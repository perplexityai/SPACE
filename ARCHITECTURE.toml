# Repository structure rules, checked by `cargo arch` (crates/tools/archcheck).

# Direct-only control-plane Postgres tables belong to the Direct substrate;
# existing users outside it are baselined until moved behind it. Postgres folds
# unquoted identifiers, so the names match in any case.
[rules.pattern_ratchet.direct_tables]
patterns = [
  '(?i)\bnode_direct\b',
  '(?i)\bsandbox_direct_route_identities\b',
  '(?i)\bsandbox_direct_route_provenance\b',
]
allow = [
  "crates/l40_api/api/src/controllers/substrate/direct.rs",
  "crates/l40_api/api/src/controllers/substrate/direct/**",
]

[rules.pattern_ratchet.direct_tables.no_crossing]       # only allowed and listed files may match
mode = "required"

[rules.pattern_ratchet.direct_tables.no_new_entries]    # a pull request may not add entries to the baseline
mode = "required"

[rules.pattern_ratchet.direct_tables.no_raised_caps]    # a pull request may not raise a cap in the baseline
mode = "required"

[rules.pattern_ratchet.direct_tables.listed_no_growth]  # listed files may not gain matching lines
mode = "required"

[rules.pattern_ratchet.direct_tables.stale_entries]     # entries with fewer matches, none, or gone
mode = "required"

# Shared code reaches Kubernetes-only state through `Substrate::as_kubernetes()`,
# binding and using the payload. A presence test on it, in any form, only asks
# which substrate is running, which belongs in a `SubstrateCapabilities` field
# (crates/l40_api/api/src/controllers/substrate/AGENTS.md). A line matcher cannot
# tell the two apart, so every call outside the substrate module counts; the
# baseline lists today's callers, and a new one fails.
[rules.pattern_ratchet.kubernetes_access]
patterns = ['\bas_kubernetes\s*\(']
allow = ["crates/l40_api/api/src/controllers/substrate/**"]

[rules.pattern_ratchet.kubernetes_access.no_crossing]
mode = "required"

[rules.pattern_ratchet.kubernetes_access.no_new_entries]
mode = "required"

[rules.pattern_ratchet.kubernetes_access.no_raised_caps]
mode = "required"

[rules.pattern_ratchet.kubernetes_access.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.kubernetes_access.stale_entries]
mode = "required"

# `SubstrateCapabilities` derives `PartialEq` and its per-substrate consts are
# public, so comparing `capabilities()` with one of them is another way to ask
# which substrate is running. Only the two substrates' `capabilities()` name
# them in production code; tests are outside the inventory.
[rules.pattern_ratchet.capability_identity]
patterns = ['\bSubstrateCapabilities\s*::\s*(?:DIRECT|KUBERNETES)\b']
allow = [
  "crates/l40_api/api/src/controllers/substrate/direct.rs",
  "crates/l40_api/api/src/controllers/substrate/kubernetes/adapter/substrate_adapter.rs",
]

[rules.pattern_ratchet.capability_identity.no_crossing]
mode = "required"

[rules.pattern_ratchet.capability_identity.no_new_entries]
mode = "required"

[rules.pattern_ratchet.capability_identity.no_raised_caps]
mode = "required"

[rules.pattern_ratchet.capability_identity.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.capability_identity.stale_entries]
mode = "required"

# Control-plane Postgres `sandboxes.managed_by` and `nodes.managed_by` hold the
# substrate that owns a row. Production code binds it as `SubstrateKind`
# (`managed_by = $n`) and never compares the 'k8s'/'space' label string. A line
# matcher catches the common forms, not all of them:
# - SQL: `managed_by` (any alias, prefix, case or quoting, a `::text` cast or a
#   wrapping call such as `lower(...)`) compared with a literal by =, <>, != or
#   IS [NOT] DISTINCT FROM, on either side; `managed_by [NOT] IN (...)` or
#   `= ANY(...)` with a literal in the list, and `'k8s' [NOT] IN (...)` naming
#   `managed_by`; `CASE managed_by WHEN '...'` on one line. `SET managed_by =
#   '...'` counts.
# - Rust: an identifier containing `managed_by` or `substrate` compared with
#   "k8s"/"space", raw strings included (==, !=, `Some("...")`, `.eq`,
#   `.eq_ignore_ascii_case`, `matches!`); any value compared with a
#   `NODE_MANAGED_BY_*` const or a `SubstrateKind`/`NodeManagedBy` variant's
#   `.as_str()`/`.to_string()`; a match on a `*managed_by`/`substrate_kind`
#   label string (`.as_str()`, `.as_deref()`, `.as_ref()`) or on the adapter's
#   `managed_by()`; a match arm on "k8s"/"space" with a substrate name
#   (`substrate`, `Substrate`, `ManagedBy`, `managed_by`) on the same line.
# Not caught: a literal in a VALUES list, split across lines, built with
# `format!` or held in a non-`.rs` file; `if let "k8s" = ...` and `let ... else`
# patterns; `["space", "k8s"].contains(...)`; a column read by name
# (`row.get::<String, _>("managed_by") == "k8s"`); a label under a neutral name
# (`|m| m == "k8s"`); a case-folded literal (`eq_ignore_ascii_case("K8S")`); a
# match written `match &*x.managed_by`, `&x.managed_by[..]` or
# `.as_deref().unwrap_or(...)`, and so its arms; an arm whose substrate name is
# only on the `match` line, or with any of `;{}=:` between the literal and `=>`
# (a guard with `==`, `("k8s", NodeRole::Builder)`, a struct pattern).
# False positives: the same text in a trailing `//` or `/* */` comment, in
# `#[doc = "..."]`, in a SQL `--` comment or in an ordinary Rust string such as
# an error message; a non-substrate vocabulary on a line that names a
# substrate; an `.as_ref()`/`.as_deref()` match on a typed
# `Option<SubstrateKind>`/`Option<NodeManagedBy>` named `substrate_kind` or
# `*managed_by`. Test files are filename-based, so `allow` adds the
# `#[cfg(test)]` support modules and fixtures, which may write literal rows.
# Production code has no matches, so there is no baseline table, and an entry
# added to one fails `no_new_entries`.
[rules.pattern_ratchet.substrate_literals]
patterns = [
  # SQL
  '''(?i)\b\w*managed_by\b"?\s*(?:::\s*text\s*)?\)?\s*(?:=|<>|!=|\bIS\s+(?:NOT\s+)?DISTINCT\s+FROM\b)\s*'(?:k8s|space)'''',
  '''(?i)'(?:k8s|space)'\s*(?:::\s*text\s*)?(?:=|<>|!=|\bIS\s+(?:NOT\s+)?DISTINCT\s+FROM\b)\s*(?:\w+\s*\(\s*)?(?:\w+\.)?"?\w*managed_by\b''',
  '''(?i)\b\w*managed_by\b"?\s*(?:::\s*text\s*)?\)?\s*(?:=\s*ANY|(?:NOT\s+)?IN)\s*\((?:[^()]|\([^()]*\))*?'(?:k8s|space)'''',
  '''(?i)'(?:k8s|space)'\s*(?:NOT\s+)?IN\s*\([^)]*\bmanaged_by\b''',
  '''(?i)\bCASE\s+(?:\w+\s*\(\s*)?(?:\w+\.)?"?\w*managed_by\b.*?\bWHEN\s+'(?:k8s|space)'''',
  # Rust comparisons with the label, a label const or a variant's label
  '''\b\w*(?:managed_by|substrate)\w*\b[\w.()&*]*\s*(?:==|!=)\s*(?:Some\s*\(\s*)?(?:r#*)?"(?:k8s|space)"''',
  '''"(?:k8s|space)"#*\s*\)?\s*(?:==|!=)\s*[\w.()&*]*\b\w*(?:managed_by|substrate)\w*\b''',
  '''\b\w*(?:managed_by|substrate)\w*\b[\w.()&*]*\.eq(?:_ignore_ascii_case)?\s*\(\s*(?:r#*)?"(?:k8s|space)"''',
  '''\bmatches!\s*\(\s*[^,]*\b\w*(?:managed_by|substrate)\w*\b[^,]*,[^;]*"(?:k8s|space)"''',
  '''(?:==|!=)\s*&?[\w:]*(?:NODE_MANAGED_BY_(?:K8S|SPACE)\b|(?:SubstrateKind|NodeManagedBy)::\w+\s*\.\s*(?:as_str|to_string)\s*\(\s*\))''',
  '''(?:\bNODE_MANAGED_BY_(?:K8S|SPACE)\b|\b(?:SubstrateKind|NodeManagedBy)::\w+\s*\.\s*(?:as_str|to_string)\s*\(\s*\))\s*(?:==|!=)''',
  # Rust matches on the label string, and arms on it beside a substrate name
  '''\bmatch\s+[\w.&*]*\b(?:\w*managed_by|substrate_kind)\b(?:\s*\(\s*\))?\s*\.\s*(?:as_str|as_deref|as_ref)\s*\(\s*\)\s*\{''',
  '''\bmatch\s+[\w.&*]*\bmanaged_by\s*\(\s*\)\s*\{''',
  '''"(?:k8s|space)"[^;{}=:]*=>.*(?:[Ss]ubstrate|ManagedBy|managed_by)''',
  '''(?:[Ss]ubstrate|ManagedBy|managed_by).*"(?:k8s|space)"[^;{}=:]*=>''',
]
allow = [
  "**/*_tests/**",
  "**/test_support.rs",
  # a crate's test-support modules, not the whole test_support layer
  "crates/*/**/test_support/**",
  "**/*_test_support.rs",
  "**/test_fixtures.rs",
  "**/*_test_fixture.rs",
  "**/scripted_test_doubles.rs",
  "crates/test_support/db/test/fixtures/**",
]

[rules.pattern_ratchet.substrate_literals.no_crossing]       # only allowed files may match
mode = "required"

[rules.pattern_ratchet.substrate_literals.no_new_entries]    # a pull request may not add entries to the baseline
mode = "required"

[rules.pattern_ratchet.substrate_literals.no_raised_caps]    # a pull request may not raise a cap in the baseline
mode = "required"

[rules.pattern_ratchet.substrate_literals.listed_no_growth]  # listed files may not gain matching lines
mode = "required"

[rules.pattern_ratchet.substrate_literals.stale_entries]     # entries with fewer matches, none, or gone
mode = "required"

# Writes of the control-plane Postgres `public.sandboxes` row move into its
# store, `pplx-space-sandbox-store`; this ratchet only shrinks. It counts each
# production line that opens a statement writing the row (`UPDATE`,
# `INSERT INTO`, `DELETE FROM`, `MERGE INTO` or `TRUNCATE` naming `sandboxes`,
# in any case, schema-qualified or quoted, before any alias, including right
# after a `\n`, `\r` or `\t` escape in a one-line string), and each call to
# the sandbox-portability renderers that compose part of its SET list
# (`sandbox_assignments()`, as a method or a path call, and the
# `*_current_local_artifact_marker_assignments` functions, after punctuation,
# a line start or `return`, `match`, `if`, `in`, `else` or `while`), so a file
# with a composed `UPDATE sandboxes s SET {...}` counts the head and each
# renderer call.
# Not caught: a statement head split across lines (`UPDATE` and `sandboxes` on
# different lines) or built at run time (`format!("UPDATE {table} ...")`); a
# `COPY sandboxes FROM ...`; a statement in a non-`.rs` file, such as the
# placement state machine's `include_str!` claim statements under
# `postgres/sql/`; a head right after an escape other than `\n`, `\r` or
# `\t` (`\0`, `\x0a`); a renderer called through an alias or a `use ... as`
# rename, passed as a function value
# (`.map(SuspendedK8sFinalizationSql::sandbox_assignments)`), or called
# right after `break` or `yield`; database triggers; scripts and smoke
# harnesses outside workspace members' `src/`.
# False positives: the same text in a trailing `//` or `/* */` comment, in
# `#[doc = "..."]`, in a SQL `--` comment or in an ordinary string such as an
# error message ("failed to update sandboxes"); a statement on another
# database's table of the same name.
# sbx-mgr's node-local SQLite database also has a `sandboxes` table, a
# different database on a different machine with its own stores
# (`pplx-space-sbx-mgr-store` and `pplx-space-sbx-mgr-migrations`;
# `layers.storage_access` keeps database drivers out of sbx-mgr's other
# crates), so its crates are allowed whole: `crates/l*/sbx/**` matches every
# directory named `sbx` directly below `crates/libs` or an `l*` layer
# directory, and any other glob in the list adds sbx crates that are
# elsewhere. A narrower glob would make this required rule fire on moves
# within sbx-mgr. Test files are
# filename-based, so `allow` adds the `#[cfg(test)]` support modules and
# fixtures, which write rows to set up their cases; `#[cfg(test)]` code inline
# in a production file counts, so test-only writes go in a `*_tests` file.
# A new writer outside the store fails, as does another write in a listed
# file; so does splitting a listed file into modules, since `--renames` pairs
# only whole-file renames and the new files' entries are new. Portability
# calls its private `sandbox_assignments` helper bare; a path-qualified call to
# it there (`Self::...`, `super::...`) matches and fails.
[rules.pattern_ratchet.sandbox_writes]
patterns = [
  # A statement head on the row's table
  '''(?i)(?:\\[nrt]|\b)(?:UPDATE|DELETE\s+FROM|INSERT\s+INTO|MERGE\s+INTO|TRUNCATE(?:\s+TABLE)?)\s+(?:ONLY\s+)?(?:\\?"?public\\?"?\s*\.\s*)?\\?"?sandboxes\b''',
  # Calls to the portability renderers of the row's assignments
  '''(?:\.|::)\s*sandbox_assignments\s*\(''',
  '''(?:^|[^\w\s]|\b(?:return|match|if|in|else|while)\s)\s*(?:\w+\s*::\s*)*(?:clear|write|publish_clear_or_preserve)_current_local_artifact_marker_assignments\s*\(''',
]
allow = [
  "crates/l30_storage/sandbox/store/**",
  # node-local sbx-mgr SQLite `sandboxes`: a different database
  "crates/l*/sbx/**",
  "**/*_tests/**",
  "**/test_support.rs",
  # a crate's test-support modules, not the whole test_support layer
  "crates/*/**/test_support/**",
  "**/*_test_support.rs",
  "**/test_fixtures.rs",
  "**/*_test_fixture.rs",
  "**/scripted_test_doubles.rs",
  "crates/test_support/db/test/fixtures/**",
]

[rules.pattern_ratchet.sandbox_writes.no_crossing]       # only allowed and listed files may match
mode = "required"

[rules.pattern_ratchet.sandbox_writes.no_new_entries]    # a pull request may not add entries to the baseline
mode = "required"

[rules.pattern_ratchet.sandbox_writes.no_raised_caps]    # a pull request may not raise a cap in the baseline
mode = "required"

[rules.pattern_ratchet.sandbox_writes.listed_no_growth]  # listed files may not gain matching lines
mode = "required"

[rules.pattern_ratchet.sandbox_writes.stale_entries]     # entries with fewer matches, none, or gone
mode = "required"

# Rootfs copies must preserve NoCoW and sparse extents through common-io's
# reflink helper. A line matcher cannot infer a path variable's contents, so
# conservatively fence all new plain filesystem copies and cp launches.
# Existing non-rootfs, non-Linux and deferred builder paths are counted
# in the baseline, not freely allowed; their counts may only decrease.
[rules.pattern_ratchet.rootfs_copy]
patterns = [
  '\bCommand\s*::\s*new\s*\(\s*"(?:/bin/|/usr/bin/)?cp"',
  '\bcommand_as_root\s*\(\s*"(?:/bin/|/usr/bin/)?cp"',
  '\bfs\s*::\s*copy\s*\(',
  '\buse\s+(?:std|tokio)\s*::\s*fs\s*::[^;]*\bcopy\b',
]
allow = ["crates/l10_foundation/common/io/src/reflink.rs"]

[rules.pattern_ratchet.rootfs_copy.no_crossing]
mode = "required"

[rules.pattern_ratchet.rootfs_copy.no_new_entries]
mode = "required"

[rules.pattern_ratchet.rootfs_copy.no_raised_caps]
mode = "required"

[rules.pattern_ratchet.rootfs_copy.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.rootfs_copy.stale_entries]
mode = "required"

# Node-manager host tools need the runner's child signal policy and ownership.
# Tests are excluded by the production-file inventory. Namespace setup, the
# spawn owner and the existing non-Linux fallback are capped in the baseline.
[rules.pattern_ratchet.node_manager_commands]
include = [
  "crates/l40_api/node/mgr/server/src/**",
  "crates/l50_app/node/mgr/svc/src/**",
]
patterns = [
  '\b(?:std\s*::\s*)?process\s*::\s*(?:Command\b|\{[^}]*\bCommand\b)',
  '\buse\s+std\s*::\s*process\s*(?:as\s+\w+\s*)?;',
  '\buse\s+std\s*::\s*\{[^}]*\bprocess\b',
  '\b(?:std\s*::\s*)?process\s*::\s*\{\s*$',
]
allow = []

[rules.pattern_ratchet.node_manager_commands.no_crossing]
mode = "required"

[rules.pattern_ratchet.node_manager_commands.no_new_entries]
mode = "required"

[rules.pattern_ratchet.node_manager_commands.no_raised_caps]
mode = "required"

[rules.pattern_ratchet.node_manager_commands.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.node_manager_commands.stale_entries]
mode = "required"

# sbx-mgr's node-local SQLite database (`sandboxes` and every other sbx-mgr
# table) is opened, migrated and queried only by its store,
# `pplx-space-sbx-mgr-store`. Its schema and location, in any crate: its
# migrations, its path and file name, and a default-path helper for it belong
# to the store; the database migrator takes them from the store's
# `db::migration::target()`. The migrations crate defines the migrators and
# common-core the path. These names are specific enough to check
# workspace-wide. The layers rule does not see these uses: its storage checks
# read only dependency edges, skip stores and helpers, and tolerate baselined
# edges, and `state.writes` scans only stores' and helpers' write statements.
# Without this ratchet, pplx-space-db-migrate, a store that depends on sqlx
# and rusqlite, could name sbx-mgr's migrator or a default-path helper for its
# database again, and a node service with a baselined driver edge
# (node-ctl-server, node-mgr, node-runtime-manager, template-mgr, volmgr,
# build-mgr-server) could open `SANDBOX_MANAGER_DB`.
[rules.pattern_ratchet.sbxmgr_sqlite_schema]
patterns = [
  '\bpplx_space_sbx_mgr_migrations\b',
  '\bSANDBOX_MANAGER_(?:DB|MIGRATOR)\b',
  '\bsqlite_sandbox_manager\b',
  '\bsbx-manager\.db\b',
  '\bdb/sandbox-manager\b',
]
allow = [
  "crates/l30_storage/sbx/mgr/store/src/**",
  "crates/l30_storage/sbx/mgr/migrations/src/**",
  "crates/libs/common/core/src/host/linux.rs",
]

[rules.pattern_ratchet.sbxmgr_sqlite_schema.no_crossing]
mode = "required"

# The baseline is empty: no file outside the store may be added to it.
[rules.pattern_ratchet.sbxmgr_sqlite_schema.no_new_entries]
mode = "required"

[rules.pattern_ratchet.sbxmgr_sqlite_schema.no_raised_caps]
mode = "required"

[rules.pattern_ratchet.sbxmgr_sqlite_schema.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.sbxmgr_sqlite_schema.stale_entries]
mode = "required"

[rules.crate_names]
# A crate matches if a part of its package or library name, lowercased and
# split on `-` and `_`, is one of these.
banned_tokens = ["common", "shared", "util", "utils", "helper", "helpers", "misc", "core"]
allow = []                            # exact package names exempt from the rule

[rules.crate_names.no_new]            # no new catch-all crate, and no new baseline entries
mode = "required"

[rules.crate_names.stale_entries]     # entries and allow names that no longer apply
mode = "required"

[rules.crate_names.policy_changed]    # changes to this table, compared with the base branch
mode = "advisory"

# Every workspace crate belongs to a layer: l10_foundation, l20_domain,
# l30_storage, l40_api and l50_app, bottom-up, or test_support and tools beside
# them. A crate in crates/<layer>/ takes its layer from the directory; the
# crates that predate the layer directories are listed in `unmoved` until they
# move. A new crate goes in a layer directory. What belongs in each layer, the
# dependency matrix and how to fix a finding: crates/tools/archcheck/README.md
# (Layers).
[rules.layers.unmoved]
l10_foundation = [
  "pplx-space-common-svc",
  "pplx-space-metrics",
]
l20_domain = [
  "pplx-space-common-core",
]
l50_app = [
  "pplx-space-runtime-manager-svc",
]


# Each store's users: the l40_api and l30_storage crates that own its state
# and use the store today, directly or through a legacy crate's re-exports
# (see `legacy` below), such as common-svc's.
[rules.layers.store_users]
pplx-space-cluster-pool = [
  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-internal-api-server",
  "pplx-space-sandbox-store",
]
pplx-space-cluster-trigger-queue = [
  "pplx-space-api",
  "pplx-space-cluster-reconciler",
  "pplx-space-internal-api-server",
]
pplx-space-credential-injection-store = ["pplx-space-api", "pplx-space-credmgr"]
pplx-space-federated-grant-store = ["pplx-space-api", "pplx-space-credmgr"]
pplx-space-node-registration-store = ["pplx-space-credmgr"]
pplx-space-placement = ["pplx-space-internal-api-server", "pplx-space-placement-executor"]
pplx-space-runtime-environment-catalog-store = ["pplx-space-internal-api-server"]
pplx-space-runtime-environment-policy-store = [
  "pplx-space-api",
  "pplx-space-internal-api-server",
]
pplx-space-sandbox-portability = [
  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-internal-api-server",
  "pplx-space-sandbox-store",
  "pplx-space-snapshot-retention",
  "pplx-space-snapshot-store",
]
pplx-space-sandbox-quarantine-store = [
  "pplx-space-cluster-controller-server",
  "pplx-space-internal-api-server",
]
pplx-space-sandbox-routability = [
  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-internal-api-server",
  "pplx-space-sandbox-store",
]
pplx-space-sandbox-store = [
  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-internal-api-server",
  "pplx-space-snapshot-retention",
]
pplx-space-sandbox-teardown = [
  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-sandbox-store",
]
pplx-space-sbx-mgr-migrations = ["pplx-space-sbx-mgr-store"]
pplx-space-sbx-mgr-store = ["pplx-space-db-migrate", "pplx-space-sbx-mgr"]
pplx-space-snapshot-storage = [
  "pplx-space-cluster-controller-server",
  "pplx-space-snapshot-retention",
]
pplx-space-snapshot-store = [
  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-internal-api-server",
  "pplx-space-snapshot-retention",
]

# Edges the dependency matrix forbids, allowed by name.
[rules.layers.allowed_edges]
# The database migrator applies every store's migrations.
pplx-space-db-migrator = ["pplx-space-db-migrate"]

# Nothing above l30_storage reaches a database or object storage directly,
# l20_domain never does, and l10_foundation does only in a storage helper,
# which names nothing SPACE-specific. `helpers` lists every helper: an
# l10_foundation crate with a required dependency on a driver that the list
# lacks is a storage_access finding until it is added. The sqlx and SQLite
# sub-crates are listed so that depending on one instead of the umbrella crate
# is no way around the checks. A legacy l10_foundation crate (see `legacy`
# below) is no helper even with a driver dependency: it is checked like every
# other crate, with today's edges baselined.
[rules.layers.storage]
drivers = [
  "aws-sdk-s3",
  "deadpool-redis",
  "libsqlite3-sys",
  "redis",
  "rusqlite",
  "sqlx",
  "sqlx-core",
  "sqlx-macros",
  "sqlx-macros-core",
  "sqlx-mysql",
  "sqlx-postgres",
  "sqlx-sqlite",
]
helpers = [
  "pplx-space-common-jobs",
  "pplx-space-migration-checksums",
  "pplx-space-object-store",
  "pplx-space-postgres-contention",
  # The HTTP connector and per-operation tracing that plug into an
  # aws-sdk-s3 client's configuration, without depending on aws-sdk-s3: the
  # one helper derivation can't see.
  "pplx-space-s3-http-client",
  "pplx-space-sqlite",
  "pplx-space-valkey",
]

[rules.layers]
# The crates being dissolved: they predate the layers and mix SPACE-specific
# code in until they are split up. Every check covers them, with today's edges
# baselined.
legacy = ["pplx-space-common-core", "pplx-space-common-svc", "pplx-space-metrics"]

# An l20_domain crate is a protocol (wire schemas and the conversions between
# them and the models) if its name ends in -protocol or -proto, or `protocols`
# lists it; every other one is a model, which never depends on a protocol.
# These five are protocols without such a name. The mixed crates, which hold
# model and wire code until they are split, count as models: api-route,
# credential-injection-core, net-common and spaced-common.
protocols = [
  "pplx-space-auto-lifecycle-receipt",
  "pplx-space-events",
  "pplx-space-execution-common",
  "pplx-space-public-api",
  "pplx-space-rpc-contracts",
]

# l20_domain crates do no I/O, so none depends on a package that does it:
# normal and build dependencies, optional ones included. Each family is an
# exact list, so a new package, such as a new aws-sdk-*, is added by hand;
# some are not in Cargo.lock today. tonic and prost are allowed. An
# l20_domain dependency on a database driver, aws-sdk-s3 or a storage helper
# is storage_access's ([rules.layers.storage]), so no family lists them.
# aws-lc-rs and aws-lc-sys are cryptography, not cloud SDKs. The workspace's
# own I/O crates need no entry: an l10_foundation crate, legacy or not, with
# a required dependency on a fenced package is fenced under that package's
# family, such as common-grpc (hyper-util), tokio-runtime (tokio) or
# common-svc (axum). Only declared dependencies are
# seen: tonic's transport brings tokio and hyper into every tonic user's
# build regardless. Features are not followed, so observability, which brings
# tokio in only behind its otel feature, is listed; feature-flags, whose
# openfeature feature does too, is fenced already by its required dependency
# on metrics.
[rules.layers.domain_fences]
runtime = [
  "async-std",
  "pplx-space-observability",
  "smol",
  "tokio",
  "tokio-rustls",
  "tokio-stream",
  "tokio-tungstenite",
  "tokio-util",
  "tokio-vsock",
]
http = [
  "attohttpc",
  "axum",
  "curl",
  "h2",
  "h3",
  "hyper",
  "hyper-named-pipe",
  "hyper-rustls",
  "hyper-timeout",
  "hyper-util",
  "hyperlocal",
  "isahc",
  "reqwest",
  "surf",
  "ureq",
]
cloud = [
  "aws-config",
  "aws-credential-types",
  "aws-runtime",
  "aws-sdk-acmpca",
  "aws-sdk-ecr",
  "aws-sdk-secretsmanager",
  "aws-sdk-sso",
  "aws-sdk-ssooidc",
  "aws-sdk-sts",
  "aws-sigv4",
  "aws-smithy-async",
  "aws-smithy-checksums",
  "aws-smithy-eventstream",
  "aws-smithy-http",
  "aws-smithy-http-client",
  "aws-smithy-json",
  "aws-smithy-observability",
  "aws-smithy-query",
  "aws-smithy-runtime",
  "aws-smithy-runtime-api",
  "aws-smithy-runtime-api-macros",
  "aws-smithy-schema",
  "aws-smithy-types",
  "aws-smithy-xml",
  "aws-types",
]
kube = [
  "k8s-openapi",
  "kube",
  "kube-client",
  "kube-core",
  "kube-runtime",
]

[rules.layers.placement]          # every crate has a layer; no new or changed unmoved entries
mode = "required"

[rules.layers.layout]             # paths below a layer directory follow the package name
mode = "required"

# Normal and build edges follow the dependency matrix; today's exceptions are
# baselined in [layers.direction], most of them from common-svc and other
# Foundation crates that still name SPACE types.
[rules.layers.direction.no_crossing]
mode = "required"

[rules.layers.direction.no_new_entries]
mode = "required"

[rules.layers.direction.stale_entries]
mode = "required"

# Dev edges point at the crate's own or a lower layer, or at test_support.
[rules.layers.dev_direction.no_crossing]
mode = "required"

[rules.layers.dev_direction.no_new_entries]
mode = "required"

[rules.layers.dev_direction.stale_entries]
mode = "required"

# Only stores and storage helpers depend on a driver or a helper; an optional
# dependency counts too, except a codec behind a feature in l10_foundation.
# Today's exceptions are baselined in [layers.storage_access].
[rules.layers.storage_access.no_crossing]
mode = "required"

[rules.layers.storage_access.no_new_entries]
mode = "required"

[rules.layers.storage_access.stale_entries]
mode = "required"

# Only stores and storage helpers turn on another crate's driver feature, one
# that enables its optional dependency on a driver or helper, such as a codec
# for its types. Today's exceptions are baselined in [layers.codec_features].
[rules.layers.codec_features.no_crossing]
mode = "required"

[rules.layers.codec_features.no_new_entries]
mode = "required"

[rules.layers.codec_features.stale_entries]
mode = "required"

# No l20_domain crate depends on a package [rules.layers.domain_fences] lists,
# or on an l10_foundation crate that a required dependency on one fences.
# Today's exceptions are baselined in [layers.domain_dependencies].
[rules.layers.domain_dependencies.no_crossing]
mode = "required"

[rules.layers.domain_dependencies.no_new_entries]
mode = "required"

[rules.layers.domain_dependencies.stale_entries]
mode = "required"

# No model depends on a protocol. Today's exceptions are baselined in
# [layers.model_protocol]: common-core, which is legacy, and spaced-common, a
# mixed crate, until they are deleted and split.
[rules.layers.model_protocol.no_crossing]
mode = "required"

[rules.layers.model_protocol.no_new_entries]
mode = "required"

[rules.layers.model_protocol.stale_entries]
mode = "required"

[rules.layers.test_only]          # test_support only through dev-dependencies; nothing depends on tools
mode = "required"

[rules.layers.clients]            # *-client crates depend only on l20_domain, l10_foundation and clients
mode = "required"

[rules.layers.store_edges]        # API and Storage crates use only the stores that list them
mode = "required"

[rules.layers.stale_entries]      # [rules.layers] entries that no longer apply
mode = "required"

[rules.layers.policy_changed]     # changes to [rules.layers], compared with the base branch
mode = "advisory"

# State ownership: each store declares the tables it owns, by database, in
# its Cargo.toml's [package.metadata.space.state]. db/common is not a database
# of its own: the migrator applies it to these databases before their own
# catalog.
[rules.layers.state.shared_catalogs]
common = [
  "build-manager",
  "runtime-manager",
  "sandbox-manager",
  "template-manager",
  "volume-manager",
]

# Co-writers: the stores that may write a table another store owns, by
# database namespace, until those writes fold into the owner. Adding one is a
# policy change that review approves. Each grant's comment says why the store
# writes the table and whether that is permanent or temporary; a temporary
# grant names the work that removes it.
[rules.layers.state.co_writers.postgres]
# Placement's commit puts a sandbox on its node. Temporary: the write folds
# into sandbox-store.
sandboxes = ["pplx-space-placement"]
# Deleting a sandbox orphans its snapshots' storage locations for cleanup.
# Temporary: the write folds into snapshot-store.
snapshot_storage_locations = ["pplx-space-sandbox-store"]

[rules.layers.state.declarations]  # every store declares its databases; only stores declare state
mode = "required"

[rules.layers.state.owners]        # no table has two owners
mode = "required"

# Among the stores, only a table's owner and co-writers write it; a storage
# helper writes a declared table only where a shared catalog creates it.
[rules.layers.state.writes]
mode = "required"

[rules.layers.state.pending]       # a declared table no migration creates yet
mode = "advisory"

# Every live table has an owner; today's tables without one are baselined in
# [layers.unowned].
[rules.layers.unowned.no_crossing]
mode = "required"

[rules.layers.unowned.no_new_entries]
mode = "required"

[rules.layers.unowned.stale_entries]
mode = "required"
