# Edges the dependency matrix forbids, allowed by name.
[rules.layers.allowed_edges]
# The database migrator applies every store's migrations.
pplx-space-db-migrator = ["pplx-space-db-migrate"]

# Nothing above l30_storage reaches a database or object storage directly,
# l20_domain never does, and l10_foundation does only in a storage helper,
# which names nothing SPACE-specific. A helper is an l10_foundation crate with
# a required dependency on a driver; `helpers` lists the others. The sqlx and
# SQLite sub-crates are listed so that depending on one instead of the
# umbrella crate is no way around the checks. A legacy l10_foundation crate
# (see `legacy` below) is no helper even with a driver dependency: it is
# checked like every other crate, with today's edges baselined.
[rules.layers.storage]
drivers = [
  "aws-sdk-s3",
  "deadpool-redis",
  "libsqlite3-sys",
  "redis",
  "rusqlite",
  "sqlx",
  "sqlx-core",
  "sqlx-macros",
  "sqlx-macros-core",
  "sqlx-mysql",
  "sqlx-postgres",
  "sqlx-sqlite",
]
helpers = [
  # The HTTP connector and per-operation tracing that plug into an
  # aws-sdk-s3 client's configuration, without depending on aws-sdk-s3.
  "pplx-space-s3-http-client",
]

[rules.layers]
# The crates being dissolved: they predate the layers and mix SPACE-specific
# code in until they are split up. Every check covers them, with today's edges
# baselined.
legacy = ["pplx-space-common-core", "pplx-space-common-svc", "pplx-space-metrics"]

# An l20_domain crate is a protocol (wire schemas and the conversions between
# them and the models) if its name ends in -protocol or -proto, or `protocols`
# lists it; every other one is a model, which never depends on a protocol.
# These five are protocols without such a name. The mixed crates, which hold
# model and wire code until they are split, count as models: api-route,
# credential-injection-core, net-common and spaced-common.
protocols = [
  "pplx-space-auto-lifecycle-receipt",
  "pplx-space-events",
  "pplx-space-execution-common",
  "pplx-space-public-api",
  "pplx-space-rpc-contracts",
]

# l20_domain crates do no I/O, so none depends on a package that does it:
# normal and build dependencies, optional ones included. Each family is an
# exact list, so a new package, such as a new aws-sdk-*, is added by hand;
# some are not in Cargo.lock today. tonic and prost are allowed. An
# l20_domain dependency on a database driver, aws-sdk-s3 or a storage helper
# is storage_access's ([rules.layers.storage]), so no family lists them.
# aws-lc-rs and aws-lc-sys are cryptography, not cloud SDKs. The workspace's
# own I/O crates need no entry: an l10_foundation crate, legacy or not, with
# a required dependency on a fenced package is fenced under that package's
# family, such as common-grpc (hyper-util), tokio-runtime (tokio) or
# common-svc (axum). Only declared dependencies are
# seen: tonic's transport brings tokio and hyper into every tonic user's
# build regardless. Features are not followed, so observability, which brings
# tokio in only behind its otel feature, is listed; feature-flags, whose
# openfeature feature does too, is fenced already by its required dependency
# on metrics.
[rules.layers.domain_fences]
runtime = [
  "async-std",
  "pplx-space-observability",
  "smol",
  "tokio",
  "tokio-rustls",
  "tokio-stream",
  "tokio-tungstenite",
  "tokio-util",
  "tokio-vsock",
]
http = [
  "attohttpc",
  "axum",
  "curl",
  "h2",
  "h3",
  "hyper",
  "hyper-named-pipe",
  "hyper-rustls",
  "hyper-timeout",
  "hyper-util",
  "hyperlocal",
  "isahc",
  "reqwest",
  "surf",
  "ureq",
]
cloud = [
  "aws-config",
  "aws-credential-types",
  "aws-runtime",
  "aws-sdk-acmpca",
  "aws-sdk-ecr",
  "aws-sdk-secretsmanager",
  "aws-sdk-sso",
  "aws-sdk-ssooidc",
  "aws-sdk-sts",
  "aws-sigv4",
  "aws-smithy-async",
  "aws-smithy-checksums",
  "aws-smithy-eventstream",
  "aws-smithy-http",
  "aws-smithy-http-client",
  "aws-smithy-json",
  "aws-smithy-observability",
  "aws-smithy-query",
  "aws-smithy-runtime",
  "aws-smithy-runtime-api",
  "aws-smithy-runtime-api-macros",
  "aws-smithy-schema",
  "aws-smithy-types",
  "aws-smithy-xml",
  "aws-types",
]
kube = [
