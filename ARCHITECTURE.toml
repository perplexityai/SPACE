  "aws-smithy-json",
  "aws-smithy-observability",
  "aws-smithy-query",
  "aws-smithy-runtime",
  "aws-smithy-runtime-api",
  "aws-smithy-runtime-api-macros",
  "aws-smithy-schema",
  "aws-smithy-types",
  "aws-smithy-xml",
  "aws-types",
]
kube = [
  "k8s-openapi",
  "kube",
  "kube-client",
  "kube-core",
  "kube-runtime",
]

[rules.layers.placement]          # every crate has a layer; no new unmoved entries
mode = "required"

[rules.layers.layout]             # paths below a layer directory follow the package name
mode = "required"

# Normal and build edges follow the dependency matrix; today's exceptions are
# baselined in [layers.direction], most of them from common-svc and other
# Foundation crates that still name SPACE types.
[rules.layers.direction.no_crossing]
mode = "required"

[rules.layers.direction.no_new_entries]
mode = "required"

[rules.layers.direction.stale_entries]
mode = "required"

# Dev edges point at the crate's own or a lower layer, or at test_support.
[rules.layers.dev_direction.no_crossing]
mode = "required"

[rules.layers.dev_direction.no_new_entries]
mode = "required"

[rules.layers.dev_direction.stale_entries]
mode = "required"

# Only stores and storage helpers depend on a driver or a helper; an optional
# dependency counts too, except a codec behind a feature in l10_foundation.
# Today's exceptions are baselined in [layers.storage_access].
[rules.layers.storage_access.no_crossing]
mode = "required"

[rules.layers.storage_access.no_new_entries]
mode = "required"

[rules.layers.storage_access.stale_entries]
mode = "required"

# Only stores and storage helpers turn on another crate's driver feature, one
# that enables its optional dependency on a driver or helper, such as a codec
# for its types. Today's exceptions are baselined in [layers.codec_features].
[rules.layers.codec_features.no_crossing]
mode = "required"

[rules.layers.codec_features.no_new_entries]
mode = "required"

[rules.layers.codec_features.stale_entries]
mode = "required"

# No l20_domain crate depends on a package [rules.layers.domain_fences] lists,
# or on an l10_foundation crate that a required dependency on one fences.
# Today's exceptions are baselined in [layers.domain_dependencies].
[rules.layers.domain_dependencies.no_crossing]
mode = "required"

[rules.layers.domain_dependencies.no_new_entries]
mode = "required"

[rules.layers.domain_dependencies.stale_entries]
mode = "required"

# No model depends on a protocol. Today's exceptions are baselined in
# [layers.model_protocol]: common-core, which is legacy, and spaced-common, a
# mixed crate, until they are deleted and split.
[rules.layers.model_protocol.no_crossing]
mode = "required"

[rules.layers.model_protocol.no_new_entries]
mode = "required"

[rules.layers.model_protocol.stale_entries]
mode = "required"

# An API crate uses another one only through its crate root (the items it
# re-exports there) or through a client; an app may compose its children at
# any path. The items each pair reaches inside the other's modules today are
# listed in [layers.facades], as "<from>.<to>" = [<item>, ...]. The planned
# fix for cluster-controller-server -> api is a shared operations crate, and
# for the `proto` items, a client crate.
[rules.layers.facades.no_crossing]     # an item reached inside an API crate's modules, unlisted
mode = "advisory"

[rules.layers.facades.no_new_entries]  # items the base branch's copy lacks
mode = "advisory"

[rules.layers.facades.stale_entries]   # listed items no longer reached
mode = "advisory"

[rules.layers.test_only]          # test_support only through dev-dependencies; nothing depends on tools
mode = "required"

[rules.layers.clients]            # *-client crates depend only on l20_domain, l10_foundation and clients
mode = "required"

[rules.layers.store_edges]        # API and Storage crates use only the stores that list them
mode = "required"

[rules.layers.single_user]        # hint: a Domain crate one crate above Domain uses, and nothing else
mode = "advisory"

[rules.layers.stale_entries]      # [rules.layers] entries that no longer apply
mode = "required"

[rules.layers.policy_changed]     # changes to [rules.layers], compared with the base branch
mode = "advisory"
