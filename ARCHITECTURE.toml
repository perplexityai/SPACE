# Repository structure rules, checked by `cargo arch` (crates/tools/archcheck).

[rules.file_size]
limit = 1000                          # code lines per production Rust file

[rules.file_size.no_crossing]         # no file outside the baseline may exceed the limit
mode = "advisory"

[rules.file_size.no_new_entries]      # a pull request may not add entries to the baseline
mode = "advisory"

[rules.file_size.no_raised_caps]      # a pull request may not raise a cap in the baseline
mode = "advisory"

[rules.file_size.listed_no_growth]    # files in the baseline may not gain code lines
mode = "advisory"

[rules.file_size.stale_entries]       # entries whose file shrank, fell under the limit, or is gone
mode = "advisory"

# Direct-only control-plane Postgres tables belong to the Direct substrate;
# existing users outside it are baselined until moved behind it. Postgres folds
# unquoted identifiers, so the names match in any case.
[rules.pattern_ratchet.direct_tables]
patterns = [
  '(?i)\bnode_direct\b',
  '(?i)\bsandbox_direct_route_identities\b',
  '(?i)\bsandbox_direct_route_provenance\b',
]
allow = [
  "crates/libs/api/src/controllers/substrate/direct.rs",
  "crates/libs/api/src/controllers/substrate/direct/**",
]

[rules.pattern_ratchet.direct_tables.no_crossing]       # only allowed and listed files may match
mode = "advisory"

[rules.pattern_ratchet.direct_tables.no_new_entries]    # a pull request may not add entries to the baseline
mode = "advisory"

[rules.pattern_ratchet.direct_tables.no_raised_caps]    # a pull request may not raise a cap in the baseline
mode = "advisory"

[rules.pattern_ratchet.direct_tables.listed_no_growth]  # listed files may not gain matching lines
mode = "advisory"

[rules.pattern_ratchet.direct_tables.stale_entries]     # entries with fewer matches, none, or gone
mode = "advisory"

# Shared code reaches Kubernetes-only state through `Substrate::as_kubernetes()`,
# binding and using the payload. A presence test on it, in any form, only asks
# which substrate is running, which belongs in a `SubstrateCapabilities` field
# (crates/libs/api/src/controllers/substrate/AGENTS.md). A line matcher cannot
# tell the two apart, so every call outside the substrate module counts, and a
# new caller needs a reviewed baseline entry.
[rules.pattern_ratchet.kubernetes_access]
patterns = ['\bas_kubernetes\s*\(']
allow = ["crates/libs/api/src/controllers/substrate/**"]

[rules.pattern_ratchet.kubernetes_access.no_crossing]
mode = "required"

[rules.pattern_ratchet.kubernetes_access.no_new_entries]
mode = "advisory"

[rules.pattern_ratchet.kubernetes_access.no_raised_caps]
mode = "advisory"

[rules.pattern_ratchet.kubernetes_access.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.kubernetes_access.stale_entries]
mode = "required"

# `SubstrateCapabilities` derives `PartialEq` and its per-substrate consts are
# public, so comparing `capabilities()` with one of them is another way to ask
# which substrate is running. Only the two substrates' `capabilities()` name
# them in production code; tests are outside the inventory.
[rules.pattern_ratchet.capability_identity]
patterns = ['\bSubstrateCapabilities\s*::\s*(?:DIRECT|KUBERNETES)\b']
allow = [
  "crates/libs/api/src/controllers/substrate/direct.rs",
  "crates/libs/api/src/controllers/substrate/kubernetes/adapter/substrate_adapter.rs",
]

[rules.pattern_ratchet.capability_identity.no_crossing]
mode = "required"

[rules.pattern_ratchet.capability_identity.no_new_entries]
mode = "advisory"

[rules.pattern_ratchet.capability_identity.no_raised_caps]
mode = "advisory"

[rules.pattern_ratchet.capability_identity.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.capability_identity.stale_entries]
mode = "required"

# Control-plane Postgres `sandboxes.managed_by` and `nodes.managed_by` hold the
# substrate that owns a row. Production code binds it as `SubstrateKind`
# (`managed_by = $n`) and never compares the 'k8s'/'space' label string. A line
# matcher catches the common forms, not all of them:
# - SQL: `managed_by` (any alias, prefix, case or quoting, a `::text` cast or a
#   wrapping call such as `lower(...)`) compared with a literal by =, <>, != or
#   IS [NOT] DISTINCT FROM, on either side; `managed_by [NOT] IN (...)` or
#   `= ANY(...)` with a literal in the list, and `'k8s' [NOT] IN (...)` naming
#   `managed_by`; `CASE managed_by WHEN '...'` on one line. `SET managed_by =
#   '...'` counts.
# - Rust: an identifier containing `managed_by` or `substrate` compared with
#   "k8s"/"space", raw strings included (==, !=, `Some("...")`, `.eq`,
#   `.eq_ignore_ascii_case`, `matches!`); any value compared with a
#   `NODE_MANAGED_BY_*` const or a `SubstrateKind`/`NodeManagedBy` variant's
#   `.as_str()`/`.to_string()`; a match on a `*managed_by`/`substrate_kind`
#   label string (`.as_str()`, `.as_deref()`, `.as_ref()`) or on the adapter's
#   `managed_by()`; a match arm on "k8s"/"space" with a substrate name
#   (`substrate`, `Substrate`, `ManagedBy`, `managed_by`) on the same line.
# Not caught: a literal in a VALUES list, split across lines, built with
# `format!` or held in a non-`.rs` file; `if let "k8s" = ...` and `let ... else`
# patterns; `["space", "k8s"].contains(...)`; a column read by name
# (`row.get::<String, _>("managed_by") == "k8s"`); a label under a neutral name
# (`|m| m == "k8s"`); a case-folded literal (`eq_ignore_ascii_case("K8S")`); a
# match written `match &*x.managed_by`, `&x.managed_by[..]` or
# `.as_deref().unwrap_or(...)`, and so its arms; an arm whose substrate name is
# only on the `match` line, or with any of `;{}=:` between the literal and `=>`
# (a guard with `==`, `("k8s", NodeRole::Builder)`, a struct pattern).
# False positives: the same text in a trailing `//` or `/* */` comment, in
# `#[doc = "..."]`, in a SQL `--` comment or in an ordinary Rust string such as
# an error message; a non-substrate vocabulary on a line that names a
# substrate; an `.as_ref()`/`.as_deref()` match on a typed
# `Option<SubstrateKind>`/`Option<NodeManagedBy>` named `substrate_kind` or
# `*managed_by`. Test files are filename-based, so `allow` adds the
# `#[cfg(test)]` support modules and fixtures, which may write literal rows.
# Production code has no matches, so there is no baseline table; a deliberate
# exception is a reviewed baseline entry, which `no_new_entries` reports.
[rules.pattern_ratchet.substrate_literals]
patterns = [
  # SQL
  '''(?i)\b\w*managed_by\b"?\s*(?:::\s*text\s*)?\)?\s*(?:=|<>|!=|\bIS\s+(?:NOT\s+)?DISTINCT\s+FROM\b)\s*'(?:k8s|space)'''',
  '''(?i)'(?:k8s|space)'\s*(?:::\s*text\s*)?(?:=|<>|!=|\bIS\s+(?:NOT\s+)?DISTINCT\s+FROM\b)\s*(?:\w+\s*\(\s*)?(?:\w+\.)?"?\w*managed_by\b''',
  '''(?i)\b\w*managed_by\b"?\s*(?:::\s*text\s*)?\)?\s*(?:=\s*ANY|(?:NOT\s+)?IN)\s*\((?:[^()]|\([^()]*\))*?'(?:k8s|space)'''',
  '''(?i)'(?:k8s|space)'\s*(?:NOT\s+)?IN\s*\([^)]*\bmanaged_by\b''',
  '''(?i)\bCASE\s+(?:\w+\s*\(\s*)?(?:\w+\.)?"?\w*managed_by\b.*?\bWHEN\s+'(?:k8s|space)'''',
  # Rust comparisons with the label, a label const or a variant's label
  '''\b\w*(?:managed_by|substrate)\w*\b[\w.()&*]*\s*(?:==|!=)\s*(?:Some\s*\(\s*)?(?:r#*)?"(?:k8s|space)"''',
  '''"(?:k8s|space)"#*\s*\)?\s*(?:==|!=)\s*[\w.()&*]*\b\w*(?:managed_by|substrate)\w*\b''',
  '''\b\w*(?:managed_by|substrate)\w*\b[\w.()&*]*\.eq(?:_ignore_ascii_case)?\s*\(\s*(?:r#*)?"(?:k8s|space)"''',
  '''\bmatches!\s*\(\s*[^,]*\b\w*(?:managed_by|substrate)\w*\b[^,]*,[^;]*"(?:k8s|space)"''',
  '''(?:==|!=)\s*&?[\w:]*(?:NODE_MANAGED_BY_(?:K8S|SPACE)\b|(?:SubstrateKind|NodeManagedBy)::\w+\s*\.\s*(?:as_str|to_string)\s*\(\s*\))''',
  '''(?:\bNODE_MANAGED_BY_(?:K8S|SPACE)\b|\b(?:SubstrateKind|NodeManagedBy)::\w+\s*\.\s*(?:as_str|to_string)\s*\(\s*\))\s*(?:==|!=)''',
  # Rust matches on the label string, and arms on it beside a substrate name
  '''\bmatch\s+[\w.&*]*\b(?:\w*managed_by|substrate_kind)\b(?:\s*\(\s*\))?\s*\.\s*(?:as_str|as_deref|as_ref)\s*\(\s*\)\s*\{''',
  '''\bmatch\s+[\w.&*]*\bmanaged_by\s*\(\s*\)\s*\{''',
  '''"(?:k8s|space)"[^;{}=:]*=>.*(?:[Ss]ubstrate|ManagedBy|managed_by)''',
  '''(?:[Ss]ubstrate|ManagedBy|managed_by).*"(?:k8s|space)"[^;{}=:]*=>''',
]
allow = [
  "**/*_tests/**",
  "**/test_support.rs",
  "**/test_support/**",
  "**/*_test_support.rs",
  "**/test_fixtures.rs",
  "**/*_test_fixture.rs",
  "**/scripted_test_doubles.rs",
  "crates/libs/db-test-fixtures/**",
]

[rules.pattern_ratchet.substrate_literals.no_crossing]       # only allowed files may match
mode = "required"

[rules.pattern_ratchet.substrate_literals.no_new_entries]    # a pull request may not add entries to the baseline
mode = "advisory"

[rules.pattern_ratchet.substrate_literals.no_raised_caps]    # a pull request may not raise a cap in the baseline
mode = "advisory"

[rules.pattern_ratchet.substrate_literals.listed_no_growth]  # listed files may not gain matching lines
mode = "required"

[rules.pattern_ratchet.substrate_literals.stale_entries]     # entries with fewer matches, none, or gone
mode = "required"

# Rootfs copies must preserve NoCoW and sparse extents through common-io's
# reflink helper. A line matcher cannot infer a path variable's contents, so
# conservatively fence all new plain filesystem copies and cp launches.
# Existing non-rootfs, non-Linux and deferred builder paths are counted
# in the baseline, not freely allowed; their counts may only decrease.
[rules.pattern_ratchet.rootfs_copy]
patterns = [
  '\bCommand\s*::\s*new\s*\(\s*"(?:/bin/|/usr/bin/)?cp"',
  '\bcommand_as_root\s*\(\s*"(?:/bin/|/usr/bin/)?cp"',
  '\bfs\s*::\s*copy\s*\(',
  '\buse\s+(?:std|tokio)\s*::\s*fs\s*::[^;]*\bcopy\b',
]
allow = ["crates/libs/common/io/src/reflink.rs"]

[rules.pattern_ratchet.rootfs_copy.no_crossing]
mode = "required"

# Seeding a new ratchet reports these initial exceptions against the base.
# Subsequent additions remain explicit review findings; ordinary new uses fail.
[rules.pattern_ratchet.rootfs_copy.no_new_entries]
mode = "advisory"

[rules.pattern_ratchet.rootfs_copy.no_raised_caps]
mode = "required"

[rules.pattern_ratchet.rootfs_copy.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.rootfs_copy.stale_entries]
mode = "required"

# Node-manager host tools need the runner's child signal policy and ownership.
# Tests are excluded by the production-file inventory. Namespace setup, the
# spawn owner and the existing non-Linux fallback are capped in the baseline.
[rules.pattern_ratchet.node_manager_commands]
include = [
  "crates/libs/node/mgr/server/src/**",
  "crates/apps/node/mgr/svc/src/**",
]
patterns = [
  '\b(?:std\s*::\s*)?process\s*::\s*(?:Command\b|\{[^}]*\bCommand\b)',
  '\buse\s+std\s*::\s*process\s*(?:as\s+\w+\s*)?;',
  '\buse\s+std\s*::\s*\{[^}]*\bprocess\b',
  '\b(?:std\s*::\s*)?process\s*::\s*\{\s*$',
]
allow = []

[rules.pattern_ratchet.node_manager_commands.no_crossing]
mode = "required"

# Seeded exceptions are review findings; new matches and cap growth fail.
[rules.pattern_ratchet.node_manager_commands.no_new_entries]
mode = "advisory"

[rules.pattern_ratchet.node_manager_commands.no_raised_caps]
mode = "required"

[rules.pattern_ratchet.node_manager_commands.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.node_manager_commands.stale_entries]
mode = "required"

# sbx-mgr's node-local SQLite database (`sandboxes` and every other sbx-mgr
# table) is opened, migrated and queried only by its store, the
# `pplx-space-sbx-mgr-store` crate. The guarantee is that crate's boundary:
# `dependency_fence.sbxmgr_rusqlite` below keeps rusqlite and
# `pplx-space-sqlite` (the shared helpers that open, migrate and delete a
# SQLite database by path) out of every other sbx-mgr crate; CI's
# `run_sbxmgr_production_checks` (ci/scripts/run-rust-checks.sh) asserts that
# nothing else in the server's production graph brings either in; and
# outside its `test-support` feature the store's API hands
# out no rusqlite connection, transaction, statement or row. (Its `FromSql`
# impl for a column type can return rusqlite's `FromSqlError`, an error type
# rather than a database capability, to a caller holding a rusqlite value.)
# This ratchet is a line-based tripwire on top of it, within sbx-mgr's
# crates: naming rusqlite, opening a connection or transaction, using the
# shared job store's SQL functions, binding parameters, executing a
# statement, or writing an SQL statement literal outside the store is a
# crossing. Aliases, wrapped imports and calls through names imported
# earlier escape it. Its `sql::sqlite` pattern predates the shared helpers'
# move into `pplx-space-sqlite` and matches nothing now; the fence and the
# graph assertion cover them. Other services' crates use rusqlite for their own databases, so
# `include` limits the rule to sbx-mgr's.
[rules.pattern_ratchet.sbxmgr_sqlite]
include = ["crates/libs/sbx/mgr/**", "crates/apps/sbx/**"]
patterns = [
  '\brusqlite\s*::',
  '\buse\s+(?:::\s*)?rusqlite\b',
  '\bextern\s+crate\s+rusqlite\b',
  '\b(?:Connection|Transaction)\s*::\s*(?:open\w*|new\w*)\s*\(',
  '\bsql\s*::\s*sqlite\b',
  '\bpplx_space_common_jobs\s*::\s*(?:db\b|\{[^}]*\bdb\b)',
  '\b(?:named_)?params\s*!',
  '\.\s*(?:execute|execute_batch|prepare|prepare_cached|query_row|query_row_and_then|query_one|query_map|query_and_then|transaction|unchecked_transaction|transaction_with_behavior|savepoint|pragma_update|pragma_query|pragma_query_value)\s*\(',
  '\.\s*(?:query|exists)\s*\(\s*[^)\s]',
  '\bimmediate_transaction\s*\(',
  '"\s*(?:SELECT\b|INSERT\s+(?:OR\s+[A-Z]+\s+)?INTO\b|REPLACE\s+INTO\b|UPDATE\s+(?:OR\s+[A-Z]+\s+)?\w+(?:\s+SET\b|\s*$)|DELETE\s+FROM\b|(?:CREATE|DROP|ALTER)\s+(?:TEMP\s+|TEMPORARY\s+|UNIQUE\s+)?(?:TABLE|INDEX|TRIGGER|VIEW)\b|PRAGMA\s+\w|WITH\s+(?:RECURSIVE\s+)?\w+\s+AS\b|(?:BEGIN|COMMIT|ROLLBACK|SAVEPOINT|RELEASE|VACUUM)\b[\w\s]*;?\s*")',
  '^\s*(?:SELECT\s|INSERT\s+(?:OR\s+[A-Z]+\s+)?INTO\s|UPDATE\s+(?:OR\s+[A-Z]+\s+)?\w+(?:\s+SET\s|\s*$)|DELETE\s+FROM\s|WITH\s+(?:RECURSIVE\s+)?\w+\s+AS\b)',
]
allow = ["crates/libs/sbx/mgr/store/src/**"]

[rules.pattern_ratchet.sbxmgr_sqlite.no_crossing]
mode = "required"

# The baseline is empty: no file outside the store may be added to it.
[rules.pattern_ratchet.sbxmgr_sqlite.no_new_entries]
mode = "required"

[rules.pattern_ratchet.sbxmgr_sqlite.no_raised_caps]
mode = "required"

[rules.pattern_ratchet.sbxmgr_sqlite.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.sbxmgr_sqlite.stale_entries]
mode = "required"

# The same database's schema and location, in any crate: its migrations, its
# path and file name, and a default-path helper for it belong to the store,
# which opens and migrates it; the database migrator takes them from the
# store's `db::migration::target()`. The migrations crate defines the
# migrators and common-core the path. These names are
# specific enough to check workspace-wide, unlike `sbxmgr_sqlite`'s patterns,
# which other services' crates match for their own databases.
[rules.pattern_ratchet.sbxmgr_sqlite_schema]
patterns = [
  '\bpplx_space_sbxmgr_migrations\b',
  '\bSANDBOX_MANAGER_(?:DB|MIGRATOR)\b',
  '\bsqlite_sandbox_manager\b',
  '\bsbx-manager\.db\b',
  '\bdb/sandbox-manager\b',
]
allow = [
  "crates/libs/sbx/mgr/store/src/**",
  "crates/libs/sbx/mgr/migrations/src/**",
  "crates/libs/common/core/src/host/linux.rs",
]

[rules.pattern_ratchet.sbxmgr_sqlite_schema.no_crossing]
mode = "required"

# The baseline is empty: no file outside the store may be added to it.
[rules.pattern_ratchet.sbxmgr_sqlite_schema.no_new_entries]
mode = "required"

[rules.pattern_ratchet.sbxmgr_sqlite_schema.no_raised_caps]
mode = "required"

[rules.pattern_ratchet.sbxmgr_sqlite_schema.listed_no_growth]
mode = "required"

[rules.pattern_ratchet.sbxmgr_sqlite_schema.stale_entries]
mode = "required"

# Only the store may depend on the SQLite drivers that can open sbx-mgr's
# database, or on the shared helpers that open, migrate and delete one by
# path, so no other sbx-mgr crate can name them: no normal, dev or build
# dependency, for any target, under any name.
[rules.dependency_fence.sbxmgr_rusqlite]
packages = ["libsqlite3-sys", "pplx-space-sqlite", "rusqlite"]
members = ["crates/libs/sbx/mgr/**", "crates/apps/sbx/**"]
allow = ["crates/libs/sbx/mgr/store"]

[rules.dependency_fence.sbxmgr_rusqlite.no_crossing]
mode = "required"

# sqlx opens SQLite too, directly or through its core and SQLite driver
# crates. The migrations crate embeds the migrations with it, and the store
# names their `Migrator` type.
[rules.dependency_fence.sbxmgr_sqlx]
packages = ["sqlx", "sqlx-core", "sqlx-sqlite"]
members = ["crates/libs/sbx/mgr/**", "crates/apps/sbx/**"]
allow = ["crates/libs/sbx/mgr/store", "crates/libs/sbx/mgr/migrations"]

[rules.dependency_fence.sbxmgr_sqlx.no_crossing]
mode = "required"

[rules.crate_names]
# A crate matches if a part of its package or library name, lowercased and
# split on `-` and `_`, is one of these.
banned_tokens = ["common", "shared", "util", "utils", "helper", "helpers", "misc", "core"]
allow = []                            # exact package names exempt from the rule

[rules.crate_names.no_new]            # no new catch-all crate, and no new baseline entries
mode = "required"

[rules.crate_names.stale_entries]     # entries and allow names that no longer apply
mode = "advisory"

[rules.crate_names.policy_changed]    # changes to this table, compared with the base branch
mode = "advisory"
