  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-internal-api-server",
  "pplx-space-sandbox-store",
]
pplx-space-sbx-mgr-migrations = ["pplx-space-sbx-mgr-store"]
pplx-space-sbx-mgr-store = ["pplx-space-db-migrate", "pplx-space-sbx-mgr"]
pplx-space-snapshot-storage = [
  "pplx-space-cluster-controller-server",
  "pplx-space-snapshot-retention",
]
pplx-space-snapshot-store = [
  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-credmgr",
  "pplx-space-internal-api-server",
  "pplx-space-snapshot-retention",
]
pplx-space-storage-vend-store = ["pplx-space-credmgr"]
pplx-space-template-mgr-store = ["pplx-space-template-mgr"]
pplx-space-template-release-original = [
  "pplx-space-cluster-pool",
  "pplx-space-template-release-store",
]
# The API resolves creates, placement and pool claims to a release's twin
# through the store, reads releases for its lookups and admin routes,
# deletes them with their template or one at a time, and checks a
# template's encryption sidecars before a visibility widen; the cluster
# pool's autoscaler embeds its resolution SQL so demand follows the release
# creates run; the cluster controller's template campaign driver pages a
# campaign's source releases, writes twins' metadata.json through its
# objects, and inserts the twins; and the internal API's release
# registration reads, inserts and fills releases and their storage
# locations, and its template catalog reads releases and their storage
# locations for the nodes that pull them. The credential manager checks
# whether a release is published
# before it vends write credentials for its storage.
pplx-space-template-release-store = [
  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-cluster-pool",
  "pplx-space-credmgr",
  "pplx-space-internal-api-server",
]
pplx-space-template-store = [
  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-credmgr",
  "pplx-space-internal-api-server",
]
pplx-space-volmgr-store = ["pplx-space-volmgr"]

# Each coordinator's users: the l40_api crates that run its transaction
# today. A coordinator (l30_storage, named *-coordinator) runs one transaction
# across the stores that list it in store_users, owns no tables and holds no
# SQL.
[rules.layers.coordinator_users]
# The admin node registry registers, reactivates and updates Direct nodes.
pplx-space-direct-coordinator = ["pplx-space-api"]

# Edges the dependency matrix forbids, allowed by name.
[rules.layers.allowed_edges]
# The database migrator applies every store's migrations.
pplx-space-db-migrator = ["pplx-space-db-migrate"]

# Nothing above l30_storage reaches a database or object storage directly,
# l10_foundation does only in a storage helper, which names nothing
# SPACE-specific, and l20_domain and other l10_foundation crates hold at most
# a codec, behind an optional dependency on a codec facade (`codec_facades`).
# `helpers` lists every helper: an
# l10_foundation crate with a required dependency on a driver that the list
# lacks is a storage_access finding until it is added. The sqlx and SQLite
# sub-crates are listed so that depending on one instead of the umbrella crate
# is no way around the checks.
[rules.layers.storage]
drivers = [
  "aws-sdk-s3",
  "deadpool-redis",
  "libsqlite3-sys",
  "redis",
  "rusqlite",
  "sqlx",
  "sqlx-core",
  "sqlx-macros",
  "sqlx-macros-core",
  "sqlx-mysql",
  "sqlx-postgres",
  "sqlx-sqlite",
]
helpers = [
  "pplx-space-common-jobs",
  "pplx-space-migration-checksums",
  "pplx-space-object-store",
  "pplx-space-postgres-contention",
  # The HTTP connector and per-operation tracing that plug into an
  # aws-sdk-s3 client's configuration, without depending on aws-sdk-s3: the
  # one helper derivation can't see.
  "pplx-space-s3-http-client",
  "pplx-space-sqlite",
  "pplx-space-valkey",
]

# The codec facades: l10_foundation crates that re-export only a driver's
# codec items, the traits and types that encode a value and decode it back,
# behind features. Storage helpers aside, an l10_foundation or l20_domain
# crate may reach a driver only through an optional normal dependency on one,
# under [dependencies] or a [target.'cfg(…)'.dependencies] table, with
# today's exceptions baselined, so a facade's exports are what every
# codec may use. Each facade's `exports` lists, by driver, the
# paths below the driver's root that its `pub use` items may name, each
# exactly; storage_access reads the facade's source with syn, a Rust parser,
# and reports anything else in it, with no baseline entry to tolerate it. A listed path no file
# re-exports, an empty list and a key for no driver the facade depends on are
# stale_entries findings, so the lists only shrink. `policy_changed` reports a
# facade or an export added or removed: list only what encoding and decoding
# a value needs, never a query, pool, connection, executor, transaction or
# row.
[rules.layers.storage.codec_facades."pplx-space-sql-codec".exports]
rusqlite = [
  "Result",
  "types::FromSql",
  "types::FromSqlError",
  "types::FromSqlResult",
  "types::ToSql",
  "types::ToSqlOutput",
  "types::ValueRef",
]
sqlx = [
  "Decode",
  "Encode",
  "Postgres",
  "Type",
  "encode::IsNull",
  "error::BoxDynError",
  "postgres::PgArgumentBuffer",
  "postgres::PgHasArrayType",
  "postgres::PgTypeInfo",
  "postgres::PgValueRef",
]

[rules.layers]
# An l20_domain crate is a protocol (wire schemas and the conversions between
# them and the models) if its name ends in -protocol or -proto, or `protocols`
# lists it; every other one is a model, which never depends on a protocol.
# These five are protocols without such a name. The mixed crates, which hold
# model and wire code until they are split, count as models: api-route,
# credential-injection and net-common.
protocols = [
  "pplx-space-auto-lifecycle-receipt",
  "pplx-space-events",
  "pplx-space-execution-common",
  "pplx-space-public-api",
  "pplx-space-rpc-contracts",
]

# l20_domain crates do no I/O, so none depends on a package that does it:
# normal and build dependencies, optional ones included. Each family is an
# exact list, so a new package, such as a new aws-sdk-*, is added by hand;
# some are not in Cargo.lock today. tonic and prost are allowed. An
# l20_domain dependency on a database driver, aws-sdk-s3 or a storage helper
# is storage_access's ([rules.layers.storage]), so no family lists them.
# aws-lc-rs and aws-lc-sys are cryptography, not cloud SDKs. The workspace's
# own I/O crates need no entry: an l10_foundation crate with a required
# dependency on a fenced package is fenced under that package's family,
# such as common-grpc (hyper-util) or tokio-runtime (tokio). Only
# declared dependencies are seen: tonic's transport brings tokio and hyper
# into every tonic user's build regardless. Features are not followed, so observability, which brings
# tokio in only behind its otel feature, is listed; feature-flags, whose
# openfeature feature does too, is fenced already by its required dependency
# on metrics-emit.
[rules.layers.domain_fences]
runtime = [
  "async-std",
  "pplx-space-observability",
  "smol",
  "tokio",
  "tokio-rustls",
  "tokio-stream",
  "tokio-tungstenite",
  "tokio-util",
  "tokio-vsock",
]
http = [
  "attohttpc",
  "axum",
  "curl",
  "h2",
  "h3",
  "hyper",
  "hyper-named-pipe",
  "hyper-rustls",
  "hyper-timeout",
  "hyper-util",
  "hyperlocal",
  "isahc",
  "reqwest",
  "surf",
  "ureq",
]
cloud = [
  "aws-config",
  "aws-credential-types",
  "aws-runtime",
  "aws-sdk-acmpca",
  "aws-sdk-ecr",
  "aws-sdk-secretsmanager",
  "aws-sdk-sso",
  "aws-sdk-ssooidc",
  "aws-sdk-sts",
  "aws-sigv4",
  "aws-smithy-async",
  "aws-smithy-checksums",
  "aws-smithy-eventstream",
  "aws-smithy-http",
  "aws-smithy-http-client",
  "aws-smithy-json",
  "aws-smithy-observability",
  "aws-smithy-query",
  "aws-smithy-runtime",
  "aws-smithy-runtime-api",
  "aws-smithy-runtime-api-macros",
  "aws-smithy-schema",
  "aws-smithy-types",
  "aws-smithy-xml",
  "aws-types",
]
kube = [
  "k8s-openapi",
  "kube",
  "kube-client",
  "kube-core",
  "kube-runtime",
]

[rules.layers.placement]          # every crate has a layer; no new or changed unmoved entries
mode = "required"

[rules.layers.layout]             # paths below a layer directory follow the package name
mode = "required"

# Normal and build edges follow the dependency matrix; today's exceptions are
# baselined in [layers.direction], most of them from Foundation crates that
# still name SPACE types.
[rules.layers.direction.no_crossing]
mode = "required"

[rules.layers.direction.no_new_entries]
mode = "required"

[rules.layers.direction.stale_entries]
mode = "required"

# Dev edges point at the crate's own or a lower layer, or at test_support.
[rules.layers.dev_direction.no_crossing]
mode = "required"

[rules.layers.dev_direction.no_new_entries]
mode = "required"

[rules.layers.dev_direction.stale_entries]
mode = "required"

# Only stores and storage helpers depend on a driver, a helper or a codec
# facade; an optional dependency counts too, with two exceptions, each an
# optional normal dependency (under [dependencies] or a
# [target.'cfg(…)'.dependencies] table): an l10_foundation or l20_domain
# crate's on a facade, and a facade's own on a driver. Today's exceptions are baselined in
# [layers.storage_access]; what a facade's source holds beyond its exports
# gets no entry.
[rules.layers.storage_access.no_crossing]
mode = "required"

[rules.layers.storage_access.no_new_entries]
mode = "required"

[rules.layers.storage_access.stale_entries]
mode = "required"

# Only stores and storage helpers turn on another crate's driver feature, one
# that enables its optional dependency on a driver or helper, such as a codec
# for its types, and l10_foundation and l20_domain crates only behind a
# feature of their own, itself a driver feature. Today's exceptions are
# baselined in [layers.codec_features].
[rules.layers.codec_features.no_crossing]
mode = "required"

[rules.layers.codec_features.no_new_entries]
mode = "required"

[rules.layers.codec_features.stale_entries]
mode = "required"

# No l20_domain crate depends on a package [rules.layers.domain_fences] lists,
# or on an l10_foundation crate that a required dependency on one fences.
# Today's exceptions are baselined in [layers.domain_dependencies].
[rules.layers.domain_dependencies.no_crossing]
mode = "required"

[rules.layers.domain_dependencies.no_new_entries]
mode = "required"

[rules.layers.domain_dependencies.stale_entries]
mode = "required"

# No model depends on a protocol.
[rules.layers.model_protocol.no_crossing]
mode = "required"

[rules.layers.model_protocol.no_new_entries]
mode = "required"

[rules.layers.model_protocol.stale_entries]
mode = "required"

[rules.layers.test_only]          # test_support only through dev-dependencies; nothing depends on tools
mode = "required"

[rules.layers.clients]            # *-client crates depend only on l20_domain, l10_foundation and clients
mode = "required"

[rules.layers.store_edges]        # API and Storage crates use only the stores that list them
mode = "required"

[rules.layers.coordinators]       # a coordinator declares no state and uses no other coordinator
mode = "required"

[rules.layers.coordinator_edges]  # API crates use only the coordinators that list them; stores none
mode = "required"

[rules.layers.driver_reexports]   # no l30_storage crate's library root re-exports a driver
mode = "required"

[rules.layers.stale_entries]      # [rules.layers] entries that no longer apply
mode = "required"

[rules.layers.policy_changed]     # changes to [rules.layers], compared with the base branch
mode = "advisory"

# State ownership: each store declares the tables it owns, by database, in
# its Cargo.toml's [package.metadata.space.state]. db/common is not a database
# of its own: the migrator applies it to these databases before their own
# catalog.
[rules.layers.state.shared_catalogs]
common = [
  "build-manager",
  "runtime-manager",
  "sandbox-manager",
  "template-manager",
  "volume-manager",
]

# Co-writers: the stores that may write a table another store owns, by
# database namespace, until those writes fold into the owner. Adding one is a
# policy change that review approves. Each grant's comment says why the store
# writes the table and whether that is permanent or temporary; a temporary
# grant names the work that removes it.
[rules.layers.state.co_writers.postgres]
# Pruning a node's absent sandboxes deletes their facet rows in one statement.
# Temporary: the prune calls sandbox-teardown for those rows.
node_facet_conditions = ["pplx-space-sandbox-store"]
# Pruning a node's absent sandboxes deletes their facet rows in one statement.
# Temporary: the prune calls sandbox-teardown for those rows.
node_facet_observed_status = ["pplx-space-sandbox-store"]
# Teardown deletes an element's queued refs in the caller's transaction.
# Temporary: the delete moves into cluster-trigger-queue and teardown calls it.
node_reconcile_queue = ["pplx-space-sandbox-teardown"]
# Pause-failed recovery and the census prune write sandboxes in the same
# statement as the observed rows.
# Temporary: it goes once neither statement writes the table, after a
# pause-failed recovery coordinator and the census prune's own split.
sandbox_observed_states = ["pplx-space-sandbox-store"]
# Pause-failed recovery retires the quarantine in its sandboxes update.
# Temporary: the recovery calls sandbox-quarantine-store for the quarantine.
sandbox_quarantine_history = ["pplx-space-sandbox-store"]
# Pause-failed recovery retires the quarantine in its sandboxes update.
# Temporary: the recovery calls sandbox-quarantine-store for the quarantine.
sandbox_quarantine_state = ["pplx-space-sandbox-store"]
# Deleting a sandbox orphans its snapshots' storage locations for cleanup.
# Temporary: the write folds into snapshot-store.
snapshot_storage_locations = ["pplx-space-sandbox-store"]

[rules.layers.state.declarations]  # every store declares its databases; only stores declare state
mode = "required"

[rules.layers.state.owners]        # no table has two owners
mode = "required"

# Among the stores, only a table's owner and co-writers write it; a storage
# helper writes a declared table only where a shared catalog creates it.
[rules.layers.state.writes]
mode = "required"

[rules.layers.state.pending]       # a declared table no migration creates yet
mode = "advisory"

# Every live table has an owner; today's tables without one are baselined in
# [layers.unowned].
[rules.layers.unowned.no_crossing]
mode = "required"

[rules.layers.unowned.no_new_entries]
mode = "required"

[rules.layers.unowned.stale_entries]
mode = "required"
