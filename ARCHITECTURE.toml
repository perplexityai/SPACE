# Each store's allowed users: the l40_api and l30_storage crates that own its
# state, including those that reach it today through common-svc's re-exports.
[rules.layers.store_users]
pplx-space-cluster-pool = [
  "pplx-space-api",
  "pplx-space-cluster-controller-server",
  "pplx-space-internal-api-server",
  "pplx-space-sandbox-teardown",
]
pplx-space-cluster-trigger-queue = [
  "pplx-space-api",
  "pplx-space-cluster-reconciler",
  "pplx-space-internal-api-server",
]
pplx-space-credential-injection-store = ["pplx-space-api", "pplx-space-credmgr"]
pplx-space-federated-grant-store = ["pplx-space-api", "pplx-space-credmgr"]
pplx-space-node-registration-store = ["pplx-space-credmgr"]
pplx-space-placement = ["pplx-space-internal-api-server", "pplx-space-placement-executor"]
pplx-space-runtime-environment-catalog-store = ["pplx-space-internal-api-server"]
