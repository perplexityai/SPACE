# Full real SPACE node-side stack on real Firecracker.
#
# Runs as a DaemonSet on every sandbox worker. Each pod runs the production
# worker binary set — runtime-supervisor, node-manager, volume-manager,
# credential-manager, template-manager, sandbox-manager, node-ctl, node-api,
# plus the per-sandbox net-gateway launched on demand — under the production
# unix identities, against real Firecracker + jailer + vsock. Node registration
# flows through node-ctl →
# space-internal-api (PublishNodeState); templates are pulled through the
# production template pull path (ClusterApi.FindTemplateRelease → volmgr).
# Snapshot artifacts flow through the real volume-manager to SeaweedFS.

image:
  repository: space-node-stack
  tag: local
  pullPolicy: IfNotPresent

# Direct-render environment fallback. Bootstrap and Tilt always supply the
# selected experiment environment or the per-host local environment.
datadogEnvironment: kind-local

datadogTeam: team-space

# Telemetry defaults come from the space-kind-telemetry library.
telemetry: {}

# Admission fence over this chart's `patch nodes` grant; see
# templates/node-fence.yaml. Mirrors the prod space-node-ctl chart's
# `nodeFence` block, including the allowlists.
# `scripts/tests/test_node_ctl_node_fence.py` guards both charts at once, from
# both ends: it pins these strings to the Rust constants (catching a rename) and
# parses node-ctl's apply bodies for the keys they actually write (catching an
# addition).
nodeFence:
  enabled: true
  # `["Audit", "Warn"]` evaluates the policy and records violations without
  # refusing them — the staged form for a cluster whose node-ctl writes have
  # not been observed against the allowlists yet.
  validationActions:
    - Deny
  allowedLabelKeys:
    # SSD_HEADROOM_TIER_LABEL, SSD_PLACEMENT_BLOCKED_LABEL
    - space.pplx.net/ssd-headroom-tier
    - space.pplx.net/ssd-placement-blocked
  allowedLabelKeyPrefixes:
    # TEMPLATE_BUILD_LABEL_KEY_PREFIX: one key per ready local template build.
    - space.pplx.net/template-build-
  allowedAnnotationKeys: []
  allowedAnnotationKeyPrefixes:
    # Template presence mirrors each build label with a same-key annotation
    # carrying the full content hash.
    - space.pplx.net/template-build-
  # Removable but not writable. node-ctl only ever *clears* a satisfied
  # template-write key; an added one is a pull request it then honors, and that
  # pull is classified on-demand, which skips the template-visibility gate. Both
  # forms are listed because `is_template_write_annotation_key` accepts the bare
  # key as well as the per-reference `-<digest>` variants — and a plain
  # `template-write` prefix would additionally permit `template-writer`.
  removalOnlyAnnotationKeys:
    - space.pplx.net/template-write
  removalOnlyAnnotationKeyPrefixes:
    - space.pplx.net/template-write-
  # Governs `status.capacity` only. `status.allocatable` is not carved out of
  # the status freeze at all, because node-ctl never writes it and it is the
  # value the scheduler and the substrate actually read.
  allowedStatusResourceKeys:
    # SANDBOX_NETWORK_SLOTS_RESOURCE. The only extended resource node-ctl
    # advertises, and the only Node status write from this identity at all.
    - space.pplx.net/network-slots
# Place the node stack on every sandbox worker. The pool label is set by
# kind-cluster.yaml.tmpl; the per-pod identity (node name, endpoint) is derived from
# the pod's host at runtime so the same chart values cover any worker count.
nodeSelector:
  space.pplx.net/node-pool: sandbox

# Host networking puts :9800 on the kube Node's IP so the API reflector can
# dial host_ip:9800. ClusterFirstWithHostNet preserves in-cluster DNS.
hostNetwork: true

# Losing both workers briefly during a local chart update is acceptable.
maxUnavailable: 100%

# Worker services keep the existing short local shutdown window. The builder
# override leaves enough grace for a build recipe's full drain budget.
terminationGracePeriodSeconds: 30

# Cluster API (space-internal-api) — node-ctl publishes node status +
# template inventory here (node registration), template-manager resolves
# template releases for pulls, sandbox-manager reports snapshot state.
internalApi:
  endpoint: http://space-internal-api:9800

# Control-plane Postgres secret. Consumed ONLY by credential-manager (its
# pre-agent-migration authority role resolves org KEK rows from the DB) and,
# when directSubstrate.enabled, by the legacy bench registration. No other
# node service sees Postgres — matching production workers.
postgres:
  secretName: space-postgres
  secretKey: POSTGRES_CONNECTION_STRING
  managedCredentialsPassword: space-dev-creds

# Legacy DirectSubstrate bench mode (space-local-3486 / Tilt MINIMAL). The
# api-server on DirectSubstrate schedules off nodes/node_direct rows and has
# no registration RPC, so the entrypoint SQL-registers the node after
# node-api is serving. Leave disabled on the production-shaped stack.
directSubstrate:
  enabled: false

# The Service still exists as a fallback for any in-cluster caller that wants
# a stable DNS name pointing at "some" worker node-api (e.g. legacy
# DirectSubstrate or the data-plane's internal route resolver). With
# hostNetwork=true each pod's identity is already host_ip:9800, which is
# what api-server's KubernetesSubstrate reflector dials directly.
node:
  role: worker
  serviceName: space-worker-node-api

# Keep this pod out of the local Datadog Agent's container-collect-all. Set on
# the builder release, whose stdout carries user-supplied template-build
# commands. See the annotation comment in templates/daemonset.yaml.
datadogLogsExcluded: false

# Builder-only process and publication configuration. The default worker
# release leaves this disabled; values-builder.yaml enables it for the
# dedicated builder node while reusing the same production binary bundle.
builder:
  enabled: false
  # Overrides SPACE_TRACE_EXPORTER for the build-manager process alone. Empty
  # leaves the normal `auto` resolution in place.
  traceExporter: ""
  listen: 127.0.0.1:9900
  endpoint: http://127.0.0.1:9900
  maxConcurrentBuilds: 1
  drainTimeoutSeconds: 7200
  blob:
    minAvailableBytes: "1073741824"
  objectStore:
    bucket: templates
    region: us-east-1
    endpoint: http://seaweedfs:8333
    multipartConcurrency: 2
    multipartPartSizeBytes: 67108864

# Optional development wiring for credential-manager's own AWS integrations.
# ExchangeToken never returns these ambient credentials; kind build-manager
# and volume-manager consume the separately injected object-store credentials
# directly for SeaweedFS.
credentialManager:
  useObjectStoreCredentials: false

# Exercise the production credential-authority path in Kind. The authority
# uses the pod's ordinary AWS SDK credential chain; callers still need to pass
# short-lived AWS credentials to bootstrap when the selected smoke resolves an
# AWS Secrets Manager reference.
networkCredentials:
  enabled: true

# Secret carrying the inter-service bearer tokens (rendered by the api chart).
internalSecretName: space-internal

spaceApiRouteToken:
  ed25519:
    verificationSecretName: space-route-verification
    verificationBundle: verification-bundle.json
  generationFenceEnabled: "true"

clusterId: "kind-local"

# Dynamic feature-flag provider for sandbox-manager. Empty is the supported
# provider-free deployment, not a missing setting: with no secret named,
# `knownEgress` below is the only control over the one flag this binary reads.
# That flag is JSON-typed and so declares no fallback — nothing resolves, and
# local configuration is the whole answer.
eppo:
  secretName: ""
  secretKey: EPPO_SDK_KEY
  baseUrl: ""

# Diagnostic logging for failed egress from the sandbox network gateway. These
# domains decide which failed DNS or TCP connections net-gateway reports; they
# neither permit nor deny egress, so this is not a network control.
#
# A `space-net-gateway-known-egress-domains` assignment replaces `domains` for
# the sandboxes it targets.
#
# `domains` is the list a deployment with no provider uses, as a comma-separated
# string and not a YAML list: the template refuses to render any other shape
# rather than let it reach the node as the text "[a b]", which sandbox-manager
# would reject whole.
#
# This is a launch argument: an existing gateway picks a change up only when
# its sandbox cycles.
#
# A bench is provider-free unless someone pastes an Eppo key in, so `domains` is
# the only way to get these diagnostics here at all. Empty is the default rather
# than the recommendation: set it to the hosts you want reported, e.g.
# "egress-proxy.example.test,git-proxy.example.test".
knownEgress:
  domains: ""

# Per-devbox sandbox SSH keypair Secret (created by bootstrap.sh from
# ~/.space-devbox/kind/ssh — the local stand-in for the AMI's
# Packer-generated /space/etc/ssh). Public half is baked into the seed;
# private half mounted read-only for `space-ssh`.
sandboxSsh:
  secretName: space-sandbox-ssh

# On-node template cache LRU eviction. `GcConfig::from_env` reads these once at
# template-manager start: an unset or zero budget means the loop spawns, logs
# once and exits, so a bench without this block never exercises eviction at
# all. Set here so `local.template_cache_lru_eviction_reclaims` proves the
# production loop against a real worker, and so kind carries the same
# steady-state behavior prod does: an unpinned, unreferenced build is reclaimed
# once the node is over budget.
#
# The numbers are smoke-sized, not prod-sized, and that is deliberate. The seed
# is ~462 MiB as a subvolume. Prefetch's latest-N pins that many release
# digests per warmed template (binary default 5) and pinned bytes count toward
# the budget without ever being reclaimable, so `prefetchLatestN` is rendered
# here as 1: only the newest seed release stays pinned, and an older seed a
# rebuilt bench left behind becomes reclaimable like any other stale build.
# With that, a 1.5 GiB budget at the binary's 0.9 headroom targets ~1.35 GiB
# (1,449,551,462 bytes): the pinned seed is far under target and a single
# budget-sized build is over it by itself. Prefetch pins (`seed:latest`), the
# active-sandbox set and warm-pool releases are never evicted, so the only
# builds this reclaims on a worker are ones nothing references — e.g. an ECW
# template build whose last sandbox was deleted more than `gcGraceSecs` ago,
# which a later create re-pulls through the normal path. Grace sits exactly at
# the binary's 60 s safety floor (below it the daemon warns at startup); the
# floor exists because grace is the only guard for the create-vs-GC race, and
# 60 s is already wide for a bench.
#
# WORKERS ONLY. values-builder.yaml sets this to null: build-manager registers
# a build and then publishes it by reading the digest dir template-manager
# just created, and a fresh build is unpinned and unreferenced — a 60 s grace
# could delete it under the upload. Builder cleanup needs a grace period long
# enough for publication, or an explicit prune after publishing.
#
# A change here needs a node-stack rollout, which restarts every worker's
# sandboxes — never patch it on a live bench.
templateCache:
  budgetBytes: "1610612736"
  gcIntervalSecs: "15"
  gcGraceSecs: "60"
  prefetchLatestN: "1"

# Keep cluster-deletion cleanup on the normal reconciler, with a short local
# grace period in disposable Kind clusters. The worker default is 600 seconds.
clusterDeletedEvictionQuiescenceSecs: "10"

# Cold-sandbox eviction — sandbox-manager's loop that removes a parked,
# suspended sandbox's entire local presence (cache dir, instance subvolume,
# node-local rows) once its state is provably restorable from a ready remote
# snapshot. `EvictionConfig::from_env` reads these once at sandbox-manager
# start, and without them the loop is off.
#
# Smoke-sized, and deliberately shaped for a bench:
# - `engageFraction: "0"` always runs the loop, independent of local disk
#   pressure. Target 0 keeps the pair valid (target < engage is only enforced
#   when engage > 0).
# - `minIdleSecs: "120"` makes the idle boundary reachable within a smoke.
#   "Idle" is the loop's activity witness (`IDLE_WITNESS_SQL`): the newest of
#   the sandbox's guest-activity clocks (`last_access_at` / `last_command_at`,
#   touched only by data-plane traffic) when one exists, else the local row's
#   `updated_at`, which every suspend bumps. So on a bench a sandbox becomes a
#   candidate two minutes after its last command (or, with no clock, after its
#   last suspend), once its upload is ready. Every scenario on the bench shares
#   this floor, so it has two lower bounds. It must stay well above the longest
#   time any other scenario leaves a suspended, backed sandbox idle before a
#   reconnect that expects a local restore: about 20 s on a devbox, in
#   `ecw.access_idle_reconnect_preserves_workspace`, which waits for the
#   access-idle pause and its durable finalization; retention and restore
#   cycles reconnect within about 8 s. It must also stay well above the
#   eviction scenario's own last command → upload ready → presence probe
#   (about 7 s), or the loop evicts before that positive probe. Both gaps grow
#   on a slow CI runner; 30 s would leave no margin, two minutes keeps several
#   times the measured gaps. Keep new scenarios' suspended idle gaps well under
#   a minute, or expect a cold wake. The eviction scenario waits the floor out
#   honestly instead of aging rows in the daemon's private DB the way the
#   retired compose suites did.
# - What it means for the bench: any sandbox left suspended for more than
#   two minutes with a ready remote snapshot loses its local copy and restores
#   from SeaweedFS on the next wake — exactly what prod does under disk
#   pressure, on a short clock.
#
# WORKERS ONLY; the builder release sets this to null. A change here is a
# node-stack rollout — never patch it on a live bench.
sandboxEviction:
  enabled: true
  engageFraction: "0"
  targetFraction: "0"
  minIdleSecs: "120"
  intervalSecs: "15"
  # The legacy-repair reupload pass runs whenever the gate is engaged — here,
  # every tick. Nothing on a fresh bench qualifies (it needs an unpinned
  # suspended row with no upload job), so keep its per-tick RPC budget minimal.
  reuploadMaxPerTick: "1"

# On-node snapshot artifact reaper — sandbox-manager's LRU loop that deletes
# local snapshot artifacts (named user snapshots, stopped disk artifacts,
# retired suspend snapshots) once they are backed up (`backup_completed_at`),
# not pinned by any sandbox's `current_local_artifact_id`, idle, and past
# grace, through node-mgr's `DeleteCacheArtifact` (which handles btrfs
# subvolume roots as well as plain directories). Read once at sandbox-manager
# start.
#
# Smoke-sized like the two loops above: `engageFraction: "0"` is the
# documented always-on gate; `idleSecs: "120"` and `graceSecs: "60"` let
# `local.snapshot_reaper_reclaims_backed_fork_snapshot` wait out a candidate.
# "Idle" is `local_artifacts.last_touched_at`,
# set at insert and moved only by a suspend re-stage or a restore lease
# commit; a fork's source snapshot gets neither, so it is reapable two minutes
# after the fork. Grace counts from the newer of insert and last touch, so the
# delay can never drop below 60 s; two minutes leaves the scenario's positive
# probe, which runs right after the fork returns, a wide margin on a slow
# runner. What else this reaches on a bench: nothing unbacked, nothing
# younger than two minutes, and nothing pinned — a suspended or restored
# sandbox pins its current artifact (the pin is cleared only while a
# re-suspend is in flight, and that re-suspend deletes the previous rows
# when it publishes) — i.e. only cold named snapshots that already have a
# durable copy. With target 0 the loop also logs "disk still over target
# after tick" every tick; that is the always-on gate talking, not a fault.
# Builder: null.
snapshotReaper:
  enabled: true
  engageFraction: "0"
  targetFraction: "0"
  intervalSecs: "15"
  graceSecs: "60"
  idleSecs: "120"

# S3-compatible object store the node stack targets for snapshot artifacts.
s3:
  # In-cluster SeaweedFS Service S3 endpoint (path-style addressing).
  endpoint: http://seaweedfs:8333
  region: us-east-1
  bucket: snapshots
  # Static credentials live in this Secret (rendered by the space-seaweedfs chart):
  #   SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID
  #   SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY
  credentialsSecretName: space-seaweedfs

# /space/cache loopback size (SPACE_CACHE_SIZE_MB, read by the kind
# entrypoint's btrfs image setup). Must sit comfortably above the 16 GiB
# logical ceiling of the encrypted suspend-snapshot volume: the backing file
# is sparse at the source and small in the object store, but a cross-node
# encrypted restore's pull materializes the full logical size on the target
# worker, so a 16 GiB cache can never receive one — the pull ENOSPCs and the
# node ends up ssd-placement-blocked. The image itself is sparse; unwritten
# capacity costs no host disk.
# Loop-device nodes the entrypoint stages before mounting /space/cache. Empty
# means the library's floor of 64 (matching node-manager's), raised to cover the
# highest loop index already in use plus SPACE_LOOP_HIGHWATER_SLACK — indices are
# kernel-global, so a fixed count wedges a restart once peers hold 0..N-1. Pin
# this only when a bench needs more than that floor from the start — e.g. a large
# encrypted fleet, which holds ~2 devices per running sandbox.
#
# Set through SPACE_LOOP_DEVICE_TARGET, which both bring-up paths map onto this
# value. Changing it on a bench whose Tilt is already running takes a Tilt
# restart: Tilt reads the environment once, at start, and the bring-up reuses a
# live process.
loopDeviceTarget: ""

cache:
  sizeMb: "40960"
  # Bind the btrfs backing image from the kind node (`/var/lib/space-cache.img`,
  # hostPath `FileOrCreate`) instead of leaving it on the pod's writable
  # overlay. With it, /space/cache survives a node-stack pod restart the way
  # the instance-store disk does on EKS: template-manager's startup recovery
  # and prune, sandbox-manager's local artifacts and both on-node reclaim
  # loops then see the same tree across a restart that production sees —
  # instead of every Tilt rollout wiping every template while the SQLite
  # catalogs under the hostPath /space/run keep their rows. The entrypoint
  # An init container formats the file the first time (kubelet creates it
  # empty) and whenever it is not a btrfs filesystem, so a chart re-apply
  # that keeps an older node-stack image never attaches an empty file; the
  # entrypoint then reuses a populated image as-is. To start clean, delete
  # the file on the kind node or recreate the cluster.
  persistImage: true

# Disk-admission sizing for /space/cache. Production defaults assume NVMe
# (50 GiB min-available floor, 8 GiB per-sandbox allocation reservation);
# the kind cache is a sparse loopback btrfs image (cache.sizeMb above), so
# scale both byte knobs to it (1 GiB each) through the same production config
# surface. Without this every node publishes scheduling_status=full / gets
# ssd-placement-blocked, and sbxmgr rejects prepare_sandbox with
# disk_available_below_threshold.
diskAdmission:
  minAvailableBytes: "1073741824"
  allocationReservationBytes: "1073741824"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
