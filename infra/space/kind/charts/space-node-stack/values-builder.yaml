# Dedicated local builder role. This is a second release of space-node-stack,
# scheduled only on the builder kind node; the default values remain the
# existing worker stack.
nodeSelector:
  space.pplx.net/node-pool: builder

node:
  role: builder
  serviceName: space-builder-node-api

builder:
  enabled: true
  # Keep build tracing off on the local bench. Recipe descriptions omit
  # user inputs, but other build failures can still contain guest output.
  traceExporter: "off"

# The node-stack container includes guest command stdout/stderr, which can
# contain user secrets even when step descriptions are safe. Exclude that
# container's logs.
datadogLogsExcluded: true

# Keep the pod's grace period above build-manager's 7200s drain budget when
# all builder services share one pod.
terminationGracePeriodSeconds: 7500

credentialManager:
  useObjectStoreCredentials: true

# Builders do not host user sandboxes or their network gateways.
networkCredentials:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "4"
    memory: 4Gi

# No template-cache eviction on the builder. The worker default is smoke-sized
# (see values.yaml `templateCache`); build-manager's register → publish reads
# the digest dir after register, and a freshly registered build is unpinned
# and unreferenced, so a 60 s grace could reclaim it under the upload. Null
# drops the key, so the DaemonSet renders none of the SPACE_TEMPLATE_* env.
templateCache: null

# No cold-sandbox eviction on the builder either: builders host build VMs,
# not suspended sandboxes, and the loop's knobs are worker sizing.
sandboxEviction: null

# No snapshot artifact reaper on the builder: build VMs leave no sandbox
# snapshot artifacts, and the loop's knobs are worker sizing.
snapshotReaper: null
