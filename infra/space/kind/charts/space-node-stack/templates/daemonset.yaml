{{- $nodeRole := required "node.role is required" .Values.node.role -}}
{{- if not (has $nodeRole (list "worker" "builder")) -}}
{{- fail "node.role must be worker or builder" -}}
{{- end -}}
{{- if and (eq $nodeRole "builder") (not .Values.builder.enabled) -}}
{{- fail "builder.enabled must be true when node.role=builder" -}}
{{- end -}}
{{- if and .Values.builder.enabled (le (int .Values.terminationGracePeriodSeconds) (int .Values.builder.drainTimeoutSeconds)) -}}
{{- fail "builder drain timeout must be less than termination grace period" -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-node-stack
  namespace: {{ .Release.Namespace }}
  labels:
    # Chart-level identity tag — distinct from the per-pod node-api role
    # label below. Keeps `kubectl get ds -l space.pplx.net/chart=space-node-stack`
    # working without confusing api-server's pod reflector role lookup.
    space.pplx.net/chart: space-node-stack
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.datadogTeam | quote }}
spec:
  selector:
    matchLabels:
      # Match the per-pod role label so api-server's pod reflector discovers
      # these pods as the corresponding worker or builder node-api.
      app.kubernetes.io/name: space-{{ $nodeRole }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.maxUnavailable | default "10%" | quote }}
  template:
    metadata:
      annotations:
        ad.datadoghq.com/tags: '{"team":"{{ .Values.datadogTeam }}"}'
        {{- if .Values.datadogLogsExcluded }}
        # node-stack tails service logs and guest command output to stdout.
        # Guest output can contain build secrets, so exclude this container's
        # logs. The format-cache-image init container runs no build recipes.
        ad.datadoghq.com/node-stack.logs_exclude: "true"
        {{- end }}
      labels:
        # api-server's KubernetesSubstrate pod reflector maps app.kubernetes.io/name
        # to a SPACE node role: "space-worker" -> worker, "space-builder" ->
        # builder. Anything else is ignored (the substrate can't find the
        # node-api pod and suspend/restore fails with "no ready node-api pod").
        # The role-specific label is rendered from node.role; the chart-level
        # identity tag lives in metadata.labels above.
        # See crates/libs/api/src/controllers/substrate/kubernetes/caches.rs.
        app.kubernetes.io/name: space-{{ $nodeRole }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        # The pod reflector also requires this companion label to scope its
        # watch to node-api Pods (it watches `component=node-api` and then
        # disambiguates by role via the name label above).
        app.kubernetes.io/component: node-api
        # Chart-level tag duplicated on the pod so an admin can find both
        # the DaemonSet and its pods with the same selector when debugging.
        space.pplx.net/chart: space-node-stack
        team: {{ .Values.datadogTeam | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      # The containerd-shim-space-v2 runs in the kind worker's PID namespace
      # (containerd's namespace). When it does `processAlive(fc_pid)` on the
      # pid sandbox-manager reported, it stat's /proc/<pid>/stat in THAT
      # namespace. The FC process spawned by the supervisor inside this pod is
      # invisible to the shim unless the pod shares the host's PID namespace.
      # Without hostPID, processAlive returns false ~immediately after Start,
      # the shim marks the task STOPPED, containerd emits a TaskExit event
      # within ~10ms, kubelet observes the pod sandbox is "not running" when
      # it goes to start the workload container, and the whole sandbox is
      # torn down via shim.Delete → sbxmgr "cleanup after delete". Services
      # running directly on the host already share its PID namespace.
      hostPID: true
      # node-ctl's Kubernetes node-local controller (node watch +
      # network-slots capacity advertisement + template pull-request
      # reconciler) — same RBAC as the prod space-node-ctl chart.
      serviceAccountName: {{ .Release.Name }}-node-stack
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | int }}
      {{- if .Values.cache.persistImage }}
      # The node-bound cache image must already be a btrfs filesystem when
      # the node-stack entrypoint attaches it. kubelet creates the
      # FileOrCreate file empty, and an entrypoint from before
      # `cache.persistImage` skips formatting anything that exists — so a
      # chart re-apply that keeps an older image (`bootstrap.sh
      # --skip-images`) would attach the empty file and crash-loop. Formatting
      # here, from the same image, makes the chart/image transition order
      # irrelevant; the entrypoint's own check stays as the second line.
      initContainers:
        - name: format-cache-image
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              set -eu
              img=/var/lib/space-cache.img
              if [ -s "$img" ] && btrfs inspect-internal dump-super "$img" >/dev/null 2>&1; then
                echo "[format-cache-image] $img is already btrfs; reusing"
                exit 0
              fi
              echo "[format-cache-image] formatting $img (${SPACE_CACHE_SIZE_MB}M, sparse)"
              truncate -s 0 "$img"
              truncate -s "${SPACE_CACHE_SIZE_MB}M" "$img"
              mkfs.btrfs -f -L space-cache "$img" >/dev/null
          env:
            - name: SPACE_CACHE_SIZE_MB
              value: {{ .Values.cache.sizeMb | quote }}
          volumeMounts:
            - name: cache-image
              mountPath: /var/lib/space-cache.img
      {{- end }}
      containers:
        - name: node-stack
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Firecracker + jailer + loop-mounted btrfs cache + cgroup subtree
          # management need a privileged container. Per-service privilege
          # separation happens inside via the production unix identities
          # (see node-stack-start.sh).
          securityContext:
            privileged: true
          ports:
            - name: grpc
              containerPort: 9800
          env:
            # Local Kind only; deployed services require authenticated internal RPC TLS.
            - name: SPACE_INTERNAL_RPC_INSECURE_DEV
              value: "true"
            - name: SPACE_CLUSTER_API_TOKEN_PATH
              value: "/var/run/space-publication/cluster-api.token"
            # Per-pod identity: the raw kube node name, exactly like the prod
            # node-service DaemonSets (fieldRef spec.nodeName). Services and
            # the cluster API derive the node UUID from (name, role) via
            # space_k8s_node_id — nothing hand-rolls an id.
            - name: SPACE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SPACE_NODE_ROLE
              value: {{ $nodeRole | quote }}
            - name: SPACE_NODE_MANAGED_BY
              value: {{ ternary "space" "k8s" .Values.directSubstrate.enabled | quote }}
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Activates node-ctl's Kubernetes node-local controller (prod
            # sets the same on the space-node-ctl DaemonSet). Fails soft to
            # "controller off" if the kube API is unreachable.
            - name: SPACE_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SPACE_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPACE_NODEMGR_SERVICE_PORT_INGRESS_ISOLATION
              value: {{ ternary "exclusive_host" "shared_host" .Values.directSubstrate.enabled | quote }}
            # Enables sandbox-manager's network-credential reconciliation.
            # Credential-manager resolves references through its default AWS
            # SDK credential chain; no provider-config file is mounted.
            - name: SPACE_SBXMGR_NETWORK_CREDENTIALS_ENABLED
              value: {{ .Values.networkCredentials.enabled | quote }}
            {{- with .Values.templateCache }}
            {{- with .budgetBytes }}
            # Template cache LRU eviction. Same env the prod template-manager
            # DaemonSet renders from `cache.budgetBytes`; the loop is off
            # without it. Interval and grace are smoke-sized (values.yaml).
            - name: SPACE_TEMPLATE_CACHE_BUDGET_BYTES
              value: {{ . | quote }}
            {{- end }}
            {{- with .gcIntervalSecs }}
            - name: SPACE_TEMPLATE_GC_INTERVAL_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .gcGraceSecs }}
            - name: SPACE_TEMPLATE_GC_GRACE_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .prefetchLatestN }}
            # How many release digests per warmed template prefetch pins;
            # pinned bytes count toward the budget and are never reclaimed.
            - name: SPACE_TEMPLATE_PREFETCH_LATEST_N
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.clusterDeletedEvictionQuiescenceSecs }}
            - name: SPACE_SBX_CLUSTER_DELETED_QUIESCENCE_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sandboxEviction }}
            {{- if .enabled }}
            # Cold-sandbox eviction (sandbox-manager). Same env the prod
            # space-sandbox-manager DaemonSet renders; smoke-sized in
            # values.yaml. Read once at daemon start.
            - name: SPACE_SBX_EVICT_ENABLED
              value: "1"
            - name: SPACE_SBX_EVICT_ENGAGE_FRACTION
              value: {{ .engageFraction | quote }}
            - name: SPACE_SBX_EVICT_TARGET_FRACTION
              value: {{ .targetFraction | quote }}
            - name: SPACE_SBX_EVICT_MIN_IDLE_SECS
              value: {{ .minIdleSecs | quote }}
            - name: SPACE_SBX_EVICT_INTERVAL_SECS
              value: {{ .intervalSecs | quote }}
            - name: SPACE_SBX_EVICT_REUPLOAD_MAX_PER_TICK
              value: {{ .reuploadMaxPerTick | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.snapshotReaper }}
            {{- if .enabled }}
            # On-node snapshot artifact reaper (sandbox-manager). Same env the
            # prod space-sandbox-manager DaemonSet renders; smoke-sized in
            # values.yaml. Read once at daemon start.
            - name: SPACE_SBX_GC_ENABLED
              value: "1"
            - name: SPACE_SBX_GC_ENGAGE_FRACTION
              value: {{ .engageFraction | quote }}
            - name: SPACE_SBX_GC_TARGET_FRACTION
              value: {{ .targetFraction | quote }}
            - name: SPACE_SBX_GC_INTERVAL_SECS
              value: {{ .intervalSecs | quote }}
            - name: SPACE_SBX_GC_GRACE_SECS
              value: {{ .graceSecs | quote }}
            - name: SPACE_SBX_GC_IDLE_SECS
              value: {{ .idleSecs | quote }}
            {{- end }}
            {{- end }}
            # Cluster API (space-internal-api). node-ctl publishes node
            # status + template inventory here (this IS node registration),
            # template-manager resolves releases for the pull path, and
            # sandbox-manager uses it for snapshot bookkeeping — same wiring
            # as the prod node-service DaemonSets.
            - name: SPACE_INTERNAL_API_ENDPOINT
              value: {{ .Values.internalApi.endpoint | quote }}
            {{- if .Values.eppo.secretName }}
            - name: EPPO_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.eppo.secretName }}
                  key: {{ required "eppo.secretKey is required when eppo.secretName is set" .Values.eppo.secretKey }}
                  optional: false
            {{- end }}
            {{- if .Values.eppo.baseUrl }}
            - name: EPPO_BASE_URL
              value: {{ .Values.eppo.baseUrl | quote }}
            {{- end }}
            {{- /* Only nil is "unset". `default dict` would swallow false, 0 and
                   "" as empty, so a non-map value would be silently ignored. */}}
            {{- $knownEgress := .Values.knownEgress }}
            {{- if kindIs "invalid" $knownEgress }}
            {{- $knownEgress = dict }}
            {{- else if not (kindIs "map" $knownEgress) }}
            {{- fail (printf "knownEgress must be a map with optional `enabled` and `domains` keys, got %s" (kindOf $knownEgress)) }}
            {{- end }}
            {{- $knownEgressDomains := $knownEgress.domains }}
            {{- if and (not (kindIs "invalid" $knownEgressDomains)) (not (kindIs "string" $knownEgressDomains)) }}
            {{- fail (printf "knownEgress.domains must be a comma-separated string, got %s; sandbox-manager parses it as one and rejects any other shape whole" (kindOf $knownEgressDomains)) }}
            {{- end }}
            {{- with $knownEgressDomains }}
            - name: SPACE_NET_GATEWAY_KNOWN_EGRESS_DOMAINS
              value: {{ . | quote }}
            {{- end }}
            - name: SPACE_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Kubernetes expands $(VAR_NAME) references against earlier env
            # entries on the same container, so this resolves to e.g.
            # 172.18.0.3:9800 at pod start. Only consumed by the legacy
            # DirectSubstrate registration (bench mode) below.
            - name: SPACE_NODE_API_ENDPOINT
              value: "$(SPACE_HOST_IP):9800"
            # credential-manager runs in its (pre-agent-migration) authority
            # role, which resolves org KEK rows from the control-plane DB.
            # The entrypoint hands this to credmgr only; no other node
            # service sees Postgres, matching production.
            - name: SPACE_CREDMGR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.secretKey }}
            # Kind consumers use their directly injected SeaweedFS credentials.
            # Credential exchange stays disabled because no AWS vending role
            # (SPACE_CREDMGR_S3_VEND_ROLE_ARN) is configured here.
            # Kind's legacy authority uses the development-only in-memory KEK.
            # Production authority charts intentionally omit this opt-in.
            - name: SPACE_CREDMGR_IN_MEMORY_KEK_ENABLED
              value: "true"
            - name: SPACE_PLATFORM_KEK_PROVIDER
              value: in-memory
            - name: SPACE_PLATFORM_KEK_IDENTIFIER
              value: kind-local-platform-kek
            # credmgr's pool connects as space_creds; the role is provisioned
            # by the api chart's bootstrap-roles initContainer.
            - name: SPACE_DB_CREDS_PASSWORD
              value: {{ .Values.postgres.managedCredentialsPassword | quote }}
            # Optional AWS creds for credmgr's independent AWS integrations
            # (for example Private CA). The entrypoint scopes them to credmgr;
            # the in-memory KEK backend above does not consume them.
            - name: SPACE_CREDMGR_AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  {{- if .Values.credentialManager.useObjectStoreCredentials }}
                  name: {{ .Values.s3.credentialsSecretName }}
                  key: SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID
                  {{- else }}
                  name: space-aws-creds
                  key: AWS_ACCESS_KEY_ID
                  optional: true
                  {{- end }}
            - name: SPACE_CREDMGR_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.credentialManager.useObjectStoreCredentials }}
                  name: {{ .Values.s3.credentialsSecretName }}
                  key: SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY
                  {{- else }}
                  name: space-aws-creds
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
                  {{- end }}
            {{- if not .Values.credentialManager.useObjectStoreCredentials }}
            - name: SPACE_CREDMGR_AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: space-aws-creds
                  key: AWS_SESSION_TOKEN
                  optional: true
            {{- end }}
            {{- if .Values.directSubstrate.enabled }}
            # Legacy DirectSubstrate bench (space-local-3486 / Tilt MINIMAL):
            # the api-server schedules off nodes/node_direct rows and there is
            # no registration RPC, so the entrypoint falls back to SQL
            # registration. Never enabled on the production-shaped stack.
            - name: SPACE_DIRECT_SUBSTRATE_REGISTRATION
              value: "1"
            - name: POSTGRES_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.secretKey }}
            {{- end }}
            # Datadog tracing — mirrors the prod EKS node-DaemonSet shape so
            # the same SPACE binaries emit traces here. DD_AGENT_HOST routes
            # to the node-local datadog-agent DaemonSet (via hostNetwork).
            # When bootstrap.sh hasn't installed the agent the tracer just
            # drops spans silently, so it's safe to render unconditionally.
            {{- include "space-kind-telemetry.env" . | nindent 12 }}
            - name: AWS_REGION
              value: {{ .Values.s3.region | quote }}
            # Scale the disk-admission floor down for Kind's small loopback
            # cache. Fraction-based thresholds retain their defaults because
            # they scale with the filesystem.
            - name: SPACE_NODE_DISK_ADMISSION_MIN_AVAILABLE_BYTES
              value: {{ .Values.diskAdmission.minAvailableBytes | quote }}
            - name: SPACE_NODE_DISK_ADMISSION_ALLOCATION_RESERVATION_BYTES
              value: {{ .Values.diskAdmission.allocationReservationBytes | quote }}
            # /space/cache loopback size for the kind entrypoint; see
            # values.yaml `cache.sizeMb` for why it must exceed the encrypted
            # suspend-snapshot volume's 16 GiB logical ceiling.
            - name: SPACE_CACHE_SIZE_MB
              value: {{ .Values.cache.sizeMb | quote }}
            {{- if ne (toString .Values.loopDeviceTarget) "" }}
            {{- /* Loop-device nodes the entrypoint stages before it mounts
                   /space/cache. The same variable node-manager reads once it is
                   up (crates/libs/node/mgr/server/src/loop_devices.rs), so one
                   setting covers both; the entrypoint's default matches that
                   module's floor. Rendered only when set, so the pod spec does
                   not carry a number the values file does not mention. */}}
            - name: SPACE_LOOP_DEVICE_TARGET
              value: {{ .Values.loopDeviceTarget | quote }}
            {{- end }}
            # Inter-service bearer tokens (every node service authorizes as the
            # Root peer principal, but the tokens gate the gRPC bearer layer).
            - name: SPACE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalSecretName }}
                  key: SPACE_INTERNAL_TOKEN
            - name: SPACE_INTERNAL_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalSecretName }}
                  key: SPACE_INTERNAL_CONTROL_TOKEN
            - name: SPACE_API_ROUTE_ED25519_VERIFICATION_BUNDLE_PATH
              value: /var/run/space-route-verification/verification-bundle.json
            - name: SPACE_CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            - name: SPACE_API_ROUTE_GENERATION_FENCE_ENABLED
              value: {{ .Values.spaceApiRouteToken.generationFenceEnabled | quote }}
            # Static S3 credentials — volume-manager uses these directly instead
            # of credmgr's STS/IRSA exchange (the local-dev escape hatch). See
            # crates/libs/vol/mgr/server/src/run.rs.
            - name: SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.credentialsSecretName }}
                  key: SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID
            - name: SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.credentialsSecretName }}
                  key: SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY
            {{- if .Values.builder.enabled }}
            # Builder publication settings mirror the production
            # space-build-manager chart, targeting local SeaweedFS.
            - name: SPACE_BUILD_MANAGER_ENDPOINT
              value: {{ .Values.builder.endpoint | quote }}
            - name: SPACE_OBJECT_STORE_BUCKET
              value: {{ .Values.builder.objectStore.bucket | quote }}
            - name: SPACE_OBJECT_STORE_REGION
              value: {{ .Values.builder.objectStore.region | quote }}
            - name: SPACE_OBJECT_STORE_ENDPOINT
              value: {{ .Values.builder.objectStore.endpoint | quote }}
            - name: SPACE_OBJECT_STORE_MULTIPART_CONCURRENCY
              value: {{ .Values.builder.objectStore.multipartConcurrency | quote }}
            - name: SPACE_OBJECT_STORE_MULTIPART_PART_SIZE_BYTES
              value: {{ .Values.builder.objectStore.multipartPartSizeBytes | int64 | quote }}
            - name: SPACE_BUILD_MANAGER_MAX_CONCURRENT_BUILDS
              value: {{ .Values.builder.maxConcurrentBuilds | quote }}
            - name: SPACE_BUILD_MANAGER_DRAIN_TIMEOUT_SECONDS
              value: {{ .Values.builder.drainTimeoutSeconds | quote }}
            - name: SPACE_BUILD_MANAGER_LISTEN
              value: {{ .Values.builder.listen | quote }}
            {{- with .Values.builder.traceExporter }}
            # Applied by node-stack-start.sh to the build-manager process only,
            # so the other services in this pod keep their normal exporter.
            - name: SPACE_BUILD_MANAGER_TRACE_EXPORTER
              value: {{ . | quote }}
            {{- end }}
            - name: SPACE_BUILDER_BLOB_MIN_AVAILABLE_BYTES
              value: {{ .Values.builder.blob.minAvailableBytes | quote }}
            {{- end }}
            # Snapshot upload destination read by sandbox-manager's
            # SnapshotUploadConfig::from_env (the suspend artifact-backup path).
            # Without these, suspend keeps snapshots local-only and never pushes
            # to SeaweedFS. Static creds are the SPACE_OBJECT_STORE_STATIC_* pair
            # above.
            - name: SPACE_SNAPSHOT_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: SPACE_SNAPSHOT_REGION
              value: {{ .Values.s3.region | quote }}
            - name: SPACE_SNAPSHOT_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
          # Startup can take minutes on first boot: the entrypoint waits for the
          # control-plane schema (api migrations), then registers + hashes the
          # multi-GiB seed rootfs, all before node-api binds :9800. The startup
          # probe gives that bootstrap a long budget and gates liveness/readiness
          # until node-api is actually serving, so a slow laptop/CI doesn't
          # crash-loop mid-bootstrap. (~15 min: 90 × 10s.)
          startupProbe:
            exec:
              command:
                {{- if .Values.builder.enabled }}
                - /bin/sh
                - -ec
                - >-
                  /opt/space/bin/grpc_health_probe -addr=127.0.0.1:9800 -connect-timeout=2s &&
                  /opt/space/bin/grpc_health_probe -addr={{ .Values.builder.listen | quote }} -service=build.manager.v1.BuildManager -connect-timeout=2s
                {{- else }}
                - /opt/space/bin/grpc_health_probe
                - -addr=127.0.0.1:9800
                - -connect-timeout=2s
                {{- end }}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            exec:
              command:
                {{- if .Values.builder.enabled }}
                - /bin/sh
                - -ec
                - >-
                  /opt/space/bin/grpc_health_probe -addr=127.0.0.1:9800 -connect-timeout=2s &&
                  /opt/space/bin/grpc_health_probe -addr={{ .Values.builder.listen | quote }} -service=build.manager.v1.BuildManager -connect-timeout=2s
                {{- else }}
                - /opt/space/bin/grpc_health_probe
                - -addr=127.0.0.1:9800
                - -connect-timeout=2s
                {{- end }}
            periodSeconds: 5
            failureThreshold: 6
          # Liveness probes node-api (:9800) — the service that fronts the whole
          # node stack for DirectSubstrate. If node-api dies while volmgr stays
          # up, restart the pod rather than serving broken create/restore. Only
          # armed after the startup probe passes.
          livenessProbe:
            exec:
              command:
                {{- if .Values.builder.enabled }}
                - /bin/sh
                - -ec
                - >-
                  /opt/space/bin/grpc_health_probe -addr=127.0.0.1:9800 -connect-timeout=3s &&
                  /opt/space/bin/grpc_health_probe -addr={{ .Values.builder.listen | quote }} -connect-timeout=3s
                {{- else }}
                - /opt/space/bin/grpc_health_probe
                - -addr=127.0.0.1:9800
                - -connect-timeout=3s
                {{- end }}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: publication-token
              mountPath: /var/run/space-publication
              readOnly: true
            - name: service-logs
              mountPath: /space/logs
            - name: run
              mountPath: /space/run
            - name: cache
              mountPath: /space/cache
              {{- if .Values.builder.enabled }}
              # Scratch builds run in the node's containerd mount namespace.
              mountPropagation: Bidirectional
              {{- end }}
            {{- if .Values.cache.persistImage }}
            - name: cache-image
              mountPath: /var/lib/space-cache.img
            {{- end }}
            - name: route-verification-bundle
              mountPath: /var/run/space-route-verification
              readOnly: true
            # systemd-nspawn needs the cgroup tree to set up the guest scope.
            - name: cgroup
              mountPath: /sys/fs/cgroup
            # Firecracker binary + vmlinux kernel staged by install-fc-vendor.sh
            # on the host and bind-mounted into the kind worker via
            # kind-cluster.yaml.tmpl's extraMounts. Read-only because we never
            # mutate the vendor tree at runtime (matches prod's Packer
            # invariant). Without this the runtime-supervisor's
            # LaunchFirecracker fails with "firecracker binary missing".
            - name: vendor
              mountPath: /space/vendor
              readOnly: true
            # KVM character device. The kind worker extraMount-binds
            # /dev/kvm from the host so the pod can claim it here.
            - name: kvm
              mountPath: /dev/kvm
            # CNI-managed network namespace files. kubelet (via the CNI
            # plugin in the kind worker) creates /var/run/netns/cni-<uid>
            # for each pod. sandbox-manager dial's network-gateway opens
            # this path to bind the firecracker tap into the per-sandbox
            # pod's namespace; without the mount it fails with
            # "network allocate failed: pod namespace not found".
            # mountPropagation Bidirectional so namespace removals
            # propagate when the kubelet tears the pod down.
            - name: netns
              mountPath: /var/run/netns
              mountPropagation: Bidirectional
            # Sandbox SSH keypair, generated per-devbox by
            # infra/space/kind/scripts/build-seed.sh (Packer generates the
            # AMI equivalent). The public half is baked into the seed rootfs;
            # the private half here lets `space-ssh` reach local sandboxes.
            # Private key stays root-only like the AMI's /space/etc/ssh.
            - name: sandbox-ssh
              mountPath: /space/etc/ssh
              readOnly: true
            {{- if .Values.builder.enabled }}
            # build-manager SSHes into the transient build VM as root and
            # talks to the node's containerd, matching the production mounts.
            - name: builder-ssh
              mountPath: /root/.ssh
              readOnly: true
            - name: containerd-run
              mountPath: /run/containerd
            - name: containerd-lib
              mountPath: /var/lib/containerd
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: publication-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: cluster-api.token
                  audience: space-cluster-api
                  expirationSeconds: 3600
        # Retain service output across container retries, but not pod replacement.
        # Recovery consumes orphan/stale fixtures; its original verdicts must
        # remain readable after a later service causes the container to exit.
        - name: service-logs
          emptyDir: {}
        # Node-local runtime state — unix sockets the SPACE node services
        # bind for IPC. Must be hostPath (not emptyDir) so that the SPACE
        # containerd shim, which runs in the kind node's pid+mount
        # namespace (not inside this pod), can reach the sandbox-manager
        # UDS at /space/run/sandbox-manager/sandbox-manager.sock. The shim
        # has that path hardcoded; see shim/space.go:sbxMgrSocket.
        # DirectoryOrCreate lets kind workers start before the DaemonSet
        # without manual prep.
        - name: run
          hostPath:
            path: /space/run
            type: DirectoryOrCreate
        # Instance rootfs clones + snapshot/transfer staging. On kind this is
        # overlayfs, so vol-mgr's reflink staging falls back to a plain copy.
        # The entrypoint mounts a loopback btrfs image over it.
        - name: cache
          {{- if .Values.builder.enabled }}
          # Containerd must resolve the builder's input/output paths on the node.
          hostPath:
            path: /space/cache
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.cache.persistImage }}
        # The btrfs image itself, bound from the kind node so the cache
        # outlives the pod (see values.yaml `cache.persistImage`). A file
        # hostPath: kubelet creates it empty, the entrypoint formats it once.
        # `/var/lib` because FileOrCreate does not create parent directories.
        - name: cache-image
          hostPath:
            path: /var/lib/space-cache.img
            type: FileOrCreate
        {{- end }}
        - name: route-verification-bundle
          secret:
            secretName: {{ .Values.spaceApiRouteToken.ed25519.verificationSecretName }}
            defaultMode: 0444
            items:
              - key: {{ .Values.spaceApiRouteToken.ed25519.verificationBundle }}
                path: verification-bundle.json
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        # Firecracker binary + vmlinux + jailer, populated on the host by
        # infra/space/kind/scripts/install-fc-vendor.sh and bind-mounted via
        # kind-cluster.yaml.tmpl's extraMounts. ReadOnly is enforced on the
        # mount above, not the volume.
        - name: vendor
          hostPath:
            path: /space/vendor
            type: Directory
        # KVM character device. kind-cluster.yaml.tmpl's extraMounts brings
        # /dev/kvm into the kind worker container; this exposes it inside
        # the node-stack pod. type: CharDevice ensures kubelet refuses to
        # start the pod if the host path is missing/wrong type (vs
        # silently DirectoryOrCreate-creating an empty dir).
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        # CNI per-pod netns root on the kind worker. With hostNetwork the
        # pod is already in the kind worker's network namespace, but
        # /var/run/netns is a MOUNT-namespace concept (where namespaces
        # are persisted as files). Bind-mounting the directory lets
        # sandbox-manager open /var/run/netns/cni-* and bind the
        # firecracker tap into the per-sandbox pod's namespace.
        - name: netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
        {{- if .Values.builder.enabled }}
        - name: containerd-run
          hostPath:
            path: /run/containerd
            type: Directory
        - name: containerd-lib
          hostPath:
            path: /var/lib/containerd
            type: Directory
        {{- end }}
        # Per-devbox sandbox SSH keypair (created by bootstrap from
        # ~/.space-devbox/space/etc/ssh). Optional so a bare chart apply
        # still starts the stack; without it only `space-ssh` is degraded.
        - name: sandbox-ssh
          secret:
            secretName: {{ .Values.sandboxSsh.secretName }}
            defaultMode: 0400
            optional: true
        {{- if .Values.builder.enabled }}
        - name: builder-ssh
          secret:
            secretName: {{ .Values.sandboxSsh.secretName }}
            defaultMode: 0400
            optional: false
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.node.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    space.pplx.net/chart: space-node-stack
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Match the per-pod role label (see daemonset pod template above).
  selector:
    app.kubernetes.io/name: space-{{ $nodeRole }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc
      port: 9800
      targetPort: 9800
