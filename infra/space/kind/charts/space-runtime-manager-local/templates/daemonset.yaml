{{- $ctx := dict "ctx" . "component" "runtime-manager" -}}
{{- $socket := "/space/run/runtime-manager/runtime-manager.sock" -}}
{{- include "space-node-service.serviceAccount" $ctx }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "space-node-service.name" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "space-node-service.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "space-node-service.selectorLabels" $ctx | nindent 6 }}
  # Delete first: runtime-manager holds no service mutex, so nothing makes a
  # successor wait for its predecessor. The successor binds at once and takes
  # the socket path by rename (crates/libs/unix-socket-bind/src/unix_socket.rs), while
  # both probes target that one shared socket rather than an instance-local
  # health socket; and with installs enabled the successor's installer empties
  # the shared staging directory on open, which it may only do "when nothing in
  # staging is live" (staging::prepare, Installer::open).
  # Two instances therefore must not overlap on a node. Nothing waits on its
  # listings, so the brief gap during a replacement costs nothing.
  {{- include "space-node-service.updateStrategy" (dict "strategy" "deleteFirst") | nindent 2 }}
  template:
    metadata:
      annotations:
        {{- include "space-node-service.podAnnotations" $ctx | nindent 8 }}
      labels:
        {{- include "space-node-service.labels" $ctx | nindent 8 }}
    spec:
      {{- include "space-node-service.nodeSelector" $ctx | nindent 6 }}
      {{- include "space-node-service.priorityClass" $ctx | nindent 6 }}
      serviceAccountName: {{ include "space-node-service.name" $ctx }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | int }}
      # space-rtmgr with its socket and node-manager client groups
      # (SPACE_RUNTIME_MANAGER_GROUPS): installs ask node-manager, over its
      # socket, to publish what they staged (NodeManagerPublisher).
      securityContext:
        {{- include "space-node-service.runAs" (dict "ctx" . "user" "SPACE_RTMGR" "groups" "SPACE_RUNTIME_MANAGER_GROUPS") | nindent 8 }}
      initContainers:
        {{- include "space-node-service.prepareRunDir" (dict "ctx" . "path" "/space/run/runtime-manager" "mode" "0750"
            "uid" (include "space-node-service.identityNumber" (dict "ctx" . "name" "SPACE_RTMGR_UID"))
            "gid" (include "space-node-service.groupId" (dict "ctx" . "name" "space-rtmgrclients"))) | nindent 8 }}
      containers:
        - name: runtime-manager
          {{- include "space-node-service.image" . | nindent 10 }}
          # With artifactInstalls.enabled, no `--list-only`: listings, and
          # installs of the catalog's releases and kernels from the compiled
          # sources (FIRECRACKER_RELEASE_SOURCE, Firecracker's GitHub release
          # downloads, and FIRECRACKER_CI_KERNEL_SOURCE, its CI bucket read
          # anonymously), downloaded over the pod network into staging.
          command: ["/opt/space/bin/space-rtmgr-svc"]
          {{- if not .Values.artifactInstalls.enabled }}
          args: ["--list-only"]
          {{- end }}
          {{- include "space-node-service.restrictedContainer" . | nindent 10 }}
          env:
            {{- include "space-node-service.env.identity" . | nindent 12 }}
          # No instance-local health socket; probe the service socket's
          # standard gRPC health service.
          startupProbe:
            exec:
              command: ["/opt/space/bin/grpc_health_probe", "-addr=unix://{{ $socket }}", "-connect-timeout=2s", "-rpc-timeout=2s"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["/opt/space/bin/grpc_health_probe", "-addr=unix://{{ $socket }}", "-connect-timeout=2s", "-rpc-timeout=2s"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/opt/space/bin/grpc_health_probe", "-addr=unix://{{ $socket }}", "-connect-timeout=3s", "-rpc-timeout=3s"]
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            {{- include "space-node-service.mount.run" . | nindent 12 }}
            # Writable with artifactInstalls.enabled, for its staging only,
            # /space/cache/.rtmgr-staging (RUNTIME_MANAGER_STAGING_DIR), which
            # node-manager creates private to space-rtmgr and the installer
            # clears on open; the account is in no group that writes the rest
            # of the cache.
            {{- include "space-node-service.mount.cache" (dict "readOnly" (not .Values.artifactInstalls.enabled)) | nindent 12 }}
            # The runtime aliases (/space/bin/firecracker, jailer), the vendor
            # releases and kernels they resolve to, and the managed store
            # /space/vendor/artifacts it lists. Read-only: node-manager alone
            # publishes into the store.
            - name: space-bin
              mountPath: /space/bin
              readOnly: true
            - name: vendor
              mountPath: /space/vendor
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "space-node-service.volume.run" . | nindent 8 }}
        {{- include "space-node-service.volume.cache" . | nindent 8 }}
        - name: space-bin
          hostPath:
            path: /space/bin
            type: DirectoryOrCreate
        - name: vendor
          hostPath:
            path: /space/vendor
            type: Directory
        - name: tmp
          emptyDir: {}
