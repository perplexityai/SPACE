# runtime-manager on every SPACE Kind node: lists the node's Firecracker
# releases and guest kernels (`space-rtmgr list`) and installs the catalog's
# (`space-rtmgr runtimes|kernels install`), which node-manager publishes into
# the node's /space/vendor/artifacts. Nothing depends on it for execution.
# One release per role: `space` and `space-builder` (`--set node.role=builder`).

image:
  repository: space-worker
  tag: local
  pullPolicy: IfNotPresent

datadogEnvironment: kind-local
clusterId: kind-local
telemetry: {}
node: {}

# runtime-manager has no service mutex and no drain budget of its own; its
# gRPC server shuts down gracefully on SIGTERM
# (crates/libs/node/runtime/manager/server/src/run.rs). The shared lifecycle
# default grace (crates/libs/service-lifecycle/src/lib.rs).
terminationGracePeriodSeconds: 60

# Installs (no --list-only, /space/cache writable for its staging). Set with
# space-node-manager-local's artifactInstalls.enabled, which lets node-manager
# create and publish into the store; off, the service only lists.
# infra/space/cluster turns it off.
artifactInstalls:
  enabled: true

# Kind sizing: requests only (see space-node-manager-local/values.yaml).
resources:
  requests:
    cpu: 10m
    memory: 32Mi
