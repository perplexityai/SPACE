image:
  repository: space-data-plane
  tag: local
  pullPolicy: IfNotPresent

datadogTeam: team-space

# Telemetry defaults come from the space-kind-telemetry library.
telemetry: {}

service:
  name: space-data-plane
  port: 8090
  type: ClusterIP

internal:
  secretName: space-internal
  apiEndpoint: https://space-internal-api:9800

grpcClient:
  # Set to "kubernetes" to exercise per-RPC balancing in Kind.
  endpointDiscovery: ""

# JSON array of {apiHost, host} pairs (SPACE_ECW_HOSTS).
ecwHosts: '[{"apiHost":"api.local.e2b.test","host":"local.e2b.test"}]'

nodeSelector:
  space.pplx.net/infra: "true"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
