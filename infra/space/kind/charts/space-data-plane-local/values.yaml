image:
  repository: space-data-plane
  tag: local
  pullPolicy: IfNotPresent

datadogTeam: team-space

# Telemetry defaults come from the space-kind-telemetry library.
telemetry: {}

service:
  name: space-data-plane
  port: 8090
  type: ClusterIP

# Load-balanced entry, as a deployment's load balancer gives the public data
# plane: a NodePort Service that kind-cluster.yaml.tmpl maps to
# 127.0.0.1:8090 on the host, so command streams and ECW wildcard hosts reach
# every replica rather than the one pod a `kubectl port-forward` pins.
# kube-proxy balances per connection.
entry:
  name: space-data-plane-entry
  # Service type. nodePort applies only to NodePort; a cluster outside Kind
  # picks its own exposure (infra/space/cluster).
  type: NodePort
  nodePort: 30090

# As the API's (space-api-local values.yaml): two replicas at least, three at
# most so both tiers' worst case fits the shared infra node of a 16-core
# runner, on CPU against the request and memory by absolute use.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryAverageValue: 384Mi

# Lifetime of the projected node-api token, as deployed; the kubelet
# refreshes it at 80% of that.
nodeApiTokenExpirationSeconds: 600

# Graceful shutdown, as deployments give the data plane.
#
# On SIGTERM the listener stops accepting and new streams are refused with a
# retryable 503 (a native WebSocket that has not attached yet gets close 1012),
# while streams that were already attached keep running; the process exits as
# soon as none remain (serve_and_drain, crates/libs/data/plane/server/src/drain.rs).
# Streams still open after --shutdown-grace-secs are cancelled, each in the form
# docs/architecture.md describes, and then get 5 s (STREAM_CANCEL_GRACE) before
# the process exits regardless. Sized like the API's 150 s shutdown grace, for
# the same clients' in-flight work. The chart always sets this deadline; the
# binary's no-deadline mode is for deployments that rely on the termination
# grace period alone.
shutdownGraceSeconds: 150

# Seconds the pod keeps serving after it starts terminating, before SIGTERM,
# so it leaves the entry Services' endpoints first: kube-proxy drops an
# endpoint in about a second, and deployments size this for their load
# balancer instead.
preStopSleepSeconds: 5

# Covers the preStop delay, the shutdown grace, the 5 s the data plane gives
# cancelled streams to close, and the telemetry flush and exit after it. The
# template refuses a value that does not exceed the first three.
terminationGracePeriodSeconds: 180

# The boot budget. The listener binds only once ClusterApi answers: startup
# retries it with backoff to 5 s, each attempt with a 5 s connect timeout
# (connect_cluster_api_for_startup, lib.rs), so a data plane that starts
# beside a rolling internal-api waits for it here rather than in liveness
# restarts. 24 x 5 s.
startupProbe:
  periodSeconds: 5
  failureThreshold: 24

# As the API's: a replacement counts as available after two readiness
# periods Ready.
minReadySeconds: 10

internal:
  secretName: space-internal
  apiEndpoint: https://space-internal-api:9800

grpcClient:
  # Set to "kubernetes" to exercise per-RPC balancing in Kind.
  endpointDiscovery: ""

# JSON array of {apiHost, host} pairs (SPACE_ECW_HOSTS).
ecwHosts: '[{"apiHost":"api.local.e2b.test","host":"local.e2b.test"}]'

# Scheduling priority (infra/space/kind/manifests/priorityclasses.yaml).
priorityClassName: space-control-plane

nodeSelector:
  space.pplx.net/infra: "true"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
