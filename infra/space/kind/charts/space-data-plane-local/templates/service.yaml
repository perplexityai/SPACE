apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-data-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: space-data-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
# The public entry, on a fixed node port the Kind cluster config maps to the
# host (values.yaml, `entry`).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.entry.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-data-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.entry.type | default "NodePort" }}
  selector:
    app.kubernetes.io/name: space-data-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq (.Values.entry.type | default "NodePort") "NodePort") .Values.entry.nodePort }}
      nodePort: {{ .Values.entry.nodePort }}
      {{- end }}
      protocol: TCP
