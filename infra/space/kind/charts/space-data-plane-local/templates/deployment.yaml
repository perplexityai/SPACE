apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-data-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-data-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.datadogTeam | quote }}
spec:
  {{- if .Values.autoscaling.enabled }}
  # The HorizontalPodAutoscaler (hpa.yaml) owns the replica count.
  {{- else }}
  replicas: 1
  {{- end }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  selector:
    matchLabels:
      app.kubernetes.io/name: space-data-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    {{- if .Values.autoscaling.enabled }}
    # Several replicas serve behind the load-balanced entry, so a rollout
    # replaces them one at a time instead of taking every replica down at once.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    type: Recreate
    {{- end }}
  template:
    metadata:
      annotations:
        {{- include "space-kind-telemetry.logAnnotations" . | nindent 8 }}
        ad.datadoghq.com/tags: '{"team":"{{ .Values.datadogTeam }}"}'
      labels:
        app.kubernetes.io/name: space-data-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
        team: {{ .Values.datadogTeam | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClassName }}
      serviceAccountName: {{ .Release.Name }}-data-plane
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | int }}
      containers:
        - name: data-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/space/bin/space-data-plane-svc"]
          {{- with .Values.internalPort }}
          args: ["--internal-listen", "0.0.0.0:{{ . }}"]
          {{- end }}
          env:
            - name: SPACE_CLUSTER_API_TOKEN_PATH
              value: "/var/run/space-publication/cluster-api.token"
            # Authenticated internal RPC TLS (docs/internal-rpc-tls.md): the
            # cluster's internal RPC CA, and the shared node-api identity, since NodeApi is dialled by node IP.
            - name: SPACE_INTERNAL_RPC_TLS_CA
              value: /etc/space-rpc-ca/ca.crt
            - name: SPACE_NODE_API_TLS_SERVER_NAME
              value: space-node-api
            # The guest bridge's NodeApi credential (SpaceBearerToken::NodeApi,
            # crates/libs/data/plane/server/src/native/protocol.rs); node-api
            # admits it by TokenReview and confines it to guest calls. The data
            # plane never calls WorkerApiInternal.
            - name: SPACE_NODE_API_TOKEN_PATH
              value: /var/run/space-auth/node-api.token
            # Datadog tracing — see datadog-agent-local chart.
            {{- include "space-kind-telemetry.env" . | nindent 12 }}
            - name: SPACE_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPACE_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SPACE_INTERNAL_API_ENDPOINT
              value: {{ .Values.internal.apiEndpoint | quote }}
            {{- with .Values.grpcClient.endpointDiscovery }}
            - name: SPACE_CLUSTER_API_ENDPOINT_DISCOVERY
              value: {{ . | quote }}
            {{- end }}
            - name: SPACE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internal.secretName }}
                  key: SPACE_INTERNAL_TOKEN
            - name: SPACE_ECW_HOSTS
              value: {{ .Values.ecwHosts | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- with .Values.internalPort }}
            - name: internal
              containerPort: {{ . }}
              protocol: TCP
            {{- end }}
          # Leave the entry Services' endpoints before SIGTERM stops the
          # listener (values.yaml).
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds | int }}
          # The boot budget (values.yaml). Liveness and readiness start once
          # it passes.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: rpc-ca
              mountPath: /etc/space-rpc-ca
              readOnly: true
            - name: publication-token
              mountPath: /var/run/space-publication
              readOnly: true
            - name: node-api-token
              mountPath: /var/run/space-auth
              readOnly: true
      volumes:
        - name: rpc-ca
          secret:
            secretName: space-internal-rpc-ca
            defaultMode: 0444
        - name: publication-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: cluster-api.token
                  audience: space-cluster-api
                  expirationSeconds: 3600
        - name: node-api-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: node-api.token
                  audience: space-node-api
                  expirationSeconds: {{ .Values.nodeApiTokenExpirationSeconds | int }}
