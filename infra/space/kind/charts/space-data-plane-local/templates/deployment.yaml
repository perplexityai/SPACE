{{- /* The data plane gives streams cancelled at the drain deadline 5 s to close
(STREAM_CANCEL_GRACE, crates/l40_api/data/plane/server/src/drain.rs). */ -}}
{{- if lt (int .Values.shutdownGraceSeconds) 8 -}}
{{- fail "shutdownGraceSeconds must be at least 8, the stream-open budget (MIN_SHUTDOWN_GRACE)" -}}
{{- end -}}
{{- /* A files request can take its upload time before it wakes its sandbox,
wait 135 s for the wake, then transfer (nativeFiles in values.yaml). */ -}}
{{- if and .Values.nativeFiles.enabled (lt (int .Values.shutdownGraceSeconds) (add (int .Values.nativeFiles.uploadSeconds) 135 (int .Values.nativeFiles.transferSeconds))) -}}
{{- fail "with nativeFiles.enabled, shutdownGraceSeconds must cover nativeFiles.uploadSeconds, the 135 s wake wait and nativeFiles.transferSeconds" -}}
{{- end -}}
{{- if le (int .Values.terminationGracePeriodSeconds) (add (int .Values.preStopSleepSeconds) (int .Values.shutdownGraceSeconds) 5) -}}
{{- fail "terminationGracePeriodSeconds must exceed preStopSleepSeconds + shutdownGraceSeconds + 5" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-data-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-data-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.datadogTeam | quote }}
spec:
  {{- if .Values.autoscaling.enabled }}
  # The HorizontalPodAutoscaler (hpa.yaml) owns the replica count.
  {{- else }}
  replicas: 1
  {{- end }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  selector:
    matchLabels:
      app.kubernetes.io/name: space-data-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    {{- if .Values.autoscaling.enabled }}
    # Several replicas serve behind the load-balanced entry, so a rollout
    # replaces them one at a time instead of taking every replica down at once.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    type: Recreate
    {{- end }}
  template:
    metadata:
      annotations:
        {{- include "space-kind-telemetry.logAnnotations" . | nindent 8 }}
        ad.datadoghq.com/tags: '{"team":"{{ .Values.datadogTeam }}"}'
      labels:
        app.kubernetes.io/name: space-data-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
        team: {{ .Values.datadogTeam | quote }}
        {{- /* The Rust build this pod is rendered for (infra/space/kind/lib/rust-build.sh),
        so a change of build rolls it; scripts/deployed-rust-build.py checks it
        against the image the pod runs. */}}
        {{- with .Values.rustBuild }}
        space.pplx.net/kind-rust-build: {{ . | quote }}
        {{- end }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClassName }}
      serviceAccountName: {{ .Release.Name }}-data-plane
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | int }}
      containers:
        - name: data-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/space/bin/space-data-plane-svc"]
          args:
            - --shutdown-grace-secs
            - {{ .Values.shutdownGraceSeconds | quote }}
          env:
            - name: SPACE_CLUSTER_API_TOKEN_PATH
              value: "/var/run/space-publication/cluster-api.token"
            # Authenticated internal RPC TLS (docs/internal-rpc-tls.md): the
            # cluster's internal RPC CA, and the shared node-api identity, since NodeApi is dialled by node IP.
            - name: SPACE_INTERNAL_RPC_TLS_CA
              value: /etc/space-rpc-ca/ca.crt
            - name: SPACE_NODE_API_TLS_SERVER_NAME
              value: space-node-api
            # The guest bridge's NodeApi credential (SpaceBearerToken::NodeApi,
            # crates/l40_api/data/plane/server/src/native/protocol.rs); node-api
            # admits it by TokenReview and confines it to guest calls. The data
            # plane never calls WorkerApiInternal.
            - name: SPACE_NODE_API_TOKEN_PATH
              value: /var/run/space-auth/node-api.token
            # Datadog tracing — see datadog-agent-local chart.
            {{- include "space-kind-telemetry.env" . | nindent 12 }}
            - name: SPACE_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPACE_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SPACE_INTERNAL_API_ENDPOINT
              value: {{ .Values.internal.apiEndpoint | quote }}
            {{- with .Values.grpcClient.endpointDiscovery }}
            - name: SPACE_CLUSTER_API_ENDPOINT_DISCOVERY
              value: {{ . | quote }}
            {{- end }}
            - name: SPACE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internal.secretName }}
                  key: SPACE_INTERNAL_TOKEN
            - name: SPACE_ECW_HOSTS
              value: {{ .Values.ecwHosts | quote }}
            {{- if .Values.nativeFiles.enabled }}
            # Native files: each request is authorized and prepared by the
            # API's activation listener over the internal RPC TLS above, with
            # the cluster-api token; the sandbox call goes to the runtime it
            # grants (values.yaml).
            - name: SPACE_DATA_PLANE_NATIVE_FILES
              value: serve
            - name: SPACE_INGRESS_ACTIVATION_ENDPOINT
              value: {{ .Values.nativeFiles.accessEndpoint | quote }}
            {{- with .Values.nativeFiles.uploadAdmission }}
            {{- if .enabled }}
            # Bounds the write bodies it holds to the pod's memory (values.yaml).
            - name: SPACE_DATA_PLANE_NATIVE_UPLOAD_ADMISSION
              value: "true"
            - name: SPACE_DATA_PLANE_MAX_IN_FLIGHT_NATIVE_UPLOAD_BYTES
              value: {{ .maxInFlightBytes | int64 | quote }}
            - name: SPACE_DATA_PLANE_MAX_IN_FLIGHT_NATIVE_UPLOAD_BYTES_PER_ORG
              value: {{ .maxInFlightBytesPerOrg | int64 | quote }}
            - name: SPACE_DATA_PLANE_MAX_IN_FLIGHT_NATIVE_UPLOAD_BYTES_PER_SANDBOX
              value: {{ .maxInFlightBytesPerSandbox | int64 | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # Leave the entry Services' endpoints before SIGTERM stops the
          # listener (values.yaml).
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds | int }}
          # The boot budget (values.yaml). Liveness and readiness start once
          # it passes.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: rpc-ca
              mountPath: /etc/space-rpc-ca
              readOnly: true
            - name: publication-token
              mountPath: /var/run/space-publication
              readOnly: true
            - name: node-api-token
              mountPath: /var/run/space-auth
              readOnly: true
      volumes:
        - name: rpc-ca
          secret:
            secretName: space-internal-rpc-ca
            defaultMode: 0444
        - name: publication-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: cluster-api.token
                  audience: space-cluster-api
                  expirationSeconds: 3600
        - name: node-api-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: node-api.token
                  audience: space-node-api
                  expirationSeconds: {{ .Values.nodeApiTokenExpirationSeconds | int }}
