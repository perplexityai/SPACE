# PostgreSQL 17, the major version deployments run and SPACE is built and
# tested against (infra/space/aws/reference/addons/variables.tf). CI takes this
# tag from the GHCR mirror at the digest ci/mirrored-images.txt pins.
image:
  repository: postgres
  tag: "17"
  pullPolicy: IfNotPresent

datadogTeam: team-space

service:
  name: postgres
  port: 5432

# Dev-only credentials. Override in CI or anything beyond local laptops.
# NOTE: do NOT use "space" as any whole value here. Tilt redacts secret VALUES
# from command lines (including docker build-args), so a value of `space`
# poisons every `docker build … space-rust-build-… …` invocation and the build
# fails with "pull access denied" on the redacted image name.
credentials:
  # The image's superuser, which initdb creates. Only the image's init and the
  # harness's direct-state psql helpers (kind_stack_psql) use it; no SPACE
  # process connects as it.
  user: spaceuser
  password: spacepassword
  database: spacedb
  # The login every SPACE connection string names, as a managed database's
  # master user: not a superuser, but CREATEDB CREATEROLE and a member of
  # rds_superuser (templates/configmap.yaml creates both). bootstrap-roles
  # takes its managed-service branch for this session
  # (converge_superadmin_attributes and converge_role_attributes in
  # crates/libs/db/migrator/src/bootstrap_roles.rs), and the services replace
  # it with their managed identity (database_connect_options,
  # crates/libs/common/svc/src/sql/mod.rs). Deployments name it space_admin,
  # which bootstrap-roles never manages (ensure_no_session_collision).
  masterUser: space_admin
  masterPassword: masterpassword

# Server settings, passed to postgres as `-c` flags (templates/statefulset.yaml).
server:
  # Every client pool's maximum must fit, so that a service is limited by its
  # own pool, as deployed, and never by the server refusing a connection.
  # Per process, from the pools each one opens and POSTGRES_POOL_MAX_CONNECTIONS
  # (default 25, crates/libs/common/svc/src/sql/mod.rs) in its chart:
  #   space-api        2 pools x 100 (space_user + space_creds,
  #                    crates/libs/api/src/run.rs) x 4 pods (HPA maximum 3,
  #                    plus 1 rolling-update surge)                       800
  #   space-admin-api  2 x 100 x 1 (Recreate)                              200
  #   internal-api     30 + 3 (template-visibility sideline pool,
  #                    crates/libs/internal/api/server/src/run.rs) x 1     33
  #   cluster-controller (2 x 25 + 1 node-drain listener,
  #                    node_drain/store.rs) x 3 (2 replicas + 1 surge)    153
  #   credmgr-authority 25 (space_creds) x 3 (2 replicas + 1 surge)        75
  #   space-db-migrate one connection per step (lib.rs, bootstrap_roles.rs)  1
  #                                                                    -----
  #                                                                     1262
  # The rest is headroom for operator and harness psql sessions and the
  # superuser reserve (superuser_reserved_connections, 3). A pool-size or
  # replica change in those charts must keep this sum below the setting.
  maxConnections: 1400
  # Logs each lock wait longer than deadlock_timeout (1 s), as the deployed
  # server does, so contention shows up in Kind's logs.
  logLockWaits: "on"

nodeSelector:
  space.pplx.net/infra: "true"

storage:
  size: 1Gi

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  # Sized for maxConnections backends rather than for the few dozen the suites
  # usually hold open: each backend keeps its own memory (catalog caches,
  # prepared statements, and work_mem for each sort or hash it runs), so pools
  # that grow toward their maxima must not OOM-kill the database. Against this
  # image and the migrated schema, every TLS backend that has read each table
  # holds about 3.3 MiB, 5.3 GiB for the pod at maxConnections; 4 GiB was
  # OOM-killed at about 1,280. The rest is headroom for prepared statements and
  # work_mem. The request stays small, so the limit reserves nothing.
  limits:
    cpu: 500m
    memory: 8Gi
