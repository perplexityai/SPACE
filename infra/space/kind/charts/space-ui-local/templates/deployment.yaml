apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.datadogTeam | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: space-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        ad.datadoghq.com/tags: '{"team":"{{ .Values.datadogTeam }}"}'
      labels:
        app.kubernetes.io/name: space-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
        team: {{ .Values.datadogTeam | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClassName }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "/space/ui/server.js"]
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.apiUrl | quote }}
            # Next.js rewrites /v1/sessions/* to this so the browser stays
            # same-origin (avoids CORS preflight redirects on devbox-fronted
            # UIs). Cluster-internal Service DNS — Next.js resolves it
            # server-side, the browser only ever sees the UI host.
            - name: NEXT_PUBLIC_DATA_PLANE_URL
              value: {{ .Values.dataPlaneUrl | quote }}
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: PORT
              value: "{{ .Values.service.port }}"
            - name: HOSTNAME
              value: "0.0.0.0"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
