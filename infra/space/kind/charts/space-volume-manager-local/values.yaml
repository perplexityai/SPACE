# volume-manager on every SPACE Kind node: snapshot and template transfers
# between /space/cache and the object store. One release per role: `space`
# and `space-builder` (`--set node.role=builder`).

image:
  repository: space-worker
  tag: local
  pullPolicy: IfNotPresent

datadogEnvironment: kind-local
clusterId: kind-local
telemetry: {}
node: {}

# How this service gets object-store credentials, set by every bring-up path
# from SPACE_KIND_STORAGE_CREDENTIALS (infra/space/kind/lib/storage-credentials.sh):
# `exchange` through credential-manager on sandbox workers, or `static` keys.
storageCredentials: exchange

# On SIGTERM volume-manager closes transfer admission, drains queued
# transfers for up to --drain-timeout-secs (100 s), then stops its gRPC server
# within --server-drain-timeout-secs (10 s)
# (crates/libs/vol/mgr/server/src/run.rs). The grace covers both plus exit.
terminationGracePeriodSeconds: 120

# Volume-manager's streaming snapshot upload part budget
# (SPACE_VOLUME_STREAM_PUSH_BUFFER_BUDGET_BYTES). Null leaves the variable
# unset, so Kind streams eligible uploads with the service default 1 GiB
# budget, as a deployment that does not set it does: this pod has no memory
# limit shared with other services. "0" uploads through temporary files
# instead; another value must be whole MiB and at least 64 MiB. See
# docs/snapshot-upload-streaming.md.
streamPushBufferBudgetBytes: null

# Kind sizing: requests only (see space-node-manager-local/values.yaml).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
