{{- $ctx := dict "ctx" . "component" "volume-manager" -}}
{{- include "space-node-service.serviceAccount" $ctx }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "space-node-service.name" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "space-node-service.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "space-node-service.selectorLabels" $ctx | nindent 6 }}
  # Delete first: volume-manager holds /space/run/volume-manager/service.mutex
  # and a successor under the same identity could take it over passively, but
  # this chart runs the separate space-volmgr identity, and a cluster whose
  # earlier release ran the legacy one would otherwise start a successor that
  # can never acquire the predecessor's lock (docs/installation.md,
  # "Separating volume-manager's credential identity"). Kind nodes are fresh
  # per cluster, so the first start finds no retained state to hand over.
  {{- include "space-node-service.updateStrategy" (dict "strategy" "deleteFirst") | nindent 2 }}
  template:
    metadata:
      annotations:
        {{- include "space-node-service.podAnnotations" $ctx | nindent 8 }}
      labels:
        {{- include "space-node-service.labels" $ctx | nindent 8 }}
    spec:
      {{- include "space-node-service.nodeSelector" $ctx | nindent 6 }}
      serviceAccountName: {{ include "space-node-service.name" $ctx }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | int }}
      # The separate volume-manager identity: space-volmgr (UID 964) with
      # SPACE_VOLUME_MANAGER_GROUPS, the production shape. node-manager's
      # btrfs send-lease RPCs authorize this principal and no other
      # (crates/libs/node/mgr/server/src/service/btrfs_send_transport.rs), so
      # deferred btrfs-send capture depends on it. Credentials come through
      # credential-manager's volume socket, the only listener that admits this
      # identity (docs/installation.md, "Separating volume-manager's
      # credential identity"); Kind's static object-store credentials bypass
      # the token exchange, but DEK issue and unwrap still use it.
      securityContext:
        {{- include "space-node-service.runAs" (dict "ctx" . "user" "SPACE_VOLMGR" "groups" "SPACE_VOLUME_MANAGER_GROUPS") | nindent 8 }}
      initContainers:
        # sandbox-manager and template-manager reach the socket through
        # space-sbxclients (crates/libs/vol/mgr/server/src/run.rs).
        {{- include "space-node-service.prepareRunDir" (dict "ctx" . "path" "/space/run/volume-manager" "mode" "0750"
            "uid" (include "space-node-service.identityNumber" (dict "ctx" . "name" "SPACE_VOLMGR_UID"))
            "gid" (include "space-node-service.groupId" (dict "ctx" . "name" "space-sbxclients"))) | nindent 8 }}
      containers:
        - name: volume-manager
          {{- include "space-node-service.image" . | nindent 10 }}
          command:
            - /opt/space/bin/space-volmgr-svc
            - --health-socket={{ include "space-node-service.healthSocket" $ctx }}
          # File transfers only: no mounts, devices or ownership changes in
          # the service path (crates/libs/vol/mgr/server/src/{executor,staging}.rs).
          {{- include "space-node-service.restrictedContainer" . | nindent 10 }}
          env:
            {{- include "space-node-service.env.identity" . | nindent 12 }}
            {{- include "space-node-service.env.diskAdmission" . | nindent 12 }}
            # The volume-manager identity is denied the standard credential
            # listener; it uses the volume socket credential-manager binds for
            # it (crates/libs/credential/mgr/server/src/run/volume_socket.rs).
            - name: SPACE_CREDMGR_ENDPOINT
              value: unix:///space/run/volume-credentials/credmgr.sock
            # Static object-store credentials instead of credential-manager's
            # token exchange (the local escape hatch,
            # crates/libs/vol/mgr/server/src/run.rs).
            {{- include "space-node-service.env.objectStoreCredentials" . | nindent 12 }}
            {{- $budget := .Values.streamPushBufferBudgetBytes }}
            {{- if not (kindIs "invalid" $budget) }}
            # Streaming snapshot upload part budget; null keeps the service
            # default (values.yaml). Rendered for any non-null value, so a
            # numeric 0 still selects file uploads; a number read from a
            # values file arrives as a float and is written out whole.
            - name: SPACE_VOLUME_STREAM_PUSH_BUFFER_BUDGET_BYTES
              value: {{ ternary (printf "%.0f" $budget) (toString $budget) (kindIs "float64" $budget) | quote }}
            {{- end }}
          {{- include "space-node-service.probes" $ctx | nindent 10 }}
          volumeMounts:
            {{- include "space-node-service.mount.run" . | nindent 12 }}
            {{- include "space-node-service.mount.cache" (dict) | nindent 12 }}
            {{- include "space-node-service.mount.private" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "space-node-service.volume.run" . | nindent 8 }}
        {{- include "space-node-service.volume.cache" . | nindent 8 }}
        {{- include "space-node-service.volume.private" . | nindent 8 }}
