# credential-manager on every SPACE Kind node. One release per role: `space`
# and `space-builder` (`--set node.role=builder`).

image:
  repository: space-worker
  tag: local
  pullPolicy: IfNotPresent

datadogEnvironment: kind-local
clusterId: kind-local
telemetry: {}
node: {}

# The agent drains for the shared 25 s lifecycle default, then releases its
# service mutex (crates/libs/credential/mgr/server/src/run.rs,
# crates/libs/service-lifecycle/src/lib.rs).
terminationGracePeriodSeconds: 60

# Kind sizing: requests only (see space-node-manager-local/values.yaml).
resources:
  requests:
    cpu: 10m
    memory: 32Mi
