# credential-manager on every SPACE Kind node. One release per role: `space`
# and `space-builder` (`--set node.role=builder`).

image:
  repository: space-worker
  tag: local
  pullPolicy: IfNotPresent

datadogEnvironment: kind-local
clusterId: kind-local
telemetry: {}
node: {}

# On SIGTERM the agent closes its sockets and releases its service mutex, so
# the successor takes over at once, then drains the RPCs it had accepted for
# up to the shared 25 s lifecycle default
# (crates/l40_api/credmgr/server/src/run.rs,
# crates/l10_foundation/service/lifecycle/src/lib.rs).
terminationGracePeriodSeconds: 60

# Kind sizing: requests only (see space-node-manager-local/values.yaml).
resources:
  requests:
    cpu: 10m
    memory: 32Mi
