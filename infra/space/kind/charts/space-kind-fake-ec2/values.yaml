# The in-repo fake EC2 endpoint (infra/space/kind/fake-ec2), standing in for
# the EC2 API a deployment's cluster-controller asks whether an instance is
# gone: the reconcile-queue GC (Ec2Detector, reconcile_queue_gc/detector.rs)
# by private-dns-name, and the dead-node verb by instance-id; and the `aws`
# node-drain terminator's Auto Scaling terminate. The controller reaches it
# through AWS_ENDPOINT_URL_EC2 and AWS_ENDPOINT_URL_AUTO_SCALING
# (charts/space-cluster-controller-local). It answers from the Nodes and
# their fake AWS providerIDs: Ready is running, not Ready is stopped, absent
# is no instance, and an instance the Auto Scaling terminate or the loopback
# test control
# (`kubectl exec ... -- space-kind-fake-ec2 terminate <id>`) named is
# terminated.

image:
  repository: space-kind-fake-ec2
  tag: local
  pullPolicy: IfNotPresent

datadogTeam: team-space

# Scheduling priority (infra/space/kind/manifests/priorityclasses.yaml).
priorityClassName: space-control-plane

nodeSelector:
  space.pplx.net/infra: "true"

service:
  # TLS with the internal RPC CA's leaf for `fake-ec2` (internal-rpc-tls.sh).
  name: fake-ec2
  port: 8443

tlsSecretName: space-kind-fake-ec2-tls

# The region requests must be signed for: the cluster-controller's AWS_REGION
# (`snapshotRegion` in charts/space-cluster-controller-local).
region: us-east-1

# One replica: the instances it has seen and those marked terminated live in
# its memory, and a restart forgets them. Every other answer is read from the
# API server.
replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 16Mi
