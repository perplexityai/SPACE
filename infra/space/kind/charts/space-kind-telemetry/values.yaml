telemetry:
  # Bring-up sets the checkout's commit, or revision-phase for an explicit
  # experiment; empty retains the image tag.
  version: ""
  phase: ""
  owner: ""
  cluster: space-local
  metricsSink: datadog
  traceExporter: auto
  otlpMetricsEndpoint: "http://collector.space-metrics.svc.cluster.local:4317"
  otlpTracesEndpoint: "http://collector.space-traces.svc.cluster.local:4317"
  # The same Collectors as a process on the Kind node reaches them, without
  # cluster DNS: the host runtime-supervisor's node environment, which
  # space-node-manager-local writes, and sandbox-manager's own endpoints, which
  # it forwards to the host sidecars it launches. Bring-up sets both from
  # scripts/telemetry_config.py; unset, the supervisor's environment names no
  # endpoint and sandbox-manager keeps the endpoints above.
  nodeOtlpMetricsEndpoint: ""
  nodeOtlpTracesEndpoint: ""
  otlpProtocol: grpc
  # OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE for the Rust services;
  # empty keeps their delta default. Bring-up sets cumulative in otel mode
  # (scripts/telemetry_config.py), because the local Collector forgets an idle
  # delta stream; the shim stays delta.
  otlpMetricsTemporality: ""
  # OTEL_METRIC_EXPORT_INTERVAL, in milliseconds, for the Rust services;
  # empty keeps their 10 s default. Bring-up sets 2000 in otel mode
  # (scripts/telemetry_config.py), so a scenario that reads a metric back from
  # the local Prometheus waits about 2 s for an export instead of 10 s.
  # sandbox-manager forwards it to the host sidecars it launches; the shim and
  # the runtime-supervisor keep 10 s.
  otlpMetricExportIntervalMillis: ""
  traceSampler: ""
  excludeDatadogLogs: false
