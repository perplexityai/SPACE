apiVersion: v2
name: space-seed-publish
description: >-
  One-shot Job that publishes the locally built seed template the way the
  production builder publishes releases: artifacts to the cluster object store
  (versitygw locally), then RegisterTemplate/RegisterTemplateRelease through
  the real ClusterApi on space-internal-api. Workers pull the seed through the
  production template pull path.
type: application
version: 0.1.0
