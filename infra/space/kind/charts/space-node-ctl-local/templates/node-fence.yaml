{{- if .Values.nodeFence.enabled }}
{{- $serviceAccount := include "space-node-service.name" (dict "ctx" . "component" "node-ctl") -}}
{{- $username := printf "system:serviceaccount:%s:%s" .Release.Namespace $serviceAccount -}}
{{- $name := printf "%s-node-ctl-node-fence" .Release.Name -}}
{{- $fence := .Values.nodeFence -}}
# Mirror of the prod space-node-ctl chart's templates/node-fence.yaml, over this
# chart's copy of its `patch nodes` grant (see rbac.yaml). That file carries the
# argument for why RBAC cannot express this and what each rule refuses; keep the
# two in step. The typed scenario `local.node_ctl_fence_refuses_and_reconciles`
# (space_smoke) exercises the admission path here with a node-ctl pod's own
# projected token, which is the only place the fence is proved against a live
# API server rather than rendered.
#
# In one line: node-ctl is worker-resident and holds cluster-wide `patch` on
# Nodes, so a guest escape that reaches its token could taint any node
# `space.pplx.net/dedicated-org` (which the node-local daemons tolerate and
# sandbox pods do not, so the node stays healthy while sandbox placement stops),
# write the `node-restriction.kubernetes.io/space-node-group` placement boundary
# on any node, relabel its own node into the credential authority's pool, or
# forge a durable extended resource on its own status. This policy pins the
# identity to its own Node and to the metadata and capacity keys node-ctl's
# reconcilers actually own.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "space-node-service.labels" (dict "ctx" . "component" "node-ctl") | nindent 4 }}
spec:
  # A CEL runtime error must not become an open door on the one grant this
  # policy exists to narrow.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # UPDATE only: rbac.yaml grants `get, list, watch, patch` and no `create`,
      # so an apply-patch cannot create a Node and never reaches admission as
      # CREATE. `delete` is not granted either.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["nodes", "nodes/status"]
  matchConditions:
    # Scopes the whole policy to this release's worker-resident identity. Every
    # other Node writer — api-server, cluster-controller, rollout-mng, the
    # kubelets, the cloud controllers — is untouched.
    - name: worker-resident-node-ctl
      expression: request.userInfo.username == {{ $username | quote }}
  variables:
    # Node the caller's pod is scheduled on. kubelet projects a pod-bound
    # token, the apiserver derives a node claim from it, and
    # `ServiceAccountTokenPodNodeInfo` surfaces that claim here; the feature is
    # GA and unconditional on Kubernetes 1.35. Empty when absent, which the
    # own-node rule below treats as a denial
    # rather than as an exemption: a credential that cannot prove which node it
    # belongs to is exactly the credential this fence is for.
    #
    # The pin rests on that claim being authenticator-set. An identity holding
    # `impersonate` on both `serviceaccounts` and
    # `userextras/authentication.kubernetes.io/node-name` could forge it; no
    # chart under `infra/space/` — neither `aws/eks/charts/` nor `kind/charts/` —
    # grants `impersonate` at all, which is what makes the pin sound rather than
    # merely conventional.
    - name: callerNode
      expression: >-
        has(request.userInfo.extra)
        && "authentication.kubernetes.io/node-name" in request.userInfo.extra
        && size(request.userInfo.extra["authentication.kubernetes.io/node-name"]) == 1
        ? request.userInfo.extra["authentication.kubernetes.io/node-name"][0]
        : ""
    - name: oldLabels
      expression: 'has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}'
    - name: newLabels
      expression: 'has(object.metadata.labels) ? object.metadata.labels : {}'
    # Keys added, removed, or changed in value. A removal counts: a server-side
    # apply that drops a key it previously owned is a legitimate node-ctl write,
    # and stripping the boundary label is an attack, so both directions have to
    # go through the same allowlist.
    - name: changedLabelKeys
      expression: >-
        variables.newLabels.filter(k,
          !(k in variables.oldLabels) || variables.oldLabels[k] != variables.newLabels[k])
        + variables.oldLabels.filter(k, !(k in variables.newLabels))
    - name: oldAnnotations
      expression: 'has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}'
    - name: newAnnotations
      expression: 'has(object.metadata.annotations) ? object.metadata.annotations : {}'
    - name: changedAnnotationKeys
      expression: >-
        variables.newAnnotations.filter(k,
          !(k in variables.oldAnnotations)
          || variables.oldAnnotations[k] != variables.newAnnotations[k])
        + variables.oldAnnotations.filter(k, !(k in variables.newAnnotations))
    - name: allowedLabelKeys
      expression: {{ toJson $fence.allowedLabelKeys | quote }}
    - name: allowedLabelKeyPrefixes
      expression: {{ toJson $fence.allowedLabelKeyPrefixes | quote }}
    - name: allowedAnnotationKeys
      expression: {{ toJson $fence.allowedAnnotationKeys | quote }}
    - name: allowedAnnotationKeyPrefixes
      expression: {{ toJson $fence.allowedAnnotationKeyPrefixes | quote }}
    # Removable but not writable. node-ctl's template-write handler only ever
    # *clears* a satisfied key (`clear_template_write_annotation_patch` patches
    # it to null); the writer is the cluster-controller's warm pool, a different
    # identity this policy does not match. Permitting an *add* would make
    # node-ctl a confused deputy: it reads any well-formed value as a pull
    # request and materializes it through the template-manager `GetTemplate`
    # RPC, whose local-miss path pulls with `PullTrigger::OnDemand` — and
    # `PullTrigger::is_prefetch` records that on-demand pulls are deliberately
    # *not* subject to the template-visibility gate, "they serve an
    # already-authorized sandbox create". An annotation is not that. So a
    # compromised token could name a private template and have the legitimate
    # binary fetch its rootfs onto the node: a data-isolation break on the warm
    # path, which placement cannot see.
    - name: removalOnlyAnnotationKeys
      expression: {{ toJson $fence.removalOnlyAnnotationKeys | quote }}
    - name: removalOnlyAnnotationKeyPrefixes
      expression: {{ toJson $fence.removalOnlyAnnotationKeyPrefixes | quote }}
    # A Node's `status.capacity` is the one part of its status a write from this
    # identity *survives* in. `network_slots.rs` says why: an
    # extended resource applied there "persists across kubelet status refreshes
    # (which do not manage extended resources)".
    #
    # What the rule below bounds is *which* keys, not the value: inflating
    # node-ctl's own `network-slots` on its own node stays permitted, because
    # node-ctl sources that number from node-manager and admission cannot tell a
    # forged count from a real one. That residual is an attract lever — the
    # scheduler will place the advertised number of sandbox pods on the node,
    # each failing at startup, concentrating other orgs' work on a node the
    # attacker owns — and closing it needs a bound admission can check, not a
    # key allowlist. Do not read this rule as bounding the count.
    #
    # `status.allocatable` is deliberately **not** carved out — it is frozen by
    # the status rule below, and that is stronger than allowlisting the same key
    # in both maps. node-ctl writes `allocatable` never
    # (`network_slot_capacity_apply` emits `"capacity"` only), so freezing it
    # refuses nothing legitimate; the kubelet mirrors capacity into it under an
    # identity this policy does not match. And it is the field that matters:
    # `node_network_slot_capacity` in
    # `substrate/kubernetes/adapter/node_eligibility.rs` gates on
    # `capacity[network-slots] > 0` and then *returns*
    # `allocatable[network-slots]`, and kube-scheduler filters on `allocatable`
    # alone. Allowing the key in both maps would have left the direct write to
    # the value both consumers read wide open.
    - name: oldCapacity
      expression: 'has(oldObject.status) && has(oldObject.status.capacity) ? oldObject.status.capacity : {}'
    - name: newCapacity
      expression: 'has(object.status) && has(object.status.capacity) ? object.status.capacity : {}'
    - name: changedCapacityKeys
      expression: >-
        variables.newCapacity.filter(k,
          !(k in variables.oldCapacity) || variables.oldCapacity[k] != variables.newCapacity[k])
        + variables.oldCapacity.filter(k, !(k in variables.newCapacity))
    - name: allowedStatusResourceKeys
      expression: {{ toJson $fence.allowedStatusResourceKeys | quote }}
    # Everything in status that is not a resource map. Enumerated as "all keys
    # except the two" rather than as a list of the fields that matter, so a
    # status field nobody thought about is covered by construction — three
    # review rounds each found one more (capacity, then allocatable, then
    # conditions), which is the signal that the list was the wrong shape.
    - name: oldStatus
      expression: 'has(oldObject.status) ? oldObject.status : {}'
    - name: newStatus
      expression: 'has(object.status) ? object.status : {}'
    - name: otherStatusKeys
      expression: >-
        variables.newStatus.filter(k, k != "capacity")
        + variables.oldStatus.filter(k, k != "capacity" && !(k in variables.newStatus))
  validations:
    - expression: >-
        variables.callerNode != "" && object.metadata.name == variables.callerNode
      messageExpression: >-
        "space-node-ctl may only write the Node it runs on; caller node is " +
        (variables.callerNode == "" ? "unknown (token carries no node claim)" : variables.callerNode) +
        " and the request targets " + object.metadata.name
      reason: Forbidden
    # Bare, not `has()`-guarded, because `{}` will not unify with a struct.
    # `.spec` is a struct in the type-checked Node view and always present, so
    # `has(object.spec) ? object.spec : {}` has no matching ternary overload —
    # `{}` is a `map`. The guarded ternaries elsewhere in this policy are fine
    # for two different reasons, both measured on 1.35 with a control (the
    # control matters: "zero warnings" proves nothing unless the checker fires,
    # and re-introducing this bad form on the same cluster did warn):
    #   - the finalizer and ownerReference validations guard against `[]`, which
    #     unifies with a list-typed field, so they check clean inline;
    #   - the `oldStatus`/`newStatus` variables guard a struct against `{}` and
    #     check clean anyway, because the schema checker does not attribute a
    #     type to a `variables` expression. They are the only two that do: the
    #     four resource-map variables guard `ResourceList`, a map, so they would
    #     check clean inline as well and are not evidence for this half.
    # So a guarded ternary in a validation needs a literal of the field's own
    # kind. Do not read this as "validations are checked and variables are not."
    - expression: object.spec == oldObject.spec
      message: >-
        space-node-ctl may not write a Node's .spec; this covers the
        space.pplx.net/dedicated-org taint, unschedulable, and providerID
      reason: Forbidden
    - expression: >-
        variables.changedLabelKeys.all(k, k in variables.allowedLabelKeys
          || variables.allowedLabelKeyPrefixes.exists(p, k.startsWith(p)))
      message: >-
        space-node-ctl may only write the Node labels it owns; writing any other
        label, including node-restriction.kubernetes.io/space-node-group and
        space.pplx.net/node-pool, is refused
      reason: Forbidden
    - expression: >-
        variables.changedAnnotationKeys.all(k, k in variables.allowedAnnotationKeys
          || variables.allowedAnnotationKeyPrefixes.exists(p, k.startsWith(p))
          || k in variables.removalOnlyAnnotationKeys
          || variables.removalOnlyAnnotationKeyPrefixes.exists(p, k.startsWith(p)))
      message: space-node-ctl may only write the Node annotations it owns
      reason: Forbidden
    - expression: >-
        variables.changedAnnotationKeys.all(k,
          !(k in variables.removalOnlyAnnotationKeys
            || variables.removalOnlyAnnotationKeyPrefixes.exists(p, k.startsWith(p)))
          || !(k in variables.newAnnotations))
      message: >-
        space-node-ctl may only clear a template-write annotation, never add or
        change one; adding one would have the node fetch a template it was not
        authorized for
      reason: Forbidden
    - expression: >-
        (has(object.metadata.finalizers) ? object.metadata.finalizers : [])
        == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : [])
      message: space-node-ctl may not write a Node's finalizers
      reason: Forbidden
    - expression: >-
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : [])
        == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : [])
      message: space-node-ctl may not write a Node's ownerReferences
      reason: Forbidden
    # Every changed key in either resource map has to be allowlisted, which in
    # practice means node-ctl's own extended resource and nothing else — a
    # kubelet-owned `cpu`/`memory`/`pods` entry is refused too, in both
    # directions, because node-ctl has no business touching one. On the `nodes`
    # path the update strategy resets `.status`, so this passes trivially there;
    # it bites on `nodes/status`, the path the capacity apply actually takes.
    # The two resource maps are carved out of the status freeze below, and only
    # these keys may move within them. Everything else in status is frozen — see
    # the rule after this one; do not read this carve-out as leaving the rest of
    # status writable.
    #
    # This rule rests on `ResourceList` merging **granularly** under the forced
    # server-side apply node-ctl uses. If it were atomic, node-ctl's own
    # `patch_status` would present as "network-slots added, cpu/memory/pods
    # removed" and this rule would refuse it, taking the capacity advertisement
    # down on every cluster at once. It is granular:
    # `local.node_ctl_fence_refuses_and_reconciles` (space_smoke) strips the resource and waits
    # for the live binary to re-advertise it through this rule, which is the only
    # place that assumption is tested rather than assumed.
    - expression: >-
        variables.changedCapacityKeys.all(k, k in variables.allowedStatusResourceKeys)
      message: >-
        space-node-ctl may only advertise its own extended resource on a Node's
        status.capacity
      reason: Forbidden
    # Everything else in status is frozen, `allocatable` included, which is
    # free: node-ctl writes exactly one status key and the kubelet writes the
    # rest under an identity this policy does not match. Enumerating instead —
    # conditions, then addresses,
    # then the next one — is what the previous two rounds did, and each round
    # found another field. `conditions` is the one with teeth: a forged
    # `Ready: False`, held in a loop, has the node-lifecycle controller apply
    # `node.kubernetes.io/not-ready`, which repels new placements immediately and
    # past the default 300s toleration escalates to evicting the co-tenant
    # sandbox pods already on the node. "The kubelet rewrites it on the next
    # heartbeat" does not answer that, for the same reason it does not answer the
    # allocatable case above: a loop on the node wins the race.
    - expression: >-
        variables.otherStatusKeys.all(k,
          (k in variables.oldStatus) && (k in variables.newStatus)
          && variables.oldStatus[k] == variables.newStatus[k])
      message: >-
        space-node-ctl may not write a Node's status outside its own extended
        resource
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "space-node-service.labels" (dict "ctx" . "component" "node-ctl") | nindent 4 }}
spec:
  policyName: {{ $name }}
  # `Deny` is the point of the policy. `["Audit", "Warn"]` turns it into an
  # observation-only pass over the same requests, which is the safe way to
  # confirm a cluster's node-ctl writes fit the allowlists before enforcing;
  # `nodeFence.enabled: false` removes the policy outright and is the incident
  # lever.
  validationActions: {{ toJson $fence.validationActions }}
{{- end }}
