apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: space-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: activation
      port: 9801
      targetPort: activation
      protocol: TCP
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
