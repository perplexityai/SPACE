apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.datadogTeam | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: space-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        ad.datadoghq.com/tags: '{"team":"{{ .Values.datadogTeam }}"}'
      labels:
        app.kubernetes.io/name: space-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        team: {{ .Values.datadogTeam | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 10
      {{- if .Values.migrate.enabled }}
      initContainers:
        # bootstrap-roles is convergent and brackets the migrations: the
        # pre-run creates the managed logins (space_user, space_creds, …)
        # the services connect as, and the post-run grants them on any
        # tables the migrations just created. The kind Postgres connection
        # string authenticates as the image-created superuser, which can
        # create roles.
        - name: bootstrap-roles
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /space/bin/space-db-migrator
            - bootstrap-roles
            - --database-url
            - $(POSTGRES_CONNECTION_STRING)
          env:
{{ include "space-api-local.bootstrapRolesEnv" . | indent 12 }}
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /space/bin/space-db-migrator
            - control-plane
            - --database-url
            - $(POSTGRES_CONNECTION_STRING)
            - up
          env:
            - name: POSTGRES_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: space-postgres
                  key: POSTGRES_CONNECTION_STRING
        - name: bootstrap-roles-grants
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /space/bin/space-db-migrator
            - bootstrap-roles
            - --database-url
            - $(POSTGRES_CONNECTION_STRING)
          env:
{{ include "space-api-local.bootstrapRolesEnv" . | indent 12 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/space/bin/space-api-svc"]
          args:
            - --surface
            - shared
            - --listen
            - "0.0.0.0:{{ .Values.service.port }}"
          env:
            - name: SPACE_INGRESS_ACTIVATION_LISTEN
              value: "0.0.0.0:9801"
            # Local Kind only; deployed services require authenticated internal RPC TLS.
            - name: SPACE_INTERNAL_RPC_INSECURE_DEV
              value: "true"
            - name: SPACE_CLUSTER_API_TOKEN_PATH
              value: "/var/run/space-publication/cluster-api.token"
            # Datadog tracing: DD_AGENT_HOST routes via
            # status.hostIP to the node-local Agent selected by the backend
            # helper. OTLP comparisons require that receiver to be running.
            {{- include "space-kind-telemetry.env" . | nindent 12 }}
            - name: SPACE_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPACE_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Absolute URL the UI / external client uses to reach the
            # data-plane.
            # Without this, api returns relative session URLs and the UI's
            # window.location.origin resolution lands on the UI host → 404.
            - name: SPACE_DATA_PLANE_PUBLIC_URL
              value: {{ .Values.dataPlanePublicUrl | quote }}
            # BYOK: cluster-wide opt-in for stamping volume_encryption on new
            # sandbox creates (with the owner org's byok_enabled). The bench
            # enables it by default: org enrollment still gates per-org, so
            # unenrolled orgs (everything until a smoke seeds a KEK) create
            # plaintext sandboxes exactly as before.
            - name: SPACE_BYOK_VOLUME_ENCRYPTION
              value: {{ .Values.byokVolumeEncryption | quote }}
            # The admin BYOK-enable gate must agree with the node-stack's
            # development-only authority provisioner.
            - name: SPACE_PLATFORM_KEK_PROVIDER
              value: in-memory
            # Must match the cluster-controller chart's value — see the
            # rationale on `nodeCensusResidency` in values.yaml. `required` so
            # a dropped key fails the render: without it a nil leaf still
            # renders the entry, just with no value, which reads as unset.
            - name: SPACE_NODE_DRAIN_NODE_CENSUS_RESIDENCY
              value: {{ required "nodeCensusResidency is required and must equal the cluster-controller chart's value" .Values.nodeCensusResidency | quote }}
            # `required` for the same reason: space-api reads an unset or empty
            # value as its default, which is on, so a dropped key would enable
            # fork whatever the values file meant.
            - name: SPACE_SANDBOX_FORK_ENABLED
              value: {{ required "fork.enabled is required: an empty value enables fork" .Values.fork.enabled | quote }}
            - name: POSTGRES_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: space-postgres
                  key: POSTGRES_CONNECTION_STRING
            - name: SPACE_DB_USER_PASSWORD
              value: {{ .Values.postgres.managedUserPassword | quote }}
            - name: SPACE_DB_CREDS_PASSWORD
              value: {{ .Values.postgres.managedCredentialsPassword | quote }}
            - name: SPACE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internal.secretName }}
                  key: SPACE_INTERNAL_TOKEN
            - name: SPACE_INTERNAL_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internal.secretName }}
                  key: SPACE_INTERNAL_CONTROL_TOKEN
            - name: SPACE_PUBLIC_CURSOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internal.secretName }}
                  key: SPACE_PUBLIC_CURSOR_SECRET
            - name: SPACE_ECW_CREDENTIAL_KEY_PATH
              value: /var/run/space-ecw-credential/ecw-credential-key
            - name: SPACE_API_ROUTE_ED25519_SIGNING_KEY_PATH
              value: /var/run/space-route-signing/signing-key.pem
            - name: SPACE_API_ROUTE_ED25519_SIGNING_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.spaceApiRouteToken.ed25519.signingSecretName }}
                  key: SPACE_API_ROUTE_ED25519_SIGNING_KEY_ID
            - name: SPACE_API_ROUTE_ED25519_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.spaceApiRouteToken.ed25519.signingSecretName }}
                  key: SPACE_API_ROUTE_ED25519_ISSUER
            - name: SPACE_CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            {{- with .Values.ecwHosts }}
            # ECW (E2B-compatible) host routing — enables the local ECW smokes
            # to reach the ECW API/data-plane surface via Host-header overrides.
            - name: SPACE_ECW_HOSTS
              value: {{ . | quote }}
            {{- end }}
            # The env masters, then the provider. Env off is a hard off no
            # assignment can reopen, so these two are what a bench with no
            # EPPO_SDK_KEY sets instead of a flag. Rendered unconditionally
            # and empty by default: an empty value reads as "not configured"
            # and leaves the binary's own default, so the chart offers the
            # knob without asserting a value.
            - name: SPACE_CLUSTER_ACTIVATION_ADMISSION_ENABLED
              value: {{ .Values.clusterActivationAdmission.enabled | quote }}
            - name: SPACE_API_CLIENT_CONCURRENCY_MODE
              value: {{ .Values.clientConcurrency.mode | quote }}
            {{- if .Values.eppo.secretName }}
            - name: EPPO_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.eppo.secretName }}
                  key: {{ .Values.eppo.secretKey }}
                  optional: true
            {{- else }}
            - name: EPPO_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internal.secretName }}
                  key: EPPO_SDK_KEY
                  optional: true
            {{- end }}
            {{- if .Values.eppo.baseUrl }}
            - name: EPPO_BASE_URL
              value: {{ .Values.eppo.baseUrl | quote }}
            {{- end }}
            {{- if .Values.k8s.enabled }}
            # Switch from DirectSubstrate to KubernetesSubstrate. Sandbox
            # placement now flows through the Pod reflector and node watcher;
            # node inventory is synthesized from labelled space-worker Pods.
            - name: SPACE_K8S_CONTROL_PLANE
              value: "true"
            - name: SPACE_SANDBOX_NAMESPACE
              value: {{ .Values.k8s.sandboxNamespace | quote }}
            - name: SPACE_SANDBOX_POD_IMAGE
              value: {{ .Values.k8s.sandboxPodImage | quote }}
            - name: SPACE_SANDBOX_NODE_SELECTOR_KEY
              value: {{ .Values.k8s.sandboxNodeSelectorKey | quote }}
            - name: SPACE_SANDBOX_NODE_SELECTOR_VALUE
              value: {{ .Values.k8s.sandboxNodeSelectorValue | quote }}
            - name: SPACE_INTERNAL_SECRET_NAME
              value: {{ .Values.internal.secretName | quote }}
            {{- end }}
          ports:
            - name: activation
              containerPort: 9801
              protocol: TCP
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            # /readyz flips to ok only after KubernetesSubstrate's Pod
            # reflector has completed its initial LIST; this prevents traffic
            # from hitting an api-server replica with a cold cache.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: publication-token
              mountPath: /var/run/space-publication
              readOnly: true
            - name: route-signing
              mountPath: /var/run/space-route-signing
              readOnly: true
            - name: ecw-credential
              mountPath: /var/run/space-ecw-credential
              readOnly: true
      volumes:
        - name: publication-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: cluster-api.token
                  audience: space-cluster-api
                  expirationSeconds: 3600
        - name: route-signing
          secret:
            secretName: {{ .Values.spaceApiRouteToken.ed25519.signingSecretName }}
            defaultMode: 0444
            items:
              - key: signing-key.pem
                path: signing-key.pem
        - name: ecw-credential
          secret:
            secretName: {{ .Values.internal.secretName }}
            defaultMode: 0444
            items:
              - key: ecw-credential-key
                path: ecw-credential-key
