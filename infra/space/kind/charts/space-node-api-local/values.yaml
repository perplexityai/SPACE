# node-api on every SPACE Kind node: the node's gRPC front door on
# host_ip:9800, which the API's KubernetesSubstrate pod reflector discovers.
# One release per role: `space` (worker role) and `space-builder`
# (`--set node.role=builder -f values-builder.yaml`).

image:
  repository: space-worker
  tag: local
  pullPolicy: IfNotPresent

datadogEnvironment: kind-local
clusterId: kind-local
telemetry: {}
node: {}

# A stable DNS name for "some" node-api of this role. The builder's
# `space-builder-node-api:9800` is the API's build dispatch target
# (crates/libs/api/src/controllers/substrate/kubernetes/pod_ops.rs); sandbox
# traffic goes to each pod's host_ip:9800 instead.
serviceName: space-worker-node-api

# Builder role only: build-manager's loopback listener, reached through the
# shared host network namespace (crates/libs/build/mgr/client/src/lib.rs).
buildManagerEndpoint: ""

# On SIGTERM node-api stops accepting connections and gives in-flight
# requests --shutdown-grace-secs (150 s by default) to finish
# (crates/libs/node/api/server/src/run.rs). The grace covers that budget plus
# exit.
terminationGracePeriodSeconds: 180

# Kind sizing: requests only (see space-node-manager-local/values.yaml).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
