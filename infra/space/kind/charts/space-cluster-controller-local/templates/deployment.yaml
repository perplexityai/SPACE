apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cluster-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.datadogTeam | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if gt (int .Values.replicaCount) 1 }}
    # Multi-replica needs a rolling update with the readiness gate doing the
    # work: Recreate would tear both replicas down at once, which is the one
    # window in which no reconciler runs at all.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: space-cluster-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- include "space-kind-telemetry.logAnnotations" . | nindent 8 }}
        ad.datadoghq.com/tags: '{"team":"{{ .Values.datadogTeam }}"}'
      labels:
        app.kubernetes.io/name: space-cluster-controller
        app.kubernetes.io/instance: {{ .Release.Name }}
        team: {{ .Values.datadogTeam | quote }}
        {{- /* The Rust build this pod is rendered for (infra/space/kind/lib/rust-build.sh),
        so a change of build rolls it; scripts/deployed-rust-build.py checks it
        against the image the pod runs. */}}
        {{- with .Values.rustBuild }}
        space.pplx.net/kind-rust-build: {{ . | quote }}
        {{- end }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClassName }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if .Values.ec2.fakeEndpoint.enabled }}
      # Without AWS_ENDPOINT_URL_EC2, the EC2 client signs to
      # https://ec2.<AWS_REGION>.amazonaws.com/, the one public endpoint it
      # can build (AwsQueryClient::endpoint). Pinning that name to loopback
      # here makes a lost override fail to connect, which the GC reads as an
      # unknown answer and keeps the refs, instead of reaching AWS.
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            - ec2.{{ .Values.snapshotRegion }}.amazonaws.com
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: cluster-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/space/bin/space-cluster-controller"]
          env:
            # Authenticated internal RPC TLS (docs/internal-rpc-tls.md): the
            # cluster's internal RPC CA, and the shared node-api identity, since NodeApi is dialled by node IP.
            - name: SPACE_INTERNAL_RPC_TLS_CA
              value: /etc/space-rpc-ca/ca.crt
            - name: SPACE_NODE_API_TLS_SERVER_NAME
              value: space-node-api
            - name: SPACE_CLUSTER_API_TOKEN_PATH
              value: "/var/run/space-publication/cluster-api.token"
            # NodeApi credentials for the api substrate the operation
            # dispatcher and warm-pool probe run, and the trigger fan-out
            # (SpaceBearerToken, crates/libs/bearer-token/src/lib.rs):
            # one projected token per node-api surface, admitted by TokenReview
            # (space-node-api-local's auth allowlists).
            - name: SPACE_NODE_API_TOKEN_PATH
              value: /var/run/space-auth/node-api.token
            - name: SPACE_NODE_API_INTERNAL_TOKEN_PATH
              value: /var/run/space-auth/node-api-internal.token
            # Datadog tracing — see datadog-agent-local chart. DD_AGENT_HOST
            # routes to the node-local agent; absent the agent the tracer
            # drops spans silently.
            - name: SPACE_CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            {{- include "space-kind-telemetry.env" . | nindent 12 }}
            - name: SPACE_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPACE_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POSTGRES_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName | default "space-postgres" }}
                  key: POSTGRES_CONNECTION_STRING
            - name: SPACE_DB_USER_PASSWORD
              {{- include "space-cluster.dbPassword" (dict "ctx" . "role" "USER" "value" .Values.postgres.managedUserPassword) | nindent 14 }}
            - name: SPACE_DB_CREDS_PASSWORD
              {{- include "space-cluster.dbPassword" (dict "ctx" . "role" "CREDS" "value" .Values.postgres.managedCredentialsPassword) | nindent 14 }}
            # The public-operation dispatcher executes sandbox creates in this
            # process, so the create-time volume_encryption stamp reads the
            # BYOK switch here too (same value as the api chart).
            - name: SPACE_BYOK_VOLUME_ENCRYPTION
              value: {{ .Values.byokVolumeEncryption | quote }}
            - name: SPACE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internal.secretName }}
                  key: SPACE_INTERNAL_TOKEN
            - name: SPACE_INTERNAL_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internal.secretName }}
                  key: SPACE_INTERNAL_CONTROL_TOKEN
            # From the route-signing Secret, not `internal.secretName`: the
            # api-local chart writes this material to its own Secret and never
            # into `space-internal`, so reading it from there left the process
            # exiting at startup with "route token signing configuration is
            # missing". Matches how space-api-local and space-internal-api-local
            # read the same three values; the key is mounted as a file below.
            - name: SPACE_API_ROUTE_ED25519_SIGNING_KEY_PATH
              value: /var/run/space-route-signing/signing-key.pem
            - name: SPACE_API_ROUTE_ED25519_SIGNING_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.spaceApiRouteToken.ed25519.signingSecretName }}
                  key: {{ .Values.spaceApiRouteToken.ed25519.signingKeyId }}
            - name: SPACE_API_ROUTE_ED25519_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.spaceApiRouteToken.ed25519.signingSecretName }}
                  key: {{ .Values.spaceApiRouteToken.ed25519.issuer }}
            # Fork operations execute here, so ECW response credentials must
            # use the same keyring and mint format as the API that serves them.
            - name: SPACE_ECW_CREDENTIAL_KEY_PATH
              value: /var/run/space-ecw-credential/ecw-credential-key
            - name: SPACE_SNAPSHOT_BUCKET
              value: {{ .Values.snapshotBucket | quote }}
            - name: SPACE_SNAPSHOT_REGION
              value: {{ .Values.snapshotRegion | quote }}
            - name: AWS_REGION
              value: {{ .Values.snapshotRegion | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.snapshotRegion | quote }}
            - name: SPACE_SNAPSHOT_ENDPOINT
              value: {{ .Values.snapshotEndpoint | quote }}
            {{- if .Values.ec2.fakeEndpoint.enabled }}
            # The fake EC2 endpoint; see `ec2` in values.yaml.
            - name: AWS_ENDPOINT_URL_EC2
              value: {{ required "ec2.fakeEndpoint.url must name the Kind fake EC2 endpoint" .Values.ec2.fakeEndpoint.url | quote }}
            # The EC2 client's HTTPS trusts the platform roots
            # (rustls-platform-verifier, through rustls-native-certs), which
            # read SSL_CERT_DIR: the image's bundle plus the internal RPC CA
            # that issued the fake's leaf.
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/space-rpc-ca
            {{- end }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.snapshotCredentialsSecretName }}
                  key: SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.snapshotCredentialsSecretName }}
                  key: SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY
            # The cluster-controller builds the same substrate as the
            # api-server (Substrate::from_env, lib.rs in
            # crates/libs/cluster/controller/server), hence this env block must
            # match the api-server's exactly. On `direct` it skips the
            # Kubernetes-only reconcilers (reconcilers.rs). The reconcilers
            # themselves are agnostic to whether the node-api behind WorkerApi
            # is the simulator or prod.
            {{- /* `substrate: direct` renders "false" (values.yaml). */}}
            - name: SPACE_K8S_CONTROL_PLANE
              value: {{ include "space-cluster-controller-local.k8sControlPlane" . }}
            # Leader election stays on whatever the replica count and
            # substrate: with it off every replica would run the reconcilers.
            # In a pod the controller contends for the Lease on either
            # substrate (LeaderElectionConfig::election in
            # crates/libs/cluster/controller/server/src/leader_election).
            - name: SPACE_CLUSTER_CONTROLLER_LEADER_ELECTION_ENABLED
              value: "true"
            # Namespace of the coordination.k8s.io Lease used for leader
            # election (this pod's own namespace, where its lease RBAC is
            # granted). The replicas contend for it.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SPACE_SANDBOX_NAMESPACE
              value: {{ .Values.k8s.sandboxNamespace | quote }}
            # The node-api DaemonSets run in the release namespace, as on the
            # api-server.
            - name: SPACE_NODE_API_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SPACE_SANDBOX_POD_IMAGE
              value: {{ .Values.k8s.sandboxPodImage | quote }}
            - name: SPACE_SANDBOX_NODE_SELECTOR_KEY
              value: {{ .Values.k8s.sandboxNodeSelectorKey | quote }}
            - name: SPACE_SANDBOX_NODE_SELECTOR_VALUE
              value: {{ .Values.k8s.sandboxNodeSelectorValue | quote }}
            - name: SPACE_INTERNAL_SECRET_NAME
              value: {{ .Values.internal.secretName | quote }}
            # The cluster activation limiter's env master. This process runs
            # the public-operation dispatcher, which builds its own
            # ClusterSandboxAdmissionConfig::from_env(), so a bench that turns
            # the guardrail off in space-api-local has to turn it off here too
            # or this copy goes on shedding the queued creates that the switch
            # was flipped to let through. Must
            # equal `clusterActivationAdmission.enabled` in that chart; the AWS
            # `space` chart renders one value into both deployments from
            # `api.clusterActivationAdmission.enabled`.
            - name: SPACE_CLUSTER_ACTIVATION_ADMISSION_ENABLED
              value: {{ .Values.clusterActivationAdmission.enabled | quote }}
            {{- if .Values.redis.url }}
            # The limiter's shared store; see `redis` in values.yaml.
            - name: SPACE_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            {{- range $name, $reconciler := .Values.reconcilers }}
            {{- range $key, $value := (default (dict) $reconciler.env) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          # Ready once the process has reached the Lease (won it, or been validly
          # denied by a peer), which it signals by touching this file.
          #
          # Do not add a `livenessProbe` on this marker: the marker clears on the
          # first failed lease call, so a probe would restart the pod on every
          # transient blip. Liveness for the lease path is decided in-process.
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/space-cluster-controller-ready"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: rpc-ca
              mountPath: /etc/space-rpc-ca
              readOnly: true
            - name: publication-token
              mountPath: /var/run/space-publication
              readOnly: true
            - name: node-api-token
              mountPath: /var/run/space-auth
              readOnly: true
            - name: route-signing
              mountPath: /var/run/space-route-signing
              readOnly: true
            - name: ecw-credential
              mountPath: /var/run/space-ecw-credential
              readOnly: true
      volumes:
        - name: rpc-ca
          secret:
            secretName: space-internal-rpc-ca
            defaultMode: 0444
        - name: publication-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: cluster-api.token
                  audience: space-cluster-api
                  expirationSeconds: 3600
        - name: node-api-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: node-api.token
                  audience: space-node-api
                  expirationSeconds: {{ .Values.nodeApiTokenExpirationSeconds | int }}
              - serviceAccountToken:
                  path: node-api-internal.token
                  audience: space-node-api-internal
                  expirationSeconds: {{ .Values.nodeApiTokenExpirationSeconds | int }}
        - name: route-signing
          secret:
            secretName: {{ .Values.spaceApiRouteToken.ed25519.signingSecretName }}
            defaultMode: 0444
            items:
              - key: {{ .Values.spaceApiRouteToken.ed25519.signingKey }}
                path: signing-key.pem
        - name: ecw-credential
          secret:
            secretName: {{ .Values.internal.secretName }}
            defaultMode: 0444
            items:
              - key: ecw-credential-key
                path: ecw-credential-key
