apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# Reuse the api-server's Role: cluster-controller needs the same pod CRUD +
# event watch verbs to drive orphan-sweep deletes and warm-pool refills.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cluster-controller-pods
  namespace: {{ .Values.k8s.sandboxNamespace }}
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.apiReleaseName }}-api-pods
---
# The node-api and node-service pods it watches in the release namespace
# (the api chart's read-only Role there).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cluster-controller-node-service-pods
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.apiReleaseName }}-api-node-service-pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cluster-controller-nodes
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.apiReleaseName }}-api-nodes
---
# Leader-election lease: the cluster-controller holds a coordination.k8s.io
# Lease in its own namespace and runs the singleton reconcilers only while it
# holds it; the other replica stands by.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cluster-controller-lease
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cluster-controller-lease
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cluster-controller-lease
{{- /* Same truthy set the binary accepts, so the grant never lags the flag. */}}
{{- if has (toString (.Values.reconcilers.dataPlaneDeletionCost.env.SPACE_DATA_PLANE_DELETION_COST_ENABLED | default "false")) (list "1" "true" "True" "TRUE") }}
---
# Data-plane deletion cost: the controller watches data-plane pods and writes
# one annotation on them, in its own namespace. The reconciler's namespace
# defaults to the same one; overriding SPACE_DATA_PLANE_DELETION_COST_NAMESPACE
# needs a matching Role there. Granted here rather than on the api Role so the
# api server does not gain pod `patch`; the data plane itself gets none.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cluster-controller-data-plane-deletion-cost
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cluster-controller-data-plane-deletion-cost
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cluster-controller-data-plane-deletion-cost
{{- end }}
{{- if eq (.Values.reconcilers.nodeDrain.env.SPACE_NODE_DRAIN_TERMINATOR_KIND | default "aws") "kube-delete" }}
---
# kube-delete terminator backend: cluster-controller-only delete on
# nodes. Not granted on the api-nodes ClusterRole because api-server
# must not be able to evict nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cluster-controller-nodes-delete
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cluster-controller-nodes-delete
  labels:
    app.kubernetes.io/name: space-cluster-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-cluster-controller-nodes-delete
{{- end }}
