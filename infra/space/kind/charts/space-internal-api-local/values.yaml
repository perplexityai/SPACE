# The production worker image carries space-internal-api-svc.
image:
  repository: space-worker
  tag: local
  pullPolicy: IfNotPresent

datadogTeam: team-space

# Telemetry defaults come from the space-kind-telemetry library.
telemetry: {}

# ServiceAccounts ClusterApi admits (TokenReview with audience
# space-cluster-api; static fallback is disabled). The node services that call
# it each run under their own DaemonSet's account, worker (`space-*`) and
# builder (`space-builder-*`).
clusterApiAuth:
  nodeServiceAccounts:
    - space-node-ctl
    - space-template-manager
    - space-sandbox-manager
    - space-node-api
    - space-builder-node-ctl
    - space-builder-template-manager
    - space-builder-sandbox-manager
    - space-builder-node-api
    - space-builder-build-manager
  controlPlaneServiceAccounts:
    - space-api
    - space-cluster-controller
    - space-data-plane
    - space-template-publish
  systemPublishers:
    - space-builder-build-manager
    - space-template-publish
  tenantPublishers:
    - space-builder-build-manager

# Two replicas behind the ClusterIP Service, as deployments run several. The
# binary keeps no state a later call has to find on the same replica and runs
# no singleton work: every write is a Postgres transaction under row locks or
# claim tokens (FOR UPDATE / SKIP LOCKED in crates/libs/internal/api/server),
# its RPCs are all unary, and its only per-replica caches (the
# template-visibility cache below, the TokenReview cache) are bounded and
# documented per replica.
replicas: 2

# A replacement counts as available only after staying Ready this long, two
# readiness periods, so a replica that fails its first probes stops the
# rollout before the old one is retired.
minReadySeconds: 10

# On SIGTERM the listener stops accepting at once and tonic's graceful
# shutdown waits for in-flight calls with no deadline of its own
# (serve_with_incoming_shutdown, crates/libs/internal/api/server/src/run.rs).
# The server sets no per-call deadline either (PublishNodeState runs several
# database operations unbounded), so a call lasts until its client gives up
# and resets the stream: every ClusterApi client, node-ctl's included, times
# out at 30 s (CLUSTER_API_RPC_TIMEOUT in
# crates/libs/node/api/client/src/cluster.rs, CLUSTER_RPC_TIMEOUT in
# crates/libs/node/ctl/server/src/lib.rs). A call admitted at the end of the
# preStop delay can therefore run until 5 + 30 s. Telemetry shutdown then
# flushes metrics and traces in turn, each capped at 5 s (SHUTDOWN_TIMEOUT in
# crates/libs/observability/src/sink/otlp.rs, the tracer provider's
# shutdown_with_timeout in crates/libs/observability/src/lib.rs). The grace
# is 5 + 30 + 10, plus 5 s to exit.
terminationGracePeriodSeconds: 50

# Seconds the pod keeps serving after it starts terminating, before SIGTERM,
# while Kubernetes removes it from the Service's endpoints: without it a
# caller that resolves the Service in that window reaches a closed listener.
# Kind's kube-proxy removes an endpoint in about a second; deployments size
# this for their load balancer.
preStopSleepSeconds: 5

service:
  name: space-internal-api
  port: 9800
  type: ClusterIP

# Lifetime of the projected node-api token, as deployed; the kubelet
# refreshes it at 80% of that.
nodeApiTokenExpirationSeconds: 600

internal:
  secretName: space-internal

spaceApiRouteToken:
  ed25519:
    signingSecretName: space-route-signing
    signingKey: signing-key.pem
    signingKeyId: SPACE_API_ROUTE_ED25519_SIGNING_KEY_ID
    issuer: SPACE_API_ROUTE_ED25519_ISSUER

clusterId: "kind-local"

postgres:
  # Secret with the managed role passwords (SPACE_DB_BOOTSTRAP_<ROLE>_PASSWORD
  # keys). Empty uses the Kind development passwords below.
  rolesSecretName: ""
  secretName: space-postgres
  secretKey: POSTGRES_CONNECTION_STRING
  # Dev-default space_user password; the role is provisioned by the api
  # chart's space-db-migrate Job (bootstrap-roles) with the same value.
  managedUserPassword: space-dev-user
  # POSTGRES_POOL_MAX_CONNECTIONS for the general space_user pool
  # (crates/libs/common/svc/src/sql/mod.rs); the template-visibility sideline
  # pool keeps its own fixed cap. Somewhat above the binary's default of 25,
  # as deployed. The space-postgres chart's max_connections holds it.
  poolMaxConnections: 30

# Scheduling priority (infra/space/kind/manifests/priorityclasses.yaml).
priorityClassName: space-control-plane

nodeSelector:
  space.pplx.net/infra: "true"

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Template-visibility cache for the release-resolution RPCs (see the
# `template_visibility_cache` module docs in the cluster-api crate).
#
# Leave a key empty to use the binary's default; an empty key renders no env var
# at all, so the pod spec is unchanged. Setting BOTH durations to "0" disables
# the cache and restores the pre-cache behavior — every lookup queries, and every
# failed lookup degrades to UNSPECIFIED immediately. Expose the rollback in
# values so disabling the cache does not require changing the binary.
#
# The EKS copy of this block says "restarting cluster-api, not by shipping a chart
# change". Neither half transfers to kind: this chart deploys
# `<release>-internal-api`, and because it is rendered rather than installed
# (see below) there is no out-of-tree override — editing this file *is* the
# in-tree change, and it is the only path.
#
# Quote the values — all of them, always. A bare 0 is a YAML integer that plain
# truthiness reads as unset (the template guards against this), and a large
# unquoted number survives Helm's JSON round-trip as Go float notation.
visibilityCache:
  # Left EMPTY on purpose, which renders no env var and leaves the binary's own
  # default in force — and that default is OFF.
  #
  # Note what "set these" means for kind specifically: the Tiltfile renders this
  # chart with `helm template` rather than `helm install`, so there is no Helm
  # release for it. It passes no values file, and its only `--set` values are
  # the telemetry settings (never this block), so the only way
  # to turn the cache on locally is editing this file. The workload this chart deploys is
  # `<release>-internal-api`, not `cluster-api`.
  #
  # Setting only staleCeilingSeconds to "0" does NOT stop cached answers — the
  # freshness window is checked before the query. Stopping them takes both.
  ttlSeconds: ""
  staleCeilingSeconds: ""

# Runtime environment desired state that GetNodeRuntimeDesiredState serves to
# nodes ("Cluster desired policy" and "Node runtime provisioning" in
# docs/execution-environments.md). Every key is empty, which renders no env var
# and leaves the binary's default in force: both settings off. Quote the scalar
# values, as for visibilityCache above.
runtimeDesiredState:
  # SPACE_INTERNAL_API_RUNTIME_DESIRED_STATE_ENABLED: serve the cluster
  # execution environment policy.
  executionPolicyEnabled: ""
  # SPACE_INTERNAL_API_RUNTIME_PROVISIONING_RECIPE_ENABLED: serve the
  # provisioning recipe to the cohort the next two keys admit. Separate from the
  # policy, so each is turned on and off on its own.
  provisioningRecipeEnabled: ""
  # SPACE_INTERNAL_API_RUNTIME_PROVISIONING_CANARY_NODES: nodes admitted by the
  # name they report (the Kubernetes node name here) or their node ID.
  provisioningCanaryNodes: []
  # SPACE_INTERNAL_API_RUNTIME_PROVISIONING_PERCENT: whole percentage, "0" to
  # "100", of nodes admitted by a stable hash of their node ID.
  provisioningPercent: ""

# Ingress activation must use the same substrate and pod configuration as the API.
k8s:
  # The API's sandbox namespace (space-api-local's k8s.sandboxNamespace).
  sandboxNamespace: sandboxes
  sandboxPodImage: registry.k8s.io/pause:3.10
  sandboxNodeSelectorKey: node.kubernetes.io/space-enabled
  sandboxNodeSelectorValue: "true"

serviceAccount:
  name: space-internal-api
apiReleaseName: space

# Lifecycle API owns activation and the Kubernetes caches.
activationEndpoint: "https://space-api:9801"
