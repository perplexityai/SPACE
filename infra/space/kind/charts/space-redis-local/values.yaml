# Redis for Kind's cluster activation and per-client concurrency limiters.
# Both use SPACE_REDIS_URL. This chart provides a local store for the
# `local.rate_limiters_enforce_and_fail_open` smoke scenario; without a
# configured URL the limiters fail open and this pod idles.
#
# Nothing in the kind tree sets SPACE_REDIS_URL, so the bring-up leaves this
# chart out unless asked (`bootstrap.sh --with-redis` / `SPACE_LOCAL_REDIS=1`,
# which the Tiltfile reads too); a default bring-up removes any store an earlier
# one left. The scenario renders it itself when absent and removes what it
# created.
#
# Single-node, in-memory only (no RDB/AOF persistence): the limiter state is a
# guardrail, not a source of truth, and a wiped store just refills the buckets.

image:
  repository: redis
  tag: "7-alpine"
  pullPolicy: IfNotPresent

datadogTeam: team-space

service:
  # DNS name the api-server reaches via SPACE_REDIS_URL=redis://space-redis:6379.
  name: space-redis
  port: 6379

# Pinned to the infra node alongside Postgres/SeaweedFS so a sandbox-worker
# drain never disturbs the limiter store.
nodeSelector:
  space.pplx.net/infra: "true"

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
