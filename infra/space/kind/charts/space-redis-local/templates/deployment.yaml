apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: space-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.datadogTeam | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: space-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    # Single in-memory store; never two replicas competing for the same keys.
    type: Recreate
  template:
    metadata:
      annotations:
        ad.datadoghq.com/tags: '{"team":"{{ .Values.datadogTeam }}"}'
      labels:
        app.kubernetes.io/name: space-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
        team: {{ .Values.datadogTeam | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClassName }}
      terminationGracePeriodSeconds: 5
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # In-memory only: disable both RDB snapshots (--save "") and the AOF so
          # the limiter store never touches disk. State is a refillable guardrail.
          command: ["redis-server"]
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --port
            - "{{ .Values.service.port }}"
          ports:
            - name: redis
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # Ready once the server answers PING, not merely once its port
          # accepts connections: the limiters fail open on any store error, so
          # a ready endpoint should be one that serves their commands.
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "{{ .Values.service.port }}", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
