# Object store — local S3-compatible endpoint for the KinD SPACE stack.
#
# Versity S3 Gateway (versitygw, Apache-2.0) serving its POSIX backend from a
# node-local hostPath: each bucket is a directory and each object a file, with
# object metadata (ETag, content type, user metadata) in extended attributes.
# volume-manager (real, on its node DaemonSet) uploads/pulls
# suspend-restore snapshot artifacts here via the production object-store
# crate with an S3 endpoint override + path-style addressing, and the
# space-seed-publish Job publishes template releases with the aws CLI. Nothing
# here is a stub.
#
# Replaces SeaweedFS: one Go process with no master/volume/filer split, no
# volume slots to exhaust and no per-collection volume growth.
#
# versitygw's standalone IAM service (`versitygw iam`, below) runs as its own
# Deployment from the same image. It issues and enforces the scoped sessions
# of credential-manager's storage exchange: the gateway asks it about every
# request signed with session keys, and keeps checking root keys itself.

image:
  repository: ghcr.io/versity/versitygw
  # Change this tag and its ci/mirrored-images.txt line, which pins the tag's
  # linux/amd64 digest, together. v1.9.0 is the first release with
  # versity/versitygw#2415: the gateway refuses a PutObject or UploadPart
  # body that ends before its Content-Length. Through v1.8.0 it committed a
  # truncated UNSIGNED-PAYLOAD body as complete when the client disconnected
  # mid-body (versity/versitygw#2414). The object-store crate's Content-MD5 on
  # every upload, which was what rejected those bodies, stays as defense in
  # depth.
  tag: "v1.9.0"
  pullPolicy: IfNotPresent

# The bucket-init Job creates the buckets through the S3 API with the aws CLI
# image CI already mirrors (ci/mirrored-images.txt).
bucketInitImage:
  repository: public.ecr.aws/aws-cli/aws-cli
  tag: "2.27.41"
  pullPolicy: IfNotPresent

datadogTeam: team-space

service:
  name: object-store
  # S3 API port (the only one vol-mgr talks to). Kept at SeaweedFS's 8333 so
  # host port-forwards and S3_ENDPOINT defaults are unchanged.
  s3Port: 8333

# Health endpoint versitygw serves on the S3 port (`--health`). Probes use it.
healthPath: /healthz

# Signing region the gateway validates (SigV4 is strict about region).
region: us-east-1

# Dev-only S3 credentials: the gateway's and the IAM service's root account,
# so sigv4 is actually validated. Handed as static creds
# (SPACE_OBJECT_STORE_STATIC_*) to whatever does not exchange
# (README, "Object-store credentials"): the bucket-init and seed-publish
# Jobs, builders, build-manager and cluster-controller, and worker
# volume-manager in static mode. Do NOT put the
# substring "space" (or "minio") anywhere in these values: Tilt redacts secret
# VALUES from command lines (including docker build-args), so a "space"
# substring would poison every `docker build … space-rust-build-… …`
# invocation. See space-postgres values.
credentials:
  accessKey: localadmin
  secretKey: localadmin-dev-secret

# Buckets created by the init Job. `snapshots` carries suspend/restore
# artifacts (volume-manager push/pull); `templates` carries template release
# artifacts published by the space-seed-publish Job and pulled by worker
# template-managers.
snapshotBucket: snapshots
templateBucket: templates

# Object data lives on this node-local hostPath (see templates/deployment.yaml).
dataHostPath: /var/lib/space-object-store

# versitygw's standalone IAM service, from the same image, in its own
# Deployment (templates/iam.yaml): its own pod, so an IAM outage refuses
# session-signed requests while the gateway stays Ready and root keys keep
# working. Its state (the OIDC provider, the vend role and every live session)
# is kept in `dirName` under the data hostPath, so sessions survive restarts
# as the objects do. A dot-directory is no valid bucket name, so the gateway
# never lists or serves it as one, as with its own `.sgwtmp`. Behind the
# `serviceName` Service it serves:
#   port         the IAM and STS API (AssumeRoleWithWebIdentity) over TLS,
#                for the STS bridge and the bucket-init Job;
#   privatePort  the private API the gateway asks about sessions, over mTLS:
#                versitygw requires client certificates on any TCP private
#                listener, and the gateway signs each call with the root keys.
# Both use leaves from the cluster's internal RPC CA (internal-rpc-tls.sh):
# `tlsSecretName` for the service, `clientTlsSecretName` for the gateway, and
# `caSecretName` to verify either side. templates/iam-networkpolicy.yaml
# admits only those three callers to the ports.
iam:
  port: 7070
  privatePort: 7071
  serviceName: object-store-iam
  dirName: .iam
  tlsSecretName: space-object-store-iam-tls
  clientTlsSecretName: space-object-store-iam-client-tls
  caSecretName: space-internal-rpc-ca
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 1Gi

# credential-manager's storage exchange against this store
# (README, "Object-store credentials"). The STS bridge (space-kind-sts-bridge)
# mints OIDC tokens for the vend identity under `issuer`; the IAM service
# fetches the issuer's discovery document from the bridge's Service instead
# of the issuer name, which never resolves, and pins the bridge's issuer CA
# by the thumbprint in `bridgeSecretName`. The bucket-init Job registers that
# provider and the vend role, which trusts only tokens for `subject` with
# `audience`, lives at most `maxSessionDuration` seconds (the authority asks
# for 3600) and may read and write objects in the two buckets: the ceiling
# every session's exact-object policy narrows. versitygw's account is fixed
# at 000000000000, so the role is arn:aws:iam::000000000000:role/<roleName>,
# the authority's SPACE_CREDMGR_S3_VEND_ROLE_ARN. These must match the
# bridge's values.
storageExchange:
  issuerHost: sts-bridge.kind.invalid
  discoveryUrl: https://sts-bridge:8443/.well-known/openid-configuration
  audience: kind-sts-bridge
  subject: kind-storage-vend
  roleName: kind-storage-vend
  maxSessionDuration: 3600
  bridgeSecretName: space-kind-sts-bridge
  # Set by every bring-up path to the checksum sts-bridge-secret.sh prints,
  # so a reissued issuer CA reruns the bucket-init Job (and only it).
  secretChecksum: ""

# Extra versitygw global flags (before the `posix` backend subcommand).
# `--pprof` serves Go profiles on loopback only, for stall diagnostics
# (`kubectl exec … wget -qO- 127.0.0.1:6060/debug/pprof/goroutine?debug=2`).
extraArgs:
  - --pprof
  - 127.0.0.1:6060

# Scheduling priority (infra/space/kind/manifests/priorityclasses.yaml).
priorityClassName: space-control-plane

# The bucket-init Job is idempotent and re-runnable: replaceable.
bucketInitPriorityClassName: space-replaceable

# Object store placed on the infra node so a sandbox-worker drain never
# disturbs it.
nodeSelector:
  space.pplx.net/infra: "true"

# Small requests so the infra node fits the rest of the stack; the limits
# hold through the full Kind suites, whose heaviest gateway work is memory
# file uploads and multipart completion.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 4Gi
