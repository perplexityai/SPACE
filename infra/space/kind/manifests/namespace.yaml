apiVersion: v1
kind: Namespace
metadata:
  name: space
---
# Per-sandbox pods live apart from the control plane, as in a deployment that
# confines them with namespace-scoped policy: the API, cluster-controller and
# internal-api charts name this as `k8s.sandboxNamespace`, and the
# space-sandbox-network-policy chart isolates every pod in it.
apiVersion: v1
kind: Namespace
metadata:
  name: sandboxes
