# Dedicated kind cluster for the single-worker DirectSubstrate bench.
#
# Separate from `space-local` (the production-shaped multi-worker stack) so a
# `tilt up` here never clobbers that stack. Runs the same node-stack DaemonSet
# (production worker service set on real Firecracker) with the api-server on
# DirectSubstrate — one worker keeps the footprint within a 16 GiB Docker
# Desktop VM and keeps create/suspend/restore node-sticky.
#
# No extraMounts: host paths like /home/dev/.space-devbox don't exist inside
# the Docker Desktop VM on macOS, so the Firecracker vendor tree is staged
# into the worker node by the Tiltfile's `stage-fc-vendor` bootstrap resource
# (docker cp) instead of a bind mount. /dev/kvm is present because kind nodes
# run as privileged containers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: space-local-3486
nodes:
  - role: control-plane
  # Single sandbox worker — the node-stack DaemonSet runs here.
  - role: worker
    labels:
      space.pplx.net/node-pool: sandbox
  # Infra node — runs Postgres, space-api, object store.
  - role: worker
    labels:
      space.pplx.net/node-pool: infra
