# Kubelet settings a deployed SPACE node sets in its bootstrap
# (infra/space/aws/eks/modules/space/templates/worker-bootstrap.sh.tftpl and
# bootstrap.sh.tftpl, `spec.kubelet`). Baked into the Kind node image, which
# points kubelet's --config-dir at this file's directory (node/Dockerfile);
# kubelet applies it over the configuration kubeadm writes at join.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# No client-side event rate limit. A burst of sandbox creates emits a burst of
# pod events (FailedCreatePodSandBox from the shim among them), which a limited
# kubelet delays and, once its queue is full, drops.
eventRecordQPS: 0
# Deployed nodes pass --fail-swap-on=false.
failSwapOn: false
