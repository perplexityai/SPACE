# Defaults of the `space` release: the control plane and the worker node
# services. The `space-builder` release adds values-builder.yaml before the
# caller's values file (install.sh). Values here only switch Kind-only parts of
# the subcharts off; everything the cluster supplies (images, Secrets,
# endpoints, telemetry) comes from the caller's file, and templates/validate.yaml
# fails the render when it is missing (README.md).

# worker or builder. Every node subchart's node.role must match.
role: worker

controlPlane:
  enabled: true
nodeServices:
  enabled: true
buildManager:
  enabled: false

space-api-local:
  # install.sh runs the space-db-migrate Job from this chart before the
  # release, as the Kind harness does; a Job owned by the release could not be
  # replaced on the next upgrade (its pod template is immutable).
  migrate:
    enabled: false
  # The caller creates space-internal, space-route-signing and
  # space-route-verification; the subchart's are development values.
  secrets:
    create: false
  entry:
    type: ClusterIP
  ecwHosts: ""
  # This installer provisions no Redis, so the rate limiters' store is off
  # unless the caller names one (values.example.yaml): an unset URL renders no
  # SPACE_REDIS_URL and both limiters fail open, as they did before Kind turned
  # its store on. templates/validate.yaml refuses the Kind endpoint and a
  # URL that differs from space-cluster-controller-local's.
  redis:
    url: ""

space-cluster-controller-local:
  # Shares the API's cluster-activation bucket, so it names the same store.
  redis:
    url: ""
  # The Kind fake EC2 endpoint is not installed here, so neither its
  # AWS_ENDPOINT_URL_EC2, its CA trust nor the pod's loopback alias for the
  # public EC2 name is rendered, and the reconcile-queue GC that Kind runs
  # against it stays off, as it ships. templates/validate.yaml refuses the
  # fake endpoint.
  ec2:
    fakeEndpoint:
      enabled: false
  reconcilers:
    reconcileQueueGc:
      env:
        SPACE_RECONCILE_QUEUE_GC_ENABLED: "false"

space-data-plane-local:
  entry:
    type: ClusterIP
  ecwHosts: ""

# Kind gives every node its own root-owned /space/vendor (stage_vendor in
# kind/node/space-kind-node.sh); a caller's node brings its own, which may be
# read-only or not root-owned. On such a node node-manager cannot prepare the
# managed store, never creates runtime-manager's staging directory, and
# runtime-manager exits at startup instead of listing. So node-manager keeps
# /space/vendor read-only and runtime-manager runs --list-only, as they did
# before Kind turned installs on. Turn both on together (templates/validate.yaml).
space-node-manager-local:
  artifactInstalls:
    enabled: false
space-runtime-manager-local:
  artifactInstalls:
    enabled: false
