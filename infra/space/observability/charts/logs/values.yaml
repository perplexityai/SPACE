# Shared installs require explicit storage, cluster identity, and collection
# paths. Kind uses profiles/kind.yaml.
profile: shared
# Fallback stream label when a record carries no cluster_id; shared installs
# must name the cluster explicitly.
clusterLabel: ""
storage:
  size: 2Gi
  storageClassName: null
  existingClaim: ""
  retain: true
  # Explicit opt-in to the cluster's default StorageClass (storageClassName
  # left null). Shared installs otherwise require a named class or claim.
  useDefaultStorageClass: false
  # emptyDir instead of a claim, for clusters without a usable StorageClass.
  # All stored data is lost whenever the pod leaves its node.
  ephemeral: false
# Applies to the Loki backend Deployment only; the collector is a DaemonSet.
scheduling:
  nodeSelector: {}
  tolerations: []
networkPolicy:
  enabled: true
  queryPeers: []
  additionalEgress: []
collection:
  # Host directory holding CRI log files; the Alloy mount follows this path.
  podLogsPath: /var/log/pods
  # Each glob is collected under the given indexed namespace label.
  podTargets:
    - {path: "/var/log/pods/space_*/*/*.log", namespace: space}
  # Literal CRI source identity, independent of the indexed namespace label.
  # List every builder release; a build-manager pod is
  # <release>-build-manager-<suffix>, and its container logs recipe command
  # output. These exclusions apply to every podTargets glob, before files are
  # tailed. Omit namespace to apply an exclusion across the selected
  # namespaces; supplied identities are literal, not globs or regexes.
  excludedPodSources:
    - {namespace: space, podNamePrefix: space-builder-build-manager-, container: build-manager}
  journal:
    enabled: true
    # Kind keeps a volatile journal at /run/log/journal; persistent hosts use
    # /var/log/journal. Collection fails if the directory is absent.
    path: /var/log/journal
    maxAge: 1h
    # Applied to "__journal__systemd_unit;__journal_syslog_identifier".
    keepRegex: "(space-.*\\.service|containerd\\.service);.*"
    # Optional deny filter on the same unit;identifier pair, after keepRegex.
    # Configure for builder services when they write to the host journal.
    dropRegex: ""
    # A sandbox's net-gateway and spaced-host have no systemd unit: they run
    # in the sandbox's cgroup and write to the output the runtime supervisor
    # gave them, so keepRegex never matches them. When enabled, lines with no
    # unit from a cgroup matching cgroupRegex are kept too, except from
    # excludedHosts (journal hostnames): list every builder node, whose
    # sandboxes run recipes.
    sidecars:
      enabled: false
      cgroupRegex: "/space/sbx-[^/;]+(?:/[^;]*)?"
      excludedHosts: []
loki:
  retentionPeriod: 24h
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 256Mi}
alloy:
  enabled: true
  nodeSelector: {kubernetes.io/os: linux}
  # A DaemonSet reaches tainted nodes only with matching tolerations.
  tolerations: []
  # Node-local read cursors; not a delivery acknowledgement.
  statePath: /var/lib/space-logs/alloy
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 128Mi}
# Copies processed entries to Alloy stdout for local evidence only.
validationEcho: false
# Pinned multi-platform digests; versions verified 2026-09-23.
# A bump also moves the tag in profiles/kind.yaml and the entry in
# ci/mirrored-images.txt.
images:
  alloy: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
  loki: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
