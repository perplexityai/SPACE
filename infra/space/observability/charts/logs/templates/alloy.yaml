{{- if .Values.alloy.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
spec:
  selector:
    matchLabels: {app: alloy}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels:
{{ include "common.podLabels" (dict "app" "alloy" "profile" .Values.profile "owner" "logs") | indent 8 }}
      annotations:
        checksum/config: {{ tpl (.Files.Get "config/config.alloy") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.alloy.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.alloy.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alloy
          image: {{ .Values.images.alloy | quote }}
          imagePullPolicy: IfNotPresent
          args: [run, /etc/space/config.alloy, --storage.path=/var/lib/alloy, --server.http.listen-addr=0.0.0.0:12345, --disable-reporting]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: GOMEMLIMIT, value: 384MiB}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
{{ toYaml .Values.alloy.resources | indent 12 }}
          readinessProbe:
            httpGet: {path: /-/ready, port: 12345}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /-/healthy, port: 12345}
            initialDelaySeconds: 20
          volumeMounts:
            - {name: config, mountPath: /etc/space, readOnly: true}
            {{- if .Values.collection.podTargets }}
            - {name: pod-logs, mountPath: {{ .Values.collection.podLogsPath | quote }}, readOnly: true}
            {{- end }}
            {{- if .Values.collection.journal.enabled }}
            - {name: journal, mountPath: {{ .Values.collection.journal.path | quote }}, readOnly: true}
            {{- end }}
            - {name: state, mountPath: /var/lib/alloy}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: logs-config}}
        {{- if .Values.collection.podTargets }}
        - name: pod-logs
          hostPath: {path: {{ .Values.collection.podLogsPath | quote }}, type: Directory}
        {{- end }}
        {{- if .Values.collection.journal.enabled }}
        - name: journal
          hostPath: {path: {{ .Values.collection.journal.path | quote }}, type: Directory}
        {{- end }}
        - name: state
          hostPath: {path: {{ .Values.alloy.statePath | quote }}, type: DirectoryOrCreate}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
{{- end }}
