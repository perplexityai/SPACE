{{- if include "common.otlpSelected" . }}
{{- range $source := .Values.collection.excludedPodSources }}
{{- $keys := list "podNamePrefix" "container" }}
{{- if hasKey $source "namespace" }}{{- $keys = append $keys "namespace" }}{{- end }}
{{- range $key := $keys }}
{{- $value := index $source $key }}
{{- if not (and (kindIs "string" $value) $value) }}
{{- fail (printf "collection.excludedPodSources entries require a nonempty literal %s" $key) }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9.-]*$" $value) }}
{{- fail (printf "collection.excludedPodSources.%s must be a literal Kubernetes name or prefix, not a glob or regex" $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
