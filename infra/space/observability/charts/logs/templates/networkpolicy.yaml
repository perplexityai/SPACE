{{- if include "common.otlpSelected" . }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
spec:
  podSelector:
    matchLabels: {app: loki}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: 3100}]
      from:
        - podSelector: {matchLabels: {app: alloy}}
{{- with .Values.networkPolicy.queryPeers }}
{{ toYaml . | indent 8 }}
{{- end }}
  egress:
{{- include "common.dnsEgress" . | nindent 4 }}
{{- with .Values.networkPolicy.additionalEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- if .Values.alloy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy
spec:
  podSelector:
    matchLabels: {app: alloy}
  # Collection is read-only from host paths; no ingress is required.
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: loki}}
      ports: [{protocol: TCP, port: 3100}]
{{- include "common.dnsEgress" . | nindent 4 }}
{{- with .Values.networkPolicy.additionalEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
