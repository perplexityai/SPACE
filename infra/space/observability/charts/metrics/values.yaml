# Shared installs require an explicit storage choice. Kind uses profiles/kind.yaml.
profile: shared
storage:
  size: 2Gi
  storageClassName: null
  existingClaim: ""
  retain: true
scheduling:
  nodeSelector: {}
  tolerations: []
networkPolicy:
  enabled: true
  receiverPeers: []
  queryPeers: []
  additionalEgress: []
collector:
  # Fixed Service ClusterIP. Empty lets Kubernetes allocate one; only the Kind
  # profile sets it, for the node-hosted shim, which has no cluster DNS.
  clusterIP: ""
  debug: false
  maxStreams: 10000
  maxStale: 2m
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}
prometheus:
  retentionTime: 6h
  retentionSize: 512MB
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 256Mi}
# Pinned multi-platform digests; versions verified 2026-09-23.
# A bump also moves the tag in profiles/kind.yaml and the entry in
# ci/mirrored-images.txt.
images:
  # Shared with the traces chart: the digest lives in charts/common so a
  # version bump is one edit. Set this to pin a different Collector here only.
  collector: ""
  prometheus: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
