{{- if include "common.otlpSelected" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-config
data:
  collector.yaml: |
{{ tpl (.Files.Get "config/collector.yaml") . | indent 4 }}
  prometheus.yaml: |
{{ .Files.Get "config/prometheus.yaml" | indent 4 }}
---
{{- if not (or .Values.storage.existingClaim .Values.storage.ephemeral) }}
{{ include "common.pvc" (dict "name" "prometheus-data" "storage" .Values.storage) }}
---
{{- end }}
{{- range $name := include "metrics.components" . | fromJsonArray }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  {{- if and (eq $name "collector") $.Values.collector.clusterIP }}
  clusterIP: {{ $.Values.collector.clusterIP | quote }}
  {{- end }}
  selector:
    app: {{ $name }}
  ports:
    {{- if eq $name "collector" }}
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: internal-metrics, port: 8888, targetPort: 8888}
    {{- else }}
    - {name: http, port: 9090, targetPort: 9090}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
{{ include "common.podLabels" (dict "app" $name "profile" $.Values.profile "owner" "metrics") | indent 8 }}
      annotations:
        checksum/config: {{ tpl ($.Files.Get (printf "config/%s.yaml" $name)) $ | sha256sum }}
    spec:
{{- include "common.scheduling" $.Values.scheduling | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ include "metrics.image" (dict "root" $ "name" $name) | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
{{ include "common.containerSecurityContext" . | indent 12 }}
          {{- if eq $name "collector" }}
          args: ["--config=/etc/space/collector.yaml"]
          env:
            - {name: GOMEMLIMIT, value: 205MiB}
          resources:
{{ toYaml $.Values.collector.resources | indent 12 }}
          readinessProbe:
            httpGet: {path: /, port: 13133}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: 13133}
            initialDelaySeconds: 15
          {{- else if eq $name "prometheus" }}
          args:
            - --config.file=/etc/space/prometheus.yaml
            - --web.enable-otlp-receiver
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $.Values.prometheus.retentionTime }}
            - --storage.tsdb.retention.size={{ $.Values.prometheus.retentionSize }}
            - --query.lookback-delta=5m
            - --query.timeout=10s
            - --query.max-concurrency=4
          resources:
{{ toYaml $.Values.prometheus.resources | indent 12 }}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
            initialDelaySeconds: 30
          {{- end }}
          volumeMounts:
            - {name: config, mountPath: /etc/space, readOnly: true}
            {{- if eq $name "prometheus" }}
            - {name: data, mountPath: /prometheus}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: metrics-config}
        {{- if eq $name "prometheus" }}
        - name: data
          {{- include "common.dataVolumeSource" (dict "name" "prometheus-data" "storage" $.Values.storage) | nindent 10 }}
        {{- end }}
---
{{- end }}
{{- end }}
