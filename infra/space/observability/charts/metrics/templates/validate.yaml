{{- if include "common.otlpSelected" . }}
{{- include "common.profileGuard" . }}
{{- include "common.sharedGuards" . }}
{{- include "common.ephemeralStorageGuard" (dict "storage" .Values.storage "resources" .Values.prometheus.resources "key" "storage" "resourcesKey" "prometheus.resources") }}
{{- if eq .Values.profile "shared" }}
{{- include "common.sharedStorageGuard" (dict "storage" .Values.storage "key" "storage") }}
{{- if .Values.collector.debug }}
{{- fail "Diagnostic metric dumps are Kind-only" }}
{{- end }}
{{- if .Values.collector.clusterIP }}
{{- fail "A fixed Collector ClusterIP is Kind-only; shared producers use the Service name" }}
{{- end }}
{{- end }}
{{- end }}
