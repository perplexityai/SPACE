{{- if include "common.otlpSelected" . }}
{{- if .Values.networkPolicy.enabled }}
{{- range $name := include "metrics.components" . | fromJsonArray }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-{{ $name }}
spec:
  podSelector:
    matchLabels: {app: {{ $name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if eq $name "collector" }}
    - ports: [{protocol: TCP, port: 8888}]
      from:
        - podSelector: {matchLabels: {app: prometheus}}
    {{- with $.Values.networkPolicy.receiverPeers }}
    - ports: [{protocol: TCP, port: 4317}]
      from:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- else }}
    - ports: [{protocol: TCP, port: 9090}]
      from:
        - podSelector: {matchLabels: {app: collector}}
{{- with $.Values.networkPolicy.queryPeers }}
{{ toYaml . | indent 8 }}
{{- end }}
    {{- end }}
  egress:
    - to:
        - podSelector: {matchLabels: {app: {{ if eq $name "collector" }}prometheus{{ else }}collector{{ end }}}}
      ports: [{protocol: TCP, port: {{ if eq $name "collector" }}9090{{ else }}8888{{ end }}}]
{{- include "common.dnsEgress" $ | nindent 4 }}
{{- with $.Values.networkPolicy.additionalEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
