global:
  scrape_interval: 10s
  scrape_timeout: 3s
otlp:
  translation_strategy: UnderscoreEscapingWithSuffixes
  promote_resource_attributes:
    - service.name
    - service.instance.id
    - service.version
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.pod.name
    - k8s.node.name
  keep_identifying_resource_attributes: true
  promote_scope_metadata: true
storage:
  tsdb:
    out_of_order_time_window: 1m
scrape_configs:
  - job_name: collector
    static_configs:
      - targets: [collector:8888]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
{{- with .Values.scrape.infraMetrics }}
{{- if .namespace }}
  # Cluster and host metric sources from the space-infra-metrics release.
  # Scraped cross-namespace, so the metrics NetworkPolicy needs matching
  # egress and that release needs this namespace in its scrapePeers.
  {{- if .kubeStateMetrics }}
  - job_name: kube-state-metrics
    static_configs:
      - targets: [kube-state-metrics.{{ .namespace }}.svc.cluster.local:8080]
  {{- end }}
  {{- if .processExporter }}
  - job_name: process-exporter
    # DNS discovery over the headless Service, not kubernetes_sd: the A record
    # already returns one address per DaemonSet pod, so this needs no
    # ServiceAccount and no cluster-wide read. Prometheus here has neither.
    dns_sd_configs:
      - names: [process-exporter.{{ .namespace }}.svc.cluster.local]
        type: A
        port: 9256
        refresh_interval: 30s
  {{- end }}
{{- end }}
{{- end }}
