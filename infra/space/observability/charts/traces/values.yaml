# Shared installs require an explicit storage choice. Kind uses profiles/kind.yaml.
profile: shared
storage:
  size: 4Gi
  storageClassName: null
  existingClaim: ""
  retain: true
scheduling:
  nodeSelector: {}
  tolerations: []
networkPolicy:
  enabled: true
  receiverPeers: []
  queryPeers: []
  # Peers allowed to scrape the Collector's own metrics on 8888: dropped and
  # refused spans, queue occupancy. The metrics chart authorizes its in-namespace
  # Prometheus for the same port; this chart ships no scraper, so without an
  # explicit peer an enforcing CNI leaves those numbers unreachable and an
  # operator is blind to the Collector shedding spans.
  monitoringPeers: []
  additionalEgress: []
collector:
  # Fixed Service ClusterIP. Empty lets Kubernetes allocate one; only the Kind
  # profile sets it, for the node-hosted shim, which has no cluster DNS.
  clusterIP: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}
tempo:
  # Block retention; Tempo also bounds ingestion and search in config/tempo.yaml.
  blockRetention: 6h
  maxSearchDuration: 6h
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 256Mi}
# Pinned multi-platform digests; versions verified 2026-09-23.
# A bump also moves the tag in profiles/kind.yaml and the entry in
# ci/mirrored-images.txt.
images:
  # Shared with the metrics chart: the digest lives in charts/common so a
  # version bump is one edit. Set this to pin a different Collector here only.
  collector: ""
  tempo: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
