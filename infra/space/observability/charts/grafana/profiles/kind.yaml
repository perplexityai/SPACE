profile: kind
auth:
  anonymous: true
networkPolicy:
  enabled: false
persistence:
  enabled: false
# By tag, not by the digest values.yaml pins: install-observability.sh loads
# that digest onto every Kind node under this tag, and a loaded image answers
# to its tag only, so a digest reference would send the kubelet to the
# registry anyway. Bump the tag with the pin in values.yaml.
image: grafana/grafana:13.2.2
datasources:
  prometheus:
    url: http://prometheus.space-metrics.svc.cluster.local:9090
  loki:
    # This profile describes the complete local stack, where bootstrap installs
    # all three backends, so it enables all three datasources. The chart default
    # stays off: a shared cluster may run neither Loki nor Tempo, and a
    # datasource pointing at nothing is worse than no datasource.
    enabled: true
    url: http://loki.space-logs.svc.cluster.local:3100
  tempo:
    enabled: true
    url: http://tempo.space-traces.svc.cluster.local:3200
