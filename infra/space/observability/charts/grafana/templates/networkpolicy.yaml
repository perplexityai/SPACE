{{- if include "common.otlpSelected" . }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
spec:
  podSelector:
    matchLabels: {app: grafana}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- with .Values.networkPolicy.uiPeers }}
    - ports: [{protocol: TCP, port: 3000}]
      from:
{{ toYaml . | indent 8 }}
    {{- end }}
  egress:
{{- include "common.dnsEgress" . | nindent 4 }}
{{- with .Values.networkPolicy.backendEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- with .Values.networkPolicy.additionalEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
