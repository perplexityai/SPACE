{{- define "grafana.datasources" -}}
apiVersion: 1
prune: true
datasources:
  {{- range $name := list "prometheus" "loki" "tempo" }}
  {{- $source := index $.Values.datasources $name }}
  {{- if $source.enabled }}
  - name: {{ title $name }}
    uid: space-{{ $name }}
    type: {{ $name }}
    access: proxy
    url: {{ $source.url | quote }}
    isDefault: {{ eq $name "prometheus" }}
    editable: false
    {{- if and (eq $name "loki") $.Values.datasources.tempo.enabled }}
    # SPACE JSON log lines carry the W3C trace_id of their enclosing span;
    # link it to that trace.
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          datasourceUid: space-tempo
          url: '$${__value.raw}'
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
{{ (.Files.Glob "config/*").AsConfig | indent 2 }}
  datasources.yaml: |
{{ include "grafana.datasources" . | indent 4 }}
---
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{ include "common.pvc" (dict "name" "grafana-data" "storage" .Values.persistence) }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ClusterIP
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels:
{{ include "common.podLabels" (dict "app" "grafana" "profile" .Values.profile "owner" "grafana") | indent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" ((.Files.Glob "config/*").AsConfig) (include "grafana.datasources" .) | sha256sum }}
    spec:
{{- include "common.scheduling" .Values.scheduling | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
{{ include "common.containerSecurityContext" . | indent 12 }}
          env:
            {{- if .Values.auth.anonymous }}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION, value: "true"}
            {{- else }}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "false"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "true"}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.userKey | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.passwordKey | quote }}
            {{- end }}
            {{- if .Values.datasources.prometheus.enabled }}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/dashboards/main-health.json}
            {{- else if .Values.datasources.loki.enabled }}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/dashboards/main-health-logs.json}
            {{- else if .Values.datasources.tempo.enabled }}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/dashboards/traces.json}
            {{- end }}
            - {name: GOMEMLIMIT, value: 512MiB}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: "false"}
            - {name: GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED, value: "true"}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/local.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/local.yaml, subPath: dashboards.yaml, readOnly: true}
            {{- if .Values.datasources.prometheus.enabled }}
            - {name: config, mountPath: /etc/grafana/dashboards/main-health.json, subPath: main-health.json, readOnly: true}
            {{- end }}
            {{- if .Values.datasources.loki.enabled }}
            - {name: config, mountPath: /etc/grafana/dashboards/main-health-logs.json, subPath: main-health-logs.json, readOnly: true}
            {{- end }}
            {{- if .Values.datasources.tempo.enabled }}
            - {name: config, mountPath: /etc/grafana/dashboards/traces.json, subPath: traces.json, readOnly: true}
            - {name: config, mountPath: /etc/grafana/dashboards/trace-detail.json, subPath: trace-detail.json, readOnly: true}
            {{- end }}
            {{- range $index, $name := .Values.dashboards.extraConfigMaps }}
            - {name: dashboard-extra-{{ $index }}, mountPath: /etc/grafana/dashboards/extra-{{ $index }}, readOnly: true}
            {{- end }}
      volumes:
        {{- range $index, $name := .Values.dashboards.extraConfigMaps }}
        - name: dashboard-extra-{{ $index }}
          configMap: {name: {{ $name | quote }}}
        {{- end }}
        - name: config
          configMap: {name: grafana-config}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "common.claimName" (dict "name" "grafana-data" "storage" .Values.persistence) | quote }}}
          {{- else }}
          emptyDir: {sizeLimit: {{ .Values.persistence.emptyDirSizeLimit }}}
          {{- end }}
