{{- if and (eq (include "space-observability.mode" .) "otlp") .Values.grafana.enabled }}
{{- $name := include "space-observability.grafanaAdminSecret" . }}
{{- if eq .Values.grafana.auth.existingSecret $name }}
{{- /* Reuse the stored password across upgrades; generate it only once. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.grafana.auth.passwordKey) }}
{{- $password = index $existing.data .Values.grafana.auth.passwordKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "space-observability.labels" . | nindent 4 }}
  annotations:
    # Survives uninstall, so a reinstall keeps the same credentials.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.grafana.auth.userKey }}: {{ .Values.grafanaAdmin.user | b64enc | quote }}
  {{ .Values.grafana.auth.passwordKey }}: {{ $password | b64enc | quote }}
{{- end }}
{{- end }}
