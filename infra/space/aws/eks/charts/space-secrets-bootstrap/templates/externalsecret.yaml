{{- $secretStoreName := required "secretStore.name is required" .Values.secretStore.name -}}
{{- range $name, $secret := .Values.externalSecrets }}
{{- if ne $secret.enabled false }}
---
apiVersion: {{ $.Values.externalSecretsApiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "space-secrets-bootstrap.namespace" $ }}
  annotations:
    # Helm deletes objects that drop out of a release's manifest, and each of
    # these owns its target secret (creationPolicy: Owner below), so that delete
    # takes the live secret with it.
    helm.sh/resource-policy: keep
spec:
  refreshInterval: {{ default "5m" $secret.refreshInterval }}
  secretStoreRef:
    name: {{ $secretStoreName }}
    kind: SecretStore
  target:
    name: {{ required (printf "externalSecrets.%s.targetSecretName is required" $name) $secret.targetSecretName }}
    creationPolicy: Owner
{{- with $secret.template }}
    template:
{{ toYaml . | indent 6 }}
{{- end }}
  data:
{{- range $secretKey, $data := $secret.data }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ required (printf "externalSecrets.%s.data.%s.remoteRef.key is required" $name $secretKey) $data.remoteRef.key | quote }}
{{- with $data.remoteRef.property }}
        property: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
