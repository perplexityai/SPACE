apiVersion: {{ .Values.externalSecretsApiVersion }}
kind: SecretStore
metadata:
  name: {{ required "secretStore.name is required" .Values.secretStore.name }}
  namespace: {{ include "space-secrets-bootstrap.namespace" . }}
  annotations:
    # Helm deletes objects that drop out of a release's manifest, and this
    # plumbing has to outlive any future move between releases — a cluster needs
    # it before the migration Job runs. Keeping the annotation here means the
    # next ownership move starts from a safe position instead of re-doing the
    # annotate deploy.
    helm.sh/resource-policy: keep
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secretStore.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ required "serviceAccount.name is required" .Values.serviceAccount.name }}
