# cargo-deny checks the resolved third-party graph alongside cargo-vet.
# SPACE's Apache-2.0 license and planned contributor CLA do not determine the
# licenses of dependencies; this list covers permissive terms in the graph.
[licenses]
include-dev = true
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# These packages distribute CA certificate data under the CDLA permissive data
# license. Keep this exception narrow so other uses get explicit review.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# RUSTSEC-2024-0449 is informational: unsafe-libyaml is unmaintained, with no
# known vulnerability. Keep this exception to that one advisory; other
# advisories keep the default policy. Remove it once #303 drops the crate.
[advisories]
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; it enters only via datadog-opentelemetry -> libdd-library-config -> serde_yaml 0.9.34+deprecated -> unsafe-libyaml. Removal is tracked in #303." },
]
