"crates/libs/spaced/CLAUDE.md" = "crates/l40_api/spaced/CLAUDE.md"

# Files the move leaves as they are, which may keep naming old paths, with why.
[stale_paths]
"scripts/move_crates.toml" = "the mapping itself: it names each crate by its package before the move, and each non-crate file by its old path"
"scripts/netgtw/bench/build-rev.sh" = "builds the bench harness at any revision, so it names the harness's path, package and anchor member in both layouts"
