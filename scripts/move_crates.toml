# Tracked files below crates/apps and crates/libs outside a crate, moving
# with the layer most of their family's crates go to.
[files]
"crates/apps/space-cli/tests/login.rs" = "stay"
"crates/libs/net/gateway/AGENTS.md" = "crates/l40_api/net/gateway/AGENTS.md"
"crates/libs/net/gateway/CLAUDE.md" = "crates/l40_api/net/gateway/CLAUDE.md"
