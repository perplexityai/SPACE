name = "Authenticated CONNECT preserves opaque forwarding"

[[steps]]
policy = { default = "deny", tls_interception = "on", allow = ["198.18.1.2", "upstream-proxy.127-0-0-1.dev"] }
probes = [
  { kind = "connect", host = "upstream-proxy.127-0-0-1.dev", tunnel_host = "inner.127-0-0-1.dev", expect = "allow" },
]

[[steps]]
policy = { default = "deny", tls_interception = "on", allow = ["198.18.1.2", "upstream-proxy.127-0-0-1.dev", "inner.127-0-0-1.dev"] }
probes = [
  { kind = "connect", host = "upstream-proxy.127-0-0-1.dev", tunnel_host = "inner.127-0-0-1.dev", expect = "allow" },
  { kind = "connect", host = "upstream-proxy.127-0-0-1.dev", tunnel_host = "inner.127-0-0-1.dev", proxy_anyauth = true, expect = "allow" },
  { kind = "connect", host = "upstream-proxy.127-0-0-1.dev", tunnel_host = "forbidden.127-0-0-1.dev", expect = "allow" },
  { kind = "connect", host = "upstream-proxy.127-0-0-1.dev", tunnel_host = "inner.127-0-0-1.dev", tunnel_authority = "forbidden.127-0-0-1.dev", expect = "allow" },
]

[[steps]]
policy = { default = "deny", tls_interception = "on", allow = ["inner.127-0-0-1.dev"] }
probes = [
  { kind = "connect", host = "upstream-proxy.127-0-0-1.dev", tunnel_host = "inner.127-0-0-1.dev", expect = "deny" },
]
