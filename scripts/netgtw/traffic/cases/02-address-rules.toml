name = "IP and CIDR allows never override an explicit deny"

[[steps]]
policy = { default = "deny", allow = ["198.18.1.2"] }
probes = [
  { kind = "tcp", expect = "allow" },
  { kind = "udp", expect = "allow" },
  { kind = "tcp", target = "198.18.2.2", expect = "deny" },
  { kind = "h2c", host = "allowed.test", expect = "allow" },
  { kind = "http2", host = "allowed.test", expect = "allow" },
  { kind = "grpc", host = "allowed.test", expect = "allow" },
  { kind = "grpcs", host = "allowed.test", expect = "allow" },
  { kind = "ws", host = "allowed.test", expect = "allow" },
  { kind = "wss", host = "allowed.test", expect = "allow" },
  { kind = "quic", host = "allowed.test", expect = "deny" },
  { kind = "quic", port = 8443, host = "allowed.test", expect = "allow" },
  { kind = "udp", sizes = [64, 1200, 8192], expect = "allow" },
]

[[steps]]
policy = { default = "deny", allow = ["198.18.0.0/15"], deny = ["198.18.2.2"] }
probes = [
  { kind = "tcp", expect = "allow" },
  { kind = "udp", expect = "allow" },
  { kind = "tcp", target = "198.18.2.2", expect = "deny" },
  { kind = "udp", target = "198.18.2.2", expect = "deny" },
  { kind = "http2", target = "198.18.2.2", host = "allowed.test", expect = "deny" },
  { kind = "grpcs", target = "198.18.2.2", host = "allowed.test", expect = "deny" },
  { kind = "wss", target = "198.18.2.2", host = "allowed.test", expect = "deny" },
  { kind = "quic", target = "198.18.2.2", host = "allowed.test", expect = "deny" },
]

[[steps]]
policy = { default = "allow", allow = ["198.18.1.2"], deny = ["198.18.0.0/15"] }
probes = [
  { kind = "tcp", expect = "deny" },
  { kind = "udp", expect = "deny" },
  { kind = "tls", host = "allowed.test", expect = "deny" },
  { kind = "h2c", host = "allowed.test", expect = "deny" },
  { kind = "http2", host = "allowed.test", expect = "deny" },
  { kind = "grpc", host = "allowed.test", expect = "deny" },
  { kind = "grpcs", host = "allowed.test", expect = "deny" },
  { kind = "ws", host = "allowed.test", expect = "deny" },
  { kind = "wss", host = "allowed.test", expect = "deny" },
  { kind = "quic", host = "allowed.test", expect = "deny" },
  { kind = "udp", sizes = [64, 1200, 8192], expect = "deny" },
]
