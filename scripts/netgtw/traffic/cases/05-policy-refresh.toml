name = "Policy refresh revokes cached DNS and active attributed TLS"

[[steps]]
policy = { default = "deny", allow = ["1.1.1.1", "refresh.198-18-1-2.sslip.io"] }
probes = [
  { kind = "dns-udp", target = "1.1.1.1", host = "refresh.198-18-1-2.sslip.io", expect = "answer" },
  { kind = "tls-echo", host = "refresh.198-18-1-2.sslip.io", session = "attributed", connection = "new", expect = "allow" },
]

[[steps]]
policy = { default = "deny", allow = ["1.1.1.1"] }
probes = [
  { kind = "tls-echo", host = "refresh.198-18-1-2.sslip.io", session = "attributed", connection = "existing", expect = "deny" },
  { kind = "tls", host = "refresh.198-18-1-2.sslip.io", expect = "deny" },
  { kind = "dns-udp", target = "1.1.1.1", host = "refresh.198-18-1-2.sslip.io", expect = "refused" },
]

[[steps]]
policy = { default = "deny", allow = ["1.1.1.1", "refresh.198-18-1-2.sslip.io"] }
probes = [
  { kind = "dns-udp", target = "1.1.1.1", host = "refresh.198-18-1-2.sslip.io", expect = "answer" },
  { kind = "tls", host = "refresh.198-18-1-2.sslip.io", expect = "allow" },
]
