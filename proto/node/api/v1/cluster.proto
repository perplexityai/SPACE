message PublishedSandboxState {
  string sandbox_id = 1;
  bool present = 2;
  optional string template = 3;
  optional string status = 4;
  optional string content_hash = 5;
  optional string runtime = 6;
  optional string created_at = 7;
  optional string owner = 8;
  optional space.net.policy.v1.NetworkPolicyV1 observed_network_policy = 9;
  uint64 observed_network_policy_generation = 10;
  space.net.policy.v1.NetworkPolicySource observed_network_policy_source = 11;
  optional uint64 network_tx_bytes = 12;
  optional uint64 network_rx_bytes = 13;
  bool snapshots_enabled = 14;
  optional uint64 disk_usage_bytes = 15;
  optional string pool_template = 16;
  optional string failure_reason = 17;
  repeated space.sandbox.manager.v1.SnapshotDetail snapshots = 18;
  optional uint32 pid = 19;
  optional string namespace = 20;
  optional string uptime = 21;
  space.net.policy.v1.PolicyAuthority observed_network_policy_authority = 22;
  space.net.policy.v1.PolicyAuthority auto_lifecycle_authority = 23;
  optional space.execution.v1.ExecutionMetadata execution = 24;
  // Most recent node-local sandbox activity timestamp that advanced
  // auto-lifecycle keepalive state; max(last_access_at, last_command_at).
  optional google.protobuf.Timestamp last_used_at = 25;
  // Most recent non-command guest activity: file access, terminal/session
  // attach, port/protocol sessions, or compatibility data-plane access.
  optional google.protobuf.Timestamp last_access_at = 26;
  // Most recent guest command/process execution.
  optional google.protobuf.Timestamp last_command_at = 27;
  optional string spaced_version = 28;
  // Bounded quarantine classification authored by sbx-manager. The cluster
  // projection validates and preserves it instead of replacing it with a
  // generic publication reason.
  optional string quarantine_reason_code = 29;
  // Generation-fenced proof of a node-local transition.
  optional space.sandbox.manager.v1.TransitionReceipt transition_receipt = 30;
  // The node confirms presence and status, but optional inventory fields are
  // incomplete. The control plane must not replace richer observations with
  // defaults from this publication.
  bool state_degraded = 31;
  // Current immutable artifact identity. These fields are published together
  // so transition receipts can bind convergence to the exact node evidence.
  optional string current_local_artifact_id = 32;
  optional space.sandbox.manager.v1.ArtifactKind current_local_artifact_kind = 33;
  optional space.sandbox.manager.v1.ArtifactOrigin current_local_artifact_origin = 34;
  // Exact Kubernetes execution identity observed for this sandbox. The API
  // uses it with the published suspend artifact to fence finalization to the
  // execution that produced those bytes.
  optional int64 execution_generation = 37;
  optional string pod_uid = 38;
  // Time the node-local state last changed. This timestamp describes `status`,
  // not the last update to any other sandbox field.
  optional google.protobuf.Timestamp state_changed_at = 39;
  // Node-local quarantine recovery scheduling facts. The cluster stores this
  // as observation and does not treat it as recovery authority.
  optional space.sandbox.manager.v1.QuarantineRecoveryObservation quarantine_recovery = 40;
  // Exact activation attempt observed with this state. Generations may be
  // reused by placement retries, so attempt-scoped evidence must carry both.
  optional string activation_attempt_id = 41;
}

