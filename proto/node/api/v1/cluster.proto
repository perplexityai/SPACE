  QUARANTINE_RECOVERY_TARGET_STATE_SUSPENDED = 1;
}

message QuarantineRecoverySuspendSnapshot {
  string snapshot_id = 1;
  // Immutable artifact identity for modern snapshots. Empty only for legacy
  // snapshots created before artifact identity was recorded.
  string local_artifact_id = 2;
  string storage_uri = 3;
  int64 bytes_uploaded = 4;
}

message GetQuarantineRecoveryPlanResponse {
  // The central quarantine episode id. This is also the node cleanup episode
  // and transition receipt id, making retries idempotent across restarts.
  string recovery_id = 1;
  int64 execution_generation = 2;
  string reason_code = 3;
  QuarantineRecoveryTargetState target_state = 4;
  QuarantineRecoverySuspendSnapshot suspend_snapshot = 5;
