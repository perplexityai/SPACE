message GetSandboxSnapshotStorageUriRequest {
  // Sandbox whose org-level override should be resolved.
  string sandbox_id = 1;
}

message GetSandboxSnapshotStorageUriResponse {
  // The org's `snapshot_base_object_storage_uri`, when set. Absent means
  // "no override; caller should use its own default". Returned verbatim;
  // the cluster API does not parse or validate it (parsing is done by the
  // node-side `SnapshotUploadConfig::from_uri`).
  optional string storage_uri = 1;
}

message GetSuspendSnapshotLocationRequest {
  // Sandbox whose latest suspend snapshot location should be returned.
  string sandbox_id = 1;
}

message GetSuspendSnapshotLocationResponse {
  // ID of the `snapshots` row backing this location.
  string snapshot_id = 1;
  // `s3://bucket/<prefix>/suspend_snapshots/<sandbox_id>?region=…` connection
  // string identifying where the artifacts live.
  string storage_uri = 2;
  // Total compressed bytes of all VM artifacts that were uploaded.
  int64 bytes_uploaded = 3;
  // Empty for snapshots finalized before digests were recorded.
  repeated SnapshotArtifactDigest artifact_digests = 4;
}

// The server authenticates the registered node independently of these hints.
message GetNodeRuntimeDesiredStateRequest {
  string node_id = 1;
  optional NodeRole role = 2;
}

message RuntimeProvisioningRecipe {
  // Immutable compiled environment references, not names, paths or new hashes.
  // Nodes validate the complete set before submitting any installation.
  // Omission never authorizes removal. Empty means no required installations.
  repeated string required_environments = 1;
}

message GetNodeRuntimeDesiredStateResponse {
  // Absent means no policy is assigned; it is not an empty applied recipe.
  RuntimeProvisioningRecipe recipe = 1;
}
