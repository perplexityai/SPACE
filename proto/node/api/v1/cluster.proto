message PublishNodeStateRequest {
  string node_id = 1;
  bool sandbox_inventory_complete = 2;
  repeated PublishedSandboxState sandboxes = 3;
  bool template_inventory_complete = 4;
  repeated PublishedTemplateState templates = 5;
  optional NodeRole role = 6;
  optional PublishedNodeStatus node_status = 7;
  optional space.execution.v1.NodeExecutionInventory execution_inventory = 8;
  repeated AutoLifecycleDeleteCompletion auto_lifecycle_delete_completions = 9;
  // This node's local artifacts with no finalized remote backup.
  //
  // Present exactly when the node answered for its whole set. Absent on
  // every delta publish and on any tick where sandbox-manager could not
  // answer — both are "the node did not report", and neither means
  // "nothing is pending". Presence carries that distinction instead of a
  // sibling flag so a reader cannot reach the list without deciding what to
  // do when there is no report: an empty list treated as a complete one
  // releases a node over artifacts nobody enumerated.
  optional PendingLocalBackupReport pending_local_backups = 10;
  // Absent means this publication makes no observation, or uses the legacy
  // execution_inventory field. Complete reports may also populate field 8 for
  // old readers, but both inventories must agree. An unavailable observation
  // must not carry field 8. This reports inventory collection, not readiness.
  // Contradictory reports and missing/unknown outcomes reject the entire
  // publication with InvalidArgument; collection failures use unavailable.
  optional ExecutionInventoryObservation execution_observation = 11;
}

message ExecutionInventoryObservation {
  oneof outcome {
    // A successful collection, including an empty inventory.
    space.execution.v1.NodeExecutionInventory complete = 1;
    ExecutionInventoryUnavailable unavailable = 2;
  }
}

// No authoritative answer was obtained. Detailed local errors stay in node
// diagnostics; this must not be interpreted as an empty installation set.
message ExecutionInventoryUnavailable {}

// A node's whole answer to "which artifacts on this disk have no durable
// copy yet". An empty `pending` here does mean nothing is pending; it is
// the absence of this message that means the node did not answer.
message PendingLocalBackupReport {
  repeated space.sandbox.manager.v1.PendingLocalBackup pending = 1;
}

message PublishNodeStateResponse {
  uint64 sandboxes_accepted = 1;
  uint64 templates_accepted = 2;
  repeated string acknowledged_auto_lifecycle_delete_receipt_ids = 3;
}

// Durable proof that a node finished a cluster-owned automatic sandbox
// deletion for one Kubernetes execution generation. Locally authoritative
// deployments do not emit receipts. The node retries this receipt until the
// cluster acknowledges its receipt_id.
message AutoLifecycleDeleteCompletion {
  string receipt_id = 1;
  string sandbox_id = 2;
  int64 execution_generation = 3;
  // Identifies the exact route activation within the execution generation.
  string route_activation_id = 4;
  // SHA-256 identity of the normalized policy that authorized this delete.
  string auto_lifecycle_policy_fingerprint = 5;
}

message PublishedNodeStatus {
  NodeSchedulingStatus scheduling_status = 1;
  string scheduling_reason = 2;
  uint32 network_slots_ready = 3;
  uint32 network_pool_min_ready = 4;
  uint32 network_slots_degraded = 5;
  uint32 network_slots_quarantined = 6;
  uint32 network_slots_total = 7;
  uint32 network_slots_leased = 8;
  uint32 network_pool_max_slots = 9;
  optional NodeCtlStatus node_ctl = 10;
}

// Terminal lifecycle state a backup attempt can be transitioned into by
// `FinalizeArtifactBackup`. `creating` is the implicit starting state set by
// `BeginArtifactBackup` and is not selectable here.
enum SuspendSnapshotTerminalState {
  SUSPEND_SNAPSHOT_TERMINAL_STATE_UNSPECIFIED = 0;
  // Upload completed; row becomes visible to restore-side readers.
  SUSPEND_SNAPSHOT_TERMINAL_STATE_READY = 1;
  // Upload pipeline gave up permanently; row stays invisible to restore.
  SUSPEND_SNAPSHOT_TERMINAL_STATE_FAILED = 2;
}

message BeginArtifactBackupRequest {
  // Identity of immutable locally published bytes to back up.
  string sandbox_id = 1;
  string local_artifact_id = 2;
  space.sandbox.manager.v1.ArtifactKind artifact_kind = 3;
  // UUIDv7 identity of this independently retryable backup attempt.
  string backup_attempt_id = 4;
  string storage_uri = 5;
  space.sandbox.manager.v1.ArtifactOrigin artifact_origin = 6;
  optional string snapshot_name = 7;
  // Exact source environment encoded in the artifact metadata sidecar.
  // Required: the server rejects a request without it as INVALID_ARGUMENT.
  space.execution.v1.ExecutionMetadata execution = 8;
  // CPU identity of the host that captured the artifact's VM state, as a
  // Kubernetes label value. Absent when unknown. The cluster API records it
  // in the snapshot's execution metadata as restore-placement evidence.
  optional string capture_host_cpu = 9;
  // Kubernetes execution generation whose runtime captured the artifact: a
  // teardown suspend's own capture (the API's generation-bound suspend
  // included), a node-local suspend, or a backup requested again by local
  // artifact id, which carries the generation of that artifact's earlier
  // upload. When set, the server refuses the first registration of a local
  // artifact whose generation was superseded: a newer execution is active or
  // has materialized a pod, or this generation's execution was retired as
  // replaced. So a runtime no restore can adopt (e.g. a reaped orphaned
  // restore pod's VM) can't register a snapshot. The fence covers
  // registration only: an admitted attempt can still finalize, a replay of an
  // already-registered attempt isn't re-fenced, and a fresh attempt for bytes
  // an earlier attempt registered is a retry and isn't fenced either. Unset
  // for backups that aren't bound to one execution.
  optional int64 execution_generation = 10;
  // Answer as this registration would, the generation fence and the source
  // node check included, but persist nothing: no snapshot row is created or
  // changed. A node sets it to recover the fence's verdict for an upload that
  // already failed, so asking leaves no row that could outrank a ready
  // snapshot. A server that predates the field registers the attempt and
  // leaves `fence_verdict_only` unset in its response.
  bool fence_verdict_only = 11;
}

message BeginArtifactBackupResponse {
  string local_artifact_id = 1;
  string backup_attempt_id = 2;
  // Echoes the request's `fence_verdict_only`: set when the server persisted
  // nothing. Unset in a reply to a verdict-only request means the server
  // predates the field and registered the attempt, which the caller then
  // closes.
  bool fence_verdict_only = 3;
}

message FinalizeArtifactBackupRequest {
  string backup_attempt_id = 1;
  SuspendSnapshotTerminalState target_state = 2;
  int64 bytes_uploaded = 3;
  optional string failure_reason = 4;
  // Digests of the artifacts this attempt uploaded. Recorded only for READY
  // and write-once: a replay must repeat the same digests.
  repeated SnapshotArtifactDigest artifact_digests = 5;
}

// Content digest of one artifact file in a backup attempt, reported by the
// uploading node and handed back to restore so the bytes it pulls are
// verified against the catalog rather than trusted from the object store.
message SnapshotArtifactDigest {
  // Canonical file name under the attempt prefix: `memfile`, `binfile`,
  // `rootfs`, `rootfs.btrfs-send`, `snapshot.luks`, `cow.luks`, or
  // `metadata.json`.
  string artifact = 1;
  // `sha256:<64 lowercase hex>` over the artifact bytes as they exist on the
  // node, before any transfer compression or encryption.
  string digest = 2;
  // Size in bytes of the same bytes the digest covers.
  uint64 size_bytes = 3;
}

message FinalizeArtifactBackupResponse {}

message TouchArtifactBackupRequest {
  string backup_attempt_id = 1;
}

message TouchArtifactBackupResponse {}

message GetArtifactBackupLocationRequest {
  // Select a ready remote copy only for this exact immutable local artifact.
  string sandbox_id = 1;
  string local_artifact_id = 2;
  space.sandbox.manager.v1.ArtifactKind artifact_kind = 3;
  // Set for a readiness query, which leaves `local_artifact_id` empty and
  // `artifact_kind` unspecified. A server without readiness support ignores
  // this field and rejects the empty artifact id instead of returning a
  // location.
  BackupReadinessQuery readiness = 4;
}

message BackupReadinessQuery {
  oneof artifact {
    // Ready when these exact immutable bytes have a ready, non-orphaned
    // backup.
    LocalArtifactBackupIdentity local_artifact = 1;
    // An unpinned cache's suspend attempt. Ready only while it is still the
    // latest ready full suspend, not merely an older attempt with a backup.
    string latest_ready_suspend_snapshot_id = 2;
    // Ready when the sandbox is durably restorable from a ready snapshot the
    // restore would select: a restoring one needs a source in its retry
    // window, any other one marked to a local artifact that artifact's ready
    // backup, and an unmarked one a ready newest full snapshot (fresher than
    // its last placement change unless it is marked for evacuation). Unlike the
    // other two, it names no identity the caller holds, so any registered node
    // learns whether a sandbox it names is restorable. Must be true.
    bool durably_restorable = 3;
  }
}

message LocalArtifactBackupIdentity {
  string local_artifact_id = 1;
  space.sandbox.manager.v1.ArtifactKind artifact_kind = 2;
}

message GetArtifactBackupLocationResponse {
  string local_artifact_id = 1;
  space.sandbox.manager.v1.ArtifactKind artifact_kind = 2;
  string backup_attempt_id = 3;
  string storage_uri = 4;
  int64 bytes_uploaded = 5;
  // Empty for attempts finalized before digests were recorded.
  repeated SnapshotArtifactDigest artifact_digests = 6;
  // Set only in reply to a readiness query; every other field is then empty.
  optional bool ready = 7;
}

message GetQuarantineRecoveryPlanRequest {
