  optional uint32 snapshot_memory_mib = 10;
  optional string built_at = 11;
  // Logical expanded rootfs artifact size from build metadata or object transfer.
  optional uint64 artifact_size_bytes = 12;
  optional uint64 base_snapshot_size_bytes = 13;
  optional uint32 pool_target = 14;
  uint32 pool_current = 15;
  uint32 pool_pending = 16;
  repeated string pool_sandbox_ids = 17;
  repeated space.template.manager.v1.SnapshotInfo snapshots = 18;
  optional space.sandbox.manager.v1.AutoLifecyclePolicy default_auto_lifecycle = 19;
  uint64 network_policy_generation = 20;
  optional uint32 vcpu = 21;
  optional uint32 memory_mib = 22;
  optional uint32 disk_size_mb = 23;
  // Node-local allocated bytes for the materialized template rootfs cache.
  optional uint64 cache_size_bytes = 24;
  space.net.policy.v1.PolicyAuthority network_policy_authority = 25;
