syntax = "proto3";
package space.node.runtime.v1;

import "execution/v1/execution.proto";

service RuntimeSupervisor {
  // Every mutation requires explicit execution identity; no unfenced mode.
  rpc BindExecution(BindExecutionRequest) returns (BindExecutionResponse);
  rpc RetireExecution(RetireExecutionRequest) returns (RetireExecutionResponse);
  rpc LaunchRuntime(LaunchRuntimeRequest) returns (LaunchRuntimeResponse);
  rpc LaunchSidecar(LaunchSidecarRequest) returns (LaunchSidecarResponse);
  rpc StopProcess(StopProcessRequest) returns (StopProcessResponse);
  rpc StopSandboxRuntime(StopSandboxRuntimeRequest) returns (StopSandboxRuntimeResponse);
  rpc UpdateCgroup(UpdateCgroupRequest) returns (UpdateCgroupResponse);
}

message BindExecutionRequest {
  string sandbox_id = 1;
  string execution_id = 2;
  optional string previous_id = 3;
}
message BindExecutionResponse {}
message RetireExecutionRequest {
  string sandbox_id = 1;
  string execution_id = 2;
}
message RetireExecutionResponse {}

message CgroupLimits {
  optional uint32 vcpu_count = 1;
  optional uint64 memory_mib = 2; // Host cgroup memory.max in MiB
  optional uint32 pids_max = 3;
}

// Host-neutral integrity contract. The environment determines immutable sources
// and host/guest requirements. Its sandbox identity must match the launch request;
// the adapter authenticates sources before starting a new process.
message VerifiedRuntimeLaunch {
  string sandbox_id = 1;
  string environment_reference = 2;
  ArtifactIntegrityRequirement integrity_requirement = 3;
}

enum ArtifactIntegrityRequirement {
  ARTIFACT_INTEGRITY_REQUIREMENT_UNSPECIFIED = 0;
  // Runtime and immutable boot sources are authenticated against the trusted
  // environment and protected against content mutation while consumed. This
  // does not attest mutable guest disks or resistance to host-root compromise.
  ARTIFACT_INTEGRITY_REQUIREMENT_AUTHENTICATED_IMMUTABLE_SOURCES = 1;
}

message PreExecSocket {
  string bind_addr = 1;
  bool tcp = 2;
  bool transparent = 3;
  bool recvorigdstaddr = 4;
  string fd_arg = 5;
}

message LaunchSidecarRequest {
  string sandbox_id = 1;
  string ns_path = 2;
  string program = 3;
  repeated string args = 4;
  map<string, string> env = 5;
  uint32 uid = 6;
  uint32 gid = 7;
  repeated PreExecSocket pre_exec_sockets = 8;
  bool grant_cap_net_admin = 9;
  string execution_id = 10;
}

message LaunchSidecarResponse {
  uint32 pid = 1;
}

message StopProcessRequest {
  string sandbox_id = 1;
  uint32 pid = 2;
  uint32 signal = 3;
  string execution_id = 4;
}

message StopProcessResponse {
  bool success = 1;
}

message StopSandboxRuntimeRequest {
  string sandbox_id = 1;
  bool immediate_kill = 2;
  string execution_id = 4;
  optional string previous_execution_id = 5;
}

message StopSandboxRuntimeResponse {
  repeated string actions = 1;
}

message UpdateCgroupRequest {
  string sandbox_id = 1;
  CgroupLimits cgroup_limits = 2;
  string execution_id = 3;
}

message UpdateCgroupResponse {}

// Node-local host adapter input. Runtime identity, not an executable basename,
// selects the adapter. Locators supply no trust or artifact identity.
message LaunchRuntimeRequest {
  // Required even for protected launches; must match verified_runtime.sandbox_id
  // when verified_runtime is present.
  string sandbox_id = 1;
  string execution_id = 2;
  space.execution.v1.RuntimeKind runtime = 3;
  string runtime_binary = 4;
  // Optional containment executable; direct VMM adapters do not need one.
  optional string launcher_binary = 5;
  string workspace_root = 6;
  string network_namespace = 7;
  uint32 uid = 8;
  uint32 gid = 9;
  string configuration_path = 10;
  string log_path = 11;
  string console_path = 12;
  string metrics_path = 13;
  CgroupLimits resource_limits = 14;
  VerifiedRuntimeLaunch verified_runtime = 15;
}
message LaunchRuntimeResponse {
  uint32 pid = 1;
  string accepted_environment_reference = 2;
}
