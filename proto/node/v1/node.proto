syntax = "proto3";
package space.node.v1;

import "execution/v1/execution.proto";

service NodeManager {
  // Request ACPI shutdown of the fenced execution; acknowledgement is not proof of exit.
  rpc RequestGuestShutdown(RequestGuestShutdownRequest) returns (RequestGuestShutdownResponse);
  // Probe a guest TCP port inside the assigned namespace; no caller-supplied address.
  rpc ProbeGuestService(ProbeGuestServiceRequest) returns (ProbeGuestServiceResponse);
  // Operator-only bounded serial or TCP stream, closed when its execution fence is lost.
  rpc OpenGuestChannel(stream OpenGuestChannelRequest) returns (stream OpenGuestChannelResponse);

  // Publish the concrete runtime releases, state formats, and guest components
  // installed on this node. Compatibility remains runtime-driver-owned.
  rpc GetExecutionInventory(GetExecutionInventoryRequest)
      returns (space.execution.v1.NodeExecutionInventory);

  // Resolve an approved binding against verified local artifacts. This is an
  // artifact observation, not a reservation or proof of later host admission.
  // Callers must require this RPC; old inventory is not equivalent evidence.
  rpc ResolveExecutionEnvironment(ResolveExecutionEnvironmentRequest)
      returns (ResolveExecutionEnvironmentResponse);

  // Enforce the cluster's execution policy over the startup settings, which it
  // may narrow but never widen, and persist it across restarts. Callers send
  // every cluster response in full; an absent policy restores the startup
  // settings. A refused default isn't an error: the response reports it.
  rpc ApplyExecutionPolicy(ApplyExecutionPolicyRequest)
      returns (ApplyExecutionPolicyResponse);

  // Lease a preprovisioned network slot, or provision a pod-network allocation.
  rpc Allocate(AllocateRequest) returns (AllocateResponse);

  // Launch a process inside an allocated namespace.
  // Runtime-supervisor enters the namespace, drops privileges, and execs.
  // Returns the PID for sbx-manager to monitor.
  rpc Launch(LaunchRequest) returns (LaunchResponse);

  // Tear down namespace, veth, routes, iptables for a sandbox.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);

  // Query node-owned resource admission signals from node-manager.
  rpc GetNodeResourceStatus(NodeResourceStatusRequest)
      returns (NodeResourceStatusResponse);

  // Query cheap network-pool counts/config from node-manager state.
  rpc GetNetworkPoolStatus(NetworkPoolStatusRequest) returns (NetworkPoolStatusResponse);

  // Side-effect-free admission probe. True covers both prepared creation and
  // identity-fenced disposal; callers must not allocate before checking it.
  rpc GetCloneCapabilities(CloneCapabilitiesRequest) returns (CloneCapabilitiesResponse);

  // List DB-backed network leases without probing host or namespace resources.
  rpc ListNetworkLeases(ListNetworkLeasesRequest) returns (ListNetworkLeasesResponse);

  // Enable or disable network-pool drain mode. Draining rejects new leases and
  // stops background filling while allowing dirty/resetting slots to finish cleanup.
  rpc SetNetworkPoolDrain(SetNetworkPoolDrainRequest) returns (SetNetworkPoolDrainResponse);

  // Nudge pool repair: enqueue dirty-slot resets and optionally rebuild idle quarantined slots.
  rpc RepairNetworkPool(RepairNetworkPoolRequest) returns (RepairNetworkPoolResponse);

  // Update live network-pool sizing. Startup-only fields such as pod_netns_path
  // are configured through /space/config/node.toml and require restart.
  rpc SetNetworkPoolConfig(SetNetworkPoolConfigRequest) returns (SetNetworkPoolConfigResponse);

  // Send a signal to the process associated with a sandbox.
  // Validates the PID belongs to the sandbox before signaling.
  rpc StopProcess(StopProcessRequest) returns (StopProcessResponse);

  // Launch a sandbox using the specified runtime.
  // The selected adapter owns isolation, boot preparation and process launch.
  // Caller must have already called Allocate (for network) and PrepareSandbox (for filesystem).
  rpc LaunchSandbox(LaunchSandboxRequest) returns (LaunchSandboxResponse);

  // Prepare sandbox filesystem: create dirs, CoW clone rootfs, write config, chown to sandbox UID.
  // Called by sbx-manager before LaunchSandbox. All filesystem ops run as root.
  rpc PrepareSandbox(PrepareSandboxRequest) returns (PrepareSandboxResponse);

  // Hold node disk admission while a privileged local builder materializes a
  // sandbox rootfs outside PrepareSandbox. Completion records the handoff that
  // makes PrepareSandbox validate and preserve that rootfs instead of cloning
  // the template over it.
  rpc ReservePreparedRootfs(ReservePreparedRootfsRequest)
      returns (ReservePreparedRootfsResponse);
  rpc CompletePreparedRootfs(CompletePreparedRootfsRequest)
      returns (CompletePreparedRootfsResponse);

  // Ensure the sandbox-local artifact directory exists and is writable by
  // sandbox-manager. Used by lifecycle paths that publish artifacts for
  // already-prepared sandboxes, including adopted warm-pool sandboxes.
  rpc PrepareSandboxArtifactDir(PrepareSandboxArtifactDirRequest)
      returns (PrepareSandboxArtifactDirResponse);

  // Comprehensive cleanup: kill processes, remove cgroup, tear down network,
  // remove nft rules, delete filesystem, release slot. Single call does everything.
  // Disposable pool clones own no runtime. Never fall back to CleanupSandbox:
  // it does not enforce the persisted directory identity.
  rpc CleanupPreparedClone(CleanupPreparedCloneRequest) returns (CleanupSandboxResponse);
  rpc CleanupSandbox(CleanupSandboxRequest) returns (CleanupSandboxResponse);

  // Inspect all resources for one sandbox (processes, network, cgroup, filesystem, state).
  rpc InspectSandbox(InspectSandboxRequest) returns (InspectSandboxResponse);

  // Capture the privileged host process and vsock binding for the currently
  // registered sandbox runtime. Sandbox-manager binds this evidence to its
  // execution generation and activation attempt before persisting it.
  rpc CaptureSandboxEndpointProof(CaptureSandboxEndpointProofRequest)
      returns (SandboxEndpointProof);

  // Compare activation-captured endpoint evidence with the live host runtime.
  // Validation addresses exact descriptors and process identities and does not
  // repeat descriptor discovery.
  rpc ValidateSandboxEndpointProof(ValidateSandboxEndpointProofRequest)
      returns (ValidateSandboxEndpointProofResponse);

  // Validate root-owned original launch evidence for a gateway host-control peer.
  rpc ValidateGatewayCaller(ValidateGatewayCallerRequest) returns (ValidateGatewayCallerResponse);

  // Scan for orphaned resources not tracked by any service.
  rpc ListOrphanCandidates(ListOrphanCandidatesRequest) returns (ListOrphanCandidatesResponse);

  // Pause the VM (freeze vCPUs). Requires the FC API socket to be enabled.
  rpc PauseSandbox(PauseSandboxRequest) returns (PauseSandboxResponse);
  // Resume the VM (thaw vCPUs).
  rpc ResumeSandbox(ResumeSandboxRequest) returns (ResumeSandboxResponse);
  // Read VM state through the node's runtime adapter without granting the
  // caller access to the runtime's control socket.
  rpc GetVmState(GetVmStateRequest) returns (GetVmStateResponse);
  rpc CaptureVmState(CaptureVmStateRequest) returns (CaptureVmStateResponse);
  rpc RestoreVmState(RestoreVmStateRequest) returns (RestoreVmStateResponse);

  // Create a read-only btrfs snapshot of a sandbox's instance subvolume.
  rpc CreateBtrfsSnapshot(CreateBtrfsSnapshotRequest) returns (CreateBtrfsSnapshotResponse);
  // Delete a btrfs snapshot.
  rpc DeleteBtrfsSnapshot(DeleteBtrfsSnapshotRequest) returns (DeleteBtrfsSnapshotResponse);
  // Delete a sandbox-cache artifact directory at the given path.
  // Handles both btrfs subvolumes and plain directories, so callers
  // (snapshot reaper, named-snapshot delete, future cache pruners)
  // don't need CAP_SYS_ADMIN themselves to invoke
  // `btrfs subvolume delete`. The path must be under /space/cache.
  // Idempotent on a missing path (was_present = false, OK).
  rpc DeleteCacheArtifact(DeleteCacheArtifactRequest) returns (DeleteCacheArtifactResponse);
  // List btrfs snapshots for a sandbox.
  rpc ListBtrfsSnapshots(ListBtrfsSnapshotsRequest) returns (ListBtrfsSnapshotsResponse);
  // Roll back: replace instance subvolume with a writable copy of a snapshot, prune newer snapshots.
  rpc RollbackBtrfsSnapshot(RollbackBtrfsSnapshotRequest) returns (RollbackBtrfsSnapshotResponse);
  // Replace the instance subvolume with a writable copy of one internal
  // snapshot, leaving every other snapshot in place. The runtime must be
  // stopped. Only `d-operation-` snapshots are accepted.
  rpc RestoreInstanceSnapshot(RestoreInstanceSnapshotRequest) returns (RestoreInstanceSnapshotResponse);
  // Get exclusive disk usage for a batch of sandboxes.
  rpc GetDiskUsage(GetDiskUsageRequest) returns (GetDiskUsageResponse);
  // Flush host filesystem caches for the sandbox rootfs backing file.
  rpc SyncGuest(SyncGuestRequest) returns (SyncGuestResponse);

  // Update cgroup resource limits for a running sandbox.
  rpc UpdateCgroup(UpdateCgroupRequest) returns (UpdateCgroupResponse);

  // Clone only into a destination already prepared by sandbox-manager.
  // Cleanup removes that destination under the same node operation gate, so
  // a delayed request cannot recreate it.
  rpc CloneSandboxIntoPreparedRoot(CloneSandboxRequest) returns (CloneSandboxResponse);

  // Expose a port for inbound traffic: install DNAT rule in pod namespace.
  rpc ExposePort(ExposePortRequest) returns (ExposePortResponse);
  // Remove an exposed port's DNAT rule.
  rpc UnexposePort(UnexposePortRequest) returns (UnexposePortResponse);

  // Allow inbound traffic to a guest port (add to sandbox allowlist).
  rpc AllowPort(AllowPortRequest) returns (AllowPortResponse);
  // Deny inbound traffic to a guest port (remove from sandbox allowlist).
  rpc DenyPort(DenyPortRequest) returns (DenyPortResponse);

  // ─── Node artifact store ─────────────────────────────────────────────
  //
  // The node's root-owned store of runtime releases and guest kernels. The
  // runtime manager downloads and unpacks them unprivileged into its own
  // staging directory; node-manager copies the staged files into the store
  // only if every byte matches the catalog's pins, so the runtime manager
  // cannot publish unverified bytes. Execution never reads this separate store.
  // Root and the runtime manager only.

  // Publish the artifact staged as
  // `<staging>/<namespace>/<staging_name>/<directory>/`, where the namespace
  // is `<runtime>/releases` and `<directory>` is `v<version>` for a runtime
  // release, and `<runtime>/kernels` and `<version>` for a kernel. Changes
  // to one store root are serialized. An artifact already in the store with the
  // pinned bytes succeeds without writing. FAILED_PRECONDITION when the
  // artifact has no pins for this node's architecture or the store root is
  // unsafe; INVALID_ARGUMENT when the staged bytes are not the pinned ones.
  // Publishing does not change execution roots, aliases, or kernel staging.
  rpc PublishArtifact(PublishArtifactRequest) returns (PublishArtifactResponse);
  // Remove a managed copy whose measured digest matches the request. Every
  // managed copy is removable, including copies of image-provided versions.
  // Missing or changed files require repair (FAILED_PRECONDITION); an absent
  // artifact succeeds. Execution artifacts are outside this store.
  rpc RemoveArtifact(RemoveArtifactRequest) returns (RemoveArtifactResponse);

  // ─── Btrfs delegation ────────────────────────────────────────────────
  //
  // Privileged btrfs operations the suspend codec depends on. All run
  // inside node-manager (the privileged service in K8s + the systemd
  // direct-deploy unit), so the callers (template-manager,
  // sandbox-manager) can stay non-root with no `capabilities.add` in
  // production. Each RPC's request carries the domain identifiers
  // (template name + content_hash, sandbox_id) the privileged side
  // needs to derive canonical paths and the deterministic UUIDv5 — the
  // calling service never passes arbitrary host paths to nodemgr.

  // Create the canonical template digest dir as a btrfs subvolume at
  // the node-owned template root. Returned
  // RW so callers can write files into it before finalizing. Errors:
  // `AlreadyExists` if the path is already populated; `Internal` if
  // the `btrfs subvolume create` ioctl fails for any other reason.
  rpc BtrfsCreateTemplateSubvolume(BtrfsCreateTemplateSubvolumeRequest)
      returns (BtrfsCreateTemplateSubvolumeResponse);

  // Stamp the deterministic UUIDv5 `received_uuid` on the template
  // subvolume and toggle it RO. UUIDv5 is computed inside nodemgr from
  // `(template_name, content_hash)` — callers do not pass it — so the
  // canonical wire UUID has a single source of truth. Idempotent:
  // re-running on an already-stamped + RO subvolume is a no-op.
  rpc BtrfsFinalizeTemplateSubvolume(BtrfsFinalizeTemplateSubvolumeRequest)
      returns (BtrfsFinalizeTemplateSubvolumeResponse);

  // Subvolume-aware delete for the canonical template digest dir.
  // Clears RO if set, deletes the subvolume; falls through to
  // `remove_dir_all` for plain dirs (non-btrfs hosts / legacy installs).
  //
  // Coarse primitive: does NOT check whether sandboxes are still
  // referencing this template via `parent_uuid`. Current callers
  // (tmplmgr's PullCleanupGuard, ImportStagingGuard, hash-mismatch
  // cleanup) are all on partial / unpublished installs, where no
  // sandbox can have snapshotted the template yet. A future
  // operator-driven "delete published template" must add its own
  // usage-checking layer on top before invoking this RPC.
  rpc BtrfsDeleteTemplateSubvolume(BtrfsDeleteTemplateSubvolumeRequest)
      returns (BtrfsDeleteTemplateSubvolumeResponse);

  // Encode a sandbox's rootfs as a `btrfs send -p <template>
  // <instance.ro>` stream. Validates preconditions (template is a
  // subvolume with matching `received_uuid`, instance is a subvolume
  // with `parent_uuid` pointing at the template's UUID), takes the
  // RO snapshot in the requested snapshot destination, runs the send writing
  // `rootfs.btrfs-send` there, removes the
  // superseded `rootfs.ext4`, cleans up the RO snapshot. Errors:
  // `FailedPrecondition` for any precondition mismatch (caller can
  // retry with Full codec); `Internal` for codec failures mid-send.
  rpc BtrfsEncodeRootfsSend(BtrfsEncodeRootfsSendRequest)
      returns (BtrfsEncodeRootfsSendResponse);

  // Encode one exact read-only named snapshot as a `btrfs send -p
  // <template>` stream. Unlike BtrfsEncodeRootfsSend, this does not
  // snapshot the current live instance again: the named snapshot is the
  // immutable source, and the stream is written to a separate artifact
  // directory under the same sandbox cache root.
  rpc BtrfsEncodeSnapshotRootfsSend(BtrfsEncodeSnapshotRootfsSendRequest)
      returns (BtrfsEncodeSnapshotRootfsSendResponse);

  // Regenerate a missing send file from a retained immutable source bundle.
  // The expected source identity fences replacement of an artifact directory.
  rpc BtrfsMaterializeRootfsSend(BtrfsMaterializeRootfsSendRequest)
      returns (BtrfsEncodeRootfsSendResponse);

  // Read-only check that a retained source bundle still exists and matches
  // the expected identity, lineage, and read-only state. NOT_FOUND: the
  // artifact, the bundle, or its manifest is absent. Capture writes and syncs
  // the manifest last, before reporting the identity, so a bundle without one
  // never held a source. FAILED_PRECONDITION: it exists but is unusable. Any other
  // status, including UNIMPLEMENTED and RESOURCE_EXHAUSTED, proves nothing
  // about the artifact. The bundle stays owned by its artifact; callers that
  // act on the result must hold their own artifact fence.
  rpc BtrfsInspectSendSource(BtrfsInspectSendSourceRequest)
      returns (BtrfsInspectSendSourceResponse);

  // Volume-manager owns an independent private copy before accepting a job.
  rpc GetBtrfsSendCapabilities(GetBtrfsSendCapabilitiesRequest) returns (GetBtrfsSendCapabilitiesResponse);
  rpc BtrfsStageSendSource(BtrfsStageSendSourceRequest) returns (BtrfsSendLease);
  rpc BtrfsReadSendSource(BtrfsSendLease) returns (stream BtrfsSendChunk);
  rpc BtrfsDeleteSendSource(BtrfsSendLease) returns (BtrfsDeleteSendSourceResponse);
  rpc BtrfsListSendSources(BtrfsListSendSourcesRequest) returns (BtrfsListSendSourcesResponse);

  // Consume a `rootfs.btrfs-send` stream pulled to the sandbox's
  // local snapshot dir and reconstruct the sandbox's `instance/`
  // subvolume against the local template. Validates the local
  // template carries the matching deterministic `received_uuid`,
  // cleans up any stale `instance` / `instance.ro` left by a prior
  // attempt, runs `btrfs receive`, renames the received subvolume to
  // `instance/`, toggles RW so FC can write to it. The required target selects
  // either a stopped canonical execution or a unique restore staging scope.
  rpc BtrfsReceiveInstance(BtrfsReceiveInstanceRequest)
      returns (BtrfsReceiveInstanceResponse);

  // Subvolume-aware delete for a sandbox's `instance/` (and any stray
  // `instance.ro` from a crashed prior btrfs-send encode). Used by
  // cleanup paths in the suspend / restore handlers. The required target has
  // the same authority rules as BtrfsReceiveInstance.
  rpc BtrfsDeleteSandboxInstance(BtrfsDeleteSandboxInstanceRequest)
      returns (BtrfsDeleteSandboxInstanceResponse);

  // ─── BYOK encrypted-volume delegation ────────────────────────────────
  //
  // Privileged device-mapper operations (losetup / cryptsetup / dmsetup /
  // mount) behind the per-sandbox encrypted rootfs and encrypted data
  // volumes. They live in node-manager — the privileged daemon — so the
  // unprivileged sandbox-manager can orchestrate BYOK sandboxes without
  // root, and so volume-manager does not need a privileged deployment
  // shape. Like the btrfs delegation above, requests carry domain
  // identifiers (sandbox_id, volume_name) and node-manager derives the
  // canonical paths itself; the few caller-supplied paths (restore
  // sources, the suspend staging dir) are validated to live under the
  // calling sandbox's cache dir. node-manager resolves the sandbox's
  // volume DEK from credmgr by sandbox_id — callers never handle key
  // material.

  // Bring up (or re-open) the per-sandbox encrypted live rootfs: a
  // dm-crypt COW over a dm-snapshot whose origin is the plaintext,
  // reflink-shared template rootfs at
  // `<cache>/<sandbox_id>/instance/rootfs.ext4`, with the COW at
  // `<cache>/<sandbox_id>/instance/cow.luks`. Format-vs-open is decided
  // from on-disk state (whether the COW is already a LUKS container).
  // The returned `mapper_path` is the runtime adapter's rootfs
  // `path_on_host`. Idempotent on the sandbox. Teardown has no RPC: the
  // device stack is released by node-manager's own sandbox cleanup.
  rpc PrepareEncryptedRootfs(PrepareEncryptedRootfsRequest)
      returns (PrepareEncryptedRootfsResponse);

  // Format (fresh) or open+mount an encrypted per-sandbox data volume:
  // btrfs(compress-force=zstd) over dm-crypt, backed by
  // `<cache>/<sandbox_id>/instance/<volume_name>.luks` and mounted at
  // `<cache>/<sandbox_id>/<volume_name>-vol`. Today's only consumer is
  // the suspend snapshot capture (`volume_name="snapshot"`). Idempotent.
  rpc PrepareEncryptedVolume(PrepareEncryptedVolumeRequest)
      returns (PrepareEncryptedVolumeResponse);

  // Unmount and close an encrypted data volume, sealing its LUKS2
  // backing file, optionally staging sealed (ciphertext) artifacts out
  // of the sandbox-private `instance/` dir for the caller. Idempotent.
  rpc ReleaseEncryptedVolume(ReleaseEncryptedVolumeRequest)
      returns (ReleaseEncryptedVolumeResponse);

  // Bring up the same dm-snapshot composite as PrepareEncryptedRootfs but
  // with a PLAINTEXT COW: the shape a warm-pool member boots on before it
  // has an owner. No org exists at fill time, so no DEK can be issued and
  // no LUKS container can be formatted; the composite still routes every
  // guest write to the COW, which is what lets the COW be re-homed onto an
  // encrypted one at claim without touching the booted guest's rootfs.
  //
  // Idempotent: a live composite is handed back as-is, and a stop→start
  // re-opens the persisted COW (detected by its dm-snapshot store header)
  // rather than re-initializing it. Any mid-build failure unwinds the
  // devices it created; `cow.plain` survives on disk only once its store
  // has been activated, so its presence means "this member has committed
  // COW state".
  //
  // A member that is claimed by a non-BYOK org keeps this COW — and until
  // the claim path collapses or re-homes it, such a sandbox cannot
  // suspend or snapshot: the plaintext artifact set captures only the
  // origin file, so capturing a composite-backed sandbox would silently
  // drop every write in the COW. sbx-mgr enforces that as a
  // FAILED_PRECONDITION veto keyed on `cow.plain`'s presence.
  rpc PrepareSnapshotRootfs(PrepareSnapshotRootfsRequest)
      returns (PrepareSnapshotRootfsResponse);

}

message GetExecutionInventoryRequest {}

// A cluster-api RuntimeEnvironmentDesiredPolicy, forwarded by node-ctl.
message ClusterExecutionPolicy {
  uint64 generation = 1;
  optional string default_environment_reference = 2;
  // Allowed and deprecated environments, the default included. Narrows only
  // while default_environment_reference is set.
  repeated string executing_environment_references = 3;
  optional bool legacy_unbound_allowed = 4;
}

message ApplyExecutionPolicyRequest {
  // Absent: the cluster serves no policy, so the startup settings apply.
  optional ClusterExecutionPolicy policy = 1;
}

enum ClusterDefaultOutcome {
  CLUSTER_DEFAULT_OUTCOME_UNSPECIFIED = 0;
  // No cluster policy, or one without a default: the configured default applies.
  CLUSTER_DEFAULT_OUTCOME_UNSET = 1;
  CLUSTER_DEFAULT_OUTCOME_ADOPTED = 2;
  // This node doesn't compile or allow the cluster default.
  CLUSTER_DEFAULT_OUTCOME_NOT_ALLOWED = 3;
  // The cluster default isn't installed and verified on this node.
  CLUSTER_DEFAULT_OUTCOME_UNUSABLE = 4;
}

message ApplyExecutionPolicyResponse {
  // The policy now enforced, as GetExecutionInventory publishes it.
  space.execution.v1.ExecutionPolicyObservation enforced = 1;
  ClusterDefaultOutcome default_outcome = 2;
}

message ResolveExecutionEnvironmentRequest {
  // Highest definition schema understood, including its identity encoding.
  // Values below 2 are unsupported. This changes encoding, never selection.
  uint32 definition_schema_version = 5;
  // Omission requests the configured default. A supplied reference must match an
  // approved environment exactly; it never changes the node default.
  optional string reference = 1;
  // Mutually exclusive with reference. This read-only request selects a complete
  // binding; callers persist it and use exact admission for all effectful calls.
  // An old peer ignores this oneof. Require the matching response acknowledgement
  // before using the result as compatible selection.
  oneof compatible {
    space.execution.v1.ExecutionMetadata cold_boot_source = 3;
    space.execution.v1.ExecutionMetadata restore_source = 4;
  }
}

enum ExecutionEnvironmentSelection {
  EXECUTION_ENVIRONMENT_SELECTION_UNSPECIFIED = 0;
  EXECUTION_ENVIRONMENT_SELECTION_COLD_BOOT = 2;
  EXECUTION_ENVIRONMENT_SELECTION_RESTORE = 3;
}

message ResolveExecutionEnvironmentResponse {
  space.execution.v1.EnvironmentDefinition definition = 1;
  space.execution.v1.ExecutionMetadata execution = 2;
  ExecutionEnvironmentSelection accepted_selection = 3;
}

enum NetworkProtocol {
  NETWORK_PROTOCOL_UNSPECIFIED = 0;
  NETWORK_PROTOCOL_TCP = 1;
  NETWORK_PROTOCOL_UDP = 2;
}

enum NetworkSlotState {
  NETWORK_SLOT_STATE_UNSPECIFIED = 0;
  NETWORK_SLOT_STATE_MISSING = 1;
  NETWORK_SLOT_STATE_CREATING = 2;
  NETWORK_SLOT_STATE_READY = 3;
  NETWORK_SLOT_STATE_LEASING = 4;
  NETWORK_SLOT_STATE_LEASED = 5;
  NETWORK_SLOT_STATE_DIRTY = 6;
  NETWORK_SLOT_STATE_RESETTING = 7;
  NETWORK_SLOT_STATE_QUARANTINED = 8;
  NETWORK_SLOT_STATE_DESTROYING = 9;
}

enum NetworkSlotHealth {
  NETWORK_SLOT_HEALTH_UNSPECIFIED = 0;
  NETWORK_SLOT_HEALTH_UNKNOWN = 1;
  NETWORK_SLOT_HEALTH_HEALTHY = 2;
  NETWORK_SLOT_HEALTH_DEGRADED = 3;
  NETWORK_SLOT_HEALTH_INVALID = 4;
}

enum NetworkPoolStatus {
  NETWORK_POOL_STATUS_UNSPECIFIED = 0;
  NETWORK_POOL_STATUS_HEALTHY = 1;
  NETWORK_POOL_STATUS_DEGRADED = 2;
  NETWORK_POOL_STATUS_EMPTY = 3;
  NETWORK_POOL_STATUS_DRAINING = 4;
  NETWORK_POOL_STATUS_WARMING = 5;
}

// Persisted by the lifecycle owner before dispatch, independently of slot leases.
// Required on every execution-mutating request that carries this field.
// Missing identity is rejected even when no execution is currently bound.
// previous_id is only authority to recover an allocation whose reply was lost;
// it never authorizes Prepare or Launch against that previous execution.
message ExecutionFence {
  string execution_id = 1;
  optional string previous_id = 2;
}

message AllocateRequest {
  string sandbox_id = 1;
  // Optional: the pod's network namespace path (from CNI). When set,
  // node-manager creates the sandbox namespace as a child and bridges
  // it to the pod namespace via a veth pair + MASQUERADE.
  optional string netns_path = 2;
  // Effective runtime host cgroup memory.max needed for this new VM,
  // clamped to the node-manager's configured sandbox cgroup memory limit.
  // Required (non-zero) when the request creates a new lease.
  uint64 sandbox_cgroup_memory_mib = 3;
  ExecutionFence execution_fence = 4;
}

message AllocateResponse {
  uint32 slot = 1;
  string namespace = 2;
  string namespace_path = 3;
  string guest_ip = 4;
  string guest_gateway = 5;
  string guest_mac = 6;
  string tap_device = 7;
  uint64 slot_generation = 8;
  string slot_label = 9;
  // Slot-derived UID that owns lease-scoped host resources.
  uint32 sandbox_uid = 10;
}

message LaunchRequest {
  string sandbox_id = 1;
  string program = 2;
  repeated string args = 3;
  uint32 uid = 4;
  uint32 gid = 5;
  map<string, string> env = 6;
  ExecutionFence execution_fence = 7;
}

message LaunchResponse {
  uint32 pid = 1;
}

message ReleaseRequest {
  string sandbox_id = 1;
  bool force = 2;
  ExecutionFence execution_fence = 3;
}

message ReleaseResponse {}

message NodeResourceStatusRequest {}

enum CacheDiskAdmissionState {
  CACHE_DISK_ADMISSION_STATE_UNSPECIFIED = 0;
  CACHE_DISK_ADMISSION_STATE_READY = 1;
  CACHE_DISK_ADMISSION_STATE_WARNING = 2;
  CACHE_DISK_ADMISSION_STATE_FULL = 3;
  CACHE_DISK_ADMISSION_STATE_UNAVAILABLE = 4;
}

message CacheDiskStatus {
  // `statvfs.f_blocks * f_frsize` for `/space/cache`. This is filesystem
  // capacity, not the sum of logical bytes referenced by btrfs subvolumes.
  uint64 statvfs_total_bytes = 1;
  // `statvfs.f_bfree * f_frsize`; diagnostic only. Admission uses
  // `statvfs_available_bytes`, not `total - logical referenced bytes`.
  uint64 statvfs_free_bytes = 2;
  // `statvfs.f_bavail * f_frsize`; the conservative physical headroom signal
  // used by node-local admission before btrfs pressure checks.
  uint64 statvfs_available_bytes = 3;
  double statvfs_available_fraction = 4;
  uint64 effective_statvfs_available_bytes = 5;
  uint64 pending_reservation_bytes = 6;
  CacheDiskAdmissionState admission_state = 7;
  string admission_reason = 8;
  string admission_detail = 9;
  // Absent when `/space/cache` is not btrfs or the btrfs CLI is unavailable.
  optional uint64 btrfs_metadata_available_bytes = 10;
  // Absent when `/space/cache` is not btrfs or the btrfs CLI is unavailable.
  optional uint64 btrfs_device_unallocated_bytes = 11;
}

message NodeResourceStatusResponse {
  // Node-manager-owned resource domains live here as siblings. Add CPU,
  // memory, GPU, or future node-wide admission signals here instead of
