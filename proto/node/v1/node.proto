// ─── Btrfs delegation messages ─────────────────────────────────────────

message BtrfsCreateTemplateSubvolumeRequest {
  // Template identifiers — nodemgr derives the canonical digest dir
  // path from these. Callers do NOT pass arbitrary paths.
  string template_name = 1;
  string content_hash = 2;  // "sha256:..."
}
message BtrfsCreateTemplateSubvolumeResponse {
  // The path nodemgr created, returned for logging / sanity-checking
  // by the caller. Always derived from the request fields, never
  // attacker-controlled.
  string digest_dir = 1;
}

message BtrfsFinalizeTemplateSubvolumeRequest {
  string template_name = 1;
  string content_hash = 2;
}
message BtrfsFinalizeTemplateSubvolumeResponse {
  // The UUIDv5 nodemgr stamped, returned so the caller can log it
  // and/or correlate against the codec's restore-side check. Derived
  // canonically from (template_name, content_hash); callers can
  // recompute independently for verification.
  string received_uuid = 1;
}

message BtrfsDeleteTemplateSubvolumeRequest {
  string template_name = 1;
  string content_hash = 2;
}
message BtrfsDeleteTemplateSubvolumeResponse {}

message BtrfsEncodeRootfsSendRequest {
  // Sandbox + template identity. nodemgr derives the canonical
  // instance/, template, and snapshot dir paths from these. The
  // template_name + content_hash are also used to verify the
  // sandbox instance's lineage (parent_uuid -> template.uuid) and
  // the template's received_uuid (deterministic UUIDv5) before
  // running `btrfs send -p`.
  string sandbox_id = 1;
  string template_name = 2;
  string content_hash = 3;
  // Optional host-absolute artifact destination. Restricted to this
  // sandbox's snapshot roots; absent uses the canonical local restore dir.
  optional string dest_dir = 4;
  ExecutionFence execution_fence = 5;
  // Retain a private COW source and parent for regeneration. Old servers
  // ignore this hint and return no source identity.
  bool retain_source = 6;
  // Requires retain_source. The response's source_id acknowledges support;
  // old servers still materialize the file. stream_bytes is zero when deferred.
  bool defer_send = 7;
}
message BtrfsEncodeRootfsSendResponse {
  // Size of the produced rootfs.btrfs-send stream, returned so the
  // caller can record / log it without having to stat the file.
  uint64 stream_bytes = 1;
  optional string source_id = 2;
  // Length of the retained source's rootfs image, present when the send was
  // deferred. Callers cannot read the retained bundle, and a deferred capture
  // has no stream to measure. This is never a send-stream length.
  optional uint64 rootfs_bytes = 3;
}

message BtrfsEncodeSnapshotRootfsSendRequest {
  string sandbox_id = 1;
  string template_name = 2;
  string content_hash = 3;
  // Node-manager derives the source path under this sandbox's named-snapshot
  // root. Callers cannot supply an arbitrary source path.
  string snapshot_name = 4;
  // Host-absolute artifact destination. Restricted to this sandbox's
  // snapshot roots and required to be separate from the read-only source.
  string dest_dir = 5;
  bool retain_source = 6;
  // Requires retain_source. The response's source_id acknowledges support;
  // old servers still materialize the file. stream_bytes is zero when deferred.
  bool defer_send = 7;
}
message BtrfsEncodeSnapshotRootfsSendResponse {
  uint64 stream_bytes = 1;
  optional string source_id = 2;
  // As in BtrfsEncodeRootfsSendResponse.
  optional uint64 rootfs_bytes = 3;
}

message BtrfsMaterializeRootfsSendRequest {
  string sandbox_id = 1;
  string artifact_dir = 2;
  string source_id = 3;
}

message BtrfsInspectSendSourceRequest {
  string sandbox_id = 1;
  // Restricted to this sandbox's snapshot roots, as for materialization.
  string artifact_dir = 2;
  string source_id = 3;
}
message BtrfsInspectSendSourceResponse {
  // Length of the retained rootfs image, not of any send stream.
  uint64 rootfs_bytes = 1;
}

// A canonical instance belongs to an execution; restore staging belongs to a
// unique transfer scope. Missing targets are rejected, never defaulted.
message InstanceTarget {
  oneof target {
    ExecutionFence execution = 1;
    string restore_scope_id = 2;
  }
}

message BtrfsReceiveInstanceRequest {
  string sandbox_id = 1;
  string template_name = 2;
  string content_hash = 3;
  InstanceTarget target = 4;
}
message BtrfsReceiveInstanceResponse {}

message PrepareEncryptedRootfsRequest {
  string sandbox_id = 1;
  // Snapshot-restore path: the downloaded `cow.luks` (the suspended guest's
  // encrypted rootfs delta), staged by the restore pull into the sandbox's
  // snapshot dir. When set, node-manager reflink-copies it to the canonical
  // COW path before opening, so the reconstructed rootfs carries the
  // suspended writes. Must live under the sandbox's cache dir. Absent on a
  // fresh create and on a same-node restore (the COW was kept in place).
  optional string restore_cow_source = 2;
  ExecutionFence execution_fence = 3;
  // Disk-only restore-as-new: authenticate both key owners in the same org and
  // re-encrypt the staged COW under the target sandbox's independent key.
  EncryptedRootfsForkSource fork_source = 4;
}

message EncryptedRootfsForkSource {
  string sandbox_id = 1;
}

message PrepareEncryptedRootfsResponse {
  // /dev/mapper/<composite> for the runtime root disk.
  string mapper_path = 1;
}

message PrepareSnapshotRootfsRequest {
  string sandbox_id = 1;
  ExecutionFence execution_fence = 2;
}

message PrepareSnapshotRootfsResponse {
  // /dev/mapper/<composite> for the runtime root disk — the same shape
  // PrepareEncryptedRootfs returns, so the caller's boot path is identical.
  string mapper_path = 1;
}

message PrepareEncryptedVolumeRequest {
  string sandbox_id = 1;
  // Logical volume name, unique per sandbox (e.g. "snapshot"). Names the
  // dm-crypt mapper and the derived backing/mount paths.
  string volume_name = 2;
  // Logical size in bytes the volume should hold. The backing file is
  // sparse, so this is a ceiling, not an allocation.
  uint64 size_bytes = 3;
  // true: fresh (recreate backing + LUKS-format + empty btrfs). false: open
  // and mount an already-formatted backing file.
  bool fresh = 4;
  // Restore path: the downloaded `<volume_name>.luks`, staged by the restore
  // pull into the sandbox's snapshot dir. When set, node-manager copies it
  // to the canonical `instance/<volume_name>.luks` backing before opening —
  // mirroring `restore_cow_source` on the rootfs — so a later re-suspend
  // seals and stages the canonical path even when the restore landed on a
  // different node than the suspend. Must live under the sandbox's cache
  // dir; only valid with `fresh = false`. Absent opens the canonical
  // backing in place (same-node restore, kept by the suspend).
  optional string restore_backing_source = 6;
  ExecutionFence execution_fence = 7;
}

message PrepareEncryptedVolumeResponse {
  // Directory the decrypted btrfs filesystem is mounted at.
  string mount_dir = 1;
}

// One sealed (ciphertext) artifact to copy out of the sandbox-private
// `instance/` dir. `src_path` must live under the sandbox's cache dir;
// `dst_name` is a bare file name inside `stage_dir`.
message EncryptedVolumeStagedArtifact {
  string src_path = 1;
  string dst_name = 2;
}

message ReleaseEncryptedVolumeRequest {
  string sandbox_id = 1;
  string volume_name = 2;
  // Optional: after sealing, reflink-copy each artifact into `stage_dir`
  // (the suspend publication staging dir, under the sandbox's cache dir).
  // The artifacts are LUKS2 containers, so only ciphertext is exposed.
  // Empty `stage_dir` skips staging.
  string stage_dir = 3;
  repeated EncryptedVolumeStagedArtifact stage_artifacts = 4;
  ExecutionFence execution_fence = 5;
}

message ReleaseEncryptedVolumeResponse {}

message BtrfsDeleteSandboxInstanceRequest {
  string sandbox_id = 1;
  InstanceTarget target = 2;
}
message BtrfsDeleteSandboxInstanceResponse {}

// These node-local capabilities are restricted to volume-manager and operators.
message BtrfsStageSendSourceRequest {
  string sandbox_id = 1;
  string artifact_dir = 2;
  string source_id = 3;
  string lease_id = 4;
}
message BtrfsSendLease { string lease_id = 1; }
message BtrfsSendChunk {
  bytes data = 1;
  // A terminal frame is required, even for an empty stream. EOF alone is not
  // successful kernel-send completion. Nonterminal frames leave this absent.
  optional uint64 completed_bytes = 2;
}
message BtrfsDeleteSendSourceResponse {}
message BtrfsListSendSourcesRequest {}
message BtrfsListSendSourcesResponse { repeated string lease_ids = 1; }

message GetBtrfsSendCapabilitiesRequest {}
message GetBtrfsSendCapabilitiesResponse {
  bool supported = 1;
  // BtrfsInspectSendSource and the encode responses' rootfs_bytes are
  // available. Sandbox-manager defers a send only when both are.
  bool inspect_send_source = 2;
}

// An artifact in the node's store, named by what it is rather than where.
message NodeArtifact {
  oneof artifact {
    RuntimeReleaseArtifact runtime_release = 1;
    ComponentArtifact component = 2;
  }
}

message RuntimeReleaseArtifact {
  space.execution.v1.RuntimeKind runtime_kind = 1;
  // The release, such as 1.16.2.
  string version = 2;
  string digest = 3;
}

message ComponentArtifact {
  space.execution.v1.ArtifactComponentKind kind = 1;
  // Adapter metadata used to locate the local slot. Never sufficient identity.
  string version = 2;
  // sha256:<hex>; publication requires independent catalog authorization,
  // removal checks the stored bytes under the root lock.
  string digest = 3;
}

message PublishArtifactRequest {
  NodeArtifact artifact = 1;
  // The staging directory the runtime manager prepared: one path component.
  string staging_name = 2;
}

message PublishArtifactResponse {
  // The artifact's directory in the store.
  string path = 1;
  // sha256:<hex> of a kernel image, or over a release's binaries.
  string digest = 2;
  // The pinned artifact was already in the store; nothing was written.
  bool already_present = 3;
}

message RemoveArtifactRequest {
  NodeArtifact artifact = 1;
}

message RemoveArtifactResponse {
  // False when the artifact was not in the store.
  bool removed = 1;
}

// State of a resident VM. Missing or unreadable control state is an RPC error,
// never evidence that a VM has stopped.
enum VmState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_NOT_STARTED = 1;
  VM_STATE_RUNNING = 2;
  VM_STATE_PAUSED = 3;
  // The runtime reports that the VM has shut down. This does not certify a
  // graceful guest shutdown, VMM process exit, or release of sandbox resources.
  VM_STATE_SHUTDOWN = 4;
}
message GetVmStateRequest { string sandbox_id = 1; }
message GetVmStateResponse { VmState state = 1; }

// Names belong to the runtime's qualified state profile, not to this protocol.
// A profile may require one file or several. Adapters reject missing, duplicate
// or unknown names before any side effect. Paths retain the existing canonical
// snapshot-root and relative-path validation; they never grant host access.
message VmStateArtifact {
  string name = 1;
  string relative_path = 2;
}

// Existing node-owned storage locators shared by capture and restore. The node
// validates these against the sandbox's canonical snapshot/volume roots.
message VmStateStorage {
  optional string directory = 1;
  optional string encrypted_volume_mount = 2;
}
message CaptureVmStateRequest {
  string sandbox_id = 1;
  optional string environment_reference = 2;
  repeated VmStateArtifact artifacts = 3;
  VmStateStorage storage = 4;
  ExecutionFence execution_fence = 5;
}
message CaptureVmStateResponse {}
message RestoreVmStateRequest {
  string sandbox_id = 1;
  repeated VmStateArtifact artifacts = 2;
  VmStateStorage storage = 3;
  ExecutionFence execution_fence = 4;
  DriveRateLimit rootfs_rate_limit = 5;
}
message RestoreVmStateResponse {}


// All guest channels derive endpoints from the execution-owned lease.
message RequestGuestShutdownRequest {
  string sandbox_id = 1;
  ExecutionFence execution_fence = 2;
}
message RequestGuestShutdownResponse {}
message ProbeGuestServiceRequest {
  string sandbox_id = 1;
  ExecutionFence execution_fence = 2;
  uint32 port = 3;
}
message ProbeGuestServiceResponse { bool reachable = 1; }
message GuestSerialEndpoint {}
message GuestChannelSelector {
  string sandbox_id = 1;
  ExecutionFence execution_fence = 2;
  oneof endpoint {
    GuestSerialEndpoint serial = 3;
    uint32 guest_tcp_port = 4;
  }
}
message OpenGuestChannelRequest {
  oneof frame {
    GuestChannelSelector selector = 1;
    bytes data = 2;
  }
}
message OpenGuestChannelResponse { bytes data = 1; }
