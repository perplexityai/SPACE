message ResumeRequest {
  // Optional cluster policy installed before thawing the fenced execution.
  // Requires activation-policy capability; omission preserves existing policy.
  optional AutoLifecyclePolicy activation_auto_lifecycle = 4;
  // With activation_auto_lifecycle, match this generation before changing policy.
  // Omission matches only a resident with no generation, never any generation.
  optional int64 expected_execution_generation = 5;
  string sandbox_id = 1;
  bool blocking = 2;  // If true, block until guest health check passes
  optional uint32 ready_timeout_secs = 3;
}
message ResumeResponse {
  optional space.net.gateway.v1.SpaceApiRouteIdentity route_identity = 1;
}
message WakeRequest {
  string sandbox_id = 1;
  bool blocking = 2;          // If true, wait until sandbox is ready for guest access
  optional WakeStartContext start_context = 3; // Internal-only launch context for node-local recovery paths
  // Target lifecycle state for the wake. Unspecified → STARTED
  // (back-compat default). PAUSED is used by the cluster-controller's
  // lifecycle-preserving drain evacuation: it restores the VM from a
  // suspend snapshot but leaves it in the paused state instead of
  // issuing the post-load resume — preserving the user-visible
  // `paused` lifecycle without an additional pause RPC after wake.
  // STOPPED is the same evacuation for a `stopped` resident: it stages the
  // disk artifact and returns with the sandbox still stopped, without
  // waking anything.
  WakeTargetState target_state = 4;
  // Unspecified is explicit operator wake. Access/command wakes must honor the
  // worker's effective policy under wake exclusion. Requires blocking STARTED.
  AutoLifecycleWakeSource implicit_wake_source = 5;
  // Internal-only. Wake a stopped or suspended sandbox by the runtime upgrade
  // `UpgradeRuntime` performs, booting the cold start this Wake would run
  // under `target_environment`, instead of starting or restoring it on the
  // environment it last ran under. Requires `start_context` and blocking
  // STARTED; an implicit wake is admitted by the sandbox's wake policy first,
  // as for a start or restore. A sandbox absent from this node is first
  // staged from its suspend checkpoint, never launched from it. When the
  // upgrade finds the sandbox already on the target, the Wake proceeds as
  // without this field. A sandbox-manager that predates the field ignores it
  // and wakes normally, where execution policy then refuses a blocked runtime.
  optional WakeRuntimeUpgrade runtime_upgrade = 6;
}

// The runtime upgrade a Wake runs; see `WakeRequest.runtime_upgrade` and
// `UpgradeRuntimeRequest`, whose fields these are.
message WakeRuntimeUpgrade {
  // Caller-chosen UUID naming this upgrade. Retries reuse it.
  string operation_id = 1;
  string target_environment = 2;
  RuntimeUpgradeAuthorization authorization = 3;
  // For a suspended sandbox, the local artifact of the checkpoint the
  // control plane decided the upgrade from. The node upgrades only a row
  // whose current local artifact is that checkpoint, and refuses a stale copy
  // the restore would have replaced. Required for a suspended sandbox; a
  // stopped one has no checkpoint to name.
  optional string checkpoint_local_artifact_id = 4;
}
// Target lifecycle state for a Wake / WakeSandbox call. UNSPECIFIED is
// treated as STARTED to preserve the historical behavior of the API.
enum WakeTargetState {
  WAKE_TARGET_STATE_UNSPECIFIED = 0;
  WAKE_TARGET_STATE_STARTED = 1;
  WAKE_TARGET_STATE_PAUSED = 2;
  // Materialize an evacuated `stopped` sandbox on this node and leave it
  // stopped. The request must carry the exact storage URI of a `stop`-origin
  // DISK artifact belonging to this same sandbox id; the node stages the
  // rootfs, pins the artifact on the local row, and returns. No runtime process
  // is created: booting a microVM only to stop it again would run the
  // guest's init and mutate the rootfs a stopped sandbox is meant to keep
  // inert.
  //
  // A sandbox-manager that predates this value rejects it as an unknown
  // target_state with INVALID_ARGUMENT before any mutation, so a mixed fleet
  // fails closed without pulling the rootfs.
  WAKE_TARGET_STATE_STOPPED = 3;
}
message WakeStartContext {
  optional uint32 vcpu = 1;
  optional uint32 memory_mib = 2; // Guest RAM in MiB
  optional string netns_path = 3;
  optional string suspend_restore_storage_uri = 4;
  optional string suspend_restore_source_node = 5;
  optional space.net.gateway.v1.SpaceApiRouteIdentity route_identity = 10;
  // Control-plane lifecycle lease, not a route authorization dimension.
  // Omitted by legacy callers; receipts then retain their legacy route-ID owner.
  optional string operation_activation_attempt_id = 11;
  // Same activation contract as StartRequest.activation_auto_lifecycle.
  optional AutoLifecyclePolicy activation_auto_lifecycle = 12;
  // Resident-resume fence only; never authority for a fresh activation.
  // Requires activation_auto_lifecycle. Absent matches only a legacy resident.
  optional int64 expected_execution_generation = 13;
  // Required with `target_state = STOPPED`; see
  // `StartRequest.expected_local_artifact_id`, which this is forwarded to.
  optional string expected_local_artifact_id = 14;
}
message WakeResponse {
  string sandbox_id = 1;
  WakeTransition transition = 2;
  optional space.net.gateway.v1.SpaceApiRouteIdentity route_identity = 3;
}

