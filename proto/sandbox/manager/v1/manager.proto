// Codec for the rootfs artifact a suspend snapshot writes to object
// storage. Per-request opt-in: callers stay on `UNSPECIFIED` (which
// the handler maps to `FULL`) unless they specifically want a
// different payload shape. Existing snapshots in object storage are
// all `FULL`; backwards compatibility for restoring them is required
// forever.
enum SuspendSnapshotFormat {
  // Default. Handler routes to `FULL`.
  SUSPEND_SNAPSHOT_FORMAT_UNSPECIFIED = 0;
  // Full `rootfs.ext4` image written to object storage. The historical
  // shape; the only codec used by legacy snapshots already in storage.
  SUSPEND_SNAPSHOT_FORMAT_FULL = 1;
  // `btrfs send -p <template_subvol> <instance_ro_snap>` stream
  // (`rootfs.btrfs-send` on the wire). Requires the sandbox `instance`
  // to be a btrfs subvolume snapshot of the local template subvolume
  // (Parent UUID set) and the template's `received_uuid` to match the
  // deterministic `UUIDv5(SPACE_TEMPLATE_RECEIVED_UUID_NS, name@hash)`
  // value so the stream is portable across nodes. If those
  // preconditions don't hold the handler rejects the request with
  // `FAILED_PRECONDITION`; the caller can retry with `FULL`.
  SUSPEND_SNAPSHOT_FORMAT_BTRFS_SEND = 2;
}

message SuspendRequest {
  string sandbox_id = 1;
  bool blocking = 2;             // If true, wait until state is suspended
  // Rootfs codec for the snapshot. `UNSPECIFIED` (the default) maps to
  // `FULL` for backwards compatibility — existing API-substrate callers
  // and legacy clients land here, and behave exactly as they did before
  // any btrfs-send work shipped.
  SuspendSnapshotFormat format = 4;
}

