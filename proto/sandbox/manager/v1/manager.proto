enum TeardownSuspendAction {
  TEARDOWN_SUSPEND_ACTION_UNSPECIFIED = 0;
  // Idempotently begin or rejoin the execution's planned suspend. A PENDING
  // response does not prove that the operation was durably journaled, so a
  // caller seeking release must retry BEGIN_OR_JOIN until a terminal outcome.
  TEARDOWN_SUSPEND_ACTION_BEGIN_OR_JOIN = 1;
  // Observe or reattach only to an operation that is already journaled. This
  // action never starts a missing operation.
  TEARDOWN_SUSPEND_ACTION_OBSERVE_ONLY = 2;
}

enum TeardownSuspendOutcome {
  TEARDOWN_SUSPEND_OUTCOME_UNSPECIFIED = 0;
  // Teardown is not yet safe. The caller must leave the task and sandbox intact.
  TEARDOWN_SUSPEND_OUTCOME_PENDING = 1;
  // This execution has a remotely ready suspend artifact.
  TEARDOWN_SUSPEND_OUTCOME_DURABLE = 2;
  // This execution no longer owns local runtime resources: a newer execution
  // owns them, or generation-fenced stop or activation rollback conclusively retired
  // them. The task must detach without deleting the sandbox or its filesystem.
  TEARDOWN_SUSPEND_OUTCOME_SUPERSEDED = 3;
  // A generation-fenced local delete committed for this execution or a newer
  // one. The task may detach without creating a suspend artifact.
  TEARDOWN_SUSPEND_OUTCOME_DELETED = 4;
}

message PrepareTeardownSuspendRequest {
  string sandbox_id = 1;
  // Monotonic execution identity supplied by the execution owner. The node
  // uses it only as a local lease; it does not query the control plane.
  int64 execution_generation = 2;
  TeardownSuspendAction action = 3;
}

message PrepareTeardownSuspendResponse {
  TeardownSuspendOutcome outcome = 1;
  optional string reason = 2;
  // Present only with DURABLE. Identifies the exact artifact published for
  // the requested execution generation.
  optional PublishedArtifact published_artifact = 3;
}
message RestoreArtifactAsNewContext {
  string source_sandbox_id = 1;
  string artifact_snapshot_id = 2;
  string target_owner = 3;
  // The requested kind must match snapshot metadata. DISK is implemented now;
  // FULL is part of the stable transport but fails as unimplemented.
  ArtifactKind artifact_kind = 4;
  // Effective immutable assignment for the target sandbox. Older shims omit
  // these fields, in which case the restored snapshot's assignment is kept.
  optional uint64 disk_io_max_operations_per_sec = 5;
  optional uint64 disk_io_max_bandwidth_mib_per_sec = 6;
  // Immutable target assignment. Artifact metadata must match it before any
  // restore files or node-local sandbox state are published.
  bool volume_encryption = 7;
}

message AutoLifecycleDeleteReceipt {
  string receipt_id = 1;
  string sandbox_id = 2;
  int64 execution_generation = 3;
  string route_activation_id = 4;
  string auto_lifecycle_policy_fingerprint = 5;
}

message ListAutoLifecycleDeleteReceiptsRequest {}

message ListAutoLifecycleDeleteReceiptsResponse {
  repeated AutoLifecycleDeleteReceipt receipts = 1;
}

message AcknowledgeAutoLifecycleDeleteReceiptsRequest {
  repeated string receipt_ids = 1;
}

message AcknowledgeAutoLifecycleDeleteReceiptsResponse {
  repeated string acknowledged_receipt_ids = 1;
}

// A sandbox's current lifecycle artifact with no `backup_completed_at`
// stamp. `local_artifacts` lets stop-, suspend- and snapshot-origin
// artifacts coexist for one sandbox; only the artifact the sandbox row
// currently pins appears here, so there is at most one entry per sandbox.
//
// `node/api/v1/cluster.proto` carries this same message up to the control
// plane inside `PendingLocalBackupReport`, so the node never re-encodes an
// artifact identity between the two hops. Identity is the
// `local_artifact_id` / `artifact_kind` pair that `snapshots` rows carry
// (Postgres migration 079).
message PendingLocalBackup {
  string sandbox_id = 1;
  string local_artifact_id = 2;
  ArtifactKind artifact_kind = 3;
}

message ListPendingLocalBackupsRequest {}

message ListPendingLocalBackupsResponse {
  repeated PendingLocalBackup pending = 1;
}

// Node-local facts about the current legacy quarantine-recovery episode.
// Consumers must not treat this observation as recovery authority.
enum QuarantineRecoveryObservedOwner {
  QUARANTINE_RECOVERY_OBSERVED_OWNER_UNSPECIFIED = 0;
  QUARANTINE_RECOVERY_OBSERVED_OWNER_LEGACY_RECOVERY = 1;
}

message QuarantineRecoveryObservation {
  // Positive versions preserve the meaning of existing fields and extend this
  // message additively; consumers read the fields they know.
  uint32 schema_version = 1;
  string local_quarantine_id = 2;
  QuarantineRecoveryObservedOwner observed_owner = 3;
  uint32 attempt_count = 4;
  optional google.protobuf.Timestamp next_attempt_at = 5;
  // The worker could not decode this observation. Consumers preserve the last
  // valid quarantine-recovery subdocument while accepting unrelated state.
  bool degraded = 6;
}

