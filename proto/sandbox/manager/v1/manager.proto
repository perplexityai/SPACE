syntax = "proto3";
package space.sandbox.manager.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "execution/v1/execution.proto";
import "net/gateway/v1/gateway.proto";
import "net/policy/v1/policy.proto";
import "spaced/operations/v1/operations.proto";

service SandboxManager {
  // Advisory readiness only. The environment input also fails closed on old readers.
  rpc GetExecutionCapabilities(GetExecutionCapabilitiesRequest) returns (GetExecutionCapabilitiesResponse);

  // Create a new sandbox (allocate resources, prepare filesystem) without starting the VM.
  rpc Create(CreateRequest) returns (CreateResponse);

  // Start a sandbox: fresh boot, or restore from checkpoint/suspend state.
  rpc Start(StartRequest) returns (StartResponse);

  // Stop sandboxes (SIGTERM + grace period + SIGKILL, then cleanup).
  rpc Stop(StopRequest) returns (StopResponse);

  // Send a signal to a sandbox's VM process, then cleanup.
  rpc Kill(KillRequest) returns (KillResponse);

  // Delete sandboxes by ID prefix, optional template filter, or all.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Query deeper state for one or more sandboxes.
  rpc State(StateRequest) returns (StateResponse);

  // Return cached node-local component health for one sandbox. This RPC never
  // performs probes; the background health monitor owns observation cadence.
  rpc GetSandboxHealth(GetSandboxHealthRequest) returns (GetSandboxHealthResponse);

  // Return node-local sandbox env projection for SPACE-controlled entrypoints.
  rpc GetEnv(GetEnvRequest) returns (GetEnvResponse);

  // Page through sandboxes with cheap inventory information, in sandbox-ID
  // order. Every sandbox present for the whole scan appears exactly once; one
  // created or deleted during the scan may or may not appear, as if the scan
  // had finished before or started after that change.
  rpc List(ListRequest) returns (ListResponse);

  // Bounded operator discovery, including rowless cache directories. This is
  // not a snapshot or mutation authority: concurrent changes may be omitted or
  // repeated, and each exact-ID mutation rechecks its own ownership. A failed
  // stream is incomplete, never permission to treat unseen sandboxes as absent.
  rpc ScanCleanupTargets(ScanCleanupTargetsRequest) returns (stream CleanupTargetBatch);

  // List every sandbox — regardless of owner — whose state still holds a
  // parent-referencing instance subvolume, so template-manager can protect
  // the parent template build from on-node GC and manual deletion. Unlike
  // List, this deliberately does NOT apply the template-manager-owner filter:
  // an adopted pool sandbox becomes user-owned (pool_template cleared, owner
  // set to the platform user) yet its instance subvolume still references the
  // parent build for incremental suspend/restore. State scoping excludes rows
  // whose instance subvolume is already being torn down. Read-only.
  rpc ListBuildReferencingSandboxes(ListBuildReferencingSandboxesRequest) returns (ListBuildReferencingSandboxesResponse);

  // Return btrfs disk usage for explicitly requested sandboxes.
  rpc GetDiskUsage(GetDiskUsageRequest) returns (GetDiskUsageResponse);

  // Clean up dead sandboxes and orphaned network allocations.
  rpc Cleanup(CleanupRequest) returns (CleanupResponse);

  // List available templates.
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);

  // Pause a running sandbox (freeze vCPUs, process stays alive).
  rpc Pause(PauseRequest) returns (PauseResponse);

  // Resume a paused sandbox (thaw vCPUs).
  rpc Resume(ResumeRequest) returns (ResumeResponse);

  // Wake a sandbox from any dormant state for guest-facing access.
  rpc Wake(WakeRequest) returns (WakeResponse);

  // Create a snapshot of a sandbox (disk-only or full VM state).
  // For full: pause + FC snapshot + full memory file + resume.
  // For disk: btrfs subvolume snapshot (instant CoW).
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);

  // Internal: observe app startup before template-manager pauses a base-snapshot VM.
  // Required app failures reject preparation; best-effort failures return warnings.
  rpc WaitTemplateApps(WaitTemplateAppsRequest) returns (WaitTemplateAppsResponse);

  // Internal: create a template base snapshot for a template-owned sandbox.
  // Produces template artifacts snapshot.base + vmstate.base.
  rpc CreateTemplateBaseSnapshot(CreateTemplateBaseSnapshotRequest) returns (CreateTemplateBaseSnapshotResponse);

  // Suspend a sandbox (FC vmstate + full memory snapshot + stop, frees resources).
  rpc Suspend(SuspendRequest) returns (SuspendResponse);

  // Start, join, or observe the durable suspend that gates container-runtime
  // teardown. Safe-to-release is reported only for the request's node-local
  // execution lease after the remote artifact is registered ready.
  rpc PrepareTeardownSuspend(PrepareTeardownSuspendRequest) returns (PrepareTeardownSuspendResponse);

  // Enqueue durable backup of a local artifact, adopting an unpinned
  // suspended snapshot when CurrentInstance is requested.
  rpc EnqueueArtifactBackup(EnqueueArtifactBackupRequest) returns (EnqueueArtifactBackupResponse);

  // Remove the entire local presence (wake-cache snapshot, instance
  // rootfs, node-local DB rows) of a suspended sandbox whose cluster row
  // no longer exists. Callers must have an authoritative cluster signal
  // that the sandbox was deleted; the handler enforces that the local row
  // is still `suspended` and quiescent before tearing down.
  rpc EvictClusterDeletedSandbox(EvictClusterDeletedSandboxRequest) returns (EvictClusterDeletedSandboxResponse);

  // Internal-only: move a stopped or suspended sandbox with a local disk to
  // another execution environment by cold boot. Fences every other activation,
  // keeps the old disk/checkpoint pair until the boot is verified, then retires
  // the old checkpoint. Files survive; memory and processes don't. A failed
  // boot restores the old pair and releases the fence. Idempotent per
  // `operation_id`: a retry resumes or settles the same upgrade. A rolled-back
  // upgrade leaves no row behind, so a retry after it starts over.
  rpc UpgradeRuntime(UpgradeRuntimeRequest) returns (UpgradeRuntimeResponse);

  // Enable rolling btrfs snapshots for a sandbox.
  rpc EnableSnapshots(EnableSnapshotsRequest) returns (EnableSnapshotsResponse);

  // Disable rolling btrfs snapshots for a sandbox.
  rpc DisableSnapshots(DisableSnapshotsRequest) returns (DisableSnapshotsResponse);

  // List available btrfs snapshots for a sandbox.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

  // Delete one or all btrfs snapshots for a sandbox.
  //
  // By name, a snapshot whose local artifact is pinned, checked out, still
  // being deleted, shares its path with another artifact, or records another
  // path answers FAILED_PRECONDITION and keeps its bytes; one whose artifact
  // record cannot be read answers INTERNAL. A failed byte delete answers
  // INTERNAL "delete snapshot failed", whatever node-manager's status. With
  // `all`, each such snapshot is kept, left out of `deleted`, and the rest are
  // still deleted; a failed byte delete fails the request with node-manager's
  // status.
  rpc DeleteSnapshots(DeleteSnapshotsRequest) returns (DeleteSnapshotsResponse);

  // Roll back a sandbox's filesystem to a previous snapshot.
  rpc Rollback(RollbackRequest) returns (RollbackResponse);

  // Return cgroup resource usage stats for a sandbox.
  rpc Stats(StatsRequest) returns (StatsResponse);

  // Update resource limits (cgroup) for a running sandbox.
  rpc Update(UpdateRequest) returns (UpdateResponse);

  // Set or replace the resolved auto lifecycle policy for a sandbox.
  rpc SetAutoLifecyclePolicy(SetAutoLifecyclePolicyRequest) returns (SetAutoLifecyclePolicyResponse);

  // Record auto-lifecycle activity without changing policy or sandbox power state.
  rpc TouchAutoLifecycle(TouchAutoLifecycleRequest) returns (TouchAutoLifecycleResponse);

  // Return a bounded batch of durable cluster auto-delete completions. Listing
  // records delivery attempts but never removes evidence.
  rpc ListAutoLifecycleDeleteReceipts(ListAutoLifecycleDeleteReceiptsRequest) returns (ListAutoLifecycleDeleteReceiptsResponse);

  // Remove exactly the completed receipts already acknowledged by the cluster.
  rpc AcknowledgeAutoLifecycleDeleteReceipts(AcknowledgeAutoLifecycleDeleteReceiptsRequest) returns (AcknowledgeAutoLifecycleDeleteReceiptsResponse);

  // Report every sandbox whose current lifecycle artifact this node cannot
  // prove is backed up.
  //
  // Unpaged, and the bound is every pinned artifact carrying no local
  // backup marker: backups in flight, backups whose upload gave up
  // permanently, restores whose marker has not been recovered, and the
  // rare pin whose artifact row is missing or belongs to another sandbox.
  // Wider than the in-flight count, then, and still nothing like the
  // node's artifact history, which is the set this replaces as a drain
  // driver.
  //
  // The response is all-or-nothing — a row this node cannot decode fails
  // the call rather than silently shrinking the set, because a caller
  // cannot distinguish a short answer from a complete one.
  rpc ListPendingLocalBackups(ListPendingLocalBackupsRequest) returns (ListPendingLocalBackupsResponse);

  // Get the resolved effective network policy for a sandbox.
  rpc GetNetworkPolicy(GetNetworkPolicyRequest) returns (GetNetworkPolicyResponse);

  // Apply a sandbox's desired network policy on the node.
  rpc SetNetworkPolicy(SetNetworkPolicyRequest) returns (SetNetworkPolicyResponse);

  // Notify sbx-manager that a template's network policy changed on this node.
  rpc TemplateNetworkPolicyUpdated(TemplateNetworkPolicyUpdatedRequest) returns (TemplateNetworkPolicyUpdatedResponse);

  // Deliberately cycle (kill + relaunch in place) one sandbox's net-gateway
  // sidecar while the VM keeps running. Gateways keep their
  // launch-time binary until cycled, so this is the operator path for
  // retiring gateways left running a pre-deploy binary. Synchronous and
  // single-sandbox; batching, rate-limiting, and dry-run live in the caller
  // (`space-sbxmgr cycle-net-gateway`). In-flight guest connections through
  // the old gateway drop; the relaunched gateway re-binds fresh TPROXY
  // sockets in the persistent sandbox netns and a policy reconcile is
  // enqueued to re-hydrate it.
  rpc CycleNetGateway(CycleNetGatewayRequest) returns (CycleNetGatewayResponse);

  // ── Spaced guest operations ───────────────────────────────────────────────

  rpc SpacedPingGuest(SpacedPingGuestRequest) returns (SpacedPingGuestResponse);
  rpc SpacedGetStatus(SpacedGetStatusRequest) returns (SpacedGetStatusResponse);
  rpc SpacedWaitReady(SpacedWaitReadyRequest) returns (SpacedWaitReadyResponse);

  rpc SpacedStat(SpacedStatRequest) returns (space.spaced.operations.v1.StatResponse);
  rpc SpacedList(SpacedListRequest) returns (stream space.spaced.operations.v1.FileInfo);
  rpc SpacedRead(SpacedReadRequest) returns (stream space.spaced.operations.v1.FileChunk);
  rpc SpacedWrite(stream SpacedWriteRequest) returns (space.spaced.operations.v1.WriteResponse);
  rpc SpacedWriteBatch(SpacedWriteBatchRequest) returns (space.spaced.operations.v1.WriteBatchResponse);
  rpc SpacedMkdir(SpacedMkdirRequest) returns (space.spaced.operations.v1.MkdirResponse);
  rpc SpacedRemove(SpacedRemoveRequest) returns (space.spaced.operations.v1.RemoveResponse);
  rpc SpacedRename(SpacedRenameRequest) returns (space.spaced.operations.v1.RenameResponse);
  rpc SpacedNormalizeWatchRoot(SpacedNormalizeWatchRootRequest) returns (space.spaced.operations.v1.NormalizeWatchRootResponse);
  rpc SpacedWatch(SpacedWatchRequest) returns (stream space.spaced.operations.v1.FileEvent);
  rpc SpacedCreateWatcher(SpacedCreateWatcherRequest) returns (space.spaced.operations.v1.CreateWatcherResponse);
  rpc SpacedGetWatcherEvents(SpacedGetWatcherEventsRequest) returns (space.spaced.operations.v1.GetWatcherEventsResponse);
  rpc SpacedRemoveWatcher(SpacedRemoveWatcherRequest) returns (space.spaced.operations.v1.RemoveWatcherResponse);
  rpc SpacedEnableFileChanges(SpacedEnableFileChangesRequest) returns (space.spaced.operations.v1.EnableFileChangesResponse);
  rpc SpacedDisableFileChanges(SpacedDisableFileChangesRequest) returns (space.spaced.operations.v1.DisableFileChangesResponse);
  rpc SpacedGetModifiedFiles(SpacedGetModifiedFilesRequest) returns (space.spaced.operations.v1.GetModifiedFilesResponse);

  rpc SpacedStartProcess(SpacedStartProcessRequest) returns (stream space.spaced.operations.v1.ProcessEvent);
  rpc SpacedConnectProcess(SpacedConnectProcessRequest) returns (stream space.spaced.operations.v1.ProcessEvent);
  rpc SpacedListProcesses(SpacedListProcessesRequest) returns (SpacedListProcessesResponse);
  rpc SpacedSendSignal(SpacedSendSignalRequest) returns (space.spaced.operations.v1.SendSignalResponse);
  rpc SpacedSendInput(SpacedSendInputRequest) returns (space.spaced.operations.v1.SendInputResponse);
  rpc SpacedCloseStdin(SpacedCloseStdinRequest) returns (space.spaced.operations.v1.CloseStdinResponse);
  rpc SpacedResizePty(SpacedResizePtyRequest) returns (space.spaced.operations.v1.ResizePtyResponse);
  rpc SpacedKillProcess(SpacedKillProcessRequest) returns (space.spaced.operations.v1.KillResponse);

  // Open / close the in-VM loopback bridge for an explicitly authorized port.
  // Forwards to spaced-host-svc (and through it, to spaced-guest-svc); the
  // host-side firewall path (`expose_port` + `allow_port` on node-mgr) must
  // be installed independently — these RPCs only manage the in-VM side.
  rpc SpacedOpenLoopbackBridge(SpacedOpenLoopbackBridgeRequest) returns (space.spaced.operations.v1.OpenLoopbackBridgeResponse);
  rpc SpacedCloseLoopbackBridge(SpacedCloseLoopbackBridgeRequest) returns (space.spaced.operations.v1.CloseLoopbackBridgeResponse);
  rpc ServicePortIngress(stream space.net.gateway.v1.ServicePortIngressFrame) returns (stream space.net.gateway.v1.ServicePortIngressFrame);

  // Internal: find a paused pool sandbox, reassign to user, resume it.
  rpc AdoptPoolSandbox(AdoptPoolSandboxRequest) returns (AdoptPoolSandboxResponse);

  // Wait for stopped, failed, cleanup_failed, suspended, or quarantined, or time out.
  // Quarantine completes the wait without implying that runtime or files were removed.
  rpc Wait(WaitRequest) returns (WaitResponse);

  // Clone a paused donor sandbox to create a new sandbox (for pool cloning).
  rpc CloneFromDonor(CloneFromDonorRequest) returns (CloneFromDonorResponse);

  // ── Snapshot transfer ──────────────────────────────────────────────────────

  // Export a sandbox snapshot for cross-node resume or external persistence.
  rpc ExportSnapshot(ExportSnapshotRequest) returns (stream ExportSnapshotChunk);

  // Import a snapshot bundle from another node or external storage.
  rpc ImportSnapshot(stream ImportSnapshotRequest) returns (ImportSnapshotResponse);

  // ── Sandbox rootfs transfer ───────────────────────────────────────────────

  // Export a sandbox's rootfs (instance directory) for cross-node migration.
  rpc ExportSandbox(ExportSandboxRequest) returns (stream ExportSandboxChunk);

  // Import a sandbox rootfs from another node or external storage.
  rpc ImportSandbox(stream ImportSandboxRequest) returns (ImportSandboxResponse);

  // Internal: resolve the effective sandbox memory policy for this node.
  rpc ResolveSandboxMemory(ResolveSandboxMemoryRequest) returns (ResolveSandboxMemoryResponse);
}

enum BootMode {
  BOOT_MODE_UNSPECIFIED = 0;
  BOOT_MODE_COLD = 1;          // Fresh boot from template
  BOOT_MODE_BASE_SNAPSHOT = 2; // Warm boot from base memory snapshot
  BOOT_MODE_POOL = 3;          // Adopt from pre-warmed pool
}

enum AutoLifecycleIdleAction {
  AUTO_LIFECYCLE_IDLE_ACTION_UNSPECIFIED = 0;
  AUTO_LIFECYCLE_IDLE_ACTION_NONE = 1;
  AUTO_LIFECYCLE_IDLE_ACTION_PAUSE = 2;
  AUTO_LIFECYCLE_IDLE_ACTION_SUSPEND = 3;
  AUTO_LIFECYCLE_IDLE_ACTION_STOP = 4;
  AUTO_LIFECYCLE_IDLE_ACTION_DELETE = 5;
}

enum AutoLifecycleWakeSource {
  AUTO_LIFECYCLE_WAKE_SOURCE_UNSPECIFIED = 0;
  AUTO_LIFECYCLE_WAKE_SOURCE_ACCESS = 1;
  AUTO_LIFECYCLE_WAKE_SOURCE_COMMAND = 2;
}

enum AutoLifecycleConditionKind {
  AUTO_LIFECYCLE_CONDITION_KIND_UNSPECIFIED = 0;
  AUTO_LIFECYCLE_CONDITION_KIND_INACTIVITY = 1;
  AUTO_LIFECYCLE_CONDITION_KIND_GUEST_ACTIVITY = 2;
}

enum AutoLifecycleActivitySource {
  AUTO_LIFECYCLE_ACTIVITY_SOURCE_UNSPECIFIED = 0;
  AUTO_LIFECYCLE_ACTIVITY_SOURCE_ACCESS = 1;
  AUTO_LIFECYCLE_ACTIVITY_SOURCE_COMMAND = 2;
}

enum AutoLifecycleTouchResult {
  AUTO_LIFECYCLE_TOUCH_RESULT_UNSPECIFIED = 0;
  AUTO_LIFECYCLE_TOUCH_RESULT_APPLIED = 1;
  AUTO_LIFECYCLE_TOUCH_RESULT_ALREADY_CURRENT = 2;
  AUTO_LIFECYCLE_TOUCH_RESULT_DISABLED = 3;
  AUTO_LIFECYCLE_TOUCH_RESULT_NOT_STARTED = 4;
}

enum AutoLifecycleConditionSetId {
  AUTO_LIFECYCLE_CONDITION_SET_ID_UNSPECIFIED = 0;
  AUTO_LIFECYCLE_CONDITION_SET_ID_ACCESS_IDLE = 1;
  AUTO_LIFECYCLE_CONDITION_SET_ID_COMMAND_IDLE = 2;
  AUTO_LIFECYCLE_CONDITION_SET_ID_GUEST_ACTIVITY = 3;
}

enum AutoLifecycleTransition {
  AUTO_LIFECYCLE_TRANSITION_UNSPECIFIED = 0;
  AUTO_LIFECYCLE_TRANSITION_NOOP = 1;
  AUTO_LIFECYCLE_TRANSITION_PAUSE = 2;
  AUTO_LIFECYCLE_TRANSITION_SUSPEND = 3;
  AUTO_LIFECYCLE_TRANSITION_STOP = 4;
  AUTO_LIFECYCLE_TRANSITION_DELETE = 5;
}

enum WakeTransition {
  WAKE_TRANSITION_UNSPECIFIED = 0;
  WAKE_TRANSITION_NOOP = 1;
  WAKE_TRANSITION_RESUME = 2;
  WAKE_TRANSITION_RESTORE = 3;
  WAKE_TRANSITION_START = 4;
  // Wake observed an in-flight transient lifecycle transition, waited for it to
  // settle, and then returned without issuing resume/restore/start itself.
  WAKE_TRANSITION_WAIT = 5;
}

message AutoLifecycleWakePolicy {
  repeated AutoLifecycleWakeSource on = 1;
}

message AutoLifecycleConditionSet {
  AutoLifecycleConditionSetId id = 1;
  AutoLifecycleConditionKind kind = 2;
  optional AutoLifecycleActivitySource activity_source = 3;
  optional google.protobuf.Duration max_guest_idle_extension = 4;
}

message AutoLifecycleStage {
  AutoLifecycleConditionSetId condition_set = 1;
  google.protobuf.Duration at = 2;
  AutoLifecycleIdleAction action = 3;
}

message AutoLifecyclePolicy {
  AutoLifecycleWakePolicy wake = 1;
  repeated AutoLifecycleConditionSet condition_sets = 2;
  repeated AutoLifecycleStage stages = 3;
}

message AutoLifecycleConditionStatus {
  AutoLifecycleConditionSetId condition_set = 1;
  bool armed = 2;
  optional google.protobuf.Timestamp epoch_at = 3;
  optional google.protobuf.Timestamp last_touched_at = 4;
}

message AutoLifecycleStatus {
  repeated AutoLifecycleConditionStatus conditions = 1;
  optional google.protobuf.Timestamp next_auto_event_at = 2;
  uint32 open_activity_leases = 3;
  optional AutoLifecycleTransition last_auto_transition = 4;
  optional google.protobuf.Timestamp last_auto_transition_at = 5;
  optional string last_auto_error = 6;
  optional google.protobuf.Timestamp last_access_at = 7;
  optional google.protobuf.Timestamp last_command_at = 8;
}

message CreateRequest {
  // Mutually exclusive with template and runtime. Old readers see no required
  // runtime and reject before any template lookup or sandbox mutation.
  EnvironmentCreateInput environment = 30;
  string template = 1;
  string owner = 2;
  string runtime = 3;            // Required for legacy input: "fc". Absent with environment.
  bool snapshots_enabled = 4;    // Enable rolling btrfs snapshots when started
  bool autostart = 5;            // If true, start the sandbox after creation
  optional string pool_template = 6; // Internal: mark this sandbox as a pool member for the given template
  BootMode boot_mode = 7;        // Which start method; fallthrough: pool → base_snapshot → cold
  bool blocking = 8;             // When autostart=true, block until guest reports ready
  optional string sandbox_id = 9; // Caller-provided sandbox ID to preserve control-plane identity
  optional string content_hash = 10; // Pin to exact build (skips "newest" resolution if set)
  map<string, string> env = 11;   // Sandbox env for SPACE-launched processes and space-ssh sessions
  optional AutoLifecyclePolicy auto_lifecycle = 12;
  // Optional per-sandbox rootfs size override. If unset, sandbox-manager clones
  // the template rootfs exactly as template-manager materialized it.
  optional uint32 rootfs_size_mb = 13;
  optional space.net.policy.v1.NetworkPolicyV1 network_policy = 14;
  uint64 network_policy_generation = 15;
  space.net.policy.v1.PolicyAuthority network_policy_authority = 16;
  space.net.policy.v1.PolicyAuthority auto_lifecycle_authority = 17;
  optional space.net.policy.v1.NetworkPolicyV1 template_network_policy = 18;
  uint64 template_network_policy_generation = 19;
  space.net.policy.v1.PolicyAuthority template_network_policy_authority = 20;
  // BYOK: run this sandbox on dm-crypt encrypted volumes. Immutable for the
  // sandbox's lifetime — stamped by the control plane at create from the
  // owner org's enrollment, honored fail-closed by every subsequent
  // start/suspend/restore without re-deciding. Mutually exclusive with
  // pool_template: pool members are always plaintext (encrypted sandboxes
  // bypass warm pools at the API).
  bool volume_encryption = 22;
  optional space.net.gateway.v1.SpaceApiRouteIdentity route_identity = 26;
  // Effective immutable disk-I/O assignment resolved by the control plane.
  // Older callers omit these and receive the platform defaults.
  optional uint64 disk_io_max_operations_per_sec = 28;
  optional uint64 disk_io_max_bandwidth_mib_per_sec = 29;
}

message CreateResponse {
  // Exact template binding admitted and retained in the sandbox metadata.
  optional string environment = 10;
  string sandbox_id = 1;
  optional uint32 pid = 2;
  optional string guest_ip = 3;
  optional string namespace = 4;
  optional string log_path = 5;
  optional string vsock_uds_path = 6;
  BootMode boot_mode_used = 7;   // Actual mode after fallthrough
  bool reused_existing = 8;
  // Present when create also activated or returned an already-active runtime.
  optional space.net.gateway.v1.SpaceApiRouteIdentity route_identity = 9;
}

message StartRequest {
  string sandbox_id = 1;
  optional uint32 vcpu = 2;
  optional uint32 memory_mib = 3; // Guest RAM in MiB
  optional string checkpoint = 4;  // Restore from checkpoint or "suspend" state instead of fresh boot
  bool from_warm = 5;     // Start from warm template snapshot instead of cold boot
  // Fresh starts wait until guest ready; checkpoint/base-snapshot restores
  // return after VM resume and snapshot readiness acceptance.
  bool blocking = 6;
  // Internal-only: use an externally-created network namespace (e.g. from K8s CNI).
  // Public WorkerApi rejects this field; node-local start-context paths may set it.
  optional string netns_path = 7;
  // Applies only to fresh-start guest readiness waits; ignored for
  // checkpoint/base-snapshot restore.
  optional uint32 ready_timeout_secs = 8;
  // Target lifecycle for checkpoint-based starts (a `checkpoint` value
  // is required for non-default behavior; ignored for fresh boots).
  // Unspecified → STARTED. PAUSED skips the post-load resume so the
  // restored VM stays in the resident paused state. Used by the
  // cluster-controller's lifecycle-preserving drain evacuation path.
  // STOPPED materializes an evacuated stopped sandbox's disk artifact and
  // stops there; it requires `checkpoint = "suspend"` plus an exact
  // `suspend_restore_storage_uri`, and never launches a VM.
  WakeTargetState target_state = 9;
  // Internal-only exact S3 fallback for `checkpoint = "suspend"`.
  optional string suspend_restore_storage_uri = 10;
  // Node holding trusted local suspend bytes. A different node must use the
  // exact S3 fallback instead of any local residual state.
  optional string suspend_restore_source_node = 11;
  optional space.net.gateway.v1.SpaceApiRouteIdentity route_identity = 16;
  // Internal-only authority for restoring a verified typed artifact under a
  // fresh sandbox identity. DISK cold-boots; FULL is reserved until rich
  // runtime restore semantics are implemented. The source identity is checked
  // against snapshot metadata; the target identity remains sandbox_id plus
  // route_identity generation.
  optional RestoreArtifactAsNewContext restore_artifact_as_new = 17;
  // Internal-only lifecycle operation owner. Independent of route_identity:
  // receipts complete this operation without rotating the serving route.
  optional string operation_activation_attempt_id = 18;
  // Cluster policy captured after the activation claim. Installed atomically
  // with local activation admission, after artifact materialization. Local
  // overrides win; an already-running retry preserves policy and deadlines.
  // Callers must check activation-policy capability before sending this field.
  // Omission preserves the existing policy.
  optional AutoLifecyclePolicy activation_auto_lifecycle = 19;
  // Required with `target_state = STOPPED`: the local artifact id that
  // `suspend_restore_storage_uri` identifies. The caller has it — the cluster
  // hands back `local_artifact_id` and `storage_uri` in the same
  // `GetArtifactBackupLocation` reply — and naming it lets the node tell "this
  // row already is that artifact" from "this row is residue from an earlier
  // life on this node" by comparing ids locally. Without it the two are
  // indistinguishable: a sandbox stopped here earlier whose disk was then
  // published for backup leaves the same `stopped` row with the same
  // `disk`/`stop` pin an evacuation does, so reporting
  // convergence on the lifecycle alone would answer for older bytes and let
  // the source be retired. Same shape as
  // `RestoreArtifactAsNewContext.artifact_snapshot_id`, which the fork
  // transport already checks against its URI locally.
  optional string expected_local_artifact_id = 20;
}

message StartResponse {
  string sandbox_id = 1;
  uint32 pid = 2;
  string guest_ip = 3;
  string guest_gateway = 4;
  string namespace = 5;
  string log_path = 6;
  string vsock_uds_path = 7;
  // Authoritative normalized identity installed for this activation. Absent
  // when the activation installed no route identity.
  optional space.net.gateway.v1.SpaceApiRouteIdentity route_identity = 8;
}

message StopRequest {
  // One exact sandbox UUID. Human selection belongs in ScanCleanupTargets.
  string sandbox_id = 1;
  // Require this template at cleanup admission; never expands the target set.
  optional string template_filter = 2;
  bool blocking = 3;          // If true, wait until sandbox state is stopped
  bool immediate_kill = 4;     // If true, skip SIGTERM grace and use SIGKILL immediately
}

message StopResponse {
  repeated string stopped_ids = 1;
}

message KillRequest {
  string sandbox_id = 1;
  uint32 signal = 2;  // Unix signal number (e.g. 9 = SIGKILL, 15 = SIGTERM)
  bool blocking = 3;  // If true and signal is fatal, wait until cleanup reaches stopped
}

message KillResponse {
}

message DeleteRequest {
  // One exact sandbox UUID. Human selection belongs in ScanCleanupTargets.
  string sandbox_id = 1;
  // Require this template at cleanup admission; never expands the target set.
  optional string template_filter = 2;
  bool blocking = 3;          // If true, wait until the sandbox row is deleted
}

message DeleteResponse {
  repeated string deleted_ids = 1;
}

message StateRequest {
  repeated string sandbox_ids = 1;
}

message StateResponse {
  repeated SandboxInfo sandboxes = 1;
  repeated string missing_ids = 2;
}

message GetEnvRequest {
  string sandbox_id = 1;
}

message GetEnvResponse {
