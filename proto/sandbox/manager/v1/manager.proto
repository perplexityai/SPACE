}
message SnapshotDetail {
  string id = 1;                 // Snapshot name (e.g. "f-manual-20260410T140000Z") — use for rollback/delete/export
  string sandbox_id = 2;
  SnapshotType type = 3;
  // Point-in-time local evidence, not a restore lease. Full snapshots require
  // publication and capture files for "ready"; transferred disk snapshots also
  // require publication and a matching transfer binding. Legacy unverified captures are
  // "unknown", missing capture files "incomplete". May also be "restoring" or "deleting".
  string state = 4;
  optional string timestamp = 5; // Compact UTC (YYYYMMDDTHHmmssZ) for disk snapshots
  optional string source_node_id = 6; // UUID of node that created it
  optional string label = 7;     // User-provided label
  optional string retention_tier = 8; // Scheduler retention tier
  uint32 vcpu = 9;               // VM config at capture time; 0 when not recorded
  uint32 memory_mib = 10;        // 0 when not recorded
  optional uint64 size_bytes = 11; // absent when measurement is unavailable
  optional string template_id = 12; // Captured provenance only; absent when unknown
  optional string content_hash = 13; // Never inferred from the sandbox's current template
  repeated SnapshotLocation locations = 14; // Empty when no location evidence is available
}
message SnapshotLocation {
  string location_type = 1;      // "node" or "volume"
  optional string node_id = 2;   // set when location_type = "node"
  optional string node_address = 3;
  optional string volume_id = 4; // set when location_type = "volume"
