message SandboxInfo {
  string sandbox_id = 1;
  optional string template = 2;
  optional uint32 pid = 4;     // VM/sandbox PID when running
  optional string namespace = 5;
  optional string uptime = 7;
  optional string owner = 8;
  optional string image_hash = 9; // template hash at creation time
  bool spaced_host_alive = 10; // is spaced-host-svc process alive?
  optional uint32 uid = 14;       // allocated sandbox UID when running
  optional uint32 slot = 15;      // network slot when running
  optional uint32 guest_cid = 16; // vsock CID when running
  optional string created_at = 17; // creation timestamp
  optional string runtime = 18; // Recorded runtime; Create supports only "fc", while imports may preserve other runtime kinds.
  bool netgtw_alive = 19;       // is net-gateway-svc process alive?
  bool snapshots_enabled = 20;  // are rolling btrfs snapshots enabled?
  optional string pool_template = 22; // set if this sandbox is a pool member
  optional AutoLifecyclePolicy auto_lifecycle = 23;
  optional AutoLifecycleStatus auto_lifecycle_status = 24;
  optional string failure_reason = 25;
  bool runtime_alive = 26; // Is the sandbox runtime process alive?
  bool vsock_raw_ping_ok = 27; // can sbx-manager ping spaced-guest directly over v.sock?
  optional google.protobuf.Timestamp last_guest_ready_at = 28; // last time host observed guest ready
  optional google.protobuf.Timestamp last_guest_heartbeat_at = 29; // last guest-originated heartbeat
  optional uint64 network_tx_bytes = 30; // guest -> network, persisted lifetime counter
  optional uint64 network_rx_bytes = 31; // network -> guest, persisted lifetime counter
  uint64 network_policy_generation = 32; // desired sandbox override/inheritance generation
  uint64 applied_network_policy_generation = 33; // effective generation last pushed to net-gateway
  space.net.policy.v1.NetworkPolicySource applied_network_policy_source = 34;
  space.net.policy.v1.PolicyAuthority network_policy_authority = 35;
  space.net.policy.v1.PolicyAuthority auto_lifecycle_authority = 36;
  optional string current_local_artifact_id = 37;
  optional ArtifactKind current_local_artifact_kind = 38;
  // Current-instance artifact origin. Only STOP and SUSPEND are valid here;
  // SNAPSHOT is used for named snapshots in PublishedArtifact/local artifact rows.
  optional ArtifactOrigin current_local_artifact_origin = 39;
  optional space.execution.v1.ExecutionMetadata execution = 40;
  optional string spaced_version = 41;
  // Build git sha reported by the running net-gateway sidecar. Absent when no
  // stats probe has succeeded yet, or when the gateway answered without a sha
  // (a binary predating sha reporting — see netgtw_stale, which is true in
  // that case).
  optional string netgtw_git_sha = 42;
  // True when the net-gateway's last stats probe reported a build sha that
  // differs from this sandbox-manager's own — the gateway is still running a
  // pre-deploy binary. A gateway that answered with no sha at all predates
  // sha reporting entirely and is also true (stale) here. Absent only when no
  // probe has succeeded yet, so "not probed" is not conflated with a verdict.
  optional bool netgtw_stale = 43;
  // Bounded node-local quarantine classification for a quarantined row.
  optional string quarantine_reason_code = 44;
  // Generation-fenced proof of a node-local transition that the control plane
  // may consume idempotently.
  optional TransitionReceipt transition_receipt = 45;
  // The row exists locally and status is authoritative, but one or more
  // optional inventory fields could not be decoded or inspected. Consumers
  // must preserve previously observed optional fields for this publication.
  bool state_degraded = 46;
  SandboxHealthStatus health_status = 47;
  optional google.protobuf.Timestamp health_observed_at = 48;
  // Exact Kubernetes execution identity observed for this sandbox. These
  // fields are carried with node state publication so the control plane can
  // fence a terminal suspend projection to the pod that produced the bytes.
  optional int64 execution_generation = 49;
  optional string pod_uid = 50;
  // Highest current or retained node-local route generations. These remain
  // available after the active runtime identity is cleared.
  optional uint64 route_provenance_generation = 51;
  optional int64 route_provenance_execution_generation = 52;
  space.net.gateway.v1.SandboxSubstrateKind route_provenance_substrate_kind = 53;
  // Time the node-local state last changed. Carried with the matching state so
  // cluster publication can measure node-to-Postgres convergence.
  optional google.protobuf.Timestamp state_changed_at = 54;
  optional QuarantineRecoveryObservation quarantine_recovery = 55;
  // Current route incarnation for this runtime. Unlike execution generation,
  // this changes when an activation retry replaces an attempt in place.
  optional string activation_attempt_id = 56;
  // Always set by the sandbox manager; readers reject its absence. Present
  // UNSPECIFIED or an unknown value means undecodable state.
  optional SandboxLifecycleState lifecycle = 57;
  // When the node recorded the artifact named by current_local_artifact_id in
  // its catalog, from the node's clock, never rewritten. Set only together
  // with current_local_artifact_id, and only when the node's catalog holds
  // that artifact with a readable time and recorded it under rules that keep
  // the comparison sound: an artifact an older node recorded has no time
  // here. Meaningful only for a STOPPED sandbox, where the pin is recorded
  // just after its snapshot is taken (as the row enters STOPPED or later,
  // while it stays STOPPED) or as a restored disk is materialized from it:
  // compare it there against state_changed_at, which comes from the same
  // clock. For other states the
  // recording can lag the capture, so the time says nothing about whether the
  // artifact matches the disk. A time from any other machine isn't
  // comparable. Absent means unknown, not old: older nodes never set it.
  optional google.protobuf.Timestamp current_local_artifact_created_at = 58;
}

