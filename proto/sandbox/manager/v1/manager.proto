// ── Snapshot transfer messages ─────────────────────────────────────────────

message ExportSnapshotRequest {
  string sandbox_id = 1;
  string snapshot_name = 2;       // required snapshot name
  bool include_rootfs = 3;        // include rootfs (large) or just memory + vmstate
  bool use_delta = 4;             // if include_rootfs, compute page-level diff against template
}

message ExportSnapshotChunk {
  oneof payload {
    ExportSnapshotHeader header = 1;
    ExportSnapshotFileChunk chunk = 2;
  }
}

message ExportSnapshotHeader {
  string sandbox_id = 1;
  string template_id = 2;        // which template this sandbox was created from
  string content_hash = 3;
  bytes snapshot_metadata = 4;    // cgroup config, network config, vcpu/mem, arch
  SnapshotType snapshot_type = 5; // disk or full — so importer knows the artifact shape
}

// Separate from template FileChunk to avoid cross-package dependency.
message ExportSnapshotFileChunk {
  string file_name = 1;
  bytes data = 2;
  uint64 offset = 3;
  bool eof = 4;
}

message ImportSnapshotRequest {
  oneof payload {
    ImportSnapshotHeader header = 1;
    ImportSnapshotFileChunk chunk = 2;
  }
}

message ImportSnapshotHeader {
  string sandbox_id = 1;
  string template_id = 2;
  string content_hash = 3;
  bytes snapshot_metadata = 4;
  SnapshotType snapshot_type = 5;  // disk or full — determines directory naming and classification
  optional string target_name = 6; // use this name instead of generating f-imported-{ts}-{id}
}

message ImportSnapshotFileChunk {
  string file_name = 1;
  bytes data = 2;
  uint64 offset = 3;
  bool eof = 4;
}

message ImportSnapshotResponse {
  string sandbox_id = 1;
  string content_hash = 2;
  string local_path = 3;       // where the snapshot was written on this node
  uint64 size_bytes = 4;       // total bytes written
}

// ── Sandbox rootfs transfer messages ──────────────────────────────────────

message ExportSandboxRequest {
  string sandbox_id = 1;
  bool use_delta = 2;            // true = compute and stream page-level diff against template rootfs
}

message ExportSandboxChunk {
  oneof payload {
    ExportSandboxHeader header = 1;
    ExportSandboxFileChunk chunk = 2;
  }
}

message ExportSandboxHeader {
  string sandbox_id = 1;
  string template_id = 2;
  string content_hash = 3;
  uint64 total_size_bytes = 4;
  string runtime = 5;           // "fc", "gvisor", etc.
  string owner = 6;             // sandbox owner
  bool snapshots_enabled = 7;   // whether rolling snapshots were enabled on the source
  string created_at = 8;        // original creation timestamp (preserved across migrations)
  optional uint64 guest_uptime_secs = 9; // cumulative guest uptime
  bool is_delta = 10;           // true = rootfs.ext4 is a SPACE file delta against template, not full file
  map<string, string> env = 11; // sandbox env projected into SPACE-controlled entrypoints
  optional AutoLifecyclePolicy auto_lifecycle = 12;
  optional uint32 rootfs_size_mb = 13; // explicit sandbox rootfs size override, if any
  optional space.net.policy.v1.NetworkPolicyV1 network_policy = 14;
  uint64 network_policy_generation = 15;
  space.net.policy.v1.PolicyAuthority network_policy_authority = 16;
  space.net.policy.v1.PolicyAuthority auto_lifecycle_authority = 17;
  optional space.execution.v1.ExecutionMetadata execution = 18;
  // BYOK: source sandbox runs on dm-crypt encrypted volumes. Export of
  // encrypted sandboxes is rejected (the stream carries a plaintext rootfs),
  // so this is false today; carried for wire-shape completeness so import
  // preserves the immutable flag if a future exporter supports it.
  bool volume_encryption = 19;
  optional uint64 disk_io_max_operations_per_sec = 21;
  optional uint64 disk_io_max_bandwidth_mib_per_sec = 22;
}

message ExportSandboxFileChunk {
  string file_name = 1;
  bytes data = 2;
  uint64 offset = 3;
  bool eof = 4;
}

message ImportSandboxRequest {
  oneof payload {
    ImportSandboxHeader header = 1;
    ImportSandboxFileChunk chunk = 2;
  }
}

message ImportSandboxHeader {
  string sandbox_id = 1;
  string template_id = 2;
  string content_hash = 3;
  string runtime = 4;
  string owner = 5;
  bool snapshots_enabled = 6;
  string created_at = 7;        // original creation timestamp
  optional uint64 guest_uptime_secs = 8; // cumulative guest uptime
  bool is_delta = 9;            // true = rootfs is a SPACE file delta, apply against template
  map<string, string> env = 10; // sandbox env projected into SPACE-controlled entrypoints
  optional AutoLifecyclePolicy auto_lifecycle = 11;
  optional uint32 rootfs_size_mb = 12; // explicit sandbox rootfs size override, if any
  optional space.net.policy.v1.NetworkPolicyV1 network_policy = 13;
  uint64 network_policy_generation = 14;
  space.net.policy.v1.PolicyAuthority network_policy_authority = 15;
  space.net.policy.v1.PolicyAuthority auto_lifecycle_authority = 16;
  optional space.execution.v1.ExecutionMetadata execution = 17;
  // BYOK: the sandbox's immutable encrypted-volumes flag, preserved across
  // the transfer.
  bool volume_encryption = 18;
  optional uint64 disk_io_max_operations_per_sec = 20;
  optional uint64 disk_io_max_bandwidth_mib_per_sec = 21;
}

message ImportSandboxFileChunk {
  string file_name = 1;
  bytes data = 2;
  uint64 offset = 3;
  bool eof = 4;
}

message ImportSandboxResponse {
  string sandbox_id = 1;
  optional AutoLifecyclePolicy auto_lifecycle = 2;
  optional AutoLifecycleStatus auto_lifecycle_status = 3;
}

