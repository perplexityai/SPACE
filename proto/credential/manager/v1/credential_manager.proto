syntax = "proto3";
package space.credential.manager.v1;

import "credential/manager/v1/network_credential.proto";

service CredentialManager {
    // Resolve only the credential references authorized by the control
    // plane's exact committed effective network policy. Callers supply
    // identity and a policy fence, never rules or reference IDs.
    rpc ResolveNetworkCredentials(ResolveNetworkCredentialsRequest) returns (ResolveNetworkCredentialsResponse);

    // OAuth 2.0 Token Exchange (RFC 8693). Exchanges a subject token for a
    // resource-specific credential. The shape of the issued credential
    // depends on the requested_token_type and is returned in the response's
    // `payload` oneof.
    rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse);

    // Issue a fresh Data Encryption Key (DEK) wrapped under the named
    // per-organization Key Encryption Key (KEK).
    //
    // Envelope encryption (NIST SP 800-57): the response carries both
    // the plaintext DEK (for immediate use) and a `wrapped_dek` (for
    // persistence). The caller encrypts its data with `plaintext_dek`,
    // discards `plaintext_dek` after use, and persists `wrapped_dek`
    // alongside the ciphertext (the caller already knows which KEK was
    // used because it supplied `provider` + `master_key_identifier` on
    // the request, typically resolved from the row's
    // `*_encrypted_fields.master_key_id` lookup). To decrypt later,
    // the caller sends `wrapped_dek` back via UnwrapDek along with the
    // same `(provider, master_key_identifier)` pair to recover the
    // plaintext on demand. The KEK never leaves the credential manager.
    //
    // Multi-tenancy: every DEK is wrapped under the named
    // organization's KEK. The credmgr binds `organization_id` into the
    // wrap so unwrap with a different `organization_id` fails.
    rpc IssueDek(IssueDekRequest) returns (IssueDekResponse);

    // Recover the plaintext DEK previously produced by IssueDek.
    //
    // The same `(organization_id, provider, master_key_identifier,
    // aad)` tuple supplied at IssueDek must be supplied here; any
    // mismatch fails with PERMISSION_DENIED. The credential manager
    // performs only the unwrap step — the caller is responsible for
    // using the returned plaintext DEK to decrypt its data and for
    // discarding it after use.
    rpc UnwrapDek(UnwrapDekRequest) returns (UnwrapDekResponse);

    // Envelope-encrypt a small payload entirely inside the credential
    // manager: a fresh DEK is generated, used for AES-256-GCM, wrapped
    // under the calling organization's KEK, and discarded — unlike
    // IssueDek, the plaintext DEK never leaves the process. Intended
    // for credential values and other small blobs (plaintext is capped
    // at 64 KiB); bulk artifacts use IssueDek + the streaming pipeline.
    //
    // Callers never name a KEK: they assert only (organization_id,
    // user_id) and credmgr resolves the organization's active
    // org_master_keys row itself — the org→KEK mapping lives only
    // inside the credential service. An org with no active KEK fails
    // with FAILED_PRECONDITION. The returned wrapped_dek is a
    // self-describing credmgr envelope that records which KEK wrapped
    // it, so Decrypt needs no key naming either. Requires this credmgr
    // instance to have database access (the control-plane deployment).
    rpc Encrypt(EncryptRequest) returns (EncryptResponse);

    // Recover the plaintext sealed by Encrypt. The same
    // (organization_id, user_id, aad) must be supplied; mismatches fail
    // with PERMISSION_DENIED. The KEK is read from the wrapped_dek
    // envelope and verified to belong to the asserted organization.
    // Retired KEK rows still decrypt — existing data must stay
    // readable — only new Encrypt calls move to the active KEK.
    rpc Decrypt(DecryptRequest) returns (DecryptResponse);

    // Resolve the per-sandbox volume Data Encryption Key, issuing and
    // persisting one on first call. Like Encrypt/Decrypt, the caller never
    // names a KEK and never handles the wrap: it asserts only the sandbox
    // id, and credmgr resolves the sandbox's organization, the org's active
    // KEK, and the stored per-sandbox wrap itself.
    //
    // First call for a sandbox generates a fresh DEK, wraps it under the
    // org's active KEK (AAD-bound to org+sandbox), persists the wrap, and
    // returns the plaintext. Later calls load the stored wrap and unwrap it
    // — every volume for the sandbox (live rootfs COW, suspend/restore
    // snapshot volume) shares the one DEK. Concurrent first calls race to
    // persist; the loser re-reads and unwraps the winner's wrap, so the DEK
    // is stable. A BYOK org with no active KEK is enrolled on this first call
    // when the authority owns provisioning (the platform default selects
    // intermediate-key-broker): it issues and persists the org KEK, then wraps the
    // DEK. Otherwise (no provisioner installed) it fails FAILED_PRECONDITION.
    // Requires database access (the control-plane deployment); the
    // node-local agent forwards it upstream.
    rpc GetOrIssueSandboxVolumeDek(GetOrIssueSandboxVolumeDekRequest) returns (GetOrIssueSandboxVolumeDekResponse);

    // Certify a caller-owned key as an intermediate CA. The serving role fixes
    // its permissions: the authority issues pathLen:1 node CAs through AWS
    // Private CA; the node agent issues pathLen:0 gateway CAs under its own CA.
    // The authority permits node credential agents; the node socket permits
    // only Sandbox Manager, which relays a gateway's CSR. Private keys remain
    // with the process that generated them.
    //
    // The request carries no node id: every node's credential manager shares
    // one ServiceAccount, so a supplied id would be an unauthenticated claim.
    // The issuer chooses the certificate's subject and extensions.
    //
    // On the authority, issuance is asynchronous and polls until its deadline
    // then answers UNAVAILABLE. Callers must reuse their keypair across
    // retries: re-offering the same public key re-attaches to the in-flight
    // issuance instead of minting a second certificate. The node acquires its
    // own CA lazily through this same RPC, then signs the gateway CSR locally.
    rpc IssueIntermediateCertificate(IssueIntermediateCertificateRequest) returns (IssueIntermediateCertificateResponse);

}

message ResolveNetworkCredentialsRequest {
    string sandbox_id = 1;
    int64 execution_generation = 2;
    string effective_network_policy_ref = 3;
}

message ResolveNetworkCredentialsResponse {
    // Echoed only after the execution, committed policy, and reference states
    // remain unchanged across provider access.
    string effective_network_policy_ref = 1;
    repeated ResolvedNetworkCredential credentials = 2;
}

// RFC 8693 §2.1 token-exchange request. SPACE requires every field needed to
// bind an AWS session to one authenticated consumer and one storage resource;
// see docs/space/design/credential-token-exchange.md.
message ExchangeTokenRequest {
    // Required: "urn:ietf:params:oauth:grant-type:token-exchange".
    string grant_type = 1;
    // Required exact S3 object ARN or canonical prefix ARN ending in "/*".
    // Bucket-only resources are rejected.
    string resource = 2;
    // Required logical service identifier: "s3.amazonaws.com".
    optional string audience = 3;
    // Required, non-empty RFC 6749 §3.3 scope set. Supported values are
    // "space.storage.read" and "space.storage.write".
    optional string scope = 4;
    // RFC 8693 §2.1 + §3 token-type URI for the issued credential. Examples:
    //   "urn:ietf:params:oauth:token-type:aws-credentials" — typed AWS keys
    //   "urn:ietf:params:oauth:token-type:access_token"    — opaque OAuth
    string requested_token_type = 5;
    // Required resource subject. `subject_token_type` determines whether this
    // is a canonical SPACE SubjectId or a content-addressed build input.
    optional string subject_token = 6;
    // "urn:space:token-type:subject-id" or
    // "urn:space:token-type:build-input-sha256".
    optional string subject_token_type = 7;
    // Original node-local service identity. Direct authenticated services
    // must omit both actor fields. The node credential agent overwrites any
    // caller-supplied values before forwarding and the authority accepts them
    // only from that authenticated agent.
    optional string actor_token = 8;
    optional string actor_token_type = 9;
    // Required requested lifetime. SPACE uses one-hour sessions because
    // storage consumers do not refresh credentials during a transfer.
    optional uint32 requested_expires_in = 10;
    // Optional exact source-object ARN for a server-side copy. The resource
    // remains the destination, with read/write scope. Only Volume Manager
    // copying between two objects of its sandbox subject may set this;
    // source authorization is read-only and checked independently.
    optional string copy_source_resource = 11;
}

// RFC 8693 §2.2 token-exchange response. The deviation from strict 8693 is
// the `payload` oneof, which lets us carry typed credentials (e.g.,
// AwsCredentials) without JSON-in-string. Strict 8693 callers can still use
// the `access_token` variant for opaque issued tokens.
message ExchangeTokenResponse {
    // Token-type URI of the issued credential — mirrors the request's
    // `requested_token_type` when honored.
    string issued_token_type = 1;
    // Per RFC 8693 §2.2.1: typically "Bearer" or "N_A" for non-bearer
    // (e.g., AWS sigv4). Free-form for the stub.
    string token_type = 2;
    // Lifetime of the issued credential in seconds. 0/unset means "no
    // expiry advertised".
    optional uint32 expires_in = 3;
    // Granted scopes; may be a subset of `request.scope`.
    optional string scope = 4;
    // Optional refresh token (rarely used with token-exchange).
    optional string refresh_token = 5;

    // The issued credential. Variant matches `issued_token_type`.
    oneof payload {
        // Strict RFC 8693 path: opaque token string. Caller decodes per
        // `issued_token_type`.
        string access_token = 6;
        // Typed AWS-credentials variant for sigv4-using clients (S3,
        // STS-derived sessions). The credential stays on the wire as
        // structured fields rather than JSON-in-string.
        AwsCredentials aws_credentials = 7;
    }
}

message AwsCredentials {
    string access_key_id = 1;
    string secret_access_key = 2;
    // Required when the credential is an STS session; empty for static
    // long-lived keys.
    optional string session_token = 3;
    // Unix-seconds expiry. 0/unset means "no expiry advertised".
    optional uint64 expires_at_unix = 4;
}

// IssueDek / UnwrapDek — Data Encryption Key envelope flow.
//
// Multi-tenancy contract: the calling internal service (authenticated
// over the credmgr UDS by peer credentials) asserts the
// `organization_id` on every request. The credmgr trusts that
// assertion for routing — it does *not* re-validate org membership of
// the underlying actor — but it does bind `organization_id` into the
// wrap so a wrapped DEK produced for org A cannot be unwrapped while
// claiming org B.
//
// `provider` + `master_key_identifier` together name the concrete
// KEK to use. Callers resolve them from the `org_master_keys` row
// referenced by the matching `*_encrypted_fields.master_key_id`
// (which is itself FK-constrained to the same `org_id`). Common
// values for `provider`: "aws-kms", "in-memory" (testing only). The
// credmgr fails closed on unknown providers.

message IssueDekRequest {
    // UUID of the organization whose KEK should wrap the new DEK.
    // Internal callers (sandbox-manager, template-manager) pass the
    // org id of the resource the DEK is being issued for. The credmgr
    // does not consult any external policy to validate org ownership;
    // peer-credential auth on the UDS is the only check.
    string organization_id = 1;

    // Backend hosting the KEK, e.g. "aws-kms". The credmgr parses
    // this into a typed provider and routes the request to the
    // matching backend; unknown values fail with FAILED_PRECONDITION.
    string provider = 2;

    // Backend-specific identifier naming the concrete KEK within
    // `provider`. For AWS KMS this is any value KMS' `KeyId`
    // parameter accepts (key ID, key ARN, alias name, alias ARN).
    // Stored verbatim in `org_master_keys.key_identifier`; treated
    // as opaque by the credmgr surface.
    string master_key_identifier = 3;

    // Symmetric key spec for the DEK. Selects the byte length and
    // intended algorithm class of `plaintext_dek`. UNSPECIFIED is
    // treated as DEK_SPEC_AES_256.
    DekSpec spec = 4;

    // Optional Additional Authenticated Data bound into `wrapped_dek`.
    // The exact same bytes must be supplied at UnwrapDek time. Use
    // this to bind the wrapped DEK to its surrounding context (sandbox
    // id, record id, …) so a wrapped DEK lifted from one context
    // cannot be unwrapped in another. May be empty.
    bytes aad = 5;
}

message IssueDekResponse {
    // Plaintext DEK. Sensitive: callers must use it immediately, must
    // not log or persist it, and should zeroize after use.
    bytes plaintext_dek = 1;

    // Wrapped DEK. Opaque ciphertext suitable for storage; format is
    // backend-specific and clients must treat it as a byte blob. The
    // caller already knows which KEK produced it from the
    // `(provider, master_key_identifier)` it supplied at IssueDek
    // time and must re-supply the same pair at UnwrapDek time.
    bytes wrapped_dek = 2;
}

message UnwrapDekRequest {
    // UUID of the organization that owns this DEK. Must match the
    // `organization_id` supplied at IssueDek time; mismatch fails
    // with PERMISSION_DENIED.
    string organization_id = 1;

    // Backend that wrapped this DEK. Must match the `provider`
    // supplied at IssueDek time.
    string provider = 2;

    // Identifier of the KEK that wrapped this DEK. Must match the
    // `master_key_identifier` supplied at IssueDek time.
    string master_key_identifier = 3;

    // The wrapped DEK as returned by IssueDek.
    bytes wrapped_dek = 4;

    // Same AAD that was supplied at IssueDek. Mismatch fails with
    // PERMISSION_DENIED.
    bytes aad = 5;
}

message UnwrapDekResponse {
    // Plaintext DEK. Same handling rules as IssueDekResponse.
    bytes plaintext_dek = 1;
}

message EncryptRequest {
    // UUID of the organization whose active KEK seals this payload.
    // Bound into both the DEK wrap and the payload AEAD; Decrypt under
    // a different org fails.
    string organization_id = 1;

    // UUID of the user this payload belongs to, for user-scoped
    // credentials. Bound into the AEAD: Decrypt must assert the same
    // user (or the same absence of one, for org-scoped payloads).
    optional string user_id = 2;

    // The payload to seal. Capped at 64 KiB; larger payloads fail
    // with INVALID_ARGUMENT (use IssueDek + the streaming pipeline).
    bytes plaintext = 3;

    // Optional Additional Authenticated Data bound into both the DEK
    // wrap and the sealed payload, alongside the org/user binding that
    // credmgr always adds itself. The exact same bytes must be
    // supplied at Decrypt time. May be empty.
    bytes aad = 4;

    // Purpose scope (e.g. "credential") bound into the seal so this RPC
    // cannot act as a general encryption oracle: Decrypt must present the
    // same purpose. Required; empty fails with INVALID_ARGUMENT.
    string purpose = 5;
}

message EncryptResponse {
    // Sealed payload: [version u8 || 12-byte nonce || AES-256-GCM
    // ciphertext+tag]. Opaque to callers; store verbatim.
    bytes ciphertext = 1;

    // The DEK wrapped under the organization's active KEK, inside a
    // self-describing credmgr envelope that records which KEK wrapped
    // it. Opaque ciphertext suitable for storage next to `ciphertext`
    // (e.g. the credential row's wrapped_key column).
    bytes wrapped_dek = 2;
}

message DecryptRequest {
    // Must match the `organization_id` supplied at Encrypt time.
    string organization_id = 1;

    // Must match the `user_id` supplied at Encrypt time (including
    // its absence).
    optional string user_id = 2;

    // The sealed payload as returned by Encrypt.
    bytes ciphertext = 3;

    // The wrapped DEK as returned by Encrypt.
    bytes wrapped_dek = 4;

    // Same AAD that was supplied at Encrypt. Mismatch fails with
    // PERMISSION_DENIED.
    bytes aad = 5;

    // Must match the `purpose` supplied at Encrypt time.
    string purpose = 6;
}

message DecryptResponse {
    // The recovered plaintext. Sensitive: callers must not log it.
    bytes plaintext = 1;
}

message GetOrIssueSandboxVolumeDekRequest {
    // UUID of the sandbox whose volume DEK should be resolved. credmgr
    // looks up the sandbox's organization and the org's active KEK; an
    // unknown sandbox fails with NOT_FOUND.
    string sandbox_id = 1;
    // Optional cross-check: the organization the caller believes owns the
    // sandbox. When set, credmgr compares it against the resolved owner
    // BEFORE issuing or unwrapping anything and refuses a mismatch with
    // FAILED_PRECONDITION. The wrap is AAD-bound to (org, sandbox) and
    // first-writer-wins, so a caller acting on a stale ownership view
    // (e.g. a warm-pool claim racing the ownership transfer) would
    // otherwise mint a wrap the real owner can never unwrap. Callers that
    // follow ownership rather than assert it (node-side restarts) leave
    // this empty.
    string expected_org_id = 2;
}

message GetOrIssueSandboxVolumeDekResponse {
    // Plaintext volume DEK (AES-256, 32 bytes). Sensitive: use it to
    // open/format the dm-crypt volume immediately, never log or persist
    // it, and zeroize after use. The wrap lives only inside credmgr.
    bytes plaintext_dek = 1;
}

message IssueIntermediateCertificateRequest {
    // DER PKCS#10 CertificationRequest (RFC 2986), self-signed with the
    // private half of the key it carries.
    //
    // Both service roles validate it and refuse anything outside the
    // shape it expects: a v1 request over an ECDSA P-256 key, signed
    // ecdsa-with-SHA256, subject exactly CN=space-node-intermediate-ca, and no
    // attributes — no extension requests. This fixed CSR subject is shared by
    // node and gateway requests; it grants no identity or signing permissions.
    // Every certificate field is set by the issuer, so ignored input is an
    // INVALID_ARGUMENT rather than a silent ignore.
    //
    // P-256 because guests verify these chains with whatever TLS stack they
    // run, and it is the one curve all of them are required to implement
    // (RFC 8446 §9.1, RFC 8422 §5.1.1).
    //
    // DER, not PEM: the authority applies the PEM armor its signing backend
    // requires, so that requirement stays off the node.
    bytes csr = 1;
}

message IssueIntermediateCertificateResponse {
    // DER of the CA certificate over the offered key: pathLen:1 from the
    // authority, pathLen:0 from the node agent. Read validity from the certificate.
    bytes certificate_der = 1;

    // The node agent returns the node CA that signed the gateway certificate.
    // Keep the pair together across rotation and serve leaf, gateway CA, node CA.
    // Empty on authority responses: the SPACE root is trusted independently.
    bytes issuer_certificate_der = 2;
}

// Symmetric key spec selecting the byte length and intended algorithm
// class of an issued DEK. UNSPECIFIED is treated as AES_256.
enum DekSpec {
    DEK_SPEC_UNSPECIFIED = 0;
    // 256-bit key, 32 bytes; intended for AES-256-GCM / AES-256-SIV.
    DEK_SPEC_AES_256 = 1;
    // 128-bit key, 16 bytes; intended for AES-128-GCM.
    DEK_SPEC_AES_128 = 2;
}
