syntax = "proto3";

package space.execution.v1;

option go_package = "github.com/perplexityai/SPACE/shim/proto/execution/v1;executionv1";

enum RuntimeKind {
  RUNTIME_KIND_UNSPECIFIED = 0;
  RUNTIME_KIND_FIRECRACKER = 1;
  RUNTIME_KIND_CLOUD_HYPERVISOR = 2;
  RUNTIME_KIND_GVISOR = 3;
}

enum GuestOperatingSystem {
  GUEST_OPERATING_SYSTEM_UNSPECIFIED = 0;
  GUEST_OPERATING_SYSTEM_LINUX = 1;
  GUEST_OPERATING_SYSTEM_WINDOWS = 2;
  GUEST_OPERATING_SYSTEM_MACOS = 3;
}

enum CpuArchitecture {
  CPU_ARCHITECTURE_UNSPECIFIED = 0;
  CPU_ARCHITECTURE_X86_64 = 1;
  CPU_ARCHITECTURE_AARCH64 = 2;
}

enum ArtifactComponentKind {
  ARTIFACT_COMPONENT_KIND_UNSPECIFIED = 0;
  ARTIFACT_COMPONENT_KIND_KERNEL = 1;
  ARTIFACT_COMPONENT_KIND_INITRD = 2;
  ARTIFACT_COMPONENT_KIND_FIRMWARE = 3;
  ARTIFACT_COMPONENT_KIND_ROOTFS = 4;
  ARTIFACT_COMPONENT_KIND_BOOT_DISK = 5;
  ARTIFACT_COMPONENT_KIND_GUEST_TOOLS = 6;
}

enum ExecutionSelectionMode {
  EXECUTION_SELECTION_MODE_UNSPECIFIED = 0;
  EXECUTION_SELECTION_MODE_NEW_COLD_BOOT = 1;
  EXECUTION_SELECTION_MODE_EXISTING_COLD_BOOT = 2;
  EXECUTION_SELECTION_MODE_PERSISTED_STATE_RESTORE = 3;
}

message RuntimeIdentity {
  RuntimeKind kind = 1;
  string version = 2;
}

message GuestPlatform {
  GuestOperatingSystem os = 1;
  CpuArchitecture architecture = 2;
}

message StateFormatIdentity {
  string format = 1;
  string version = 2;
}

message ArtifactComponent {
  ArtifactComponentKind kind = 1;
  optional string role = 2;
  optional string version = 3;
  optional string digest = 4;
  optional string format = 5;
}

message ExecutionMetadata {
  RuntimeIdentity runtime = 1;
  GuestPlatform guest = 2;
  optional StateFormatIdentity state_format = 3;
  repeated ArtifactComponent components = 4;
  // Complete immutable binding, when explicitly verified by an environment-aware
  // resolver. Absence must not be interpreted as E0 or as peer support.
  optional string environment = 5;
}

message StateFormatCapability {
  StateFormatIdentity identity = 1;
  bool can_create = 2;
  bool can_load = 3;
}

message RuntimeInstallation {
  RuntimeIdentity runtime = 1;
  repeated GuestPlatform supported_guests = 2;
  repeated StateFormatCapability state_formats = 3;
  // The runtime driver's ordering key for this release, compared element-wise
  // and only within one runtime kind. Empty when the driver defines no order
  // for the version, or the node predates this field.
  repeated uint32 version_sort_key = 4;
}

message ArtifactComponentInstallation {
  ArtifactComponent component = 1;
  bool default_for_new = 2;
  bool legacy_default = 3;
}

message NodeExecutionInventory {
  repeated RuntimeInstallation runtimes = 1;
  repeated ArtifactComponentInstallation components = 2;
  // Effective policy: the startup settings, narrowed by any applied cluster
  // policy. Independent of installed/usable artifacts. Absence means unknown
  // support, never implicit E0 approval.
  ExecutionPolicyObservation policy = 3;
  // Absent from nodes that predate environment observations. Absence means
  // unknown, never an empty catalog or a node with nothing usable.
  EnvironmentObservation environments = 4;
}

// Which environments this node's build certifies and which it can run. Usable
// is not executable: the policy observation says what this node admits.
message EnvironmentObservation {
  uint32 schema_version = 1;
  // Every environment compiled into this node's catalog, whatever its policy.
  repeated KnownEnvironment known = 2;
  // Known environments this node can cold boot: its startup policy allows
  // them, and a new cold boot resolves to them from verified artifacts. This
  // is evidence, not a reservation. Cluster policy and freshness are for the
  // reader to apply, and restore readiness isn't covered.
  repeated string usable_environments = 3;
}

message KnownEnvironment {
  // A generic schema-2 definition; observations never use the historical
  // schema-1 representation.
  EnvironmentDefinition definition = 1;
  // Ordering key of the environment's runtime release; see
  // RuntimeInstallation.version_sort_key.
  repeated uint32 runtime_version_sort_key = 2;
  // Known environments this one is certified to be cold-boot upgraded to.
  repeated string upgrade_edges = 3;
  // Upgrade targets also certified to restore this environment's checkpoints.
  repeated string memory_edges = 4;
}

message ExecutionPolicyObservation {
  uint32 schema_version = 1;
  repeated string allowed_environment_references = 2;
  // Absent with an empty list on architectures using the legacy default.
  optional string default_environment_reference = 3;
  // Permission for unbound historical contracts, not an environment identity.
  bool legacy_unbound_allowed = 4;
  // The cluster policy generation this policy enforces, with schema_version 2.
  // Absent with schema_version 1: the node runs its startup policy only. A
  // schema 2 policy may have allowed environments and no default.
  optional uint64 applied_generation = 5;
  // With schema_version 2 and no applied_generation: the node can't read the
  // cluster policy it persisted, so it admits no new work (empty allowlist,
  // no default, no legacy) until the policy is reapplied. Running VMs are
  // untouched. Treat the node as having no usable policy evidence.
  bool cluster_policy_unreadable = 6;
}

// Environment definitions are additive data contracts. Sending one to a peer
// requires explicit support for its schema and reference; legacy inventory and
// ExecutionMetadata do not imply that support. New required semantics must bump
// schema_version, including semantics added through new fields or oneof members.
enum HostOperatingSystem {
  HOST_OPERATING_SYSTEM_UNSPECIFIED = 0;
  HOST_OPERATING_SYSTEM_LINUX = 1;
  HOST_OPERATING_SYSTEM_WINDOWS = 2;
  HOST_OPERATING_SYSTEM_MACOS = 3;
}

message HostPlatform {
  HostOperatingSystem os = 1;
  CpuArchitecture architecture = 2;
}

enum HypervisorBackend {
  HYPERVISOR_BACKEND_UNSPECIFIED = 0;
  HYPERVISOR_BACKEND_KVM = 1;
}

enum IsolationClass {
  ISOLATION_CLASS_UNSPECIFIED = 0;
  // A separate hardware VM boundary for each sandbox; not an ordered strength.
  ISOLATION_CLASS_HARDWARE_VM = 1;
}

enum RuntimePayloadLayout {
  RUNTIME_PAYLOAD_LAYOUT_UNSPECIFIED = 0;
  // The trusted artifact catalog owns executable roles and file layout.
  // Archive formats, paths, and per-runtime binary counts are not wire contracts.
  RUNTIME_PAYLOAD_LAYOUT_CATALOG_RELEASE_V1 = 2;
}

message ManagedRuntimeRelease {
  RuntimeIdentity runtime = 1;
  // Digest over pinned binaries, never the source archive checksum.
  string digest = 2;
  HostPlatform target = 3;
  RuntimePayloadLayout layout = 4;
}

message RuntimeBinding {
  oneof provider {
    ManagedRuntimeRelease managed_release = 1;
  }
}

message EnvironmentComponent {
  ArtifactComponentKind kind = 1;
  string version = 2;
  string digest = 3;
}

message BootProfile {
  oneof profile {
    ArtifactBootProfileV1 artifacts_v1 = 2;
  }
}

// Runtime-neutral boot inputs. The versioned contract names immutable boot
// semantics implemented by the adapter; it never names a node-local path.
message ArtifactBootProfileV1 {
  string contract = 1;
  repeated BootArtifact artifacts = 2;
}

message BootArtifact {
  // Unique within this boot profile; e.g. boot, firmware, or system-disk.
  string role = 1;
  EnvironmentComponent component = 2;
  string format = 3;
}

message ExecutionCompatibilityProfile {
  oneof profile {
    RuntimeCompatibilityV1 runtime_v1 = 2;
  }
}

message RuntimeCompatibilityV1 {
  // Immutable machine/device ABI contract, qualified by the trusted catalog.
  // Adding an approved replacement does not change this identifier.
  string contract = 1;
  // Absent means this environment has no memory-state contract. It does not
  // mean unknown or a default format. Presence alone does not grant restore.
  StateFormatIdentity state_format = 2;
}

message EnvironmentDescriptor {
  HostPlatform host = 1;
  GuestPlatform guest = 2;
  RuntimeBinding runtime = 3;
  HypervisorBackend backend = 4;
  BootProfile boot = 5;
  IsolationClass isolation = 6;
  ExecutionCompatibilityProfile compatibility = 7;
}

message EnvironmentDefinition {
  // Only generic transport schema 2 is supported.
  uint32 schema_version = 1;
  // SHA-256 over versioned canonical semantic fields, not protobuf wire bytes.
  string reference = 2;
  EnvironmentDescriptor descriptor = 3;
  // Canonical identity encoding, independent of the transport schema. Zero
  // retains the historical rule: use schema_version. A schema-2 representation
  // may carry identity 1 only when it exactly represents the legacy contract.
  uint32 identity_schema_version = 4;
}
