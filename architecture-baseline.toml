# Existing violations of the rules in ARCHITECTURE.toml, tolerated until fixed.
# Updated by `cargo arch --write-baseline[=<table>]`, which never adds an entry
# or a [pattern_ratchet.*] table; see crates/tools/archcheck/README.md.
#
# [pattern_ratchet.<instance>] maps each production Rust file outside the
# instance's allowed paths to its cap on code lines matching its patterns. Only
# remove entries or lower caps: a pull request that adds an entry or raises a
# cap is reported.

[pattern_ratchet.direct_tables]
"crates/l30_storage/cluster/trigger/queue/src/lib.rs" = 1
"crates/l30_storage/sandbox/store/src/lib.rs" = 2
"crates/l40_api/api/src/routes/admin/node_maintenance.rs" = 4
"crates/l40_api/internal/api/server/src/data_plane_sessions/route_rows.rs" = 1

[pattern_ratchet.kubernetes_access]
# Spawns the Kubernetes-only reconcilers from the bound `KubernetesSubstrate`.
"crates/l40_api/cluster/controller/server/src/reconcilers.rs" = 1
[pattern_ratchet.rootfs_copy]
# Privileged builder copies are deferred; builders stay CoW.
"crates/l40_api/build/mgr/engine/src/lib.rs" = 1
# Non-Linux fallbacks; Linux paths use file-io's reflink helper.
"crates/l40_api/node/runtime/core/src/lib.rs" = 2
"crates/l40_api/template/mgr/server/src/service.rs" = 3
"crates/l40_api/volmgr/server/src/staging.rs" = 2
# Network configuration and process-snapshot payloads are not rootfs images.
"crates/l40_api/sbx/mgr/server/src/service/grpc_spaced_process_snapshots.rs" = 1

[pattern_ratchet.node_manager_commands]
# The namespace runner's std::Command parameter is the bounded fork exception.
"crates/l40_api/node/mgr/server/src/host_command.rs" = 1
"crates/l40_api/node/mgr/server/src/host_command/spawn.rs" = 2
"crates/l40_api/node/mgr/server/src/net/fallback.rs" = 1
"crates/l40_api/node/mgr/server/src/service/artifact_fs/receive.rs" = 4

# Writers of the control-plane Postgres `sandboxes` row outside sandbox-store.
# They move into the store; lower each cap as they go.
[pattern_ratchet.sandbox_writes]

# No code outside the store names sbx-mgr's migrations or database path; the
# database migrator takes them from the store.
[pattern_ratchet.sbxmgr_sqlite_schema]

# [layers.<check>] maps each workspace package to what it depends on against
# the layers rule's <check>: workspace packages, drivers, storage helpers and
# packages Domain may not depend on, or, for codec_features, the
# <package>/<feature> it enables; [layers.unowned] maps each database
# namespace to its live tables that no store declares. Only remove entries:
# a pull request that adds one is reported.
[layers.codec_features]

[layers.dev_direction]

[layers.direction]

[layers.domain_dependencies]

[layers.model_protocol]

[layers.storage_access]
pplx-space-api = [
  "deadpool-redis",
  "redis",
  "sqlx",
]
pplx-space-build-mgr = [
  "pplx-space-object-store",
]
pplx-space-cluster-controller-server = [
  "sqlx",
]
pplx-space-internal-api-server = [
  "sqlx",
]
pplx-space-node-runtime-manager = [
  "aws-sdk-s3",
  "pplx-space-s3-http-client",
]
pplx-space-template-publisher = [
  "pplx-space-object-store",
]
pplx-space-volmgr = [
  "pplx-space-object-store",
]

[layers.unowned]
postgres = [
  "data_plane_session_output_events",
  "org_credentials",
  "sandbox_archives",
  "sandbox_encrypted_fields",
  "user_credentials",
]

# [crate_names] maps each workspace package with a catch-all name (a part such
# as `common`, `utils` or `core`) to its member path. Only remove entries: a pull
# request that adds one is reported, and fails the check.
[crate_names]
pplx-space-common-cli = "crates/l10_foundation/common/cli"
pplx-space-common-grpc = "crates/l10_foundation/common/grpc/transport"
pplx-space-common-jobs = "crates/l10_foundation/common/jobs"
pplx-space-common-proto-build = "crates/l10_foundation/common/proto/build"
pplx-space-execution-common = "crates/l20_domain/execution/common"
pplx-space-net-common = "crates/l20_domain/net/common"
pplx-space-node-runtime-core = "crates/l40_api/node/runtime/core"

[pattern_ratchet.sql_wrapped_column_predicate]
# Major-version match on a state format, a residual filter after the
# primary-key lookup by node and runtime.
"crates/l30_storage/node/registration/store/src/direct/placement_candidates.rs" = 2
"crates/l30_storage/sandbox/store/src/direct/restore_candidates.rs" = 2
