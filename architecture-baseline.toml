# [layers.<check>] maps each workspace package to what it depends on against
# the layers rule's <check>: workspace packages, drivers, storage helpers and
# packages Domain may not depend on, or, for codec_features, the
# <package>/<feature> it enables; [layers.facades] maps each <from>.<to> pair
# of packages to the items <from> reaches inside <to>'s modules. Only
# remove entries: a pull request that adds one is reported.
[layers.codec_features]
pplx-space-api = [
  "pplx-space-common-core/sqlx",
]
pplx-space-cluster-controller-server = [
  "pplx-space-common-core/sqlx",
