# Existing violations of the rules in ARCHITECTURE.toml, tolerated until fixed.
# Updated by `cargo arch --write-baseline[=<table>]`, which never adds an entry
# or a [pattern_ratchet.*] table; see crates/tools/archcheck/README.md.
#
# [pattern_ratchet.<instance>] maps each production Rust file outside the
# instance's allowed paths to its cap on code lines matching its patterns. Only
# remove entries or lower caps: a pull request that adds an entry or raises a
# cap is reported.

[pattern_ratchet.direct_tables]
"crates/libs/api/src/controllers/sandbox/responses.rs" = 4
"crates/libs/api/src/controllers/sandbox/spaced.rs" = 1
"crates/libs/api/src/public_template_operations.rs" = 1
"crates/libs/api/src/routes/admin/node_maintenance.rs" = 7
"crates/libs/api/src/routes/admin/node_store.rs" = 1
"crates/libs/api/src/routes/admin/templates.rs" = 1
"crates/libs/api/src/routes/public/sandboxes.rs" = 1
"crates/libs/cluster/controller/server/src/node_drain/store.rs" = 1
"crates/libs/cluster/controller/server/src/tombstone_retention.rs" = 2
"crates/libs/cluster/trigger-queue/src/lib.rs" = 1
"crates/libs/internal/api/server/src/data_plane_sessions/route_rows.rs" = 7
"crates/libs/internal/api/server/src/data_plane_sessions/service_route_reset.rs" = 1
"crates/libs/internal/api/server/src/lib.rs" = 1
"crates/libs/internal/api/server/src/published_state.rs" = 4
"crates/libs/sandbox/store/src/lib.rs" = 2

[pattern_ratchet.kubernetes_access]
# Spawns the Kubernetes-only reconcilers from the bound `KubernetesSubstrate`.
"crates/libs/cluster/controller/server/src/reconcilers.rs" = 1
[pattern_ratchet.rootfs_copy]
# Privileged builder copies are deferred; builders stay CoW.
"crates/libs/build/mgr/src/lib.rs" = 1
# Network configuration and process-snapshot payloads are not rootfs images.
"crates/libs/sbx/mgr/server/src/service/grpc_spaced_process_snapshots.rs" = 1
# Non-Linux fallbacks; Linux paths use common-io's reflink helper.
"crates/libs/node/runtime/core/src/lib.rs" = 2
"crates/libs/template/mgr/src/service.rs" = 3
"crates/libs/vol/mgr/server/src/staging.rs" = 2

[pattern_ratchet.node_manager_commands]
# The namespace runner's std::Command parameter is the bounded fork exception.
"crates/libs/node/mgr/server/src/host_command.rs" = 1
"crates/libs/node/mgr/server/src/host_command/spawn.rs" = 2
"crates/libs/node/mgr/server/src/service/artifact_fs/receive.rs" = 4
"crates/libs/node/mgr/server/src/net/fallback.rs" = 1

# Writers of the control-plane Postgres `sandboxes` row outside sandbox-store,
# and their calls to sandbox-portability's assignment renderers. They move into
# the store; lower each cap as they go.
[pattern_ratchet.sandbox_writes]
"crates/libs/api/src/controllers/sandbox/lifecycle.rs" = 4
"crates/libs/api/src/controllers/sandbox/queries.rs" = 4
"crates/libs/api/src/controllers/sandbox/responses.rs" = 3
"crates/libs/api/src/controllers/sandbox/updates.rs" = 4
"crates/libs/api/src/controllers/sandbox/wake_completion.rs" = 1
"crates/libs/api/src/controllers/substrate/direct.rs" = 6
"crates/libs/api/src/controllers/substrate/kubernetes/store/activation_fence.rs" = 1
"crates/libs/api/src/controllers/substrate/kubernetes/store/execution_rows.rs" = 1
"crates/libs/api/src/controllers/substrate/kubernetes/store/pod_placement.rs" = 1
"crates/libs/api/src/controllers/substrate/kubernetes/store/pod_tracking.rs" = 5
"crates/libs/api/src/controllers/substrate/kubernetes/store/restore_lease.rs" = 8
"crates/libs/api/src/controllers/substrate/kubernetes/store/suspend.rs" = 8
"crates/libs/api/src/controllers/substrate/mod.rs" = 1
"crates/libs/cluster/controller/server/src/drained_node_terminator/store.rs" = 1
"crates/libs/cluster/controller/server/src/failed_restorable_repair/store.rs" = 3
"crates/libs/cluster/controller/server/src/node_drain/store.rs" = 15
"crates/libs/cluster/controller/server/src/orphaned_sandboxes.rs" = 5
"crates/libs/cluster/controller/server/src/orphaned_sandboxes/quarantine_recovery/store.rs" = 1
"crates/libs/cluster/controller/server/src/started_sandbox_repair/store.rs" = 3
"crates/libs/cluster/controller/server/src/suspended_execution_reaper/store.rs" = 1
"crates/libs/cluster/controller/server/src/tombstone_retention.rs" = 1
"crates/libs/cluster/controller/server/src/transient_lifecycle_sweeper/store.rs" = 12
"crates/libs/internal/api/server/src/data_plane_sessions/service_route.rs" = 1
"crates/libs/internal/api/server/src/published_state.rs" = 9
"crates/libs/internal/api/server/src/sandbox_quarantine_store.rs" = 3
"crates/libs/internal/api/server/src/status.rs" = 1
"crates/libs/placement/machine/src/postgres.rs" = 1
"crates/libs/sandbox/teardown/src/lib.rs" = 1

# sbx-mgr code outside its SQLite store uses only the store's own handle,
# transaction and error types, so no file is listed.
[pattern_ratchet.sbxmgr_sqlite]

# No code outside the store names sbx-mgr's migrations or database path; the
# database migrator takes them from the store.
[pattern_ratchet.sbxmgr_sqlite_schema]

