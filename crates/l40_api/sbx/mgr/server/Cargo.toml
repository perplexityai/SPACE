[package]
name = "pplx-space-sbx-mgr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
otel = [
    "pplx-space-observability/otel",
    "pplx-space-template-mgr-client/otel",
]
datadog = [
    "otel",
    "pplx-space-observability/datadog",
    "pplx-space-template-mgr-client/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
# Compiles in the test-only environment hooks; never enabled for release builds.
test-hooks = [
    "pplx-space-node-disk-admission/test-hooks",
    "pplx-space-test-hooks/test-hooks",
]

[dependencies]
rustix = { workspace = true, features = ["fs"] }
nix = { workspace = true, features = ["dir", "fs", "user"] }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
h2 = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
jiff = { workspace = true }
libc = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["join-map"] }
toml = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7"] }

# internal
pplx-space-accounts = { workspace = true, features = ["serde"] }
pplx-space-api-route = { workspace = true }
pplx-space-auto-lifecycle-receipt = { workspace = true }
pplx-space-byte-size = { workspace = true, features = ["serde"] }
pplx-space-common-core = { workspace = true, features = ["serde"] }
pplx-space-template-runtime = { workspace = true }
pplx-space-btrfs = { workspace = true }
pplx-space-host-layout = { workspace = true }
pplx-space-host-linux = { workspace = true }
pplx-space-node-disk-admission = { workspace = true }
pplx-space-template-cache-permissions = { workspace = true }
pplx-space-common-grpc = { workspace = true }
pplx-space-file-io = { workspace = true }
pplx-space-common-jobs = { workspace = true }
pplx-space-lru-reaper = { workspace = true }
pplx-space-env-vars = { workspace = true }
pplx-space-content-digest = { workspace = true, features = ["serde"] }
pplx-space-cpu-arch = { workspace = true, features = ["serde"] }
pplx-space-network-roles = { workspace = true, features = ["serde"] }
pplx-space-sandbox-grpc = { workspace = true }
pplx-space-credential-injection = { workspace = true }
pplx-space-credmgr-client = { workspace = true }
pplx-space-dependency-drain = { workspace = true }
pplx-space-events = { workspace = true }
pplx-space-execution-common = { workspace = true }
pplx-space-execution-catalog = { workspace = true }
pplx-space-feature-flags = { workspace = true }
pplx-space-grpc-rate-limiter = { workspace = true }
pplx-space-grpc-server = { workspace = true }
pplx-space-ingress-admission = { workspace = true }
pplx-space-k8s-node-id = { workspace = true }
pplx-space-local-health = { workspace = true }
pplx-space-semver = { workspace = true, features = ["serde"] }
pplx-space-service-lifecycle = { workspace = true }
pplx-space-service-mutex = { workspace = true }
pplx-space-state-reconciliation = { workspace = true }
pplx-space-test-hooks = { workspace = true }
pplx-space-uds-peer-auth = { workspace = true }
pplx-space-unix-socket-bind = { workspace = true }
pplx-space-volmgr-client = { workspace = true }
pplx-space-net-common = { workspace = true, features = ["serde"] }
pplx-space-net-gateway-client = { workspace = true }
pplx-space-node-api-client = { workspace = true }
pplx-space-node-mgr-client = { workspace = true }
pplx-space-metrics-emit = { workspace = true }
pplx-space-reconcile-metrics = { workspace = true }
pplx-space-sandbox-metrics = { workspace = true }
pplx-space-node-runtime-core = { workspace = true, features = ["host-runtime"] }
pplx-space-spaced-guest-protocol = { workspace = true }
pplx-space-spaced-protocol = { workspace = true }
pplx-space-spaced-client = { workspace = true }
pplx-space-spaced-update = { workspace = true }
semver = { workspace = true }
pplx-space-spaced-host-client = { workspace = true }
pplx-space-observability = { workspace = true, default-features = false }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-sbx-mgr-store = { workspace = true }
pplx-space-template-manifest = { workspace = true }
pplx-space-template-mgr-client = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
pplx-space-bearer-token = { workspace = true }
pplx-space-common-core = { workspace = true, features = ["serde"] }
pplx-space-sbx-mgr-store = { workspace = true, features = ["test-support"] }
pplx-space-common-jobs = { workspace = true, features = ["test-support"] }
pplx-space-net-gateway = { workspace = true, features = ["test-support"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "metrics"] }
pplx-space-credmgr = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs", "x509-parser"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
# `test-util` enables `#[tokio::test(start_paused = true)]` so retry-backoff
# loops auto-advance virtual time instead of sleeping in real time.
# `rt-multi-thread` lets lock-ordering regression tests run waiters in real
# parallelism, matching the production runtime.
aws-lc-rs = { workspace = true }
anyhow = { workspace = true }
insta = { workspace = true }
base64 = { workspace = true }
tonic-prost = { workspace = true }
pplx-space-observability = { workspace = true, features = ["test-capture"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
pplx-space-grpc-metrics = { workspace = true }
pplx-space-metrics-emit = { workspace = true, features = ["test-capture"] }
pplx-space-policy-authority = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true, features = ["test-support"] }
pplx-space-test-env = { workspace = true }
pplx-space-test-hooks = { workspace = true, features = ["test-hooks"] }
