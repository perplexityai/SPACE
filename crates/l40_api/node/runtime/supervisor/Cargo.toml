[package]
name = "pplx-space-node-runtime-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
otel = ["pplx-space-service-host/otel"]
datadog = ["otel", "pplx-space-service-host/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
dashmap = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["process", "signal", "fs", "user", "sched", "mount", "resource"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-execution-common = { workspace = true }
pplx-space-grpc-server = { workspace = true }
pplx-space-host-layout = { workspace = true }
pplx-space-host-linux = { workspace = true }
pplx-space-linux-ids = { workspace = true }
pplx-space-node-runtime-core = { workspace = true, features = ["host-runtime", "artifact-store"] }
pplx-space-observability = { workspace = true }
pplx-space-service-host = { workspace = true }
pplx-space-service-lifecycle = { workspace = true }
pplx-space-uds-peer-auth = { workspace = true }
pplx-space-unix-socket-bind = { workspace = true }

[dev-dependencies]
pplx-space-common-grpc = { workspace = true }
pplx-space-content-digest = { workspace = true }
pplx-space-cpu-arch = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }
