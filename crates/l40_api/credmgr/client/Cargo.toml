[package]
name = "pplx-space-credmgr-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
prost = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "net"] }
tonic = { workspace = true, features = ["tls-aws-lc"] }
tonic-prost = { workspace = true }
zeroize = { workspace = true }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-common-grpc = { workspace = true }
pplx-space-credential-injection-core = { workspace = true }
pplx-space-rustls-provider = { workspace = true }

[dev-dependencies]
pplx-space-test-env = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
uuid = { workspace = true, features = ["v7"] }

[build-dependencies]
anyhow = { workspace = true }
pplx-space-common-proto-build = { workspace = true }
tonic-prost-build = { workspace = true }
