[package]
name = "pplx-space-spaced-guest-execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
telemetry = ["dep:pplx-space-observability", "dep:pplx-space-service-host"]
otel = ["telemetry", "pplx-space-service-host/otel"]
datadog = ["otel", "pplx-space-service-host/datadog"]

[dependencies]
dashmap = { workspace = true }
futures-util = { version = "0.3" }
globset = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
nix = { workspace = true, features = ["signal", "process", "user", "net", "fs", "term", "time", "poll"] }
libc = { workspace = true }
rustix = { workspace = true, features = ["fs", "mm", "process", "pty", "termios", "thread"] }
notify = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "io-util", "net", "fs", "process", "sync"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["codec"] }
tonic = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-common-grpc = { workspace = true }
pplx-space-env-vars = { workspace = true }
pplx-space-grpc-metrics = { workspace = true }
pplx-space-guest-process = { workspace = true }
pplx-space-observability = { workspace = true, optional = true }
pplx-space-pii = { workspace = true }
pplx-space-spaced-guest-protocol = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
pplx-space-cluster-id = { workspace = true }
pplx-space-host-linux = { workspace = true }
pplx-space-rpc-contracts = { workspace = true }
pplx-space-service-host = { workspace = true, optional = true }

[dev-dependencies]
nix = { workspace = true, features = ["uio"] }
pplx-space-test-env = { workspace = true }
tempfile = { workspace = true }
# Retention and cancellation tests advance virtual time.
tokio = { workspace = true, features = ["test-util"] }
