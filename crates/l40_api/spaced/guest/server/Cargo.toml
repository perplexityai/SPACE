[package]
name = "pplx-space-spaced-guest-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[test]]
name = "worker_subprocess"
path = "tests/worker_subprocess.rs"
harness = false

[[test]]
name = "worker_telemetry"
path = "tests/worker_telemetry.rs"
harness = false
required-features = ["otel"]

[lints]
workspace = true

[features]
# The service entry point: process-mode dispatch, telemetry init, the Tokio
# runtime, and the readiness loop that `spaced-svc`'s `main` calls. Off by
# default because it is the only thing here that needs `service-host`: consumers
# that link this crate for its service types or `loopback-diagnostic` -- the in-VM
# loopback diagnostic, the spaced host test suites -- would otherwise compile
# `service-host`'s process setup to reach code they never call.
service-entrypoint = [
    "dep:pplx-space-service-host",
    "dep:pplx-space-service-lifecycle",
    "pplx-space-spaced-guest-execution/telemetry",
]
# Compiles in the test-only environment hooks; never enabled for release builds.
test-hooks = ["pplx-space-test-hooks/test-hooks", "pplx-space-spaced-guest-execution/test-hooks"]
# Forwards to `service-host`'s telemetry pipeline. The entry point is where
# this crate initializes telemetry, so the gate has to reach it rather than the
# binary, and it implies the entry point it configures.
otel = ["service-entrypoint", "pplx-space-service-host/otel", "pplx-space-spaced-guest-execution/otel"]
datadog = ["otel", "service-entrypoint", "pplx-space-service-host/datadog", "pplx-space-spaced-guest-execution/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
# Exposes the in-VM loopback diagnostic without stabilizing runtime internals.
# The diagnostic is a workspace binary that enables this in its normal
# dependencies, so release builds resolve it too; it adds an export, not
# behaviour, and is deliberately not named as a test-only feature.
loopback-diagnostic = []

[dependencies]
futures-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "io-util", "net", "sync", "fs", "process"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
prost-types = { workspace = true }
pplx-space-spaced-guest-protocol = { workspace = true }

[target.'cfg(unix)'.dependencies]
hyper-util = { workspace = true, features = ["tokio"] }
nix = { workspace = true, features = ["signal", "process", "user", "net", "fs", "term", "time"] }
libc = { workspace = true }
rustix = { workspace = true, features = ["fs"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["codec"] }
tokio-vsock = { workspace = true, features = ["tonic014"] }
tower = { workspace = true }

# internal
pplx-space-service-host = { workspace = true, optional = true }
pplx-space-service-lifecycle = { workspace = true, optional = true }
pplx-space-spaced-guest-execution = { workspace = true }
pplx-space-connection-admission = { workspace = true }
pplx-space-common-core = { workspace = true }
pplx-space-common-grpc = { workspace = true }
pplx-space-grpc-metrics = { workspace = true }
pplx-space-observability = { workspace = true }
pplx-space-spaced-common = { workspace = true }
pplx-space-spaced-update = { workspace = true }
pplx-space-spaced-guest-update = { workspace = true }
pplx-space-test-hooks = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
serde_json = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "metrics"] }
pplx-space-spaced-guest-client = { workspace = true }
pplx-space-observability = { workspace = true, features = ["test-capture"] }
h2 = { workspace = true }
prost = { workspace = true }
pplx-space-test-env = { workspace = true }
pplx-space-test-hooks = { workspace = true, features = ["test-hooks"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` so the
# port-forward bind-retry/backoff tests run on virtual time.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
pplx-space-spaced-guest-update = { workspace = true }
pplx-space-spaced-update = { workspace = true }
jiff = { workspace = true }
pplx-space-guest-capability = { workspace = true }
pplx-space-guest-process = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true }
socket2 = { workspace = true }
tokio-util = { workspace = true, features = ["io-util", "rt"] }
prost = { workspace = true }
blake3 = { workspace = true }
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_SystemInformation", "Win32_System_EventLog", "Win32_System_Services", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Pipes", "Win32_System_Environment", "Win32_UI_Shell", "Win32_System_Registry"] }
windows-service = "0.8"
