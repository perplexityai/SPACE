[package]
name = "pplx-space-spaced-host-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = []
# Telemetry pipelines forward to `pplx-space-observability`; `service-host`
# initializes this crate's service telemetry.
otel = ["pplx-space-observability/otel"]
datadog = ["otel", "pplx-space-observability/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
pplx-space-grpc-rate-limiter = { workspace = true }
pplx-space-grpc-server = { workspace = true }
pplx-space-guest-process = { workspace = true }
tower = { workspace = true }
http-body = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
futures-util = { version = "0.3" }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

# internal
pplx-space-connection-admission = { workspace = true }
pplx-space-common-core = { workspace = true }
pplx-space-host-layout = { workspace = true }
pplx-space-common-grpc = { workspace = true }
pplx-space-grpc-metrics = { workspace = true }
pplx-space-metrics-emit = { workspace = true }
pplx-space-observability = { workspace = true }
pplx-space-spaced-common = { workspace = true }
pplx-space-uds-peer-auth = { workspace = true }
prost-types = { workspace = true }

[dev-dependencies]
pplx-space-spaced-host-server = { path = ".", features = ["test-support"] }
pplx-space-spaced-host-client = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
pplx-space-spaced-guest-server = { workspace = true }
anyhow = { workspace = true }
pplx-space-net-common = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
prost-types = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
