[package]
name = "pplx-space-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
federated-identity = []
# Test-only surfaces, for other crates' tests through a dev-dependency: the
# environment overrides of `pplx_space_test_hooks::test_hook`, and, with
# `kubernetes`, `KubernetesSubstrate::with_seeded_caches`. Enabled from a normal
# dependency, a workspace-wide release build would ship them.
test-hooks = ["pplx-space-test-hooks/test-hooks"]
kubernetes = [
    "dep:kube",
    "dep:k8s-openapi",
    "dep:pplx-space-work-coalescer",
    "dep:pplx-space-sandbox-pod",
    "dep:pplx-space-kube-client",
    "pplx-space-rpc-auth/k8s",
]
otel = ["pplx-space-observability/otel"]
datadog = ["otel", "pplx-space-observability/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
bcrypt = { workspace = true }
deadpool-redis = { workspace = true }
flate2 = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
jiff = { workspace = true }
oci-spec = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
http-body-util = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_32"], optional = true }
kube = { workspace = true, default-features = false, features = ["aws-lc-rs", "client", "config", "rustls-tls", "runtime"], optional = true }
log = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
redis = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
sqlx = { workspace = true, features = ["derive", "json", "migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid", "time"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde-human-readable"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net", "time"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }
tonic = { workspace = true }
tonic-health = { workspace = true }
toml = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "trace"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7", "serde"] }

# internal
# build-manager is reached indirectly via space-node-api-svc (BuilderApi).
# The recipe adapter keeps system builds on the same TOML contract as the builder CLI.
pplx-space-accounts = { workspace = true, features = ["serde"] }
pplx-space-api-route = { workspace = true }
pplx-space-auto-lifecycle = { workspace = true, features = ["serde"] }
pplx-space-bearer-token = { workspace = true }
pplx-space-build-mgr = { workspace = true }
pplx-space-build-mgr-client = { workspace = true }
pplx-space-env-vars = { workspace = true }
pplx-space-byte-size = { workspace = true, features = ["serde"] }
pplx-space-content-digest = { workspace = true, features = ["serde"] }
pplx-space-cpu-arch = { workspace = true, features = ["serde"] }
pplx-space-durations = { workspace = true, features = ["serde"] }
pplx-space-execution-catalog = { workspace = true }
pplx-space-credmgr-client = { workspace = true }
pplx-space-credential-injection = { workspace = true }
pplx-space-credential-injection-store = { workspace = true }
pplx-space-ecw-credential = { workspace = true }
pplx-space-execution-spec = { workspace = true, features = ["serde"] }
pplx-space-feature-flags = { workspace = true }
pplx-space-federated-grant-store = { workspace = true }
pplx-space-federated-identity = { workspace = true }
pplx-space-grpc-server = { workspace = true }
pplx-space-guest-process = { workspace = true, features = ["serde"] }
pplx-space-http-server = { workspace = true }
pplx-space-ingress-admission = { workspace = true }
pplx-space-k8s-ids = { workspace = true, features = ["serde"] }
pplx-space-k8s-node-id = { workspace = true }
pplx-space-kube-client = { workspace = true, optional = true }
pplx-space-sandbox-pod = { workspace = true, optional = true }
pplx-space-node-api-client = { workspace = true }
pplx-space-node-mgr-client = { workspace = true }
pplx-space-node-registration-store = { workspace = true }
pplx-space-cluster-trigger-queue = { workspace = true }
pplx-space-events = { workspace = true }
pplx-space-grpc-metrics = { workspace = true }
pplx-space-metrics-emit = { workspace = true }
pplx-space-sandbox-metrics = { workspace = true }
pplx-space-native-files = { workspace = true }
pplx-space-postgres-pool = { workspace = true }
pplx-space-public-api-http = { workspace = true }
pplx-space-observability = { workspace = true, default-features = false }
pplx-space-public-api = { workspace = true, features = ["schema", "serde"] }
pplx-space-common-core = { workspace = true, features = ["serde", "sqlx"] }
pplx-space-template-runtime = { workspace = true }
pplx-space-common-grpc = { workspace = true, features = ["internal-tls"] }
pplx-space-sandbox-grpc = { workspace = true }
pplx-space-work-coalescer = { workspace = true, optional = true }
pplx-space-cluster-pool = { workspace = true }
pplx-space-net-common = { workspace = true, features = ["serde"] }
pplx-space-policy-authority = { workspace = true }
pplx-space-rpc-auth = { workspace = true }
pplx-space-node-status-store = { workspace = true }
pplx-space-sandbox-portability = { workspace = true }
pplx-space-runtime-environment-policy-store = { workspace = true }
pplx-space-sandbox-quarantine-store = { workspace = true }
pplx-space-sandbox-residency = { workspace = true }
pplx-space-sandbox-store = { workspace = true }
pplx-space-sandbox-teardown = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-semver = { workspace = true, features = ["serde"] }
pplx-space-service-lifecycle = { workspace = true }
pplx-space-snapshot-store = { workspace = true }
pplx-space-state-reconciliation = { workspace = true }
pplx-space-template-mgr-client = { workspace = true }
pplx-space-test-hooks = { workspace = true }

[dev-dependencies]
pplx-space-api-route = { workspace = true, features = ["test-support"] }
pplx-space-ecw-credential = { workspace = true, features = ["test-support"] }
pplx-space-internal-api-server = { workspace = true }
pplx-space-common-core = { workspace = true, features = ["serde", "sqlx"] }
insta = { workspace = true, features = ["json", "yaml", "redactions"] }
jsonschema = { workspace = true }
pplx-space-common-grpc = { workspace = true, features = ["internal-tls", "test-support"] }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-sandbox-store = { workspace = true, features = ["test-support"] }
pplx-space-metrics-emit = { workspace = true, features = ["test-capture"] }
pplx-space-observability = { workspace = true, features = ["test-capture"] }
pplx-space-node-api-sim = { workspace = true }
pplx-space-rustls-provider = { workspace = true }
pplx-space-node-status-store = { workspace = true, features = ["test-support"] }
pplx-space-test-env = { workspace = true }
pplx-space-test-hooks = { workspace = true, features = ["test-hooks"] }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
rstest = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["redis"] }
# `test-util` enables `#[tokio::test(start_paused = true)]` so follower-join
# backoff tests auto-advance virtual time instead of sleeping in real time.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
