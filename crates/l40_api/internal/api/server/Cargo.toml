[package]
name = "pplx-space-internal-api-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-hooks = ["pplx-space-test-hooks/test-hooks", "pplx-space-rpc-auth/test-hooks"]
default = []
kubernetes = [
    "dep:k8s-openapi",
    "dep:kube",
    "pplx-space-rpc-auth/k8s",
]
otel = ["pplx-space-template-mgr-client/otel"]
datadog = ["otel", "pplx-space-template-mgr-client/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
futures-util = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_32"], optional = true }
kube = { workspace = true, default-features = false, features = ["aws-lc-rs", "client", "config", "rustls-tls"], optional = true }
prost-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["derive", "json", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs", "uuid"] }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["net", "sync", "rt", "time"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-reflection = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-accounts = { workspace = true, features = ["serde"] }
pplx-space-api-route = { workspace = true }
pplx-space-auto-lifecycle-receipt = { workspace = true }
pplx-space-cluster-pool = { workspace = true }
pplx-space-cluster-trigger-queue = { workspace = true }
pplx-space-common-core = { workspace = true, features = ["serde", "sqlx"] }
pplx-space-common-grpc = { workspace = true, features = ["internal-tls"] }
pplx-space-ecw-credential = { workspace = true }
pplx-space-sandbox-grpc = { workspace = true }
pplx-space-env-vars = { workspace = true }
pplx-space-events = { workspace = true }
pplx-space-grpc-server = { workspace = true }
pplx-space-ingress-admission = { workspace = true }
pplx-space-metrics-emit = { workspace = true }
pplx-space-sandbox-metrics = { workspace = true }
pplx-space-reconcile-metrics = { workspace = true }
pplx-space-net-common = { workspace = true, features = ["serde"] }
pplx-space-node-api-client = { workspace = true }
pplx-space-node-mgr-client = { workspace = true }
pplx-space-observability = { workspace = true }
pplx-space-postgres-pool = { workspace = true }
pplx-space-rpc-auth = { workspace = true }
pplx-space-sandbox-portability = { workspace = true }
pplx-space-sandbox-quarantine-store = { workspace = true }
pplx-space-sandbox-store = { workspace = true }
pplx-space-public-api = { workspace = true }
pplx-space-execution-common = { workspace = true }
pplx-space-policy-authority = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-semver = { workspace = true, features = ["serde"] }
pplx-space-snapshot-store = { workspace = true }
pplx-space-runtime-environment-catalog-store = { workspace = true }
pplx-space-runtime-environment-policy-store = { workspace = true }
pplx-space-state-reconciliation = { workspace = true }
pplx-space-template-mgr-client = { workspace = true }
pplx-space-test-hooks = { workspace = true }

[dev-dependencies]
pplx-space-api-route = { workspace = true, features = ["test-support"] }
pplx-space-common-core = { workspace = true, features = ["serde", "sqlx"] }
pplx-space-ecw-credential = { workspace = true, features = ["test-support"] }
pplx-space-execution-common = { workspace = true, features = ["serde"] }
hex = { workspace = true }
insta = { workspace = true, features = ["yaml", "redactions"] }
prost = { workspace = true }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-sandbox-store = { workspace = true, features = ["test-support"] }
pplx-space-metrics-emit = { workspace = true, features = ["test-capture"] }
pplx-space-node-api-sim = { workspace = true }
pplx-space-observability = { workspace = true, features = ["otel", "test-capture"] }
pplx-space-rpc-auth = { workspace = true, features = ["test-hooks", "test-support"] }
pplx-space-sandbox-residency = { workspace = true }
pplx-space-test-env = { workspace = true }
pplx-space-test-hooks = { workspace = true, features = ["test-hooks"] }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
