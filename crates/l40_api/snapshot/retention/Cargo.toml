[package]
name = "pplx-space-snapshot-retention"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
s3 = ["dep:pplx-space-snapshot-storage", "pplx-space-snapshot-storage/s3"]

[dependencies]
futures-util = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uuid = { workspace = true }

# internal
pplx-space-common-core = { workspace = true, features = ["sqlx"] }
pplx-space-events = { workspace = true }
pplx-space-metrics = { workspace = true }
pplx-space-sandbox-portability = { workspace = true }
pplx-space-sandbox-store = { workspace = true }
pplx-space-snapshot-storage = { workspace = true, optional = true }
pplx-space-snapshot-store = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-metrics = { workspace = true, features = ["test-capture"] }
pplx-space-observability = { workspace = true, features = ["test-capture"] }
pplx-space-test-env = { workspace = true }
sqlx = { workspace = true, features = ["migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tracing-subscriber = { workspace = true }
