[package]
name = "pplx-space-data-plane-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
otel = ["pplx-space-observability/otel"]
datadog = ["otel", "pplx-space-observability/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
kubernetes = ["pplx-space-node-api-client/kubernetes"]

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
dashmap = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
multer = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
# `all` gates TcpKeepalive::with_retries, which the listener sets, and the
# socket option getters the listener test reads.
socket2 = { workspace = true, features = ["all"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-api-route = { workspace = true }
pplx-space-bearer-token = { workspace = true }
pplx-space-common-core = { workspace = true }
pplx-space-common-grpc = { workspace = true, features = ["internal-tls"] }
pplx-space-sandbox-grpc = { workspace = true }
pplx-space-feature-flags = { workspace = true }
pplx-space-guest-process = { workspace = true }
pplx-space-http-server = { workspace = true }
pplx-space-ingress-admission = { workspace = true }
pplx-space-metrics = { workspace = true }
pplx-space-native-files = { workspace = true }
pplx-space-net-gateway-client = { workspace = true }
pplx-space-node-api-client = { workspace = true }
pplx-space-observability = { workspace = true }
pplx-space-public-api = { workspace = true, features = ["serde"] }
pplx-space-public-api-http = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-service-lifecycle = { workspace = true }

[dev-dependencies]
pplx-space-grpc-server = { workspace = true }
pplx-space-metrics-emit = { workspace = true, features = ["test-capture"] }
tokio = { workspace = true, features = ["test-util"] }
pplx-space-test-env = { workspace = true }
aws-lc-rs = { workspace = true }
insta = { workspace = true }
tower = { workspace = true, features = ["util"] }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
tonic-prost = { workspace = true }
