[package]
name = "pplx-space-build-mgr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
aws-ecr = ["dep:aws-config", "dep:aws-sdk-ecr"]
otel = ["pplx-space-template-mgr-client/otel"]
datadog = ["otel", "pplx-space-template-mgr-client/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
async-trait = { workspace = true }
aws-config = { workspace = true, optional = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-ecr = { workspace = true, optional = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
bytes = { workspace = true }
hex = { workspace = true }
jiff = { workspace = true }
oci-spec = { workspace = true, features = ["image"] }
object = { workspace = true }
reqwest = { workspace = true, features = ["query"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "rt", "sync", "time"] }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

# internal
pplx-space-accounts = { workspace = true, features = ["serde"] }
pplx-space-build-mgr-client = { workspace = true }
pplx-space-common-core = { workspace = true, features = ["serde"] }
pplx-space-template-runtime = { workspace = true }
pplx-space-content-digest = { workspace = true, features = ["serde"] }
pplx-space-cpu-arch = { workspace = true, features = ["serde"] }
pplx-space-credmgr-client = { workspace = true }
pplx-space-execution-common = { workspace = true }
pplx-space-host-layout = { workspace = true }
pplx-space-host-linux = { workspace = true }
pplx-space-metrics-emit = { workspace = true }
pplx-space-net-common = { workspace = true }
pplx-space-node-api-client = { workspace = true }
pplx-space-node-disk-admission = { workspace = true }
pplx-space-node-mgr-client = { workspace = true }
pplx-space-node-runtime-core = { workspace = true }
pplx-space-object-store = { workspace = true }
pplx-space-page-cache = { workspace = true }
pplx-space-policy-authority = { workspace = true }
pplx-space-rpc-auth = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-spaced-guest-protocol = { workspace = true }
pplx-space-template-manifest = { workspace = true }
pplx-space-template-mgr-client = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
pplx-space-execution-common = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["test-util"] }
pplx-space-credmgr = { workspace = true, features = ["test-hooks"] }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-internal-api-server = { workspace = true }
pplx-space-rpc-auth = { workspace = true, features = ["test-support"] }
pplx-space-test-env = { workspace = true }
pplx-space-uds-peer-auth = { workspace = true }
prost = { workspace = true }
rstest = { workspace = true }
sqlx = { workspace = true, features = ["json", "postgres", "runtime-tokio", "uuid"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
