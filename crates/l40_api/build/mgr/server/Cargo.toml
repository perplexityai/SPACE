[package]
name = "pplx-space-build-mgr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-hooks = ["pplx-space-rpc-auth/test-hooks"]
default = []
k8s = ["pplx-space-rpc-auth/k8s"]
aws-ecr = ["pplx-space-build-mgr/aws-ecr"]
otel = [
    "pplx-space-build-mgr/otel",
    "pplx-space-observability/otel",
]
datadog = [
    "otel",
    "pplx-space-build-mgr/datadog",
    "pplx-space-observability/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
pplx-space-execution-spec = { workspace = true, features = ["serde"] }
prost = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tracing = { workspace = true }

# internal
pplx-space-common-grpc = { workspace = true, features = ["internal-tls"] }
pplx-space-build-mgr = { workspace = true }
pplx-space-build-mgr-client = { workspace = true }
pplx-space-common-jobs = { workspace = true }
pplx-space-grpc-server = { workspace = true }
pplx-space-observability = { workspace = true }
pplx-space-rpc-auth = { workspace = true }

[dev-dependencies]
pplx-space-content-digest = { workspace = true, features = ["serde"] }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
rustls = { workspace = true, features = ["aws_lc_rs"] }
sqlx = { workspace = true, features = ["macros", "migrate"] }
pplx-space-build-mgr-client = { workspace = true, features = ["test-support"] }
axum = { workspace = true }
base64 = { workspace = true }
pplx-space-rpc-auth = { workspace = true, features = ["k8s", "test-hooks", "test-support"] }
pplx-space-test-env = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
