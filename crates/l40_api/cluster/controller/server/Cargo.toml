[package]
name = "pplx-space-cluster-controller-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# On by default: every reconciler in this crate drives the Kubernetes
# substrate today, so the library has no meaning without it. The gate is kept
# rather than folded in so a direct-substrate build can grow behind it without
# a manifest change; a `--no-default-features` build does not compile yet.
default = ["kubernetes"]
# The observability half reaches only this crate's tests, through the
# dev-dependency; the api half reaches the library.
otel = [
    "pplx-space-observability/otel",
    "pplx-space-api/otel",
]
datadog = [
    "otel",
    "pplx-space-observability/datadog",
    "pplx-space-api/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
# Gates the kube client, k8s-openapi types, and the kube-specific sink and
# reconciler impls. Mirrors the same feature in `pplx-space-api`.
kubernetes = [
    "dep:k8s-openapi",
    "dep:kube",
    "pplx-space-api/kubernetes",
    "pplx-space-common-core/kubernetes",
    "dep:pplx-space-kube-client",
]
test-hooks = ["pplx-space-common-core/test-hooks"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-smithy-types = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_32"], optional = true }
kube = { workspace = true, default-features = false, features = ["client"], optional = true }
prost-types = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
time = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-api = { workspace = true }
pplx-space-api-route = { workspace = true }
pplx-space-aws-client = { workspace = true }
pplx-space-bearer-token = { workspace = true }
pplx-space-cluster-pool = { workspace = true }
pplx-space-cluster-reconciler = { workspace = true }
pplx-space-common-core = { workspace = true, features = ["sqlx"] }
pplx-space-common-grpc = { workspace = true, features = ["internal-tls"] }
pplx-space-federated-identity = { workspace = true }
pplx-space-grpc-server = { workspace = true }
pplx-space-k8s-node-id = { workspace = true }
pplx-space-kube-client = { workspace = true, optional = true }
pplx-space-postgres-pool = { workspace = true }
pplx-space-sandbox-quarantine-store = { workspace = true }
pplx-space-sandbox-residency = { workspace = true }
pplx-space-sandbox-store = { workspace = true }
pplx-space-sandbox-teardown = { workspace = true }
pplx-space-snapshot-storage = { workspace = true, features = ["s3"] }
pplx-space-snapshot-retention = { workspace = true, features = ["s3"] }
pplx-space-snapshot-store = { workspace = true }
pplx-space-events = { workspace = true }
pplx-space-feature-flags = { workspace = true }
pplx-space-metrics-emit = { workspace = true }
pplx-space-runtime-environment-catalog-store = { workspace = true }
pplx-space-node-api-client = { workspace = true }
pplx-space-public-api = { workspace = true }
pplx-space-sandbox-portability = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-state-reconciliation = { workspace = true }

[dev-dependencies]
pplx-space-api = { workspace = true, features = ["test-hooks"] }
pplx-space-api-route = { workspace = true, features = ["test-support"] }
pplx-space-common-core = { workspace = true, features = ["sqlx", "test-hooks"] }
pplx-space-metrics-emit = { workspace = true, features = ["test-capture"] }
pplx-space-observability = { workspace = true, features = ["test-capture"] }
axum = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-node-api-sim = { workspace = true }
pplx-space-policy-authority = { workspace = true }
pplx-space-sandbox-store = { workspace = true, features = ["test-support"] }
pplx-space-test-env = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, features = ["migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic-health = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true }
