[package]
name = "pplx-space-cluster-reconciler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = { workspace = true }
sqlx = { workspace = true, features = ["derive", "migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-cluster-trigger-queue = { workspace = true }
pplx-space-common-core = { workspace = true }
pplx-space-common-grpc = { workspace = true, features = ["internal-tls"] }
pplx-space-common-svc = { workspace = true }
pplx-space-metrics = { workspace = true }
pplx-space-node-api-client = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-metrics = { workspace = true, features = ["test-capture"] }
pplx-space-test-env = { workspace = true }
rstest = { workspace = true }
