[package]
name = "pplx-space-template-mgr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
otel = ["pplx-space-service-host/otel"]
datadog = ["otel", "pplx-space-service-host/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
# Compiles in the test-only environment hooks; never enabled for release builds.
test-hooks = ["pplx-space-common-core/test-hooks"]

[dependencies]
pplx-space-common-grpc = { workspace = true }
pplx-space-execution-catalog = { workspace = true }
rustix = { workspace = true, features = ["fs"] }
async-trait = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
jiff = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
zstd = { workspace = true }

# internal
pplx-space-common-core = { workspace = true, features = ["serde"] }
pplx-space-common-io = { workspace = true, features = ["reflink"] }
pplx-space-common-jobs = { workspace = true }
pplx-space-common-lru-reaper = { workspace = true }
pplx-space-grpc-rate-limiter = { workspace = true }
pplx-space-grpc-server = { workspace = true }
pplx-space-local-health = { workspace = true }
pplx-space-page-cache = { workspace = true }
pplx-space-rpc-auth = { workspace = true }
pplx-space-service-host = { workspace = true }
pplx-space-service-lifecycle = { workspace = true }
pplx-space-service-mutex = { workspace = true }
pplx-space-sqlite = { workspace = true }
pplx-space-state-reconciliation = { workspace = true }
pplx-space-stopwatch = { workspace = true }
pplx-space-execution-common = { workspace = true }
pplx-space-metrics = { workspace = true }
pplx-space-reconcile-metrics = { workspace = true }
pplx-space-feature-flags = { workspace = true }
pplx-space-node-api-client = { workspace = true }
pplx-space-node-mgr-client = { workspace = true }
pplx-space-net-common = { workspace = true, features = ["serde"] }
pplx-space-observability = { workspace = true, default-features = false }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-template-mgr-client = { workspace = true }
pplx-space-uds-peer-auth = { workspace = true }
pplx-space-unix-socket-bind = { workspace = true }
pplx-space-volmgr-client = { workspace = true }

[dev-dependencies]
pplx-space-internal-api-server = { workspace = true }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-common-grpc = { workspace = true }
pplx-space-common-core = { workspace = true, features = ["serde", "test-hooks"] }
nix = { workspace = true, features = ["user"] }
pplx-space-observability = { workspace = true, features = ["test-capture"] }
pplx-space-rpc-auth = { workspace = true, features = ["test-support"] }
pplx-space-test-env = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
