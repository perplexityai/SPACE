[package]
name = "pplx-space-volmgr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Turn on telemetry for this crate's own tests, such as the sparse-accounting
# benchmark, through the service-host dev-dependency. `space-volmgr-svc`
# enables service-host's features itself.
otel = ["pplx-space-service-host/otel"]
datadog = ["otel", "pplx-space-service-host/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
async-trait = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
nix = { workspace = true, features = ["time"] }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
zeroize = { workspace = true }
zstd = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

# internal
pplx-space-common-core = { workspace = true, features = ["serde", "rusqlite"] }
pplx-space-common-grpc = { workspace = true }
pplx-space-common-io = { workspace = true, features = ["reflink"] }
pplx-space-common-jobs = { workspace = true }
pplx-space-grpc-rate-limiter = { workspace = true }
pplx-space-grpc-server = { workspace = true }
pplx-space-local-health = { workspace = true }
pplx-space-page-cache = { workspace = true }
pplx-space-service-mutex = { workspace = true }
pplx-space-sandbox-grpc = { workspace = true }
pplx-space-sqlite = { workspace = true }
pplx-space-credmgr-client = { workspace = true }
pplx-space-metrics = { workspace = true }
pplx-space-object-store = { workspace = true }
pplx-space-uds-peer-auth = { workspace = true }
pplx-space-unix-socket-bind = { workspace = true }
pplx-space-volmgr-client = { workspace = true }
pplx-space-node-mgr-client = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
pplx-space-common-grpc = { workspace = true }
pplx-space-service-host = { workspace = true }
pplx-space-test-env = { workspace = true }
rstest = { workspace = true }
tonic-health = { workspace = true }
tracing-subscriber = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` so the codec
# admission tests can assert a blocked acquire without real-time sleeps.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
