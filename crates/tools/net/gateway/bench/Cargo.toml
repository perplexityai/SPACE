[package]
name = "pplx-space-net-gateway-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "netgtw-bench"
path = "src/main.rs"

[[bin]]
name = "netgtw-traffic-control"
path = "src/traffic_control.rs"

[dependencies]
anyhow = { workspace = true }
aws-lc-rs = { workspace = true }
clap = { workspace = true, features = ["derive"] }
jiff = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem", "x509-parser"] }
time = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-common-svc = { workspace = true }
pplx-space-credential-injection-core = { workspace = true }
pplx-space-spaced-common = { workspace = true }
pplx-space-net-common = { workspace = true, features = ["serde"] }
pplx-space-net-gateway = { workspace = true }
pplx-space-net-gateway-client = { workspace = true }
