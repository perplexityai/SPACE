[package]
name = "pplx-space-publish-load"
default-run = "publish-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[lints]
workspace = true

[[bin]]
name = "publish-load"
path = "src/main.rs"

[[bin]]
name = "publish-statements"
path = "src/statements.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
jiff = { workspace = true }
nix = { workspace = true, features = ["feature"] }
pplx-space-common-core = { workspace = true }
pplx-space-node-api-client = { workspace = true }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-net-common = { workspace = true }
pplx-space-state-reconciliation = { workspace = true }
pplx-space-rustls-provider = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-sql-locator = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "json"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true, features = ["tls-native-roots"] }
uuid = { workspace = true }
