[package]
name = "pplx-space-spaced-loopback-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "spaced-loopback-test"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
nix = { workspace = true, features = ["net"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-util", "net", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# internal
pplx-space-spaced-common = { workspace = true }
pplx-space-spaced-guest-server = { workspace = true, features = ["loopback-diagnostic"] }
