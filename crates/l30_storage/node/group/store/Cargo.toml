[package]
name = "pplx-space-node-group-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["node_group_template_compat", "node_groups"]

[lints]
workspace = true

[dependencies]
sqlx = { workspace = true, features = ["derive", "postgres", "time", "uuid"] }
time = { workspace = true }
uuid = { workspace = true }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-node-model = { workspace = true, features = ["sqlx"] }
pplx-space-postgres-pool = { workspace = true }
pplx-space-sql-locator = { workspace = true }
pplx-space-template-model = { workspace = true, features = ["sqlx"] }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
