[package]
name = "pplx-space-node-registration-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["node_k8s", "nodes"]

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["derive", "json", "postgres"] }
thiserror = { workspace = true }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-node-model = { workspace = true, features = ["sqlx"] }
pplx-space-k8s-ids = { workspace = true }
pplx-space-k8s-node-id = { workspace = true }
pplx-space-node-drain = { workspace = true }
pplx-space-sandbox-model = { workspace = true, features = ["sqlx"] }
pplx-space-sandbox-residency = { workspace = true }
pplx-space-sql-locator = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
