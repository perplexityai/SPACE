[package]
name = "pplx-space-node-execution-inventory-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = [
    "node_artifact_components",
    "node_runtime_guests",
    "node_runtime_installations",
    "node_runtime_state_formats",
]

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["derive", "json", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs", "uuid"] }
time = { workspace = true }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-sql-locator = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
