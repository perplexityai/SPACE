[package]
name = "pplx-space-node-mgr-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
sqlite.node-manager = [
  "network_pool_meta",
  "network_slots",
  "sandbox_executions",
]

[lints]
workspace = true

[features]
default = []
# Exposes the raw connection to node-manager's test suites, which enable it
# as a dev-dependency to seed and inspect the database directly.
test-support = []

[dependencies]
ref-cast = { workspace = true }
rusqlite = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate"] }
thiserror = { workspace = true }

# internal
pplx-space-node-mgr-protocol = { workspace = true }
pplx-space-sandbox-model = { workspace = true }
pplx-space-sql-locator = { workspace = true }
pplx-space-sqlite = { workspace = true }
