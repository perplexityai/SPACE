[package]
name = "pplx-space-node-template-inventory-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["node_template_components", "node_template_inventory"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["derive", "json", "postgres", "uuid"] }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-execution-spec = { workspace = true }
pplx-space-node-model = { workspace = true, features = ["sqlx"] }
pplx-space-sql-locator = { workspace = true }
pplx-space-template-model = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt"] }
uuid = { workspace = true, features = ["v7"] }
