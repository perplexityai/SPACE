[package]
name = "pplx-space-node-status-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["node_status_snapshots"]

[lints]
workspace = true

[features]
# Snapshot seeding for other crates' tests; enable only from [dev-dependencies].
test-support = []

[dependencies]
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["derive", "json", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = { workspace = true }
time = { workspace = true }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-execution-spec = { workspace = true, features = ["serde"] }
pplx-space-sandbox-residency = { workspace = true }
pplx-space-sql-locator = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
