[package]
name = "pplx-space-node-runtime-manager-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
sqlite.runtime-manager = ["jobs", "operation_results"]

[lints]
workspace = true

[features]
default = []
# Exposes the raw connection to runtime-manager's test suites, which enable it
# as a dev-dependency to seed and inspect the database directly.
test-support = []

[dependencies]
jiff = { workspace = true }
ref-cast = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate"] }
thiserror = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }

# internal
pplx-space-common-jobs = { workspace = true }
pplx-space-content-digest = { workspace = true }
pplx-space-job-id = { workspace = true, features = ["rusqlite"] }
pplx-space-sql-locator = { workspace = true }
pplx-space-sqlite = { workspace = true }
