[package]
name = "pplx-space-data-plane-session-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["data_plane_org_revocation_epochs", "data_plane_sessions"]

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["derive", "json", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs", "uuid"] }
time = { workspace = true }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-k8s-ids = { workspace = true, features = ["sqlx"] }
pplx-space-sandbox-model = { workspace = true, features = ["sqlx"] }
pplx-space-sql-locator = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
