[package]
name = "pplx-space-firewall-rules-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = [
    "firewall_rules_rollouts",
    "firewall_rules_rollout_items",
    "firewall_rules_revisions",
    "firewall_rules_control",
    "firewall_rules_node_assignments",
    "firewall_rules_node_observations",
]

[lints]
workspace = true

[features]
# Rollout seeding for other crates' tests; enable only from [dev-dependencies].
test-support = ["dep:tokio"]

[dependencies]
jiff = { workspace = true }
sqlx = { workspace = true, features = ["derive", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["time"], optional = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-firewall-rules-model = { workspace = true }
pplx-space-firewall-rules-protocol = { workspace = true }
pplx-space-rollout-queue = { workspace = true }
pplx-space-sql-locator = { workspace = true }

[dev-dependencies]
pplx-space-cluster-trigger-queue = { workspace = true }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-node-status-store = { workspace = true, features = ["test-support"] }
pplx-space-state-reconciliation = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
