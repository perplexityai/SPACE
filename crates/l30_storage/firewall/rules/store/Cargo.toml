[package]
name = "pplx-space-firewall-rules-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = [
    "firewall_rules_rollouts",
    "firewall_rules_rollout_items",
    "firewall_rules_revisions",
    "firewall_rules_control",
    "firewall_rules_node_assignments",
    "firewall_rules_node_observations",
    "firewall_rules_mutation_receipts",
]

[lints]
workspace = true

[dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["json", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
uuid = { workspace = true }

# internal
pplx-space-sql-locator = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
uuid = { workspace = true, features = ["v7"] }
