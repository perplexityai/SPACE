[package]
name = "pplx-space-accounts-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["api_keys", "clusters", "organizations", "sessions", "users"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["derive", "postgres", "time", "uuid"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde-human-readable"] }
uuid = { workspace = true, features = ["serde"] }

# internal
pplx-space-accounts = { workspace = true, features = ["serde", "sqlx"] }
pplx-space-sql-locator = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
