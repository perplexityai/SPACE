[package]
name = "pplx-space-direct-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["node_direct", "sandbox_direct_route_identities", "sandbox_direct_route_provenance"]

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["derive", "json", "postgres", "time", "uuid"] }
time = { workspace = true }
uuid = { workspace = true }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-postgres-pool = { workspace = true }
pplx-space-sandbox-model = { workspace = true, features = ["sqlx"] }
pplx-space-sql-locator = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-node-model = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
