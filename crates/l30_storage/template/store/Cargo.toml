[package]
name = "pplx-space-template-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = [
    "template_base_snapshot_policies",
    "template_build_base_grants",
    "template_build_blobs",
    "template_build_jobs",
    "template_default_auto_lifecycle_policies",
    "template_pool_policies",
    "template_release_tags",
    "template_system_publication_grants",
    "template_tenant_publication_grants",
    "templates",
]

[lints]
workspace = true

[features]
# Tag seeding for other crates' tests; enable it only from
# [dev-dependencies].
test-support = []

[dependencies]
sqlx = { workspace = true, features = ["derive", "json", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs", "uuid"] }
time = { workspace = true }
uuid = { workspace = true }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-auto-lifecycle = { workspace = true, features = ["serde"] }
pplx-space-net-common = { workspace = true, features = ["serde"] }
pplx-space-sql-locator = { workspace = true }
pplx-space-template-model = { workspace = true, features = ["sqlx"] }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
