[package]
name = "pplx-space-template-release-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["template_release_storage_locations", "template_releases"]

[lints]
workspace = true

[features]
# An in-memory `ReleaseObjects` for other crates' tests; enable it only from
# [dev-dependencies].
test-support = []

[dependencies]
async-trait = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-credential-types = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["derive", "json", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true }

# internal
pplx-space-artifact-model = { workspace = true }
pplx-space-content-digest = { workspace = true }
pplx-space-execution-spec = { workspace = true }
pplx-space-object-store = { workspace = true }
pplx-space-sql-locator = { workspace = true }
pplx-space-template-release-original = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
