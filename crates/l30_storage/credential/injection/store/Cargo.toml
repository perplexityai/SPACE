[package]
name = "pplx-space-credential-injection-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["credential_references"]

[lints]
workspace = true

[dependencies]
pplx-space-common-core = { workspace = true, features = ["sqlx", "serde"] }
pplx-space-credential-injection-core = { workspace = true }
pplx-space-net-common = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["derive", "json", "postgres", "uuid"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
