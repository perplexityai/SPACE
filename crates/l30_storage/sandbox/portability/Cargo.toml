[package]
name = "pplx-space-sandbox-portability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = []

[lints]
workspace = true

[features]
default = []
# Exposes `ExecutionSupersessionRow::new` and `drain_gate_blocks_source_release`
# to other crates' test suites as a dev-dependency feature: the constructor for
# the cluster controller's orphaned-restore-pod GC tests, and the drain gate's
# reference predicate for the api's `live_residents_tests`. This crate's unit
# tests get them under `cfg(test)`.
test-support = []

[dependencies]
pplx-space-sandbox-model = { workspace = true }
pplx-space-snapshot-model = { workspace = true }

[dev-dependencies]
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-net-common = { workspace = true, features = ["serde"] }
pplx-space-snapshot-model = { workspace = true, features = ["sqlx"] }
pplx-space-sql-locator = { workspace = true }
pplx-space-test-env = { workspace = true }
sqlx = { workspace = true, features = ["json", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs"] }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
uuid = { workspace = true }
