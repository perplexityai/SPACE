[package]
name = "pplx-space-sandbox-quarantine-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["sandbox_quarantine_history", "sandbox_quarantine_state"]

[lints]
workspace = true

[dependencies]
sqlx = { workspace = true, features = ["derive", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs", "uuid"] }
time = { workspace = true }
uuid = { workspace = true }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-common-core = { workspace = true, features = ["sqlx"] }
pplx-space-sandbox-model = { workspace = true, features = ["sqlx"] }
pplx-space-sql-locator = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
