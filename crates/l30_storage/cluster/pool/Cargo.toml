[package]
name = "pplx-space-cluster-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = [
  "kubernetes_pool_configs",
  "kubernetes_pool_slots",
  "warm_pool_policies",
]

[lints]
workspace = true

[features]
default = ["kubernetes"]
kubernetes = [
    "dep:pplx-space-byte-size",
    "dep:pplx-space-common-core",
    "dep:pplx-space-content-digest",
    "dep:pplx-space-execution-spec",
    "dep:serde",
    "dep:sqlx",
    "dep:thiserror",
    "dep:time",
    "dep:uuid",
]

[dependencies]
pplx-space-byte-size = { workspace = true, features = ["serde"], optional = true }
pplx-space-common-core = { workspace = true, features = ["serde", "sqlx"], optional = true }
pplx-space-content-digest = { workspace = true, features = ["serde"], optional = true }
pplx-space-execution-spec = { workspace = true, features = ["serde"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
sqlx = { workspace = true, features = ["derive", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs", "uuid"], optional = true }
thiserror = { workspace = true, optional = true }
time = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v7"], optional = true }

[dev-dependencies]
pplx-space-accounts = { workspace = true, features = ["serde", "sqlx"] }
pplx-space-db-test-fixtures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
