[package]
name = "pplx-space-public-operation-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = [
  "public_idempotency_records",
  "public_operation_events",
  "public_operations",
]

[lints]
workspace = true

[features]
default = []
# Exposes `test_support`, the statement texts of `operations::inline_org_at_limit`
# and `quota::sandboxes_held`, to the api's plan-cost tests as a
# dev-dependency feature. This crate's unit tests get it under `cfg(test)`.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["derive", "json", "postgres", "time", "uuid"] }
time = { workspace = true }
uuid = { workspace = true }

# internal
pplx-space-accounts = { workspace = true, features = ["sqlx"] }
pplx-space-postgres-pool = { workspace = true }
pplx-space-public-api = { workspace = true }
pplx-space-sandbox-model = { workspace = true }
pplx-space-sql-locator = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-execution-spec = { workspace = true }
pplx-space-runtime-upgrade-campaign-store = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
