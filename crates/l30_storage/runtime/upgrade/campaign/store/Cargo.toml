[package]
name = "pplx-space-runtime-upgrade-campaign-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["runtime_upgrade_campaigns", "runtime_upgrade_items"]

[lints]
workspace = true

[features]
# Campaign seeding for other crates' tests; enable only from [dev-dependencies].
test-support = []

[dependencies]
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["derive", "json", "postgres", "runtime-tokio", "time", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-common-core = { workspace = true, features = ["sqlx"] }
pplx-space-node-status-store = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-node-status-store = { workspace = true, features = ["test-support"] }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
