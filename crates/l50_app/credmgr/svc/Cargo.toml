[package]
name = "pplx-space-credmgr-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "space-credmgr-svc"
path = "src/main.rs"

[features]
default = []
otel = [
    "pplx-space-service-host/otel",
    "pplx-space-credmgr/otel",
]
datadog = [
    "otel",
    "pplx-space-service-host/datadog",
    "pplx-space-credmgr/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# internal
pplx-space-credmgr = { workspace = true }
pplx-space-host-layout = { workspace = true }
pplx-space-service-host = { workspace = true }
pplx-space-service-lifecycle = { workspace = true }
pplx-space-tokio-runtime = { workspace = true }
