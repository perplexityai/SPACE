[package]
name = "pplx-space-node-runtime-supervisor-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "space-runtime-supervisor-svc"
path = "src/main.rs"

[features]
default = []
experimental-wasm = ["pplx-space-node-runtime-supervisor/experimental-wasm", "dep:serde_json"]
otel = ["pplx-space-node-runtime-supervisor/otel"]
datadog = ["otel", "pplx-space-node-runtime-supervisor/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
serde_json = { workspace = true, optional = true }

# internal
pplx-space-host-layout = { workspace = true }
pplx-space-node-runtime-supervisor = { workspace = true }
