[package]
name = "pplx-space-node-mgr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "space-nodemgr"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
pplx-space-execution-common = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
comfy-table = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "sync"] }
tonic = { workspace = true }
tokio-stream = { workspace = true }

# internal
pplx-space-common-cli = { workspace = true }
pplx-space-common-core = { workspace = true, features = ["serde"] }
pplx-space-node-api-client = { workspace = true }
pplx-space-node-mgr-client = { workspace = true }
