[package]
name = "pplx-space-node-mgr-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "space-nodemgr-svc"
path = "src/main.rs"

[features]
default = []
otel = [
    "pplx-space-service-host/otel",
    "pplx-space-node-mgr/otel",
]
datadog = [
    "otel",
    "pplx-space-service-host/datadog",
    "pplx-space-node-mgr/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
# Compiles in the test-only environment hooks; never enabled for release builds.
test-hooks = ["pplx-space-node-mgr/test-hooks"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# internal
pplx-space-node-mgr = { workspace = true }
pplx-space-service-host = { workspace = true }
pplx-space-service-lifecycle = { workspace = true }
pplx-space-tokio-runtime = { workspace = true }
