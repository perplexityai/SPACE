[package]
name = "pplx-space-sbx-mgr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "space-sbxmgr"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
comfy-table = { workspace = true }
jiff = { workspace = true }
nix = { workspace = true, features = ["user"] }
prost-types = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tonic = { workspace = true }

# internal
pplx-space-common-cli = { workspace = true }
pplx-space-common-core = { workspace = true }
pplx-space-net-common = { workspace = true }
pplx-space-net-gateway-client = { workspace = true }
pplx-space-node-api-client = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-template-mgr-client = { workspace = true }
