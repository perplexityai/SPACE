[package]
name = "pplx-space-net-gateway-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "space-netgtw-svc"
path = "src/main.rs"

[features]
default = []
otel = [
    "pplx-space-common-svc/otel",
    "pplx-space-net-gateway/otel",
]
datadog = [
    "otel",
    "pplx-space-common-svc/datadog",
    "pplx-space-net-gateway/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-common-svc = { workspace = true }
pplx-space-net-common = { workspace = true }
pplx-space-net-gateway = { workspace = true }
