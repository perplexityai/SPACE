[package]
name = "pplx-space-spaced-host-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "spaced-host"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

# internal
pplx-space-common-cli = { workspace = true }
pplx-space-common-core = { workspace = true }
pplx-space-spaced-host-client = { workspace = true }
prost-types = { workspace = true }

[dev-dependencies]
nix = { workspace = true, features = ["fs", "user"] }
pplx-space-spaced-guest-server = { workspace = true }
pplx-space-spaced-host-server = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio-util = { workspace = true }
