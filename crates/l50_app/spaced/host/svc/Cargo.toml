[package]
name = "pplx-space-spaced-host-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "space-spaced-host-svc"
path = "src/main.rs"

[features]
default = []
otel = [
    "pplx-space-common-svc/otel",
    "pplx-space-spaced-host-server/otel",
]
datadog = [
    "otel",
    "pplx-space-common-svc/datadog",
    "pplx-space-spaced-host-server/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

# internal
pplx-space-common-svc = { workspace = true }
pplx-space-spaced-host-server = { workspace = true }
