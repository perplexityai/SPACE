[package]
name = "pplx-space-spaced-guest-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "spaced-svc"
path = "src/main.rs"

[features]
default = []
otel = ["pplx-space-spaced-guest-server/otel"]
datadog = ["otel", "pplx-space-spaced-guest-server/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
# Compiles in the test-only environment hooks; never enabled for release builds.
test-hooks = ["pplx-space-spaced-guest-server/test-hooks"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

[target.'cfg(unix)'.dependencies]
pplx-space-spaced-guest-server = { workspace = true, features = ["service-entrypoint"] }

[target.'cfg(windows)'.dependencies]
pplx-space-spaced-guest-windows = { workspace = true }
tracing-subscriber = { workspace = true }
