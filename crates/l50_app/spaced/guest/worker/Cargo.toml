[package]
name = "pplx-space-spaced-guest-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "spaced-filesystem-worker"
path = "src/main.rs"

[[test]]
name = "embedding"
harness = false

[features]
default = []
otel = ["pplx-space-spaced-guest-execution/otel"]
datadog = ["otel", "pplx-space-spaced-guest-execution/datadog"]

[dependencies]
pplx-space-spaced-guest-execution = { workspace = true }

[dev-dependencies]
pplx-space-common-core = { workspace = true }
pplx-space-spaced-guest-protocol = { workspace = true }
pplx-space-test-env = { workspace = true }
futures-util = "0.3"
nix = { workspace = true, features = ["user", "fs", "process", "signal"] }
rustix = { workspace = true, features = ["fs", "thread"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
