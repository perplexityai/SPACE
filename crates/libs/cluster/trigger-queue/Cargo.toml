[package]
name = "pplx-space-cluster-trigger-queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.space.state]
postgres = ["node_reconcile_triggers"]

[lints]
workspace = true

[dependencies]
sqlx = { workspace = true, features = ["derive", "migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-common-core = { workspace = true, features = ["sqlx"] }
pplx-space-common-svc = { workspace = true }
pplx-space-metrics = { workspace = true }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
