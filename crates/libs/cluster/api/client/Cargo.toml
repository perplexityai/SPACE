[package]
name = "pplx-space-cluster-api-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
kubernetes = ["dep:pplx-space-common-grpc-lb", "pplx-space-common-grpc-lb/k8s"]

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-common-grpc = { workspace = true, features = ["internal-tls"] }
pplx-space-common-grpc-lb = { workspace = true, optional = true }
pplx-space-common-svc = { workspace = true }
pplx-space-execution-common = { workspace = true }
pplx-space-net-common = { workspace = true }
pplx-space-node-api-types = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-template-mgr-client = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
pplx-space-common-proto-build = { workspace = true }
tonic-prost-build = { workspace = true }
