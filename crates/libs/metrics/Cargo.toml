[package]
name = "pplx-space-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-capture = ["pplx-space-metrics-emit/test-capture"]

[dependencies]
metrics = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-grpc-metrics = { workspace = true }
pplx-space-metrics-emit = { workspace = true }
pplx-space-observability = { workspace = true, default-features = false }

[dev-dependencies]
# Unit tests here assert on captured values, so they need the capture the
# emit crate builds only with `test-capture`.
pplx-space-metrics-emit = { workspace = true, features = ["test-capture"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name = "metrics_workload"
required-features = ["pplx-space-observability/otlp-metrics"]
