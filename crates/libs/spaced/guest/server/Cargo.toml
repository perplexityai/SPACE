[package]
name = "pplx-space-spaced-guest-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[test]]
name = "worker_subprocess"
path = "tests/worker_subprocess.rs"
harness = false

[[test]]
name = "worker_telemetry"
path = "tests/worker_telemetry.rs"
harness = false
required-features = ["otel"]

[lints]
workspace = true

[features]
# The service entry point: process-mode dispatch, telemetry init, the Tokio
# runtime, and the readiness loop that `spaced-svc`'s `main` calls. Off by
# default because it is the only thing here that needs `common-svc`: consumers
# that link this crate for its service types or `test-support` -- the in-VM
# loopback diagnostic, the spaced host test suites -- would otherwise compile
# `common-svc`'s Postgres, Redis, and TLS stack to reach code they never call.
service-entrypoint = ["dep:pplx-space-common-svc"]
# Compiles in the test-only environment hooks; never enabled for release builds.
test-hooks = ["pplx-space-common-core/test-hooks"]
# Forwards to `common-svc`'s telemetry pipeline. The entry point is where
# this crate initializes telemetry, so the gate has to reach it rather than the
# binary, and it implies the entry point it configures.
otel = ["service-entrypoint", "pplx-space-common-svc/otel"]
datadog = ["otel", "service-entrypoint", "pplx-space-common-svc/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
# Exposes the in-VM loopback diagnostic without stabilizing runtime internals.
test-support = []

[dependencies]
dashmap = { workspace = true }
futures-util = { version = "0.3" }
globset = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
nix = { workspace = true, features = ["signal", "process", "user", "net", "fs", "term", "time", "poll"] }
libc = { workspace = true }
rustix = { workspace = true, features = ["fs", "process", "pty", "termios"] }
notify = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "io-util", "net", "fs", "process", "sync"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["codec"] }
tokio-vsock = { workspace = true, features = ["tonic014"] }
tonic = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-common-connection-admission = { workspace = true }
pplx-space-common-core = { workspace = true }
pplx-space-common-grpc = { workspace = true }
pplx-space-common-svc = { workspace = true, optional = true }
pplx-space-metrics = { workspace = true }
pplx-space-observability = { workspace = true }
pplx-space-spaced-common = { workspace = true }
prost-types = { workspace = true }

[dev-dependencies]
pplx-space-common-core = { workspace = true, features = ["test-hooks"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "metrics"] }
pplx-space-spaced-guest-client = { workspace = true }
pplx-space-observability = { workspace = true, features = ["test-capture"] }
h2 = { workspace = true }
prost = { workspace = true }
pplx-space-test-env = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` so the
# port-forward bind-retry/backoff tests run on virtual time.
tokio = { workspace = true, features = ["test-util"] }
