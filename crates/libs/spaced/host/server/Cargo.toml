[package]
name = "pplx-space-spaced-host-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = []
# Telemetry pipelines forward to `common-svc`, which is where this
# crate's service telemetry is initialized.
otel = ["pplx-space-common-svc/otel"]
datadog = ["otel", "pplx-space-common-svc/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
tower = { workspace = true }
http-body = { workspace = true }
thiserror = { workspace = true }
futures-util = { version = "0.3" }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

# internal
pplx-space-common-connection-admission = { workspace = true }
pplx-space-common-core = { workspace = true }
pplx-space-common-grpc = { workspace = true }
pplx-space-common-svc = { workspace = true }
pplx-space-metrics = { workspace = true }
pplx-space-spaced-common = { workspace = true }
prost-types = { workspace = true }

[dev-dependencies]
pplx-space-spaced-host-server = { path = ".", features = ["test-support"] }
pplx-space-spaced-host-client = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
pplx-space-spaced-guest-server = { workspace = true }
anyhow = { workspace = true }
pplx-space-net-common = { workspace = true }
tempfile = { workspace = true }
prost-types = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
