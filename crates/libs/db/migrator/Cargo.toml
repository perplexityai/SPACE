[package]
name = "pplx-space-db-migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bcrypt = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
rusqlite = { workspace = true }
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "runtime-tokio", "sqlite-bundled", "tls-rustls-aws-lc-rs"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }

# internal
pplx-space-common-svc = { workspace = true, features = ["sqlite"] }
pplx-space-sbx-mgr-store = { workspace = true }

[dev-dependencies]
pplx-space-common-jobs = { workspace = true }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
