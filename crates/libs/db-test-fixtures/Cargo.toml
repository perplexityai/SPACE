[package]
name = "pplx-space-db-test-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# No `test-hooks`: this is a workspace member with normal dependencies, so a
# feature enabled here unifies into every release build that resolves the
# whole workspace. The crate reads its own variables directly instead.
pplx-space-common-core = { workspace = true, features = ["serde", "sqlx"] }
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
pplx-space-test-env = { workspace = true }
tempfile = { workspace = true }
