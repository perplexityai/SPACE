[package]
name = "pplx-space-sandbox-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["derive", "json", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid", "time"] }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-common-core = { workspace = true, features = ["sqlx", "serde"] }
pplx-space-sandbox-portability = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-placement = { workspace = true, features = ["test-support"] }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
