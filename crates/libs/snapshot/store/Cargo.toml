# internal
pplx-space-common-core = { workspace = true, features = ["serde", "sqlx"] }

[dev-dependencies]
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
