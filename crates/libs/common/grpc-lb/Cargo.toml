[package]
name = "pplx-space-common-grpc-lb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
k8s = ["dep:k8s-openapi", "dep:kube"]

[dependencies]
futures-util = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
tonic = { workspace = true }
tracing = { workspace = true }

k8s-openapi = { workspace = true, features = ["v1_32"], optional = true }
kube = { workspace = true, default-features = false, features = ["aws-lc-rs", "client", "config", "runtime", "rustls-tls"], optional = true }

# internal
pplx-space-grpc-metrics = { workspace = true }
pplx-space-observability = { workspace = true }

[dev-dependencies]
http = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream = { workspace = true, features = ["net"] }
tower = { workspace = true }
