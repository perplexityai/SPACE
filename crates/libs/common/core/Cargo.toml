[package]
name = "pplx-space-common-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-lc-rs = { workspace = true, optional = true }
pplx-space-accounts = { workspace = true }
pplx-space-auto-lifecycle = { workspace = true }
pplx-space-byte-size = { workspace = true }
pplx-space-cluster-id = { workspace = true }
pplx-space-content-digest = { workspace = true }
pplx-space-cpu-arch = { workspace = true }
pplx-space-durations = { workspace = true }
pplx-space-env-vars = { workspace = true }
pplx-space-execution-spec = { workspace = true }
pplx-space-guest-process = { workspace = true }
pplx-space-host-layout = { workspace = true }
pplx-space-job-id = { workspace = true }
pplx-space-k8s-ids = { workspace = true }
pplx-space-linux-ids = { workspace = true }
pplx-space-net-common = { workspace = true }
pplx-space-network-roles = { workspace = true }
pplx-space-rpc-contracts = { workspace = true }
pplx-space-semver = { workspace = true }
pplx-space-sql-locator = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["postgres", "uuid"], optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7"] }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []
archive = ["dep:aws-lc-rs"]
serde = [
    "dep:serde",
    "dep:serde_json",
    "pplx-space-byte-size/serde",
    "pplx-space-content-digest/serde",
    "pplx-space-durations/serde",
    "uuid/serde",
    "pplx-space-semver/serde",
    "pplx-space-cpu-arch/serde",
    "pplx-space-k8s-ids/serde",
    "pplx-space-cluster-id/serde",
    "pplx-space-guest-process/serde",
    "pplx-space-accounts/serde",
    "pplx-space-execution-spec/serde",
    "pplx-space-linux-ids/serde",
    "pplx-space-network-roles/serde",
    "pplx-space-auto-lifecycle/serde",
]
sqlx = [
    "dep:sqlx",
    "pplx-space-semver/sqlx",
    "pplx-space-k8s-ids/sqlx",
    "pplx-space-accounts/sqlx",
]
