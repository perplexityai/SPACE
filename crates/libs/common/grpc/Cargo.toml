[package]
name = "pplx-space-common-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
internal-tls = ["tonic/tls-aws-lc", "tokio/fs", "dep:tokio-util"]
test-support = []

[dependencies]
futures-core = { workspace = true }
tokio-util = { workspace = true, optional = true }
http = { workspace = true }
http-body = { workspace = true }
bytes = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "tokio"] }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "time", "sync"] }
tonic = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["metrics", "trace"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-grpc-metrics = { workspace = true }
pplx-space-observability = { workspace = true }

[dev-dependencies]
tokio-util = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
pplx-space-metrics-emit = { workspace = true, features = ["test-capture"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic-health = { workspace = true }
