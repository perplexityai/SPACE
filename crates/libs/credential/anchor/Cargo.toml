[package]
name = "pplx-space-sandbox-anchor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-lc-rs = { workspace = true }
hex = { workspace = true }
# Prototype-only exception: AWS-LC has no production RFC 6979 signing API.
# This dependency must undergo security review before production enablement.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem", "x509-parser"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
x509-parser = { workspace = true, features = ["verify-aws"] }
