[package]
name = "pplx-space-node-runtime-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
host-runtime = ["dep:aws-lc-rs", "dep:nix", "dep:rustix", "dep:serde", "dep:subtle", "dep:zeroize", "dep:pplx-space-net-common"]

[dependencies]
aws-lc-rs = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["process", "thread"], optional = true }
nix = { workspace = true, features = ["fs", "sched", "process", "resource", "signal", "user", "poll"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
prost = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-common-svc = { workspace = true }
pplx-space-execution-common = { workspace = true }
pplx-space-net-common = { workspace = true, features = ["host-sockets"], optional = true }

[build-dependencies]
anyhow = { workspace = true }
pplx-space-common-proto-build = { workspace = true }
tonic-prost-build = { workspace = true }
[dev-dependencies]
pplx-space-test-env = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros"] }
