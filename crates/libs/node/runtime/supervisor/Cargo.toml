[package]
name = "pplx-space-node-runtime-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
otel = ["pplx-space-common-svc/otel"]
datadog = ["otel", "pplx-space-common-svc/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
dashmap = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["process", "signal", "fs", "user", "sched", "mount", "resource"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-execution-common = { workspace = true }
pplx-space-common-svc = { workspace = true }
pplx-space-node-runtime-core = { workspace = true, features = ["host-runtime", "artifact-store"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }
