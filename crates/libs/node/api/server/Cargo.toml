[package]
name = "pplx-space-node-api-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-hooks = ["pplx-space-common-svc/test-hooks"]
default = []
otel = ["pplx-space-template-mgr-client/otel"]
datadog = ["otel", "pplx-space-template-mgr-client/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
# Opt-in Kubernetes projected-token (TokenReview) auth, which pulls in the kube
# stack. Off by default so the workspace builds without kube for non-k8s
# deployments (dev box, UTM, self-deploy); prod image builds enable it. Forwards
# to `common-svc`'s `k8s` feature, which is where the node-api auth layer this
# crate installs reads its TokenReview configuration.
k8s = ["pplx-space-common-svc/k8s", "dep:kube"]

[dependencies]
bytes = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
hyper-util = { workspace = true }
kube = { workspace = true, default-features = false, features = ["client", "config", "rustls-tls"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["macros", "net", "sync", "rt", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-build-mgr-client = { workspace = true }
pplx-space-common-core = { workspace = true, features = ["serde"] }
pplx-space-common-grpc = { workspace = true, features = ["internal-tls"] }
pplx-space-common-svc = { workspace = true }
pplx-space-metrics = { workspace = true }
pplx-space-net-common = { workspace = true, features = ["serde"] }
pplx-space-net-gateway-client = { workspace = true }
pplx-space-node-api-client = { workspace = true }
pplx-space-node-mgr-client = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-template-mgr-client = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
axum = { workspace = true }
pplx-space-test-env = { workspace = true }
pplx-space-common-svc = { workspace = true, features = ["test-support", "test-hooks"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
tonic = { workspace = true }
