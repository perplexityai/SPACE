[package]
name = "pplx-space-node-api-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
kubernetes = ["dep:pplx-space-common-grpc-lb", "pplx-space-common-grpc-lb/k8s"]

[dependencies]
hyper-util = { workspace = true, features = ["tokio"] }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true, features = ["net", "sync"] }
thiserror = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

# internal
pplx-space-bearer-token = { workspace = true }
pplx-space-build-mgr-client = { workspace = true }
pplx-space-common-core = { workspace = true }
pplx-space-common-grpc = { workspace = true, features = ["internal-tls"] }
pplx-space-common-grpc-lb = { workspace = true, optional = true }
pplx-space-execution-common = { workspace = true }
pplx-space-net-common = { workspace = true }
pplx-space-net-gateway-client = { workspace = true }
pplx-space-node-mgr-client = { workspace = true }
pplx-space-observability = { workspace = true }
pplx-space-sbx-mgr-client = { workspace = true }
pplx-space-template-mgr-client = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
pplx-space-common-proto-build = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
rustls = { workspace = true, features = ["aws_lc_rs"] }
bytes = { workspace = true }
http-body-util = { workspace = true }
pplx-space-test-env = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tokio-stream = { workspace = true, features = ["net"] }
