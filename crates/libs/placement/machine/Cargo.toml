[package]
name = "pplx-space-placement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Exposes `test_support` to other crates' test suites as a dev-dependency
# feature: `StoredSandboxLifecycle::all`, every value Postgres
# `sandboxes.lifecycle` can hold, and the reader for writer × stored-lifecycle
# expectation tables. This crate's unit tests get it under `cfg(test)`.
test-support = []

[dependencies]
jiff = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# internal
pplx-space-common-core = { workspace = true, features = ["sqlx"] }

[dev-dependencies]
futures-util = { workspace = true }
pplx-space-db-test-fixtures = { workspace = true }
pplx-space-test-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
