[package]
name = "pplx-space-kube-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
http = { workspace = true }
http-body = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_32"] }
kube = { workspace = true, default-features = false, features = ["client", "config", "runtime", "rustls-tls"] }
pin-project-lite = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }

# internal
pplx-space-observability = { workspace = true }

[dev-dependencies]
pplx-space-observability = { workspace = true, features = ["test-capture"] }
tracing-subscriber = { workspace = true }
