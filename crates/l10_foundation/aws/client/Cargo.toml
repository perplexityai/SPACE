[package]
name = "pplx-space-aws-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true, features = ["http1", "sign-http"] }
aws-smithy-async = { workspace = true, features = ["rt-tokio"] }
aws-smithy-http-client = { workspace = true, features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { workspace = true, features = ["client", "http-1x"] }
aws-smithy-types = { workspace = true }
aws-smithy-xml = { workspace = true }
aws-types = { workspace = true }
form_urlencoded = { workspace = true }
http = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
