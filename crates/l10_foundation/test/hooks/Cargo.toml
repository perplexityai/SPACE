[package]
name = "pplx-space-test-hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pplx-space-env-vars = { workspace = true }

[features]
default = []
# Compiles in the test-only environment overrides (see `test_hook`). Only
# kind and smoke images and test builds enable it; release binaries cannot read
# these variables, so they are not part of the public configuration surface.
# Enable it only from `[features]` or `[dev-dependencies]`: a workspace member
# that enables it in its normal dependencies reaches the release builds, which
# ci/scripts/check-release-build-features.sh fails.
test-hooks = []
