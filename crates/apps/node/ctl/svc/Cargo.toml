[package]
name = "pplx-space-node-ctl-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "space-nodectl-svc"
path = "src/main.rs"

[[test]]
name = "handoff"
path = "tests/handoff.rs"
required-features = ["test-hooks"]

[features]
default = []
otel = [
    "pplx-space-common-svc/otel",
    "pplx-space-node-ctl-server/otel",
]
datadog = [
    "otel",
    "pplx-space-common-svc/datadog",
    "pplx-space-node-ctl-server/datadog",
]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]
kubernetes = ["pplx-space-node-ctl-server/kubernetes"]
# Compiles in the test-only flags; never enabled for release builds.
test-hooks = []

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-common-svc = { workspace = true }
pplx-space-node-ctl-server = { workspace = true }

[dev-dependencies]
hyper-util = { workspace = true, features = ["tokio"] }
nix = { workspace = true, features = ["signal", "user"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
tonic = { workspace = true }
tonic-health = { workspace = true }
tower = { workspace = true, features = ["util"] }
