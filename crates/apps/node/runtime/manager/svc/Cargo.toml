[package]
name = "pplx-space-runtime-manager-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "space-rtmgr-svc"
path = "src/main.rs"

[features]
default = []
otel = ["pplx-space-node-runtime-manager/otel"]
datadog = ["otel", "pplx-space-node-runtime-manager/datadog"]
# Deprecated for one release; use otel and datadog.
datadog-otel = ["otel", "datadog"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }

# internal
pplx-space-common-core = { workspace = true }
pplx-space-common-svc = { workspace = true }
pplx-space-node-runtime-core = { workspace = true }
pplx-space-node-runtime-manager = { workspace = true, features = ["github", "s3"] }
