[package]
name = "pplx-space-execution-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "pplx-space-common-core/serde", "pplx-space-content-digest/serde", "pplx-space-cpu-arch/serde"]

[dependencies]
aws-lc-rs = { workspace = true }
pplx-space-content-digest = { workspace = true }
pplx-space-cpu-arch = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
prost = { workspace = true }
pplx-space-common-core = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true, default-features = false }

[build-dependencies]
anyhow = { workspace = true }
pplx-space-common-proto-build = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
pplx-space-common-core = { workspace = true, features = ["serde"] }
