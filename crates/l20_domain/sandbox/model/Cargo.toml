[package]
name = "pplx-space-sandbox-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pplx-space-accounts = { workspace = true }
pplx-space-byte-size = { workspace = true }
pplx-space-env-vars = { workspace = true }
pplx-space-k8s-ids = { workspace = true }
pplx-space-linux-ids = { workspace = true }
pplx-space-node-model = { workspace = true }
pplx-space-sql-codec = { workspace = true, optional = true }
pplx-space-uuid-id = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []
serde = [
    "dep:serde",
    "pplx-space-accounts/serde",
    "pplx-space-k8s-ids/serde",
    "pplx-space-node-model/serde",
]
sqlx = [
    "dep:pplx-space-sql-codec",
    "dep:pplx-space-uuid-id",
    "pplx-space-sql-codec/postgres",
]
