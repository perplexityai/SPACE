[package]
name = "pplx-space-admin-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pplx-space-accounts = { workspace = true, optional = true }
pplx-space-execution-spec = { workspace = true, optional = true }
pplx-space-node-model = { workspace = true, optional = true }
pplx-space-sandbox-model = { workspace = true, optional = true }
pplx-space-template-model = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = []
serde = [
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "pplx-space-accounts/serde",
    "pplx-space-execution-spec/serde",
    "pplx-space-node-model/serde",
    "pplx-space-sandbox-model/serde",
    "pplx-space-template-model/serde",
]
