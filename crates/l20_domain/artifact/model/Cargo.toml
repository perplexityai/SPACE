pplx-space-host-layout = { workspace = true }
pplx-space-sandbox-model = { workspace = true }
pplx-space-snapshot-model = { workspace = true }
pplx-space-template-model = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
