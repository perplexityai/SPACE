[package]
name = "pplx-space-artifact-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pplx-space-byte-size = { workspace = true }
pplx-space-content-digest = { workspace = true }
