[package]
name = "pplx-space-node-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pplx-space-accounts = { workspace = true }
pplx-space-k8s-ids = { workspace = true }
pplx-space-sql-codec = { workspace = true, optional = true }
pplx-space-template-model = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[features]
default = []
serde = ["dep:serde"]
# Forwards TemplateVisibility's codec, which api's node-group SQL gets through
# sandbox-store, as Cargo unifies features.
sqlx = [
    "dep:pplx-space-sql-codec",
    "pplx-space-sql-codec/postgres",
    "pplx-space-template-model/sqlx",
]
