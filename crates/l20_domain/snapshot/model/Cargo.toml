[package]
name = "pplx-space-snapshot-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pplx-space-byte-size = { workspace = true }
pplx-space-execution-spec = { workspace = true }
pplx-space-job-id = { workspace = true, optional = true }
pplx-space-sql-codec = { workspace = true, optional = true }
pplx-space-template-model = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[features]
default = []
serde = ["dep:serde"]
sqlx = [
    "dep:pplx-space-job-id",
    "dep:pplx-space-sql-codec",
    "pplx-space-sql-codec/postgres",
]
