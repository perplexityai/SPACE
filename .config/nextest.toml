experimental = ["setup-scripts"]

[scripts.setup.postgres]
command = "bash ci/scripts/setup-nextest-postgres.sh"
slow-timeout = { period = "30s", terminate-after = 4 }

[scripts.setup.redis]
command = "bash ci/scripts/setup-nextest-redis.sh"
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.scripts]]
# The migrator's bootstrap-role tests exercise cluster-global Postgres roles
# (fixed names like space_migrator) and each needs a virgin server, so they
# stay on their own bespoke per-test container rather than the shared one.
# The migrator's collision-repair and lock-retry tests only touch database-local
# state (migration history and probe tables), so they use the shared server
# too, via the raw (unmigrated) database fixture rather than the migrated
# template every other rdeps(pplx-space-db-test-fixtures) test clones from.
# Its user_password tests are database-local as well and already clone the
# migrated template through pg_test_db, so the package-wide exclusion above
# only cost them their own container and their own copy of the template. Its
# postgres_baseline_tests take the raw fixture too, and without the shared
# server they would need a Docker socket the default CI job does not have.
# Spaced host tests use only local sockets; common-svc's dev dependency
# otherwise pulls them into this transitive fixture selection.
filter = '''
(rdeps(pplx-space-db-test-fixtures)
 and not package(pplx-space-db-migrate)
 and not package(pplx-space-spaced-host-server))
or test(postgres_collision_repair_tests)
or test(postgres_lock_retry_tests)
or (package(pplx-space-db-migrate) and test(user_password::))
or (package(pplx-space-db-migrate) and test(postgres_baseline_tests::))
'''
setup = "postgres"

[[profile.default.scripts]]
# Publishes SPACE_TEST_REDIS_URL, which client_concurrency's and
# cluster_admission's Redis-backed tests already prefer over starting their
# own per-test container (see try_redis_url in both modules). Scoped to the
# api package only; nothing else in the workspace reads that env var.
filter = "package(pplx-space-api)"
setup = "redis"

[[profile.default.overrides]]
# nextest starts tests in binary order, and these binaries sort near the end,
# so each started a two-to-three-second test in the last seconds of a run
# whose slots were otherwise full, and the run waited on it. Starting them
# first leaves short tests at the tail instead.
filter = '''
binary_id(pplx-space-spaced-guest-server::worker_telemetry)
or binary_id(pplx-space-spaced-guest-server::it)
or package(pplx-space-volmgr)
'''
priority = 10

# Tests that need more than an ordinary user, and tests whose root path differs
# from their unprivileged one. GitHub CI runs `not group(privileged)` as an
# unprivileged user without a Docker socket, and this group as root in a
# separate --privileged container (ci/scripts/run-rust-checks.sh
# tests-unprivileged / tests-privileged).
#
# Keep one clause per line. Before any test runs, the unprivileged step checks
# that every clause matches at least one test and that each test it matches is
# in this group, so a renamed test, a typo, or an earlier override that assigns
# another group fails CI instead of quietly moving a test to the unprivileged
# half. It cannot detect a privileged test nobody listed: such a test must
# assert what it needs, so the unprivileged half fails, rather than return.
[test-groups.privileged]
max-threads = 8

[[profile.default.overrides]]
# 53 tests: 41 that exercise privilege in CI, and 12 opt-in tests that return
# early there because neither CI step opts them in.
#
# Root alone: identity_handoff, clone_tree, transfer_directory, the credmgr
# volume-socket tests and the spaced worker binaries switch between real
# service uids; rejects_bind_mounts_in_private_state also unshares a mount
# namespace (CAP_SYS_ADMIN). The router's descriptor reads use pidfd_getfd,
# which Docker's default seccomp profile allows only with CAP_SYS_PTRACE. The
# bootstrap-role tests each start a virgin Postgres container.
#
# Root path differs from the unprivileged one: encrypted_volumes reads as uid
# 65534 only as root; permission_tree rewrites ownership between distinct uids
# and covers the private shelter only as root; the credmgr binary-check test
# pins root's short-circuit as root. gateway_isolation and the
# net-gateway-client test return early when not root.
#
# Root only for an incidental step, until the test loses it: the build-mgr
# copy test escalates through sudo when not root, and the net-gateway
# exemption test's relay sets SO_MARK (CAP_NET_RAW).
#
# The 12 opt-in tests assert root, need kernel capabilities, or escalate once
# opted in, and return early in either half while unset: the loop-device test
# (it adds devices to the running kernel), the node-mgr btrfs fixtures, the
# containment benchmark, and build-mgr's real containerd and OCI assembly
# tests.
filter = '''
(binary_id(pplx-space-volmgr-svc::bin/space-volmgr-svc) and test(/^identity_handoff::tests::/))
or (package(pplx-space-node-mgr) and test(=clone_tree::tests::private_clone_blocks_foreign_uid_grafts_and_shared_clone_is_held))
or (package(pplx-space-node-mgr) and test(=loop_devices::tests::ensure_capacity_creates_attachable_devices_past_max_loop))
or (package(pplx-space-node-mgr) and test(=service::gateway_isolation::tests::isolated_gateway_cannot_access_vm_resources))
or (package(pplx-space-node-mgr) and test(=service::encrypted_volumes::tests::ciphertext_publication_is_readable_without_exposing_private_backings))
or (package(pplx-space-node-mgr) and test(=service::permission_tree::tests::owned_walk_prunes_snapshots_and_never_mutates_link_targets))
or (package(pplx-space-node-mgr) and test(=device_backing::tests::pinned_devices_survive_replacement_and_encrypted_reopen))
or (package(pplx-space-node-mgr) and test(=service::artifact_fs::tests::btrfs_pinned_operations_survive_path_replacement_and_nested_cleanup))
or (package(pplx-space-node-mgr) and test(=service::artifact_fs::receive::tests::receive_keeps_destination_identity_through_scrub_and_publication))
or (package(pplx-space-node-mgr) and test(=service::btrfs_send_source::tests::retained_source_regenerates_after_producer_deletion_and_receives_on_same_filesystem))
or (package(pplx-space-node-mgr) and test(=service::btrfs_send_transport::tests::durable_lease_survives_producer_removal_and_cancelled_grpc_reader))
or (package(pplx-space-node-mgr) and test(=service::prepared_rootfs::tests::prepared_instance_and_clone_use_real_btrfs_subvolumes))
or (package(pplx-space-node-mgr) and test(/::startup_containment::tests::linux::linux_containment_benchmark$/))
or (package(pplx-space-sbx-mgr) and test(=transfer_directory::tests::distinct_service_uids_can_exchange_downloads))
or (package(pplx-space-credmgr) and test(=run::tests::volume_socket::real_peers_obey_volume_listener_policy))
or (package(pplx-space-credmgr) and test(=run::volume_socket::tests::preflight_checks_real_permissions_without_replacing_live_socket))
or (package(pplx-space-credmgr) and test(=auth::tests::uds_peer_binary_check_is_reached_when_uids_match))
or binary_id(pplx-space-spaced-guest-server::worker_subprocess)
or binary_id(pplx-space-spaced-guest-server::worker_telemetry)
or (package(pplx-space-spaced-guest-server) and test(=filesystem::router::tests::a_read_streams_from_the_workers_descriptor_without_relaying_through_it))
or (package(pplx-space-spaced-guest-server) and test(=filesystem::router::tests::a_read_through_a_workers_descriptor_ends_with_the_worker))
or (package(pplx-space-build-mgr) and test(=oci::assembly::tests::extraction_failure_is_not_masked_by_archive_sigpipe))
or (package(pplx-space-build-mgr) and test(=oci::assembly::tests::real_oci_image_assembles_with_the_space_guest_bundle))
or (package(pplx-space-build-mgr) and test(/^oci::containerd::tests::real_containerd_exposes_a_flattened_read_only_rootfs::/))
or (package(pplx-space-net-gateway) and test(=tcp_proxy::tests::tls_interception::interception_exemptions_relay_original_tls_only_after_admission))
or (package(pplx-space-net-gateway-client) and test(=tests::sandbox_connections_ignore_replaced_alias_and_reject_legacy_only_gateway))
or (package(pplx-space-db-migrate) and test(/^bootstrap_roles::tests::postgres_bootstrap_tests::/))
'''
test-group = "privileged"
