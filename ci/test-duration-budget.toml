# Wall-time budget for each test in the Rust tests job, which
# ci/scripts/check-test-durations.py checks against nextest's JUnit report
# after every run (ci/scripts/run-rust-checks.sh).
#
# A test should take up to `limit_seconds`; CI reports each one over it as a
# warning. The run fails when a test takes over `fail_seconds`. The gap is for
# CI's run-to-run variance: on a loaded runner a test's slowest run is often
# twice its median. A new test that needs longer than the limit does not get
# an exception: make it faster, for example by testing the behaviour at a
# smaller size or without real waits.
limit_seconds = 2.0
fail_seconds = 4.0

# The tests that took 2 s or more in at least one recent merge-queue, Main
# CI or pull request Rust tests job (2026-11-02 to 2026-11-04), keyed by
# `<nextest binary id> <test name>`, so a test already near the limit
# cannot fail a pull request on a slow runner. Each ceiling is 1.5 times the
# test's slowest time, rounded up and at least 5 s; the check refuses one at
# or below `fail_seconds`. Make a listed test faster and delete its line;
# never raise a ceiling.
