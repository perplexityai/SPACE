# Wall-time budget for each test in the Rust tests job, which
# ci/scripts/check-test-durations.py checks against nextest's JUnit report
# after every run (ci/scripts/run-rust-checks.sh).
#
# Any test may take up to `limit_seconds`. A new test that needs longer does
# not get an exception: make it faster, for example by testing the behaviour
# at a smaller size or without real waits.
limit_seconds = 2.0

# The tests that were already slower when the limit started, keyed by
# `<nextest binary id> <test name>`. Each ceiling is 1.5 times the test's
# slowest time across 24 successful merge-queue and Main CI Rust tests jobs
# (2026-11-02 to 2026-11-04), rounded up and at least 3 s, so CI's run-to-run
# variance does not fail it. Every test slower than 1.33 s in any of those
# runs is listed, so an unlisted test has the same headroom below the limit.
# Make a listed test faster and delete its line; never raise a ceiling. One
# entry comes from later: node_manager_commands_reject_direct_spawns_without_restricting_other_services
# went from 82 s to 2.8 s in CI, most of it loading the repository, so its
