'''
user = "root"

# ── Step 7: User account and workspace ────────────────────────────────────────

[[steps]]
name = "Configure user account"
type = "run"
command = """
id -u user 2>/dev/null || useradd -m -s /bin/bash user
echo 'user ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/user
chmod 440 /etc/sudoers.d/user
mkdir -p /home/user/.ssh /home/user/workspace
chown -R user:user /home/user
chmod 700 /home/user/.ssh
"""
user = "root"

# ── Step 8: Fix capabilities lost during seed ext4 packing ────────────────────

[[steps]]
name = "Fix ping capabilities"
type = "run"
command = """
if [ -f /usr/bin/ping ]; then
  setcap cap_net_raw+ep /usr/bin/ping 2>/dev/null || chmod u+s /usr/bin/ping
fi
"""
user = "root"

# ── Step 9: Clean up ─────────────────────────────────────────────────────────

[[steps]]
name = "Clean up"
type = "run"
command = """
apt-get clean
rm -rf /tmp/* /var/tmp/*
"""
user = "root"
