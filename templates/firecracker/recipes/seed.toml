# Seed template recipe.
#
# Unlike higher-level templates such as code-runtime, seed starts from scratch:
# it downloads a base Ubuntu minimal cloud squashfs, customizes it into a
# Firecracker-friendly rootfs, and registers the resulting template locally.
#
# Usage:
#   space-admin-cli template build seed

[metadata]
name = "seed"
description = "Minimal Ubuntu Firecracker seed"
from = "scratch"

# The shared lineage carries a BPF/tracing-capable guest kernel with built-in
# nf_tables, so containers can manage IPv4/IPv6 firewall and NAT rules. Every
# node running a template from this lineage must stage this exact kernel.
[guest_kernel]
version = "vmlinux-6.1.155-bpf-modsig-nft"
digest = "sha256:6e7fc9417db2b53cc4af5915a6734368875ea44dc897cd7eeff398da27423592"

[source]
type = "ubuntu-minimal-cloud-squashfs"
release = "resolute"
version = "26.04"
date = "release-20260908"
