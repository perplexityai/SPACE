# The next release's node-store migrations this release can run against.
# After an image rollback, a node service that finds one recorded leaves it in
# place and starts; see "Forward-compatible migrations" in db/README.md.
# List a migration here one release before the release that bundles it, only
# when this release reads and writes correctly once it is applied.
# Entries are scoped by the db/ directory name and numeric migration version.
# `checksum` is the SHA-384 of the up migration exactly as the bundling release
# ships it: shasum -a 384 path/to/migration.up.sql (or sha384sum on Linux).
# `reason` says why this release keeps working on that schema.
#
# [[migrations]]
# store = "sandbox-manager"
# version = 20261201000000
# checksum = "<96 hex digits>"
# reason = "adds a nullable column this release never names"

[[migrations]]
store = "sandbox-manager"
version = 20261114020000
checksum = "98f25d61b0439360b174dc09f876f2760bd08f758fcd18ecb08ea674fe2706d5820a0fbaa1ee0a4a2ba9793ab2bd8dcc"
reason = "drops the generated legacy_state column, which this release never names"
