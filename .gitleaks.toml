[extend]
useDefault = true

# https://www.rfc-editor.org/rfc/rfc8032.html#section-7.1
[[allowlists]]
description = "RFC 8032 section 7.1 test 1 key, used only by the local Kind harness"
targetRules = ["private-key"]
condition = "AND"
paths = ['''^infra/space/kind/charts/space-api-local/values\.yaml$''']
regexes = ['''^-----BEGIN[ ]PRIVATE KEY-----\r?\n[ \t]*MC4CAQAwBQYDK2VwBCIEIJ1hsZ3v/VpguoRK9JLsLMREScVpezJpGXA7rAMcrn9g\r?\n[ \t]*-----END[ ]PRIVATE KEY-----$''']

# Diff scans read context lines too, so edits near these fixtures surface it.
[[allowlists]]
description = "Synthetic credential-reference UUID shared by credential test fixtures"
targetRules = ["generic-api-key"]
regexes = ['''^019d84bd-280d-7331-99c6-b63377f3a3a2$''']

[[allowlists]]
description = "Synthetic sandbox UUID in the restore artifact retention fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/libs/sbx/mgr/server/src/snapshot_restore/tests\.rs$''']
regexes = ['''^019e31d9-79a6-7132-b90f-007f1c62ddea$''']

[[allowlists]]
description = "Verified SHA-256 of the frozen synthetic publication baseline executable"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^bench/publish/cpu-acceptance-v3/baseline-lane-a/summary\.json$''']
regexes = ['''^44aa5e48d18180ae6751969b40acbc0a268ae440dc07bb5c754d3a6dbb3e97f3$''']

[[allowlists]]
description = "Verified SHA-256 of the measured publication executable at 938e0cf4"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^bench/publish/cpu-acceptance-v3/head-938e0cf4/summary\.json$''']
regexes = ['''^436380140f29850439d7f172b4e1c07ae1f4b93c301575969bc08c0ae50a039f$''']
