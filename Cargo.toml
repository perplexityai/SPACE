[workspace.package]
version = "0.8.1"
edition = "2024"
# Minimum supported Rust version (MSRV) floor. Cargo refuses to build on any
# toolchain below this, giving a clear "requires rustc >= X" error instead of a
# confusing downstream compile failure. It must reflect the versions the code
# actually compiles on: clippy is MSRV-aware and its default-warn
# `incompatible_msrv` lint (a hard error under `-D warnings`) fires when workspace
# code calls a std API stabilized *after* this floor, so a floor set below the
# real minimum is not just cosmetic — it breaks CI. We keep the floor equal to
# the pinned toolchain in rust-toolchain.toml (the version we build and validate
# on): that is the minimum we can prove green. Raise both together when bumping.
# Edition 2024 independently requires >=1.85. Members inherit via
# `rust-version.workspace = true`.
rust-version = "1.99.1"
authors = ["Perplexity AI"]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
aead-stream = "0.6"
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
aes-gcm = "0.11"
aws-config = { version = "1", default-features = false }
aws-credential-types = "1"
aws-lc-rs = { version = "1.17", default-features = false, features = ["aws-lc-sys"] }
aws-runtime = "1"
aws-sdk-acmpca = { version = "1", default-features = false }
aws-sdk-ecr = { version = "1", default-features = false }
aws-sdk-s3 = { version = "1", default-features = false }
aws-sdk-secretsmanager = { version = "1", default-features = false }
aws-sdk-sts = { version = "1", default-features = false }
aws-sigv4 = { version = "1", default-features = false }
aws-smithy-async = "1"
aws-smithy-http-client = { version = "1", default-features = false }
aws-smithy-runtime-api = "1"
# aws-config 1.12 still uses aws-smithy-json 0.63, which does not compile with
# aws-smithy-types 1.7. Keep the AWS SDK graph on its latest coherent line.
aws-smithy-types = "=1.6.3"
# 0.63 requires the currently incompatible aws-smithy-types 1.7 line above.
aws-smithy-xml = "0.62"
aws-types = "1"
axum = "0.8"
base64 = "0.23"
bcrypt = "0.19"
bytes = "1"
bytesize = "2.3.1"
clap = "4"
comfy-table = "8"
crc = "3"
datadog-opentelemetry = "0.5"
dashmap = "6"
deadpool-redis = { version = "0.23", default-features = false, features = ["rt_tokio_1", "script", "tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
# Eppo hard-enables reqwest 0.12's ring-backed `rustls-tls` feature. Keep that
# transitive exception isolated; remove it when Eppo exposes an AWS-LC or
# provider-neutral TLS feature.
eppo = "5.2.1"
futures-core = "0.3"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["metrics", "tokio", "tls-aws-lc-rs", "webpki-roots"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
h2 = "0.4"
hmac = "0.13"
# 1.11.1: dropping a client call resets its HTTP/2 stream, even while its
# request body is still open. Client-streaming uploads rely on that.
hyper = "1.11.1"
hyper-util = "0.1"
insta = "1"
jiff = "0.2"
jsonschema = { version = "0.56", default-features = false }
k8s-openapi = "0.28"
kube = { version = "4.2", default-features = false }
libc = "0.2"
log = "0.4"
lru = "0.18"
md-5 = "0.11"
metrics = "0.24.1"
multer = "3"
nix = "0.31"
rustix = "1.1.4"
notify = "8"
oci-spec = { version = "0.10", default-features = false, features = ["distribution"] }
object = { version = "0.40", default-features = false, features = ["read_core", "elf"] }
# Default features stay on because 0.3.0 does not build without them, despite
# declaring them optional: `src/hooks/logging.rs` imports `log` unconditionally
# and `src/provider/mod.rs` re-exports `MockFeatureProvider` unconditionally, so
# `default-features = false` fails to compile the SDK itself. The cost is
# `mockall` in the graph of any build that enables `openfeature`. Left visible
# rather than worked around; revisit when the SDK gates them properly.
open-feature = { version = "0.3" }
# Local (in-process) evaluation only: the flag set syncs in the background and
# every read is served from it, which is what the sync `FeatureFlagProvider`
# contract needs. `tls-aws-lc` replaces the default `tls-ring` because SPACE
# standardises on AWS-LC and two crypto providers make rustls panic on first
# use, unable to auto-select one.
open-feature-flagd = { version = "0.2", default-features = false, features = ["in-process", "tls-aws-lc"] }
# Keep the OTel family on the datadog-opentelemetry-compatible line. Advancing
# these alone pulls a duplicate OTel SDK graph.
opentelemetry = "0.32"
opentelemetry-otlp = { version = "=0.32.0", default-features = false }
opentelemetry-proto = { version = "=0.32.0", default-features = false }
opentelemetry_sdk = "0.32"
parking_lot = "0.12"
percent-encoding = "2"
pin-project-lite = "0.2"
prost = "0.14"
prost-types = "0.14"
rand = "0.10"
rcgen = { version = "0.14", default-features = false }
redis = { version = "1", default-features = false, features = ["cluster-async", "script", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
ref-cast = "1.0.27"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rstest = { version = "0.27", default-features = false }
rtnetlink = "0.23"
# rusqlite 0.40 and sqlx-sqlite 0.9 require incompatible libsqlite3-sys
# versions, which cannot coexist because both link the native SQLite library.
rusqlite = { version = "0.39", features = ["bundled", "trace"] }
rustls = { version = "0.23.46", default-features = false }
schemars = "1"
serde = "1"
serde_json = "1"
semver = "1"
blake3 = "1.8.7"
sha2 = "0.11"
subtle = "2"
socket2 = "0.6"
sqlx = { version = "0.9", default-features = false }
tempfile = "3"
tar = "0.4.46"
flate2 = "1"
form_urlencoded = "1"
# testcontainers-modules 0.15 requires testcontainers 0.27. Keep the pair
# aligned until a stable modules release supports testcontainers 0.28.
testcontainers = { version = "0.27", default-features = false, features = ["aws-lc-rs"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["aws-lc-rs"] }
thiserror = "2"
tikv-jemallocator = "0.7"
time = "0.3"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-vsock = "0.7"
toml = "1"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tower = "0.5"
tower-http = "0.7"
tracing = "0.1"
tracing-log = "0.2"
# tracing-opentelemetry 0.33 is the matching line for opentelemetry 0.32.
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
x509-parser = "0.18"
zeroize = "1"
zstd = { version = "0.14.3", features = ["zstdmt"] }

