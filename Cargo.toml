[profile.release]
lto = "thin"
strip = true

# These large test binaries exceed Mach-O's 24-bit DWARF unwind offset limit
# without optimization. Keep debug information and unwind support while
# reducing the generated code and unwind tables.
[profile.test.package.pplx-space-api]
opt-level = 1

[profile.test.package.pplx-space-sbx-mgr]
opt-level = 1

# Three dependencies whose test cost is the compiled work itself, not the Rust
# around it, so the debug profile's opt-level 0 lands directly on wall time.
#
# `libsqlite3-sys` bundles and compiles `sqlite3.c`: every SQLite-backed test
# in the workspace runs the amalgamation, and unoptimized it is the dominant
# term in the SQLite-heavy suites. `bcrypt` and `blowfish` are the same shape —
# a cost-12 hash is 4096 Blowfish key schedules, and each password-handling
# test pays for several.
#
# Scoped to `test` because that is where the cost falls; the `release` profile
# already optimizes these and `dev` builds nothing that runs them in a loop.
[profile.test.package.libsqlite3-sys]
opt-level = 3

[profile.test.package.bcrypt]
opt-level = 3

[profile.test.package.blowfish]
opt-level = 3

[profile.dev-release]
inherits = "release"
lto = false
strip = false
debug = 1
incremental = true
codegen-units = 16

[workspace.lints.rust]

[workspace.lints.clippy]
# Panic / latent crash footguns
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

# Silent failure / dropped work
let_underscore_future = "warn"
unused_result_ok = "warn"
assertions_on_result_states = "warn"

# Async / concurrency
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"

# Unsafe hygiene
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

# Numeric correctness, low-ish noise
cast_sign_loss = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
invalid_upcast_comparisons = "warn"

# Easy correctness/debugging wins
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"
