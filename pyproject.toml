[project]
name = "space-smoke"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "e2b==2.21.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-sdk==1.44.0",
    # The runtime dependencies of the SDK native.m1_generated_sdk_conformance
    # generates (space_smoke/m1_conformance.py), within the generator's bounds.
    "pydantic==2.14.1",
    "python-dateutil==2.9.0.post0",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# The repository-wide Python test suite's imports (ci/scripts/run-python-tests.sh).
# Locked like the dependencies above, so an upstream release of any of these or
# of what they pull in cannot change an unchanged run.
[dependency-groups]
test = [
    "boto3==1.43.113",
    "cel-python==0.5.0",
    "pglast==7.21",
    "psycopg[binary]==3.3.6",
    "pytest==8.4.2",
    "python-hcl2==8.1.4",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]
