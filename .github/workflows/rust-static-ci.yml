name: Rust Static CI

on:
  workflow_call:
    inputs:
      scope_base:
        description: >-
          Base commit for skipping a check the change cannot affect
          (ci/check-scopes/README.md). Empty, as Main CI passes it, runs every
          check.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

jobs:
  validation:
    if: github.repository == 'perplexityai/SPACE'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    # pull-requests: read lets reviewdog and gh read a pull request's files.
    permissions:
      contents: read
      packages: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rust format
            scope: rust
            command: bash ci/scripts/run-rust-checks.sh fmt
            runner: ubuntu-24.04
            rust_cache: false
            timeout: 15
          - name: Rust clippy
            scope: rust
            command: bash ci/scripts/run-rust-checks.sh clippy
            runner: ubuntu-24.04-16core
            rust_cache: true
            rust_cache_key: clippy
            rust_cache_size: 2G
            rust_cache_refresh_misses: 20
            cargo_registry: restore
            timeout: 45
            archcheck: true
          # Lints libraries one at a time (ci/scripts/lib/rust-isolated-crates.sh)
          # in a job of its own, so it lengthens neither clippy nor the tests.
          # Its compiler cache is a family of its own: its crates build with
          # other feature sets than the workspace pass, and two jobs saving one
          # family would replace and trim each other's snapshots.
          - name: Rust isolated crates
            scope: rust
            command: bash ci/scripts/run-rust-checks.sh isolated-crates
            runner: ubuntu-24.04-16core
            rust_cache: true
            rust_cache_key: isolated-crates
            rust_cache_size: 2G
            rust_cache_refresh_misses: 20
            cargo_registry: restore
            timeout: 45

    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull CI and the merge queue skip a check the change cannot affect,
      # and Main CI, which passes no base, runs it (ci/check-scopes/README.md).
      - name: Decide whether this change needs the check
        id: scope
        shell: bash
        env:
          SCOPE: ${{ matrix.scope }}
          SCOPE_BASE: ${{ inputs.scope_base }}
          # Set only for pull requests, whose change is the synthetic merge
          # against its first parent.
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        # Only an explicit answer reaches the gates: anything else fails.
        run: |
          set -euo pipefail
          decision="$(bash ci/scripts/check-needed.sh "${SCOPE}" "${SCOPE_BASE}" "${PULL_REQUEST_HEAD}")"
          case "${decision}" in
            needed=true | needed=false) printf '%s\n' "${decision}" >>"${GITHUB_OUTPUT}" ;;
            *) echo "check-needed.sh answered '${decision}'" >&2; exit 1 ;;
          esac

      # The report after Clippy runs this copy of the package cache helper,
      # taken before Clippy starts, as in common-ci.yml.
      - name: Copy the package cache helper
        if: ${{ steps.scope.outputs.needed == 'true' && (matrix.cargo_registry) }}
        run: |
          set -euo pipefail
          install -d "${RUNNER_TEMP}/space-ci-helpers"
          install -m 0444 ci/scripts/package-cache.py "${RUNNER_TEMP}/space-ci-helpers/"
          chmod 0555 "${RUNNER_TEMP}/space-ci-helpers"

      - name: Get the CI image
        if: steps.scope.outputs.needed == 'true'
        id: ci-image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: bash ci/scripts/ci-image.sh ensure "space-ci:${GITHUB_SHA}"

      # Common CI's Rust tests job saves the crates on main; see the package
      # caches in common-ci.yml. The path matches theirs, which the cache's
      # version includes.
      - name: Name the Cargo registry cache
        id: cargo-registry-key
        if: ${{ steps.scope.outputs.needed == 'true' && (matrix.cargo_registry) }}
        run: python3 ci/scripts/package-cache.py key cargo

      - name: Restore the Cargo registry
        id: restore-cargo-registry
        if: ${{ steps.scope.outputs.needed == 'true' && (matrix.cargo_registry) }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-home/registry/index
          key: ${{ steps.cargo-registry-key.outputs.key }}
          restore-keys: |
            ${{ steps.cargo-registry-key.outputs.lock }}
            ${{ steps.cargo-registry-key.outputs.family }}

      - name: Prepare the Cargo registry
        if: ${{ steps.scope.outputs.needed == 'true' && (matrix.cargo_registry) }}
        env:
          MATCHED_KEY: ${{ steps.restore-cargo-registry.outputs.cache-matched-key }}
        run: >-
          python3 ci/scripts/package-cache.py restored cargo "${RUNNER_TEMP}/cargo-home/registry"
          "${MATCHED_KEY}" --lockfile Cargo.lock

      # Keep Clippy's compiler outputs separate from the test graph: the two
      # modes use different rustc invocations and cannot reliably share keys.
      # The snapshot lifecycle matches common-ci.yml.
      - name: Name the Rust compiler cache
        id: rust-cache-key
        if: ${{ steps.scope.outputs.needed == 'true' && (matrix.rust_cache == true) }}
        env:
          FAMILY: space-sccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_cache_key }}
          INPUTS: >-
            ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'ci/Dockerfile.ci',
            'ci/scripts/run-rust-checks.sh') }}
        run: |
          {
            echo "family=${FAMILY}-"
            echo "inputs=${FAMILY}-${INPUTS}-"
            echo "key=${FAMILY}-${INPUTS}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >>"${GITHUB_OUTPUT}"

      - name: Restore the Rust compiler cache
        id: restore-rust-cache
        if: ${{ steps.scope.outputs.needed == 'true' && (matrix.rust_cache == true) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/space-sccache
          key: ${{ steps.rust-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.rust-cache-key.outputs.inputs }}
            ${{ steps.rust-cache-key.outputs.family }}

      - name: Run ${{ matrix.name }}
        if: steps.scope.outputs.needed == 'true'
        env:
          SPACE_CI_COMMAND: ${{ matrix.command }}
          SPACE_CI_RUST_CACHE: ${{ matrix.rust_cache }}
          SPACE_CI_CARGO_DIR: ${{ runner.temp }}/cargo-home
          SPACE_CI_SCCACHE_DIR: ${{ runner.temp }}/space-sccache
          SPACE_CI_SCCACHE_RUN_DIR: ${{ runner.temp }}/space-sccache-run
          SPACE_CI_SCCACHE_SIZE: ${{ matrix.rust_cache_size }}
        run: |
          set -euo pipefail

          # The Cargo registry lives on the runner, so later steps in this job
          # build from the crates this step fetches.
          mkdir -p "${SPACE_CI_CARGO_DIR}/registry" "${SPACE_CI_CARGO_DIR}/git"
          docker_args=(
            --rm
            --volume "${GITHUB_WORKSPACE}:/workspace"
            --workdir /workspace
            --volume "${SPACE_CI_CARGO_DIR}/registry:/usr/local/cargo/registry"
            --volume "${SPACE_CI_CARGO_DIR}/git:/usr/local/cargo/git"
            --env CI=true
            --env CARGO_INCREMENTAL=0
            --env GITHUB_ACTIONS=true
            --env SPACE_CI_COMMAND
          )

          if [[ "${SPACE_CI_RUST_CACHE}" == true ]]; then
            mkdir -p "${SPACE_CI_SCCACHE_DIR}" "${SPACE_CI_SCCACHE_RUN_DIR}"
            touch "${SPACE_CI_SCCACHE_RUN_DIR}/started"
            docker_args+=(
              --volume "${SPACE_CI_SCCACHE_DIR}:/sccache"
              --volume "${SPACE_CI_SCCACHE_RUN_DIR}:/sccache-run"
              --env RUSTC_WRAPPER=sccache
              --env SCCACHE_CACHE_SIZE="${SPACE_CI_SCCACHE_SIZE}"
              --env SCCACHE_DIR=/sccache
              --env SPACE_CI_SCCACHE_STATS=/sccache-run/stats.json
            )
          fi

          docker run "${docker_args[@]}" "space-ci:${GITHUB_SHA}" \
            bash -c 'git config --global --add safe.directory /workspace && exec bash -c "$SPACE_CI_COMMAND"'

      # Pull requests and merge groups: archcheck runs offline from the clippy
      # step's caches, even when clippy failed, against a base commit (see
      # run-archcheck.sh). For a pull request, the base is the first parent of
      # the synthetic merge (fetch-depth 0 above), once resolve-migration-base.sh
      # has checked the second is this pull request, and the findings go to
      # rdjson: exit 1 means required findings, which reviewdog decides on, and
      # anything else fails. For a merge group, the base is its base_sha, so
      # the queue repeats the comparison for the group as it will merge: exit 1
      # fails the step, without reviewdog. no_new_entries, no_raised_caps and
      # crate_names.no_new compare with the base's architecture-baseline.toml,
      # and crate_names.policy_changed, layers.policy_changed, layers.placement's
      # check for new or changed unmoved entries and pattern_ratchet's seeding of
      # a new instance's table with its ARCHITECTURE.toml; an empty file stands
      # in for one the base lacks. The files git detects as renamed since the
      # base are passed too, so that a baseline entry moved with its file is not
      # a new one; without them, it is. If the base can't be resolved, a
      # warning: the first two and the ARCHITECTURE.toml comparisons are
      # skipped, and no_new allows only the crates listed when it was added.
      - name: Check repository structure
        id: archcheck
        if: >-
          ${{ steps.scope.outputs.needed == 'true' && (!cancelled() && steps.ci-image.outcome == 'success' && matrix.archcheck == true && (github.event_name == 'pull_request' || github.event_name == 'merge_group')) }}
        env:
          CARGO_DIR: ${{ runner.temp }}/cargo-home
          SCCACHE_DIR: ${{ runner.temp }}/space-sccache
          SCCACHE_SIZE: ${{ matrix.rust_cache_size }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          status=0
          docker run --rm --volume "${GITHUB_WORKSPACE}:/workspace" --workdir /workspace \
            --volume "${CARGO_DIR}/registry:/usr/local/cargo/registry" --volume "${CARGO_DIR}/git:/usr/local/cargo/git" \
            --volume "${SCCACHE_DIR}:/sccache" --env SCCACHE_DIR=/sccache --env SCCACHE_CACHE_SIZE="${SCCACHE_SIZE}" \
            --env SCCACHE_BASEDIRS=/workspace --env CARGO_INCREMENTAL=0 --env CARGO_NET_OFFLINE=true \
            --env CARGO_TARGET_DIR=target/buildkite-lint --env EVENT_NAME --env PULL_REQUEST_HEAD --env MERGE_GROUP_BASE \
            "space-ci:${GITHUB_SHA}" bash -c '
              sccache --start-server >/dev/null 2>&1 && export RUSTC_WRAPPER=sccache
              git config --global --add safe.directory /workspace
              if [[ "${EVENT_NAME}" == pull_request ]]; then
                exec bash ci/scripts/run-archcheck.sh "" "${PULL_REQUEST_HEAD}" target/archcheck.rdjson
              fi
              exec bash ci/scripts/run-archcheck.sh "${MERGE_GROUP_BASE}" ""' || status=$?
          if ((status == 1)) && [[ "${EVENT_NAME}" == merge_group ]]; then
            echo "::error title=archcheck::Required findings against the merge group's base; see above."; exit 1
          fi
          if ((status > 1)); then echo "::error title=archcheck::cargo arch exited ${status}; see above."; exit 1; fi

      - name: Set up reviewdog
        if: ${{ steps.scope.outputs.needed == 'true' && (!cancelled() && steps.archcheck.outcome == 'success' && github.event_name == 'pull_request') }}
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      # Advisory findings only in changed files, unless the pull request
      # changes the rules or archcheck itself (old or new names), or its file
      # list can't be read in full. Required findings wherever they are:
      # -filter-mode=file would drop one on a file renamed without edits, or
      # on a baseline line the pull request leaves alone, such as a deleted
      # file's stale entry. tests/repository.rs fails on any required finding
      # in the tree, so one already on main blocks every pull request anyway.
      # reviewdog fails after 10 annotations of any severity, so advisory
      # findings get a run of their own that never fails the step. GitHub
      # shows a step's first 10 warnings, so that run puts the pull request's
      # own findings first (see order-archcheck-findings.sh).
      - name: Annotate repository structure findings
        if: ${{ steps.scope.outputs.needed == 'true' && (!cancelled() && steps.archcheck.outcome == 'success' && github.event_name == 'pull_request') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          mode="nofilter" files="${RUNNER_TEMP}/archcheck-pull-request-files.json"
          # One or more JSON arrays of files (gh may merge pages); none if the
          # call fails, so the ordering still runs.
          if { gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" >"${files}" ||
            { echo '[]' >"${files}"; false; }; } &&
            jq -se --argjson n "${CHANGED_FILES}" 'add // [] | length == $n and all(.[] | .filename, .previous_filename // empty;
              IN("ARCHITECTURE.toml", "architecture-baseline.toml", "Cargo.toml") or startswith("crates/tools/archcheck/") | not)' \
              "${files}" >/dev/null; then
            mode="file"
          fi
          echo "archcheck: -filter-mode=${mode}"
          ordered="${RUNNER_TEMP}/archcheck-ordered.rdjson"
          order() { bash ci/scripts/order-archcheck-findings.sh "$@" target/archcheck.rdjson "${files}"; }
          if order >"${ordered}" && own="$(order --own="${mode}" | jq '[.diagnostics[] | select(.severity != "ERROR")] | length')"; then
            echo "archcheck: ${own} advisory findings in this pull request's changes, annotated first"
            if ((own > 10)); then
              echo "archcheck: at most 10 of the ${own} advisory findings in this pull request's changes are annotated; run cargo arch." |
                tee -a "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "archcheck: could not order the findings; annotating them in report order"
            cp target/archcheck.rdjson "${ordered}"
          fi
          annotate() {
            jq ".diagnostics |= map(select($1))" "$4" |
              reviewdog -f=rdjson -name=archcheck -reporter=github-pr-annotations -filter-mode="$3" -fail-level="$2"
          }
          annotate '.severity != "ERROR"' none "${mode}" "${ordered}" ||
            echo "::warning title=archcheck::Not every advisory finding was annotated; run cargo arch."
          annotate '.severity == "ERROR"' error nofilter target/archcheck.rdjson

      - name: Report the Cargo registry
        if: ${{ steps.scope.outputs.needed == 'true' && (always() && matrix.cargo_registry) }}
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/space-ci-helpers/package-cache.py
        run: python3 -I "${PACKAGE_CACHE}" report cargo "${RUNNER_TEMP}/cargo-home/registry"

      - name: Decide whether to refresh the Rust compiler cache
        id: refresh-rust-cache
        if: ${{ steps.scope.outputs.needed == 'true' && (success() && matrix.rust_cache == true) }}
        env:
          KEY: ${{ steps.rust-cache-key.outputs.key }}
          INPUTS_PREFIX: ${{ steps.rust-cache-key.outputs.inputs }}
          RESTORED_KEY: ${{ steps.restore-rust-cache.outputs.cache-matched-key }}
          REFRESH_MISSES: ${{ matrix.rust_cache_refresh_misses }}
          STATS: ${{ runner.temp }}/space-sccache-run/stats.json
        run: >-
          python3 ci/scripts/sccache-snapshot.py decide --key "${KEY}" --inputs-prefix "${INPUTS_PREFIX}"
          --restored-key "${RESTORED_KEY}" --refresh-misses "${REFRESH_MISSES}" --stats "${STATS}"

      - name: Prepare the Rust compiler cache for upload
        if: >-
          ${{ steps.scope.outputs.needed == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.refresh-rust-cache.outputs.save == 'true') }}
        env:
          SPACE_CI_SCCACHE_DIR: ${{ runner.temp }}/space-sccache
          SPACE_CI_SCCACHE_RUN_DIR: ${{ runner.temp }}/space-sccache-run
          TRIM: ${{ steps.refresh-rust-cache.outputs.trim }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "${SPACE_CI_SCCACHE_DIR}"
          if [[ "${TRIM}" == true ]]; then
            unused="$(find "${SPACE_CI_SCCACHE_DIR}" -type f ! -newer "${SPACE_CI_SCCACHE_RUN_DIR}/started" -print -delete | wc -l)"
            echo "Deleted ${unused} entries this run did not use."
          fi
          du -sh "${SPACE_CI_SCCACHE_DIR}"

      - name: Save the Rust compiler cache
        if: >-
          ${{ steps.scope.outputs.needed == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.refresh-rust-cache.outputs.save == 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/space-sccache
          key: ${{ steps.rust-cache-key.outputs.key }}

  windows_guest:
    if: github.repository == 'perplexityai/SPACE'
    name: Windows guest checks
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pull CI and the merge queue skip a check the change cannot affect,
      # and Main CI, which passes no base, runs it (ci/check-scopes/README.md).
      - name: Decide whether this change needs the check
        id: scope
        shell: bash
        env:
          SCOPE: rust
          SCOPE_BASE: ${{ inputs.scope_base }}
          # Set only for pull requests, whose change is the synthetic merge
          # against its first parent.
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        # Only an explicit answer reaches the gates: anything else fails.
        run: |
          set -euo pipefail
          decision="$(bash ci/scripts/check-needed.sh "${SCOPE}" "${SCOPE_BASE}" "${PULL_REQUEST_HEAD}")"
          case "${decision}" in
            needed=true | needed=false) printf '%s\n' "${decision}" >>"${GITHUB_OUTPUT}" ;;
            *) echo "check-needed.sh answered '${decision}'" >&2; exit 1 ;;
          esac
      - name: Install protobuf compiler
        if: steps.scope.outputs.needed == 'true'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $destination = Join-Path $env:RUNNER_TEMP "protoc"
          Invoke-WebRequest https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-win64.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "d1cede9e308cc3eb072392af1c02ccae4bdd3d2f374ec2970dbd8cdfdaa91363") {
            throw "protoc archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $destination
          "PROTOC=$destination\bin\protoc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROTOC_INCLUDE=$destination\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$destination\bin\protoc.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and lint native Windows code and tests
        if: steps.scope.outputs.needed == 'true'
        run: >-
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets
          -p pplx-space-spaced-guest-windows -p pplx-space-spaced-guest-svc
          -- -D warnings
      - name: Run native Windows unit tests
        if: steps.scope.outputs.needed == 'true'
        run: >-
          cargo test --locked --target x86_64-pc-windows-msvc
          -p pplx-space-spaced-guest-windows --lib
