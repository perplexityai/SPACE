name: Kind CI

on:
  workflow_call:
    inputs:
      # test-hooks, every caller's default, or release: kind-release-ci.yml's
      # on-demand lane of binaries built without test hooks
      # (infra/space/kind/lib/rust-build.sh). Only the release lane sets
      # SPACE_KIND_RUST_BUILD, so the default lane runs as it always has.
      rust_build:
        type: string
        default: test-hooks

# The caller owns permissions: pull-ci.yml grants contents:read and
# packages:read and actions:read; main-ci.yml grants packages:write to this call.
# Actions reads only inspect a producer in this run; never elevate a PR writer.

# Cancel superseded PR validation, but keep every main commit's evidence.
concurrency:
  group: kind-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rust_artifacts:
    if: github.repository == 'perplexityai/SPACE'
    name: Build shared Kind Rust artifacts
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 60
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - &enable-containerd-store
        name: Enable the containerd image store for artifact handoff and cache
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/docker
          if [[ -s /etc/docker/daemon.json ]]; then
            sudo jq '.features["containerd-snapshotter"] = true' /etc/docker/daemon.json \
              | sudo tee /etc/docker/daemon.json.new >/dev/null
            sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          else
            echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json >/dev/null
          fi
          sudo systemctl restart docker
          if ! docker info --format '{{json .DriverStatus}}' | grep -q 'io.containerd.snapshotter'; then
            echo "::error::The containerd image store did not activate; artifact identity and BuildKit cache export require it"
            exit 1
          fi

      # Keep existing cache hits while main seeds the public registry package.
      # This is an import-only bridge for BuildKit: neither PRs nor main export
      # layers to Actions. The one Kind export there is main-ci.yml's
      # kind_rust_state, which saves the incremental build state below.
      - name: Expose the existing Actions cache for read-only imports
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # Reads the third-party image mirror (ci/mirrored-images.txt) and the
      # layer cache; only main's token can also write the cache. Best-effort
      # and bounded: without it every GHCR read falls back (the mirror to its
      # sources, the Kind node image to a local build, the layer cache to a
      # cold build), and main's cache export already ignores a failed push, so
      # a GHCR outage costs time here, never the job.
      - &ghcr-login
        name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$GHCR_TOKEN" |
            timeout --kill-after=10 60 docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning::Could not log in to GHCR; its reads fall back to their sources"
          fi

      # A PR whose Rust build inputs equal those of an image main already
      # published takes that image instead of compiling it again. The key is
      # content-addressed over everything the build reads
      # (build-rust-artifacts.sh --input-key), so a PR that changes only
      # scripts, charts, smoke scenarios or workflows hits; any Rust input
      # change misses. Every miss or failure, a fork's unreadable package
      # included, leaves the build below to run with a notice. Main never
      # reuses: building every push proves the producer still builds at HEAD
      # and replaces a bad published image on the next push. Setting the
      # repository variable SPACE_KIND_RUST_REUSE to `off` stops PR reuse.
      - name: Reuse main's Rust artifact image for identical inputs
        id: reuse
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') && vars.SPACE_KIND_RUST_REUSE != 'off' && inputs.rust_build != 'release' }}
        continue-on-error: true
        run: python3 infra/space/kind/scripts/rust-artifact-handoff.py reuse ghcr.io/perplexityai/space-kind-rust-artifacts

      # A PR that changes Rust inputs restores main's newest incremental build
      # state instead of recompiling every workspace crate: Docker mode imports
      # main's dependency (cook) layers and rebuilds the workspace on top. The
      # state is the Cargo target directory, the source mirror whose mtimes tell
      # Cargo what changed, and the Cargo home
      # (infra/space/kind/scripts/rust-state-cache.sh). The build below then
      # runs in incremental mode and recompiles only the crates whose inputs
      # changed; without a restored state it builds in Docker mode, as before.
      # The script's `key` names what a restore never crosses (the toolchain,
      # the Cargo config, the builder image and its pinned base, the build lists
      # and the build's scripts) and what it may (Cargo.lock), for this restore
      # and main-ci.yml's kind_rust_state save alike. Main never restores: its
      # state is built cold. Setting the repository variable
      # SPACE_KIND_RUST_STATE to `off` turns both off.
      - name: Name the Kind Rust build state
        id: state-key
        if: steps.reuse.outputs.reused != 'true' && inputs.rust_build != 'release' && vars.SPACE_KIND_RUST_STATE != 'off'
        run: bash infra/space/kind/scripts/rust-state-cache.sh key

      - name: Restore main's Kind Rust build state
        if: steps.state-key.outcome == 'success' && github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kind-rust-state-parts
          key: ${{ steps.state-key.outputs.key }}
          restore-keys: |
            ${{ steps.state-key.outputs.lock }}
            ${{ steps.state-key.outputs.hard }}

      - name: Unpack the Kind Rust build state
        id: state
        if: steps.state-key.outcome == 'success' && github.event_name != 'push'
        run: >-
          bash infra/space/kind/scripts/rust-state-cache.sh unpack
          "${RUNNER_TEMP}/kind-rust-state-parts" "${RUNNER_TEMP}/kind-rust-state"

      - name: Build the Rust artifact image once
        if: steps.reuse.outputs.reused != 'true'
        env:
          SPACE_CI_IMAGE_MIRROR: ghcr
          SPACE_KIND_RUST_ARTIFACTS: ${{ steps.state.outputs.restored == 'true' && 'incremental' || 'docker' }}
          SPACE_KIND_RUST_BUILD: ${{ inputs.rust_build == 'release' && 'release' || '' }}
          SPACE_KIND_BUILD_CACHE_REPOSITORY: ghcr.io/perplexityai/space-kind-build-cache
          SPACE_KIND_BUILD_CACHE_WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
          SPACE_KIND_RUST_TARGET_DIR: ${{ runner.temp }}/kind-rust-state/target
          SPACE_KIND_RUST_SRC_DIR: ${{ runner.temp }}/kind-rust-state/src
          SPACE_KIND_CARGO_HOME: ${{ runner.temp }}/kind-rust-state/cargo-home
        run: bash infra/space/kind/scripts/build-rust-artifacts.sh

      - name: Export this run's artifact image
        run: |
          set -euo pipefail
          install -d "${RUNNER_TEMP}/kind-rust"
          docker image save space-rust-build-kind:local | gzip -1 >"${RUNNER_TEMP}/kind-rust/kind-rust.tar.gz"
          python3 infra/space/kind/scripts/rust-artifact-handoff.py record "${RUNNER_TEMP}/kind-rust"

      - name: Upload the image for this run's isolated shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kind-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kind-rust/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Main only: push the image main's producer just built under its Rust input
  # key, for PRs with the same key to reuse, and prune the producer's two
  # registry packages. A job of its own because the shards wait for the whole
  # producer job to complete, so nothing here delays them. It verifies the
  # handoff as a shard does before pushing. Every step tolerates failure: a
  # missed push costs later PRs a build, never main's result. No permissions
  # block: the caller grants them, and a PR caller's read-only grant would
  # refuse a job that asks for packages:write even though it never runs there.
  rust_artifacts_publish:
    if: github.repository == 'perplexityai/SPACE' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Publish shared Kind Rust artifacts
    needs: rust_artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *enable-containerd-store

      - *ghcr-login

      - name: Find this attempt's Rust producer
        id: producer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/space/kind/scripts/rust-artifact-handoff.py wait --timeout 300

      - name: Download this attempt's Rust artifact image
        id: download
        if: steps.producer.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kind-rust-${{ github.sha }}-${{ env.SPACE_KIND_RUST_PRODUCER_ATTEMPT }}
          path: ${{ runner.temp }}/kind-rust

      - name: Load and verify the Rust artifact image
        id: load
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: python3 infra/space/kind/scripts/rust-artifact-handoff.py load "${RUNNER_TEMP}/kind-rust"

      # Main builds on every push, so this replaces the key's earlier image.
      - name: Publish the artifact image under its Rust input key
        if: steps.load.outcome == 'success'
        continue-on-error: true
        run: python3 infra/space/kind/scripts/rust-artifact-handoff.py publish ghcr.io/perplexityai/space-kind-rust-artifacts

      # Only this dedicated cache package is pruned, never release images.
      # Fixed tagged heads stay intact; retain ten untagged versions for readers
      # already pulling an older manifest. This never runs on a PR.
      - name: Retain ten superseded cache versions
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          owner: perplexityai
          package-name: space-kind-build-cache
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 10

      # Only this dedicated artifact package, tags included. Every main push
      # republishes its key, leaving the previous image untagged, so twenty
      # versions are about the last twenty main pushes. A PR tests its merge
      # with the main it started from, and a re-run keeps that merge; a PR
      # whose key was pruned builds it. This never runs on a PR.
      - name: Retain twenty Rust artifact images
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          owner: perplexityai
          package-name: space-kind-rust-artifacts
          package-type: container
          min-versions-to-keep: 20

  smoke:
    if: github.repository == 'perplexityai/SPACE'
    name: Kind / Firecracker smoke (${{ matrix.shard }}/6)
    permissions:
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      # Six shards: with the leader-election brownout at the lease TTL floor, it
      # is about one shard's share of the ECW pass at six, so a seventh shard
      # would not lower the slowest. Keep the list, the job name and
      # SMOKE_SHARD's count in step.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # Image builds, the charts' images and the observability backends'
      # images come from the GHCR mirror; see ci/mirrored-images.txt.
      SPACE_CI_IMAGE_MIRROR: ghcr
      SPACE_KIND_RUST_ARTIFACTS: prebuilt
      # The release lane's build, which the handoff checks on the loaded image
      # and the bring-up and the typed smoke check on the bench.
      SPACE_KIND_RUST_BUILD: ${{ inputs.rust_build == 'release' && 'release' || '' }}
      # The runtime images and the seed import their dependency layers from
      # the cache main writes; a miss builds them cold. Never written here.
      SPACE_KIND_BUILD_CACHE_REPOSITORY: ghcr.io/perplexityai/space-kind-build-cache
      # The shards explicitly select the devbox `otel` profile, with the
      # local metrics, traces and logs backends installed from the mirror and
      # every service exporting to them. The scenarios run with telemetry on,
      # and local.telemetry_reaches_local_backends proves it arrives. Pinned
      # rather than inherited so a default change cannot alter the shards
      # silently.
      SPACE_KIND_TELEMETRY_MODE: otel
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 180
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Match the producer before loading the archive: the classic image store
      # exposes a config digest instead of the producer's image manifest
      # digest, which is its image ID on the containerd store.
      # Restart Docker before any Kind/Tilt containers exist.
      - *enable-containerd-store

      - name: Enable KVM access
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          if ! sudo udevadm control --reload-rules; then
            echo "::error::Failed to reload udev rules"
            exit 1
          fi
          if ! sudo udevadm trigger --name-match=kvm; then
            echo "::error::Failed to trigger the kvm udev device"
            exit 1
          fi
          if ! sudo udevadm settle; then
            echo "::error::Failed to wait for kvm udev processing"
            exit 1
          fi

          if [[ ! -e /dev/kvm ]]; then
            echo "::error::The runner does not expose /dev/kvm"
            exit 1
          fi
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm exists but is not a character device"
            exit 1
          fi
          if [[ ! -r /dev/kvm ]]; then
            echo "::error::The runner user cannot read /dev/kvm"
            exit 1
          fi
          if [[ ! -w /dev/kvm ]]; then
            echo "::error::The runner user cannot write /dev/kvm"
            exit 1
          fi

      - *ghcr-login

      - name: Install Kind smoke prerequisites
        run: |
          set -euo pipefail
          sudo install -d -m 0755 -o "${USER}" -g "$(id -gn)" /home/dev
          install -d -m 0755 "${HOME}/.local/bin"
          INSTALL_DIR="${HOME}/.local/bin" \
            bash infra/space/kind/scripts/install-prereqs.sh
          echo "${HOME}/.local/bin" >>"${GITHUB_PATH}"

      # The BYOK scenario seals snapshots with the host kernel's device-mapper
      # crypt and snapshot targets. Kind nodes share the runner's kernel and
      # cannot load modules themselves, so load them here, where a runner that
      # cannot fails the job instead of losing BYOK coverage. The general
      # bring-up never touches host modules; elsewhere the scenario's own
      # preflight reports missing targets. The runner image provides modprobe
      # and dmsetup, so they are not general smoke prerequisites: on a Devbox,
      # dmsetup's /usr/sbin is not on the user's PATH and install-prereqs.sh
      # rejected it as absent.
      - name: Load the host device-mapper targets for BYOK smoke
        run: |
          set -euo pipefail
          source scripts/lib/space-smoke-prereqs.sh
          space_smoke_prepare_encrypted_targets

      # The sandbox worker and builder nodes boot this image, which bakes in the
      # node layer (btrfs /space/cache, cgroup subtree, loop devices). Main CI
      # publishes each content-addressed tag; until then, or if the pull fails,
      # this builds it from the mirrored base. The bring-up would do the same,
      # but here its cost and source show up as a step of their own.
      - name: Provide the SPACE Kind node image
        run: bash infra/space/kind/scripts/kind-node-image.sh ensure

      # Stays on this shard's runner: no cluster or mutable test state crosses
      # jobs. Rust-independent setup now overlaps the shared producer.
      - name: Prepare Kind while the Rust producer builds
        run: bash infra/space/kind/scripts/prepare-cluster.sh

      # Tiltfile evaluation installs the selected observability profile before
      # Tilt registers its context, and none of it needs a SPACE image. In otel
      # mode that is minutes of image loads and Helm waits, which ran after the
      # producer finished. Installed here, they overlap the producer instead,
      # and Tilt's own pass finds each release unchanged. The Datadog preflight
      # runs first, as it does in the Tiltfile. Inside Tilt the install was
      # bounded by the bring-up's 1800 s initialization timeout; the step keeps
      # that bound, since `ctr images ls` and `kind load` have none of their own.
      - name: Install the observability profile while the Rust producer builds
        timeout-minutes: 30
        env:
          SPACE_KIND_CLUSTER: space-local
        run: |
          set -euo pipefail
          python3 infra/space/kind/scripts/datadog_backend.py preflight --for-deployment >/dev/null
          bash infra/space/kind/scripts/install-observability.sh

      - name: Wait for this attempt's Rust producer
        timeout-minutes: 70
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/space/kind/scripts/rust-artifact-handoff.py wait

      - name: Download this attempt's Rust artifact image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kind-rust-${{ github.sha }}-${{ env.SPACE_KIND_RUST_PRODUCER_ATTEMPT }}
          path: ${{ runner.temp }}/kind-rust

      - name: Load and verify the shared Rust artifact image
        run: python3 infra/space/kind/scripts/rust-artifact-handoff.py load "${RUNNER_TEMP}/kind-rust"

      # Where the bring-up after the artifact handoff spends its time, per Tilt
      # resource: scripts/benchmarks/kind-bringup-timeline.py records build
      # windows, pod and Job transitions and the Tilt log stamped on arrival,
      # which a passing run otherwise keeps none of. It runs in the background
      # through the baseline smoke; the step after the baseline stops it and
      # reports.
      - name: Record the Kind bring-up timeline
        continue-on-error: true
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/kind-bringup-timeline"
          install -d "${dir}"
          setsid nohup python3 scripts/benchmarks/kind-bringup-timeline.py watch "${dir}" \
            >"${dir}/watch.out" 2>&1 </dev/null &
          echo "$!" >"${dir}/watch.pid"

      # DATA_PLANE_URL makes the bring-up wait for the public data plane as well as the API.
      # The data plane's ReplicaSet reaches ready a few minutes after the API on a cold
      # stack; without this wait the baseline passes on the API alone and the typed suite's
      # first scenarios fail with connection refused on 127.0.0.1:8090.
      # Every Tilt invocation verifies and reuses the loaded Rust image. Runtime images,
      # seed, credentials, and Kind cluster state are still built separately on each runner.
      - name: Run the baseline Kind smoke
        env:
          BOOTSTRAP_TIMEOUT: 1800
          DATA_PLANE_URL: http://127.0.0.1:8090
        run: bash scripts/tests/smoke-kind-e2e.sh

      # Snapshots Tilt's build history while Tilt still runs, stops the
      # recorder and prints the timeline; the next step uploads its raw files.
      # None of the three steps fails the shard: the timeline is evidence, not
      # a check.
      - name: Report the Kind bring-up timeline
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          dir="${RUNNER_TEMP}/kind-bringup-timeline"
          [[ -s "${dir}/watch.pid" ]] || exit 0
          timeout 60 python3 scripts/benchmarks/kind-bringup-timeline.py snapshot "${dir}" >/dev/null || true
          pid="$(<"${dir}/watch.pid")"
          kill -TERM "${pid}" 2>/dev/null || true
          for _ in $(seq 1 20); do kill -0 "${pid}" 2>/dev/null || break; sleep 1; done
          timeout 60 python3 scripts/benchmarks/kind-bringup-timeline.py report "${dir}" || true

      - name: Upload the Kind bring-up timeline
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kind-bringup-timeline-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kind-bringup-timeline/
          retention-days: 7
          if-no-files-found: ignore

      # Together the shards cover every ecw, network_policy, native, and local scenario.
      # Each shard stays serial against the isolated stack its baseline proved. The suite
      # exits 1 on any failed scenario and 2 on an inconclusive one or a missing tool, so a
      # partial run cannot report green. A scenario declared `quarantined=` is withheld and
      # printed as QUARANTINED with its reason, so the log shows what this run did not prove.
      # ecw.cold_create_environment needs an admin bearer token file and a receipts
      # directory; both are created here from the local root account the baseline already
      # logged in as. Two local scenarios need the aws CLI. `all` runs the inventory on the
      # ECW API surface and then the native-capable scenarios on the native /v1 surface, and
      # exits nonzero if either pass did; that second pass is the only typed coverage of the
      # native API. native.m1_generated_sdk_conformance generates the M1 SDK with the pinned
      # OpenAPI Generator; SPACE_M1_GENERATOR_MIRROR makes scripts/check-m1-sdk-generation.sh
      # pull that image from the GHCR mirror (ci/mirrored-images.txt) this job logged in to,
      # falling back to Docker Hub.
      - name: Run this shard of the typed Kind smoke
        env:
          SKIP_BOOTSTRAP: "1"
          SMOKE_SHARD: ${{ matrix.shard }}/6
          SPACE_M1_GENERATOR_MIRROR: ghcr.io/perplexityai/space-ci-mirror
          SPACE_SMOKE_KIND_ADMIN_TOKEN_FILE: ${{ runner.temp }}/space-smoke-admin-token
          SPACE_SMOKE_KIND_COLD_RECEIPTS: ${{ runner.temp }}/space-smoke-cold-receipts
        run: |
          set -euo pipefail
          for tool in aws curl jq; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              echo "::error::The typed Kind smoke needs ${tool} on the runner"
              exit 1
            fi
          done
          uv_bin="$(bash ci/scripts/ensure-uv.sh)"
          uv_dir="$(dirname "${uv_bin}")"
          export PATH="${uv_dir}:${PATH}"
          install -d -m 0700 "${SPACE_SMOKE_KIND_COLD_RECEIPTS}"
          curl -fsS -X POST http://localhost:8080/auth/v1/sessions \
            -H 'content-type: application/json' \
            -d '{"email":"root@local","password":"password"}' \
            | jq -r '.token // empty' >"${SPACE_SMOKE_KIND_ADMIN_TOKEN_FILE}"
          chmod 0600 "${SPACE_SMOKE_KIND_ADMIN_TOKEN_FILE}"
          if [[ ! -s "${SPACE_SMOKE_KIND_ADMIN_TOKEN_FILE}" ]]; then
            echo "::error::Could not obtain an admin session token from the Kind API"
            exit 1
          fi
          # Belt and braces for the baseline's wait: the typed scenarios talk to the data
          # plane from their first command, so prove it answers before starting any of them.
          for _ in $(seq 1 150); do
            if curl -sf -m 2 http://127.0.0.1:8090/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! curl -sf -m 2 http://127.0.0.1:8090/healthz >/dev/null 2>&1; then
            echo "::error::The Kind data plane at 127.0.0.1:8090 never became healthy"
            exit 1
          fi
          # Kept for the failure-telemetry step, which reads the failed
          # scenarios' sandbox ids from it.
          bash scripts/tests/smoke-kind-typed.sh all "${SMOKE_SHARD}" 2>&1 \
            | tee "${RUNNER_TEMP}/kind-typed-smoke.log"

      # Every command below is bounded, and each step has a deadline: a wedged
      # apiserver, Tilt, or node must not hold the job until its own deadline and
      # lose the evidence upload. Each command writes its own output, so what
      # finished before a timeout is still uploaded.
      - name: Collect Kind diagnostics
        if: failure()
        timeout-minutes: 5
        run: |
          k() { timeout "$1" kubectl --context kind-space-local "${@:2}"; }
          k 30s get nodes -o wide || true
          k 30s get pods -A -o wide || true
          # The sandbox pods' own namespace and the NetworkPolicies confining
          # it: a pod the policies refuse shows up as a dial timeout in the
          # API's log, not as a pod event.
          k 30s -n sandboxes get pods,networkpolicies,events -o wide || true
          # The local observability backends, whose own failures can surface as
          # a missing signal rather than a failed step.
          for namespace in space-metrics space-traces space-logs; do
            k 30s -n "${namespace}" get pods,events -o wide || true
            for pod in $(k 30s -n "${namespace}" get pods -o name); do
              k 30s -n "${namespace}" logs "${pod}" --all-containers=true --tail=100 || true
            done
          done
          timeout 30s tilt get uiresources -o yaml || true
          timeout 30s tilt logs --tail=200 || true
          # One DaemonSet per node service: keep each pod's earlier attempt
          # visible when its container restarted, init containers included.
          for pod in $(k 30s -n space get pods -l app.kubernetes.io/part-of=space-node -o name); do
            echo "::group::${pod}"
            k 30s -n space logs "$pod" --all-containers --previous --prefix --tail=100 || true
            k 30s -n space logs "$pod" --all-containers --prefix --tail=100 || true
            echo "::endgroup::"
          done
          # The smoke reaches the API and data plane through the infra node's
          # host port mappings onto their NodePort entry Services, which reach
          # every ready replica; the autoscalers and endpoints show how many
          # there were. The object store is still a Tilt port-forward, pinned
          # to one pod: its status shows when it last dropped.
          k 30s -n space get hpa,endpoints -o wide || true
          timeout 15s docker port "$(timeout 15s kubectl --context kind-space-local get nodes \
            -l space.pplx.net/node-pool=infra -o jsonpath='{.items[0].metadata.name}')" || true
          timeout 30s tilt get portforwards -o yaml || true

      # A sandbox pod stuck Terminating is held on its node: the kubelet's
      # StopPodSandbox runs through containerd into the SPACE shim, which waits
      # for node-local sbx-manager. Only the node journals (the shim logs to
      # containerd's stderr) and the node-service logs name the refused call,
      # and they vanish with the runner. The Kind nodes are fresh per job, so
      # each journal covers exactly this run. The node units' journals
      # (runtime-supervisor, which runs every Firecracker VM, and the node
      # layer) and each node's mount table, with propagation, show what the
      # node itself held.
      - name: Collect Kind node teardown evidence
        if: failure()
        timeout-minutes: 8
        run: |
          dir="${RUNNER_TEMP}/kind-node-diagnostics"
          mkdir -p "${dir}"
          # Keep startup/evaluation output even when Tilt has not registered a
          # cluster or any application resources yet.
          tilt_log="${SPACE_TILT_LOG:-$HOME/.space-devbox/kind/tilt-${SPACE_KIND_CLUSTER:-space-local}.log}"
          if [[ -f "$tilt_log" ]]; then
            tail -c 2097152 "$tilt_log" >"${dir}/tilt-startup.log"
          fi
          k() { timeout "$1" kubectl --context kind-space-local "${@:2}"; }
          # Preserve the first admission/recovery error, not only its final retry,
          # from every API replica: `logs deployment/...` reads only one.
          for pod in $(k 30s -n space get pods -l app.kubernetes.io/name=space-api -o name); do
            k 45s -n space logs "${pod}" --all-containers=true --timestamps \
              >"${dir}/${pod#pod/}.log" 2>&1 || true
          done
          # The credential-manager authority every node agent forwards to, each
          # replica: its storage exchange decisions are spread over both.
          for pod in $(k 30s -n space get pods -l app.kubernetes.io/name=space-credmgr-authority -o name); do
            k 45s -n space logs "${pod}" --all-containers=true --timestamps \
              >"${dir}/${pod#pod/}.log" 2>&1 || true
          done
          # Its Kind fixtures: the key broker, and the STS bridge with the
          # object store's IAM service behind it.
          k 45s -n space logs deployment/space-kind-key-broker --all-containers=true --timestamps \
            >"${dir}/space-kind-key-broker.log" 2>&1 || true
          k 45s -n space logs deployment/space-kind-sts-bridge --all-containers=true --timestamps \
            >"${dir}/space-kind-sts-bridge.log" 2>&1 || true
          k 45s -n space logs deployment/space-object-store-iam --timestamps \
            >"${dir}/space-object-store-iam.log" 2>&1 || true
          # The cluster-controller's Kind fixture: the fake EC2 endpoint, whose
          # log records every call the reconcile-queue GC made.
          k 45s -n space logs deployment/space-kind-fake-ec2 --all-containers=true --timestamps \
            >"${dir}/space-kind-fake-ec2.log" 2>&1 || true
          for node in $(timeout 30s kind get nodes --name space-local 2>/dev/null); do
            timeout 45s docker exec "${node}" journalctl -u kubelet -u containerd --no-pager -o short-iso \
              >"${dir}/${node}.journal.log" 2>&1 || true
            timeout 15s docker exec "${node}" crictl pods >"${dir}/${node}.crictl-pods.txt" 2>&1 || true
            timeout 45s docker exec "${node}" journalctl -u 'space-*' --no-pager -o short-iso \
              >"${dir}/${node}.space-units.journal.log" 2>&1 || true
            timeout 15s docker exec "${node}" systemctl status 'space-*' --no-pager \
              >"${dir}/${node}.space-units.status.txt" 2>&1 || true
            timeout 15s docker exec "${node}" findmnt -o TARGET,FSTYPE,PROPAGATION \
              >"${dir}/${node}.findmnt.txt" 2>&1 || true
          done
          for pod in $(k 30s -n space get pods -l app.kubernetes.io/part-of=space-node -o name); do
            k 45s -n space logs "${pod}" --all-containers --previous --prefix --timestamps \
              >"${dir}/${pod#pod/}.previous.log" 2>&1 || true
            k 45s -n space logs "${pod}" --all-containers --prefix --timestamps \
              >"${dir}/${pod#pod/}.log" 2>&1 || true
          done
          k 30s -n sandboxes get pods -l app.kubernetes.io/name=space-sandbox -o json \
            | jq -r '.items[] | select(.metadata.deletionTimestamp) | .metadata.name' \
            | while IFS= read -r pod; do
                echo "::group::Terminating sandbox pod ${pod}"
                k 15s -n sandboxes describe pod "${pod}" || true
                echo "::endgroup::"
              done || true
          echo "Teardown refusals recorded by the node journals (last 100):"
          grep -hE 'StopPodSandbox.*failed|KillPodSandbox|\[space-shim\] (kill|delete): task .* keeps running' \
            "${dir}"/*.journal.log 2>/dev/null | tail -n 100 || true

      # The local Tempo, Loki and Prometheus die with the runner. Save what they
      # hold for each failed scenario's sandboxes (its traces, its log lines)
      # and the run's space_* series into the uploaded evidence. The script is
      # bounded in time and size and exits 0; continue-on-error keeps a
      # surprise here from failing the job or skipping the upload.
      - name: Collect failed-scenario telemetry
        if: failure()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python3 infra/space/kind/scripts/collect-failure-telemetry.py \
            --out "${RUNNER_TEMP}/kind-node-diagnostics/telemetry" \
            --log "${RUNNER_TEMP}/kind-typed-smoke.log" \
            --budget 240

      - name: Upload Kind node teardown evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kind-node-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kind-node-diagnostics/
          retention-days: 7
