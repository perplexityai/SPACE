name: Common CI

on:
  workflow_call:
    inputs:
      base_sha:
        description: Commit used as the migration-check comparison base
        required: true
        type: string
      per_commit_migration_isolation:
        description: Check migration isolation separately for each first-parent commit after base_sha
        required: false
        default: false
        type: boolean
      main_only_tests:
        description: >-
          Also run the tests whose cost only the post-merge pipeline pays for.
          Their contracts are covered at small scale on every run; the
          full-scale versions re-prove them against production-sized
          statistics.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  guidebook:
    if: github.repository == 'perplexityai/SPACE'
    name: SPACE Guide
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The steps after the workload run this copy of the package cache
      # helper, taken before the workload starts, so they always run the
      # reviewed helper. It imports only Python's standard library.
      - &copy-package-cache-helper
        name: Copy the package cache helper
        run: |
          set -euo pipefail
          install -d "${RUNNER_TEMP}/space-ci-helpers"
          install -m 0444 ci/scripts/package-cache.py "${RUNNER_TEMP}/space-ci-helpers/"
          chmod 0555 "${RUNNER_TEMP}/space-ci-helpers"

      # A GitHub release download has answered 500 to four attempts over 8 s,
      # while jobs half a minute either side fetched the same file. Six retries
      # back off over about a minute; --retry-all-errors also retries a reset
      # connection.
      - &install-mdbook
        name: Install pinned mdBook
        run: |
          version="$(cat docs/book/mdbook.version)"
          archive="mdbook-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 6 --retry-all-errors --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${version}/$archive"
          echo "c96bdabf3754d9e016fb803c1565a41050434479b2dc1e02a87c8d0da7524c6c  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mdbook
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Set up guide diagram tooling
        # Mermaid's offline browser bundle comes from the shared docs lockfile.
        # Keep the standalone guide on the same Node version as the API build.
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.23.3'

      # Package caches: a run downloads only the packages its lockfile
      # changed. Each cache is keyed on its inputs and the run (the families
      # and their inputs are in ci/scripts/package-cache.py), and every job
      # restores the newest copy for its inputs, else the newest of the family,
      # and fetches the difference. One job saves each cache, on main only:
      # when it restored no copy for these inputs, or had to repair or
      # complete it. It first trims the copy to the lockfile, so the cache does
      # not grow with every change, and Main CI deletes superseded copies. A
      # stalled restore gives up after SEGMENT_DOWNLOAD_TIMEOUT_MINS, and a
      # miss, a failed restore or a damaged archive only costs a download.
      # Preparing a copy for upload never fails the job; it only skips the
      # save. This job saves npm's.
      - &name-npm-cache
        name: Name the npm cache
        id: npm-cache-key
        run: python3 ci/scripts/package-cache.py key npm

      - &restore-npm-cache
        name: Restore the npm cache
        id: restore-npm-cache
        continue-on-error: true
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.npm-cache-key.outputs.lock }}
            ${{ steps.npm-cache-key.outputs.family }}

      - &prepare-npm-cache
        name: Prepare the npm cache
        env:
          MATCHED_KEY: ${{ steps.restore-npm-cache.outputs.cache-matched-key }}
        run: python3 ci/scripts/package-cache.py restored npm "${HOME}/.npm" "${MATCHED_KEY}"

      - name: Build and check the guide
        run: |
          bash scripts/build-guide-docs.sh
          python3 docs/book/test.py

      - name: Report the npm cache
        id: report-npm-cache
        if: always()
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/space-ci-helpers/package-cache.py
          KEY: ${{ steps.npm-cache-key.outputs.key }}
          MATCHED_KEY: ${{ steps.restore-npm-cache.outputs.cache-matched-key }}
        run: >-
          python3 -I "${PACKAGE_CACHE}" report npm "${HOME}/.npm"
          --decide "${KEY}" --matched-key "${MATCHED_KEY}"

      - name: Prepare the npm cache for upload
        id: prepare-npm-upload
        continue-on-error: true
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.report-npm-cache.outputs.npm-save == 'true'
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/space-ci-helpers/package-cache.py
        run: python3 -I "${PACKAGE_CACHE}" trim npm "${HOME}/.npm" docs/api/package-lock.json

      - name: Save the npm cache
        if: steps.prepare-npm-upload.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache-key.outputs.key }}

  api_reference:
    if: github.repository == 'perplexityai/SPACE'
    name: Documentation site
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 15
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *copy-package-cache-helper

      # The SPACE Guide saves the npm cache, which the two jobs' identical
      # `npm ci` share, and Rust tests the Cargo registry.
      - name: Set up documentation tooling
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.23.3'

      - *name-npm-cache

      - *restore-npm-cache

      - *prepare-npm-cache

      - &name-cargo-registry
        name: Name the Cargo registry cache
        id: cargo-registry-key
        run: python3 ci/scripts/package-cache.py key cargo

      - &restore-cargo-registry
        name: Restore the Cargo registry
        id: restore-cargo-registry
        continue-on-error: true
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cargo unpacks sources from the .crate archives on demand, and
          # resolves a complete Cargo.lock offline from the index's cache.
          path: |
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-home/registry/index
          key: ${{ steps.cargo-registry-key.outputs.key }}
          restore-keys: |
            ${{ steps.cargo-registry-key.outputs.lock }}
            ${{ steps.cargo-registry-key.outputs.family }}

      # Cargo takes a .crate in its registry as downloaded, so a damaged one
      # would fail every build; one whose checksum is not Cargo.lock's goes.
      - &prepare-cargo-registry
        name: Prepare the Cargo registry
        env:
          MATCHED_KEY: ${{ steps.restore-cargo-registry.outputs.cache-matched-key }}
        run: >-
          python3 ci/scripts/package-cache.py restored cargo "${RUNNER_TEMP}/cargo-home/registry"
          "${MATCHED_KEY}" --lockfile Cargo.lock

      - *install-mdbook

      - name: Get the CI image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: bash ci/scripts/ci-image.sh ensure "space-ci:${GITHUB_SHA}"

      - name: Install documentation dependencies
        run: npm ci --prefix docs/api --ignore-scripts --no-fund --no-audit

      - name: Build guide and API
        env:
          SPACE_API_DOCS_RUST_IMAGE: space-ci:${{ github.sha }}
          SPACE_API_DOCS_CARGO_REGISTRY: ${{ runner.temp }}/cargo-home/registry
          SPACE_DOCS_NPM_CI_DONE: '1'
        run: bash scripts/build-docs.sh

      - name: Report the npm cache
        if: always()
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/space-ci-helpers/package-cache.py
        run: python3 -I "${PACKAGE_CACHE}" report npm "${HOME}/.npm"

      - &report-cargo-registry
        name: Report the Cargo registry
        if: always()
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/space-ci-helpers/package-cache.py
        run: python3 -I "${PACKAGE_CACHE}" report cargo "${RUNNER_TEMP}/cargo-home/registry"

      - name: Check standalone outputs and the combined site
        run: |
          python3 docs/book/test.py
          python3 docs/site/test_build.py

      - name: Retain private preview assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: space-docs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/docs/site/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # The existing Rust test lane below also runs the canonical OpenAPI contract
  # tests. Both this job and that lane feed the unchanged space-pull-ci gate for
  # pull requests and merge groups. No docs deployment or write token is used.
  dependency_vetting:
    if: github.repository == 'perplexityai/SPACE'
    name: Rust dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *copy-package-cache-helper

      # Both tools read every package's manifest through `cargo metadata`,
      # which downloads every crate in Cargo.lock.
      - *name-cargo-registry

      - *restore-cargo-registry

      - *prepare-cargo-registry

      # cargo-vet and cargo-deny are pinned in ci/Dockerfile.ci and ship in the
      # CI image, so this job no longer compiles them on every run.
      - name: Get the CI image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: bash ci/scripts/ci-image.sh ensure "space-ci:${GITHUB_SHA}"

      - name: Verify third-party Rust dependencies
        run: >-
          docker run --rm --volume "${GITHUB_WORKSPACE}:/workspace" --workdir /workspace
          --volume "${RUNNER_TEMP}/cargo-home/registry:/usr/local/cargo/registry"
          "space-ci:${GITHUB_SHA}" cargo vet --locked

      - name: Check Rust advisories, licenses, and sources
        run: >-
          docker run --rm --volume "${GITHUB_WORKSPACE}:/workspace" --workdir /workspace
          --volume "${RUNNER_TEMP}/cargo-home/registry:/usr/local/cargo/registry"
          "space-ci:${GITHUB_SHA}"
          cargo deny --locked --all-features check advisories licenses sources

      - *report-cargo-registry

  validation:
    if: github.repository == 'perplexityai/SPACE'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The build and every test outside the nextest group `privileged`
          # run as the image's unprivileged user, with no Docker socket and no
          # host network; the runner starts their Postgres and Redis. The
          # privileged group then runs as root from the same build, in the
          # "Run the privileged Rust tests" step. See .config/nextest.toml.
          - name: Rust tests
            command: bash ci/scripts/run-rust-checks.sh tests-unprivileged
            # The full all-targets/all-features graph exhausts the standard
            # runner's 14 GB disk before linking the workspace test binaries.
            runner: ubuntu-24.04-16core
            docker_access: false
            host_network: false
            privileged: false
            unprivileged_user: true
            test_services: true
            privileged_tests: true
            rust_cache: true
            rust_cache_key: tests
            rust_cache_size: 4G
            rust_cache_refresh_misses: 20
            rust_target_cache: true
            cargo_registry: save
            # Only this runner gains from it: on the standard runners the
            # prefetch slows the concurrent CI image pull by more than it saves.
            prefetch_crates: true
            timeout: 120
          - name: Go shim
            command: bash ci/scripts/run-shim-checks.sh
            runner: ubuntu-24.04
            docker_access: false
            host_network: false
            privileged: false
            go_modules: save
            timeout: 30
          - name: Python tests
            command: bash ci/scripts/run-python-tests.sh
            runner: ubuntu-24.04
            docker_access: true
            host_network: true
            privileged: false
            uv_cache: python
            uv_cache_save: true
            timeout: 30
          - name: Shell tests
            command: bash ci/scripts/run-shell-tests.sh
            runner: ubuntu-24.04
            docker_access: false
            host_network: false
            privileged: false
            uv_cache: shell
            uv_cache_save: true
            timeout: 30
          - name: Migration guards
            command: >-
              migration_base="$(bash ci/scripts/resolve-migration-base.sh "$SPACE_CI_BASE_SHA" "$SPACE_CI_PULL_REQUEST_HEAD_SHA")" &&
              export BUILDKITE_BUILD_ID=github-actions &&
              export MIGRATION_VERSION_GUARD_BASE_REF="$migration_base" &&
              export MIGRATION_ISOLATION_BASE_REF="$migration_base" &&
              export MIGRATION_SQUAWK_BASE_REF="$migration_base" &&
              bash scripts/check-migration-versions.sh &&
              if [[ "$SPACE_CI_PER_COMMIT_MIGRATION_ISOLATION" == true ]]; then
              bash ci/scripts/check-migration-isolation-per-commit.sh "$migration_base";
              else bash scripts/check-postgres-migrations-isolated.sh; fi &&
              bash scripts/check-postgres-migrations-squawk.sh
            runner: ubuntu-24.04
            docker_access: false
            host_network: false
            privileged: false
            uv_cache: shell
            timeout: 15
          - name: Gateway traffic
            command: >-
              bash scripts/netgtw/traffic/run.sh &&
              NETGTW_TRAFFIC_SKIP_BUILD=1 python3 scripts/netgtw/traffic/tls-authority/run.py
            runner: ubuntu-24.04
            docker_access: false
            host_network: true
            privileged: true
            # Its own snapshot: the tests job's --workspace --all-features
            # build compiles different feature sets, so its keys never match.
            # One cold build writes about 330 MiB.
            rust_cache: true
            rust_cache_key: gateway
            rust_cache_size: 1G
            rust_cache_refresh_misses: 20
            cargo_registry: restore
            uv_cache: gateway
            uv_cache_save: true
            timeout: 45

    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - *copy-package-cache-helper

      # The repository-owned image pins the same toolchain used by the source
      # scripts. Main pushes publish it to this repository's GHCR package; a
      # job builds it locally when its tag is new or cannot be pulled. SPACE CI
      # neither reads nor writes SPACE's private CI image registry. The pull
      # runs in the background while the next steps fetch the test containers'
      # images and the compiler cache; "Wait for the CI image" reports it.
      - name: Start getting the CI image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: >-
          bash ci/scripts/background-step.sh start ci-image
          bash ci/scripts/ci-image.sh ensure "space-ci:${GITHUB_SHA}"

      # The package caches, as in the SPACE Guide job. An entry restores the
      # ones it sets among cargo_registry, go_modules and uv_cache; the one
      # entry whose cargo_registry or go_modules is `save`, or that sets
      # uv_cache_save, saves that cache on main. Each uv family has its own
      # inputs, because no job installs another's packages. The migration
      # guards restore the shell tests' family, whose inputs are their
      # checkers', and use it only for a changed migration.
      - name: Name the package caches
        id: package-cache-keys
        if: matrix.cargo_registry || matrix.go_modules || matrix.uv_cache
        env:
          UV_CACHE: ${{ matrix.uv_cache }}
        run: |
          set -euo pipefail
          python3 ci/scripts/package-cache.py key cargo --output-prefix cargo-
          python3 ci/scripts/package-cache.py key go --output-prefix go-
          if [[ -n "${UV_CACHE}" ]]; then
            python3 ci/scripts/package-cache.py key "uv-${UV_CACHE}" --output-prefix uv-
          fi

      - name: Restore the Cargo registry
        id: restore-cargo-registry
        if: matrix.cargo_registry
        continue-on-error: true
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-home/registry/index
          key: ${{ steps.package-cache-keys.outputs.cargo-key }}
          restore-keys: |
            ${{ steps.package-cache-keys.outputs.cargo-lock }}
            ${{ steps.package-cache-keys.outputs.cargo-family }}

      - name: Restore the Go module cache
        id: restore-go-modules
        if: matrix.go_modules
        continue-on-error: true
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only the downloaded archives: Go extracts a module from its zip
          # without the network.
          path: ${{ runner.temp }}/go-mod/cache/download
          key: ${{ steps.package-cache-keys.outputs.go-key }}
          restore-keys: |
            ${{ steps.package-cache-keys.outputs.go-lock }}
            ${{ steps.package-cache-keys.outputs.go-family }}

      - name: Restore the uv cache
        id: restore-uv-cache
        if: matrix.uv_cache
        continue-on-error: true
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ steps.package-cache-keys.outputs.uv-key }}
          restore-keys: |
            ${{ steps.package-cache-keys.outputs.uv-lock }}
            ${{ steps.package-cache-keys.outputs.uv-family }}

      # Cargo and Go take an archive in their cache as downloaded, so a damaged
      # one would fail every build; one whose checksum is not the lockfile's
      # goes.
      - name: Prepare the package caches
        if: matrix.cargo_registry || matrix.go_modules || matrix.uv_cache
        env:
          CARGO_REGISTRY: ${{ matrix.cargo_registry }}
          CARGO_KEY: ${{ steps.restore-cargo-registry.outputs.cache-matched-key }}
          GO_MODULES: ${{ matrix.go_modules }}
          GO_KEY: ${{ steps.restore-go-modules.outputs.cache-matched-key }}
          UV_CACHE: ${{ matrix.uv_cache }}
          UV_KEY: ${{ steps.restore-uv-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [[ -n "${CARGO_REGISTRY}" ]]; then
            python3 ci/scripts/package-cache.py restored cargo "${RUNNER_TEMP}/cargo-home/registry" \
              "${CARGO_KEY}" --lockfile Cargo.lock
          fi
          if [[ -n "${GO_MODULES}" ]]; then
            python3 ci/scripts/package-cache.py restored go "${RUNNER_TEMP}/go-mod" "${GO_KEY}" \
              --lockfile shim/go.sum
          fi
          if [[ -n "${UV_CACHE}" ]]; then
            python3 ci/scripts/package-cache.py restored uv "${RUNNER_TEMP}/uv-cache" "${UV_KEY}"
          fi

      # Download the crates the restored registry lacks meanwhile with the
      # runner's own Cargo, into the registry the job container mounts; its
      # `cargo fetch --locked` then only checks them. Cargo shares one registry
      # across versions, as on any machine with several toolchains. This only
      # saves time: if it fails, the container's fetch downloads them, as
      # before.
      - name: Start fetching the Rust dependencies
        if: matrix.prefetch_crates == true
        run: >-
          bash ci/scripts/background-step.sh start cargo-fetch
          env RUSTUP_TOOLCHAIN=stable RUSTUP_AUTO_INSTALL=0 CARGO_HOME="${RUNNER_TEMP}/cargo-home"
          cargo fetch --locked

      # Anonymous public.ecr.aws pulls from these runners fail once their
      # shared egress exhausts its data limit, and retries do not help. Take the
      # test containers' images from this repository's GHCR mirror instead; see
      # ci/mirrored-images.txt. The job container shares this Docker daemon, so
      # its own pulls find the images already present. A missing mirror falls
      # back to the source and never fails the job. Like the CI image, the pull
      # overlaps the cache restores below and is waited for before the run.
      - name: Start pulling the test containers' images
        if: matrix.docker_access == true || matrix.test_services == true
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          source ci/scripts/lib/test-deps.sh
          bash ci/scripts/background-step.sh start test-images \
            bash ci/scripts/mirror-images.sh pull \
            "$(space_test_dependency_postgres_image)" "$(space_test_dependency_redis_image)"

      # The Rust tests' M1 SDK check runs the OpenAPI generator from Docker Hub,
      # whose anonymous pull limit these runners also share. Pull its
      # linux/amd64 image from the mirror as well. The check runs that copy when
      # this daemon has it (SPACE_M1_GENERATOR_MIRROR below), and otherwise
      # tries the mirror itself and then Docker Hub; see
      # scripts/check-m1-sdk-generation.sh.
      - name: Start pulling the M1 SDK generator's image
        if: matrix.name == 'Rust tests'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: >-
          bash ci/scripts/background-step.sh start m1-generator
          bash ci/scripts/mirror-images.sh pull
          openapitools/openapi-generator-cli:v7.25.0@sha256:2ab0a9680222de65dc9d3baf861aa02b99e1b80c211d8221ebf3ae8f8a102524

      # sccache cannot cache what links: test harnesses, binaries, build scripts
      # and proc-macros. A Cargo target directory from an earlier commit can
      # skip those too. Main builds cold and saves one per push; pull requests
      # and the merge queue restore the newest and rebuild what changed since.
      # The key never crosses the toolchain, Cargo config, CI image, test
      # script or this mechanism; it does cross Cargo.lock, whose changes
      # Cargo's own fingerprints track. The test script's side checks, in
      # ci/scripts/lib/rust-side-checks.sh, are not among its inputs: they build
      # in this directory only through the test script's own functions. Main CI
      # keeps the newest directory for each of the last few inputs, so a pull
      # request stacked on a branch with older ones still finds its own. See
      # ci/scripts/rust-target-cache.sh.
      # Setting the repository variable SPACE_RUST_TARGET_CACHE to off
      # disables it.
      - name: Name the Cargo target directory
        id: target-key
        if: matrix.rust_target_cache == true && vars.SPACE_RUST_TARGET_CACHE != 'off'
        env:
          FAMILY: space-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_cache_key }}
          HARD: >-
            ${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'ci/Dockerfile.ci',
            'ci/scripts/run-rust-checks.sh', 'ci/scripts/rust-target-cache.sh') }}
          LOCK: ${{ hashFiles('Cargo.lock') }}
        run: |
          {
            echo "hard=${FAMILY}-${HARD:0:16}-"
            echo "lock=${FAMILY}-${HARD:0:16}-${LOCK:0:16}-"
            echo "key=${FAMILY}-${HARD:0:16}-${LOCK:0:16}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >>"${GITHUB_OUTPUT}"

      # Main never restores one: its cold build is what catches an input Cargo
      # was never told about.
      - name: Restore the Cargo target directory
        if: steps.target-key.outcome == 'success' && github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/space-target-parts
          key: ${{ steps.target-key.outputs.key }}
          restore-keys: |
            ${{ steps.target-key.outputs.lock }}
            ${{ steps.target-key.outputs.hard }}

      # Unpacking takes the CPU and disk while the compiler cache's restore
      # below mostly downloads, so the two overlap.
      - name: Start hydrating the Cargo target directory
        if: steps.target-key.outcome == 'success'
        run: >-
          bash ci/scripts/background-step.sh start target-hydrate
          bash ci/scripts/rust-target-cache.sh hydrate target/buildkite-tests "${RUNNER_TEMP}/space-target-parts"

      # GitHub's cache service rate-limits sccache's per-object backend under
      # this workspace's compile fanout. Restore one bounded local archive
      # instead. Only trusted main pushes save one, each under a new key, so a
      # restore takes the newest snapshot for the current dependency inputs,
      # else the newest for any inputs.
      - name: Name the Rust compiler cache
        id: rust-cache-key
        if: matrix.rust_cache == true
        env:
          FAMILY: space-sccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_cache_key }}
          INPUTS: >-
            ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'ci/Dockerfile.ci',
            'ci/scripts/run-rust-checks.sh') }}
        run: |
          {
            echo "family=${FAMILY}-"
            echo "inputs=${FAMILY}-${INPUTS}-"
            echo "key=${FAMILY}-${INPUTS}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >>"${GITHUB_OUTPUT}"

      - name: Restore the Rust compiler cache
        id: restore-rust-cache
        if: matrix.rust_cache == true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/space-sccache
          key: ${{ steps.rust-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.rust-cache-key.outputs.inputs }}
            ${{ steps.rust-cache-key.outputs.family }}

      - name: Wait for the Cargo target directory
        if: steps.target-key.outcome == 'success'
        run: bash ci/scripts/background-step.sh wait target-hydrate

      - name: Wait for the CI image
        run: bash ci/scripts/background-step.sh wait ci-image

      # Also when it failed: the two Cargos do not share a lock, so the
      # container's must not start while this one still writes.
      - name: Wait for the Rust dependencies
        if: matrix.prefetch_crates == true
        run: >-
          bash ci/scripts/background-step.sh wait cargo-fetch ||
          echo "::warning::The runner could not fetch the Rust dependencies; the job container fetches them itself"

      - name: Wait for the test containers' images
        if: matrix.docker_access == true || matrix.test_services == true
        run: bash ci/scripts/background-step.sh wait test-images

      # The job container has no Docker socket, so its nextest setup scripts
      # take these servers instead of starting their own. The owner label is
      # this job's, so the stop step removes only what this step created.
      - name: Start the test services
        id: test-services
        if: matrix.test_services == true
        env:
          SPACE_CI_TEST_SERVICES_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
        run: |
          set -euo pipefail
          services="$(bash ci/scripts/ci-test-services.sh start space-ci-tests "${SPACE_CI_TEST_SERVICES_OWNER}")"
          printf 'env<<EOF\n%s\nEOF\n' "${services}" >>"${GITHUB_OUTPUT}"

      - name: Wait for the M1 SDK generator's image
        if: matrix.name == 'Rust tests'
        run: bash ci/scripts/background-step.sh wait m1-generator

      - name: Run ${{ matrix.name }}
        id: run
        env:
          SPACE_CI_COMMAND: ${{ matrix.command }}
          SPACE_CI_BASE_SHA: ${{ inputs.base_sha }}
          SPACE_CI_PER_COMMIT_MIGRATION_ISOLATION: ${{ inputs.per_commit_migration_isolation }}
          SPACE_CI_MAIN_ONLY_TESTS: ${{ inputs.main_only_tests }}
          SPACE_CI_PULL_REQUEST_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          SPACE_CI_DOCKER_ACCESS: ${{ matrix.docker_access }}
          SPACE_CI_HOST_NETWORK: ${{ matrix.host_network }}
          SPACE_CI_PRIVILEGED: ${{ matrix.privileged }}
          SPACE_CI_UNPRIVILEGED_USER: ${{ matrix.unprivileged_user == true }}
          SPACE_CI_TEST_SERVICES: ${{ steps.test-services.outputs.env }}
          SPACE_CI_RUST_CACHE: ${{ matrix.rust_cache == true }}
          SPACE_CI_SCCACHE_DIR: ${{ runner.temp }}/space-sccache
          SPACE_CI_SCCACHE_RUN_DIR: ${{ runner.temp }}/space-sccache-run
          SPACE_CI_SCCACHE_SIZE: ${{ matrix.rust_cache_size }}
          SPACE_CI_CARGO_REGISTRY: ${{ runner.temp }}/cargo-home/registry
          SPACE_CI_GO_MOD_CACHE: ${{ runner.temp }}/go-mod
          SPACE_CI_UV_CACHE: ${{ runner.temp }}/uv-cache
        run: |
          set -euo pipefail

          # Mount Cargo's registry, under the CI image's CARGO_HOME, from the
          # runner. It holds any crates restored or prefetched above, and it
          # keeps their tens of thousands of unpacked source files out of the
          # container, which --rm would otherwise delete one by one before the
          # step ends. Go's module cache and uv's cache come from the runner
          # too, with what the steps above restored.
          mkdir -p "${SPACE_CI_CARGO_REGISTRY}" "${SPACE_CI_GO_MOD_CACHE}" "${SPACE_CI_UV_CACHE}"
          docker_args=(
            --rm
            --volume "${GITHUB_WORKSPACE}:/workspace"
            --volume "${SPACE_CI_CARGO_REGISTRY}:/usr/local/cargo/registry"
            --volume "${SPACE_CI_GO_MOD_CACHE}:/go-mod-cache"
            --volume "${SPACE_CI_UV_CACHE}:/uv-cache"
            --workdir /workspace
            --env GOMODCACHE=/go-mod-cache
            --env UV_CACHE_DIR=/uv-cache
            --env CI=true
            --env CARGO_INCREMENTAL=0
            --env GITHUB_ACTIONS=true
            --env NEXTEST_TEST_THREADS=30
            --env SPACE_CI_BASE_SHA
            --env SPACE_CI_PULL_REQUEST_HEAD_SHA
            --env SPACE_CI_COMMAND
            --env SPACE_CI_PER_COMMIT_MIGRATION_ISOLATION
            --env SPACE_CI_REQUIRE_TEST_DEPS=1
            --env SPACE_CI_REQUIRE_TEST_PRIVILEGE=1
            --env SPACE_M1_GENERATOR_MIRROR=ghcr.io/perplexityai/space-ci-mirror
          )

          # Only the Rust suite reads this, but passing it to every matrix
          # entry keeps the rendering one branch instead of a per-entry flag.
          if [[ "${SPACE_CI_MAIN_ONLY_TESTS}" == true ]]; then
            docker_args+=(--env SPACE_CI_MAIN_ONLY_TESTS=1)
          fi
          if [[ "${SPACE_CI_HOST_NETWORK}" == true ]]; then
            docker_args+=(--network host)
          fi
          if [[ "${SPACE_CI_DOCKER_ACCESS}" == true ]]; then
            docker_args+=(--volume /var/run/docker.sock:/var/run/docker.sock)
          fi
          if [[ "${SPACE_CI_PRIVILEGED}" == true ]]; then
            docker_args+=(--privileged)
          fi
          # The image's space-ci account has the runner user's uid, so the
          # container writes the workspace and caches as their owner. It needs
          # no capabilities, and the image's setuid binaries must not grant
          # any.
          if [[ "${SPACE_CI_UNPRIVILEGED_USER}" == true ]]; then
            image_uid="$(docker run --rm --entrypoint id "space-ci:${GITHUB_SHA}" -u space-ci)"
            if [[ "${image_uid}" != "$(id -u)" ]]; then
              echo "::error::The runner user's uid is $(id -u), but the CI image's space-ci account has uid ${image_uid}; set SPACE_CI_UID in ci/Dockerfile.ci to match."
              exit 1
            fi
            docker_args+=(--user "$(id -u)" --cap-drop=ALL --security-opt=no-new-privileges)
          fi
          if [[ -n "${SPACE_CI_TEST_SERVICES}" ]]; then
            docker_args+=(--network space-ci-tests)
            while IFS= read -r assignment; do
              docker_args+=(--env "${assignment}")
            done <<<"${SPACE_CI_TEST_SERVICES}"
          fi
          if [[ "${SPACE_CI_RUST_CACHE}" == true ]]; then
            # The command writes its sccache statistics to SPACE_CI_SCCACHE_STATS.
            # The marker dates the run for trimming the cache before a save.
            mkdir -p "${SPACE_CI_SCCACHE_DIR}" "${SPACE_CI_SCCACHE_RUN_DIR}"
            touch "${SPACE_CI_SCCACHE_RUN_DIR}/started"
            docker_args+=(
              --volume "${SPACE_CI_SCCACHE_DIR}:/sccache"
              --volume "${SPACE_CI_SCCACHE_RUN_DIR}:/sccache-run"
              --env RUSTC_WRAPPER=sccache
              --env SCCACHE_CACHE_SIZE="${SPACE_CI_SCCACHE_SIZE}"
              --env SCCACHE_DIR=/sccache
              --env SPACE_CI_SCCACHE_STATS=/sccache-run/stats.json
            )
          fi

          docker run "${docker_args[@]}" "space-ci:${GITHUB_SHA}" \
            bash -c 'git config --global --add safe.directory /workspace && exec bash -c "$SPACE_CI_COMMAND"'

      # The nextest group `privileged`: tests that need root, CAP_SYS_ADMIN,
      # a seccomp profile allowing pidfd_getfd, or a Docker socket, or whose
      # root path differs, plus NoCoW tests on a disposable btrfs filesystem.
      # Other opt-in tests retain their own opt-ins. Also the M1 generator check. They run the binaries the step above built, whatever its result,
      # without compiling; the script returns anything it creates as root to
      # the runner user. No host network: the setup scripts and testcontainers
      # reach their containers on the bridge network.
      - name: Run the privileged Rust tests
        if: >-
          !cancelled() && matrix.privileged_tests == true &&
          (steps.run.outcome == 'success' || steps.run.outcome == 'failure')
        env:
          SPACE_CI_MAIN_ONLY_TESTS: ${{ inputs.main_only_tests }}
          SPACE_CI_CARGO_REGISTRY: ${{ runner.temp }}/cargo-home/registry
        run: |
          set -euo pipefail
          docker_args=(
            --rm
            --user root
            --privileged
            --volume /var/run/docker.sock:/var/run/docker.sock
            --volume "${GITHUB_WORKSPACE}:/workspace"
            --volume "${SPACE_CI_CARGO_REGISTRY}:/usr/local/cargo/registry"
            --workdir /workspace
            --env CI=true
            --env GITHUB_ACTIONS=true
            --env NEXTEST_TEST_THREADS=30
            --env SPACE_CI_REQUIRE_TEST_DEPS=1
            --env SPACE_CI_REQUIRE_TEST_PRIVILEGE=1
            --env SPACE_M1_GENERATOR_MIRROR=ghcr.io/perplexityai/space-ci-mirror
          )
          if [[ "${SPACE_CI_MAIN_ONLY_TESTS}" == true ]]; then
            docker_args+=(--env SPACE_CI_MAIN_ONLY_TESTS=1)
          fi
          docker run "${docker_args[@]}" "space-ci:${GITHUB_SHA}" \
            bash -c 'git config --global --add safe.directory /workspace && exec bash ci/scripts/with-nocow-test-filesystem.sh bash ci/scripts/run-rust-checks.sh tests-privileged'

      # Their logs print on every run: a test that fails and then passes on
      # nextest's retry leaves the job green.
      - name: Stop the test services
        if: always() && matrix.test_services == true
        env:
          SPACE_CI_TEST_SERVICES_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
        run: |
          echo "::group::Test service logs"
          bash ci/scripts/ci-test-services.sh logs "${SPACE_CI_TEST_SERVICES_OWNER}"
          echo "::endgroup::"
          bash ci/scripts/ci-test-services.sh stop "${SPACE_CI_TEST_SERVICES_OWNER}"

      # Keep the full test-build report: later nextest and doctest invocations
      # reuse its artifacts and would otherwise hide the expensive compilation.
      - name: Upload Rust test build timings
        if: ${{ !cancelled() && matrix.name == 'Rust tests' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test-timings-${{ github.run_attempt }}
          path: target/buildkite-tests/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 14

      # A failed traffic run's process logs, results, and events otherwise
      # vanish with the runner. The container writes them as root in 0700
      # directories, so hand them to the runner user first.
      - name: Prepare the Gateway traffic logs for upload
        if: failure() && matrix.name == 'Gateway traffic'
        run: |
          [[ -d target/gateway-traffic ]] || exit 0
          sudo chown -R "$(id -u):$(id -g)" target/gateway-traffic

      # runtime/ holds the fixtures' keys and the test credential; the harness
      # deletes it on a normal exit, and it is never uploaded.
      - name: Upload the Gateway traffic logs
        if: failure() && matrix.name == 'Gateway traffic'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-traffic-${{ github.run_attempt }}
          path: |
            target/gateway-traffic/run.*/
            !target/gateway-traffic/run.*/runtime/**
          retention-days: 7

      # Main refreshes the snapshot when it was built for other dependency
      # inputs or when this job missed rust_cache_refresh_misses Rust
      # compilations against it. Missing statistics also refresh it. Every
      # event logs the decision; only pushes to main save, and Main CI then
      # deletes superseded snapshots.
      - name: Decide whether to refresh the Rust compiler cache
        id: refresh-rust-cache
        if: success() && matrix.rust_cache == true
        env:
          KEY: ${{ steps.rust-cache-key.outputs.key }}
          INPUTS_PREFIX: ${{ steps.rust-cache-key.outputs.inputs }}
          RESTORED_KEY: ${{ steps.restore-rust-cache.outputs.cache-matched-key }}
          REFRESH_MISSES: ${{ matrix.rust_cache_refresh_misses }}
          STATS: ${{ runner.temp }}/space-sccache-run/stats.json
        run: >-
          python3 ci/scripts/sccache-snapshot.py decide --key "${KEY}" --inputs-prefix "${INPUTS_PREFIX}"
          --restored-key "${RESTORED_KEY}" --refresh-misses "${REFRESH_MISSES}" --stats "${STATS}"

      # sccache stamps each entry it reads or writes, so entries older than the
      # run are ones this commit no longer uses.
      - name: Prepare the Rust compiler cache for upload
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.refresh-rust-cache.outputs.save == 'true'
        env:
          SPACE_CI_SCCACHE_DIR: ${{ runner.temp }}/space-sccache
          SPACE_CI_SCCACHE_RUN_DIR: ${{ runner.temp }}/space-sccache-run
          TRIM: ${{ steps.refresh-rust-cache.outputs.trim }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "${SPACE_CI_SCCACHE_DIR}"
          if [[ "${TRIM}" == true ]]; then
            unused="$(find "${SPACE_CI_SCCACHE_DIR}" -type f ! -newer "${SPACE_CI_SCCACHE_RUN_DIR}/started" -print -delete | wc -l)"
            echo "Deleted ${unused} entries this run did not use."
          fi
          du -sh "${SPACE_CI_SCCACHE_DIR}"

      - name: Save the Rust compiler cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.refresh-rust-cache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/space-sccache
          key: ${{ steps.rust-cache-key.outputs.key }}

      # Every successful main push saves its cold target directory under a
      # new key, and Main CI then deletes the superseded ones.
      - name: Pack the Cargo target directory for upload
        id: pack-target
        if: >-
          success() && steps.target-key.outcome == 'success' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash ci/scripts/rust-target-cache.sh prepare target/buildkite-tests "${RUNNER_TEMP}/space-target-parts"

      - name: Save the Cargo target directory
        if: steps.pack-target.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/space-target-parts
          key: ${{ steps.target-key.outputs.key }}

      - name: Report the package caches
        id: report-package-caches
        if: always() && (matrix.cargo_registry || matrix.go_modules || matrix.uv_cache)
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/space-ci-helpers/package-cache.py
          CARGO_REGISTRY: ${{ matrix.cargo_registry }}
          CARGO_KEY: ${{ steps.package-cache-keys.outputs.cargo-key }}
          CARGO_MATCHED_KEY: ${{ steps.restore-cargo-registry.outputs.cache-matched-key }}
          GO_MODULES: ${{ matrix.go_modules }}
          GO_KEY: ${{ steps.package-cache-keys.outputs.go-key }}
          GO_MATCHED_KEY: ${{ steps.restore-go-modules.outputs.cache-matched-key }}
          UV_CACHE: ${{ matrix.uv_cache }}
          UV_SAVE: ${{ matrix.uv_cache_save == true }}
          UV_KEY: ${{ steps.package-cache-keys.outputs.uv-key }}
          UV_MATCHED_KEY: ${{ steps.restore-uv-cache.outputs.cache-matched-key }}
        run: |
          report() {
            local kind="$1" dir="$2" save="$3" key="$4" matched_key="$5"
            if [[ "${save}" == true ]]; then
              python3 -I "${PACKAGE_CACHE}" report "${kind}" "${dir}" --decide "${key}" --matched-key "${matched_key}"
            else
              python3 -I "${PACKAGE_CACHE}" report "${kind}" "${dir}"
            fi
          }
          if [[ -n "${CARGO_REGISTRY}" ]]; then
            report cargo "${RUNNER_TEMP}/cargo-home/registry" "$([[ "${CARGO_REGISTRY}" == save ]] && echo true)" \
              "${CARGO_KEY}" "${CARGO_MATCHED_KEY}"
          fi
          if [[ -n "${GO_MODULES}" ]]; then
            report go "${RUNNER_TEMP}/go-mod" "$([[ "${GO_MODULES}" == save ]] && echo true)" "${GO_KEY}" "${GO_MATCHED_KEY}"
          fi
          if [[ -n "${UV_CACHE}" ]]; then
            report uv "${RUNNER_TEMP}/uv-cache" "${UV_SAVE}" "${UV_KEY}" "${UV_MATCHED_KEY}"
          fi

      # The job containers wrote the Go and uv caches as root. The copy saved
      # holds only what the current lockfile lists: Cargo and Go drop what it
      # no longer lists, and uv's prune drops what uv used only while it ran,
      # such as the environments `uv run --with` builds. uv's copy keeps the
      # downloaded wheels: `uv cache prune --ci` would drop those too, and the
      # next run would fetch them all from PyPI again. The wheels of older
      # inputs stay until uv's next release starts a new family, and an input
      # that floats (an unpinned `uv run --with`) adds a copy of each upstream
      # release, so every uv input must be pinned.
      - name: Prepare the package caches for upload
        id: prepare-package-upload
        continue-on-error: true
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (steps.report-package-caches.outputs.cargo-save == 'true' ||
          steps.report-package-caches.outputs.go-save == 'true' ||
          steps.report-package-caches.outputs.uv-save == 'true')
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/space-ci-helpers/package-cache.py
          CARGO_SAVE: ${{ steps.report-package-caches.outputs.cargo-save }}
          GO_SAVE: ${{ steps.report-package-caches.outputs.go-save }}
          UV_SAVE: ${{ steps.report-package-caches.outputs.uv-save }}
          SPACE_CI_GO_MOD_CACHE: ${{ runner.temp }}/go-mod
          SPACE_CI_UV_CACHE: ${{ runner.temp }}/uv-cache
        run: |
          set -euo pipefail
          if [[ "${CARGO_SAVE}" == true ]]; then
            python3 -I "${PACKAGE_CACHE}" trim cargo "${RUNNER_TEMP}/cargo-home/registry" Cargo.lock
          fi
          if [[ "${GO_SAVE}" == true ]]; then
            sudo chown -R "$(id -u):$(id -g)" "${SPACE_CI_GO_MOD_CACHE}/cache/download"
            python3 -I "${PACKAGE_CACHE}" trim go "${SPACE_CI_GO_MOD_CACHE}" shim/go.sum
          fi
          if [[ "${UV_SAVE}" == true ]]; then
            docker run --rm --volume "${SPACE_CI_UV_CACHE}:/uv-cache" --env UV_CACHE_DIR=/uv-cache \
              "space-ci:${GITHUB_SHA}" uv cache prune
            du -sh "${SPACE_CI_UV_CACHE}"
          fi

      - name: Save the Cargo registry
        if: >-
          steps.prepare-package-upload.outcome == 'success' &&
          steps.report-package-caches.outputs.cargo-save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-home/registry/index
          key: ${{ steps.package-cache-keys.outputs.cargo-key }}

      - name: Save the Go module cache
        if: >-
          steps.prepare-package-upload.outcome == 'success' &&
          steps.report-package-caches.outputs.go-save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-mod/cache/download
          key: ${{ steps.package-cache-keys.outputs.go-key }}

      - name: Save the uv cache
        if: >-
          steps.prepare-package-upload.outcome == 'success' &&
          steps.report-package-caches.outputs.uv-save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ steps.package-cache-keys.outputs.uv-key }}
