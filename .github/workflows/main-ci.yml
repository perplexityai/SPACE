name: Main CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

# GitHub occasionally delivers two push events for one main commit. Run the
# second after the first instead of beside it: in parallel both find the
# commit's images unpublished, both build, and the second push fails on the
# immutable tag. Queued, it finds them published and skips the build.
concurrency:
  group: main-ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # The only job that writes the CI image. Pull requests, the merge queue, and
  # the other main jobs read it; each builds it locally until this job has
  # published a new tag. It is not required by space-ci: a failed publish
  # leaves every check correct, only slower.
  ci_image:
    if: github.repository == 'perplexityai/SPACE'
    name: Publish the CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish the CI image if its tag is new
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: bash ci/scripts/ci-image.sh publish

  # The only job that writes the SPACE Kind node image,
  # ghcr.io/perplexityai/space-kind-node. Its tag is content-addressed, so this
  # publishes once per change to the image's inputs. Kind CI jobs and developer
  # bring-ups pull the tag and build it locally until it exists, so space-ci
  # does not require this job.
  kind_node_image:
    if: github.repository == 'perplexityai/SPACE'
    name: Publish the Kind node image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish the Kind node image if its tag is new
        env:
          GHCR_TOKEN: ${{ github.token }}
          # Take the kindest/node base from the third-party image mirror.
          SPACE_CI_IMAGE_MIRROR: ghcr
        run: bash infra/space/kind/scripts/kind-node-image.sh publish

  # The only job that writes the third-party image mirror,
  # ghcr.io/perplexityai/space-ci-mirror. It copies each digest in
  # ci/mirrored-images.txt that the mirror lacks. Jobs fall back to the source
  # until it has, so space-ci does not require this job, and the next main push
  # retries a failed copy.
  mirror_images:
    if: github.repository == 'perplexityai/SPACE'
    name: Mirror third-party CI images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Copy every image the mirror lacks
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: bash ci/scripts/mirror-images.sh publish

  rust_static:
    if: github.repository == 'perplexityai/SPACE'
    uses: ./.github/workflows/rust-static-ci.yml
    # Callers must grant the pull-requests: read the called job asks for.
    permissions:
      contents: read
      packages: read
      pull-requests: read

  common:
    if: github.repository == 'perplexityai/SPACE'
    uses: ./.github/workflows/common-ci.yml
    permissions:
      contents: read
      packages: read
    with:
      base_sha: ${{ github.event.before }}
      # One push can land a whole merge-queue batch, so before..after can span
      # several PRs; judge migration isolation per landed commit instead.
      per_commit_migration_isolation: true
      # Main is the one pipeline that pays for the full-scale runs. Pull
      # requests and the merge queue keep the default and rely on the
      # small-scale coverage of the same contracts.
      main_only_tests: true

  artifacts:
    if: github.repository == 'perplexityai/SPACE'
    uses: ./.github/workflows/artifact-ci.yml
    # Reads the third-party image mirror, writes the bundle builds' layer cache
    # (ghcr.io/perplexityai/space-bundle-cache), and the bundle build exchanges
    # this job's OIDC token for the image push role.
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      publish: true

  # The hash of the guest kernel inputs, for guest_kernel's concurrency group:
  # hashFiles() is not available in jobs.<id>.concurrency.
  guest_kernel_inputs:
    if: github.repository == 'perplexityai/SPACE'
    name: Hash guest kernel inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hash the guest kernel inputs
        id: hash
        run: |
          hash="$(bash templates/firecracker/kernel/ci.sh hash)"
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

  # Every kernel input is pinned in templates/firecracker/kernel, so a build
  # that passed for one hash of it passes again. The script records each
  # passing hash as a GHCR marker; main commits that change none of it skip the
  # ~30-minute rebuild and its dependence on snapshot.ubuntu.com. A failing
  # change never records a marker, so it fails every main run until fixed. A
  # missing marker costs one rebuild, whose base, toolchain and BuildKit image
  # come from GHCR (the script's registry cache and the image mirror). When
  # GHCR is unreachable the rebuild loses those too and takes them from Docker
  # Hub and snapshot.ubuntu.com, as every rebuild did before.
  #
  # Runs for the same inputs queue instead of overlapping, so the later ones
  # find the earlier one's marker. queue: max keeps every pending run; the
  # default would cancel all but the newest, and space-ci fails a cancelled
  # job.
  guest_kernel:
    if: github.repository == 'perplexityai/SPACE'
    name: Build and QEMU-smoke guest kernel
    needs: guest_kernel_inputs
    runs-on: ubuntu-24.04
    # A marker hit takes a minute and a cold build about 30. The worst case
    # with Docker Hub and snapshot.ubuntu.com working, GHCR answering manifests
    # but stalling every download, costs about 152 minutes: each deadline in
    # ci.sh runs out once, then the kernel and smoke images build cold. The
    # budget is itemized in templates/firecracker/kernel/ci.sh.
    timeout-minutes: 180
    concurrency:
      group: guest-kernel-${{ needs.guest_kernel_inputs.outputs.hash }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-boot the guest kernel unless these inputs passed
        env:
          GHCR_TOKEN: ${{ github.token }}
          # Take the Ubuntu base from the third-party image mirror.
          SPACE_CI_IMAGE_MIRROR: ghcr
        run: bash templates/firecracker/kernel/ci.sh publish

  kind_smoke:
    if: github.repository == 'perplexityai/SPACE'
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/kind-ci.yml

  # Rust jobs on main save each compiler-cache refresh under a new key, and
  # restores take only the newest snapshot of a job, or of a job's build inputs
  # for Cargo target directories. Delete the older ones so they do not fill the
  # repository's cache quota. Only this job holds actions:write. It is not
  # required by space-ci: a failed deletion leaves every check correct, and the
  # next main run retries it.
  rust_cache_cleanup:
    if: ${{ !cancelled() && github.repository == 'perplexityai/SPACE' }}
    name: Delete superseded Rust compiler caches
    needs:
      - rust_static
      - common
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Delete superseded Rust compiler caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/sccache-snapshot.py prune --repository "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}"

  space-ci:
    if: always() && github.repository == 'perplexityai/SPACE'
    name: space-ci
    runs-on: ubuntu-24.04
    needs:
      - rust_static
      - common
      - artifacts
      - guest_kernel
      - kind_smoke
    steps:
      - name: Require every applicable main check
        env:
          RUST_STATIC_RESULT: ${{ needs.rust_static.result }}
          COMMON_RESULT: ${{ needs.common.result }}
          ARTIFACTS_RESULT: ${{ needs.artifacts.result }}
          GUEST_KERNEL_RESULT: ${{ needs.guest_kernel.result }}
          KIND_SMOKE_RESULT: ${{ needs.kind_smoke.result }}
        run: |
          set -euo pipefail
          for result in \
            "${RUST_STATIC_RESULT}" \
            "${COMMON_RESULT}" \
            "${ARTIFACTS_RESULT}" \
            "${GUEST_KERNEL_RESULT}" \
            "${KIND_SMOKE_RESULT}"; do
            [[ "${result}" == success ]]
          done

  notify-main-ci-failure:
    if: >-
      ${{
        always() &&
        github.repository == 'perplexityai/SPACE' &&
        needs['space-ci'].result == 'failure'
      }}
    name: Notify Slack on main CI failure
    needs:
      - space-ci
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    environment:
      name: internal-slack
      deployment: false
    steps:
      - name: Check out SPACE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_DESCRIPTION: ${{ github.event.head_commit.message }}
        run: bash ci/scripts/notify-main-ci-failure.sh
