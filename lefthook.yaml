# Lefthook — local git hooks for the SPACE repo.
#
# Install once:
#   brew install lefthook   # or: go install github.com/evilmartians/lefthook@latest
#   lefthook install
#
# Hooks run automatically on `git push`. To run manually:
#   lefthook run pre-push
#   lefthook run pre-commit

pre-commit:
  parallel: false
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
      fail_text: |
        Rust formatting check failed.
        Run `cargo fmt --all` to fix formatting issues.

pre-push:
  parallel: false
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
      fail_text: |
        Rust formatting check failed.
        Run `cargo fmt --all` to fix formatting issues.

    # `cargo lint` (.cargo/config.toml) is the same invocation CI runs. It
    # also compiles everything `cargo check` would, and finishes quickly when
    # an earlier `cargo lint` already built the same tree.
    rust-lint:
      glob: "*.rs"
      run: cargo lint
      fail_text: |
        `cargo lint` failed (clippy warnings are errors).
        Fix the errors above before pushing.

    shim-fmt:
      root: "shim/"
      glob: "*.go"
      run: test -z "$(gofmt -l .)"
      fail_text: |
        Go formatting check failed.
        Run `gofmt -w .` in the shim/ directory to fix formatting.

    shim-vet:
      root: "shim/"
      glob: "*.go"
      run: go vet ./...
      fail_text: |
        Go vet found issues in the shim.
        Fix the vet warnings above before pushing.
